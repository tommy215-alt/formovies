  if (name === "wall" && t >= CUE.meeting && t < CUE.book) {   // 1926 年の会議：暗い講堂
    show("hall"); audience.forEach((p, i) => { p.g.visible = true; p.pose({ x: -2.2 + (i % 5) * 1.1, z: -2.0 + Math.floor(i / 5) * 1.3, yaw: Math.PI, nod: .1 + .05 * Math.sin(t * 2 + i) }); });
