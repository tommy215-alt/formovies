<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>pilot_030 renderer</title>
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0}
</style>
</head><body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="ui" width="1080" height="1920"></canvas>
</div>
<script src="../common/vendor/three.min.js"></script>
<script src="../ext/vendor/three147/GLTFLoader.js"></script>
<script src="../ext/vendor/three147/RGBELoader.js"></script>
<script src="../ext/vendor/three147/Pass.js"></script>
<script src="../ext/vendor/three147/EffectComposer.js"></script>
<script src="../ext/vendor/three147/RenderPass.js"></script>
<script src="../ext/vendor/three147/ShaderPass.js"></script>
<script src="../ext/vendor/three147/CopyShader.js"></script>
<script src="../ext/vendor/three147/SimplexNoise.js"></script>
<script src="../ext/vendor/three147/SSAOShader.js"></script>
<script src="../ext/vendor/three147/SSAOPass.js"></script>
<script src="../ext/vendor/three147/BokehShader.js"></script>
<script src="../ext/vendor/three147/BokehPass.js"></script>
<script src="../common/stage.js"></script>
<script src="../common/cine.js"></script>
<script src="../ext/hud_ext.js"></script>
<script src="assets/assets.js"></script>
<script src="../ext/kit/scene_assets.js"></script>
<script src="../ext/kit/kit.js"></script>
<script src="../ext/kit/shots.js"></script>
<script>
// pilot_030「尿から光る元素——ヘニッヒ・ブラント」のレンダラー（ドパ設計）。制作の土台は ext/kit（kit.js・shots.js）。画面の構成は SHOTS。
// 本物の画像：alchemist（ジョゼフ・ライト・オブ・ダービー 1771 年の絵、パブリックドメイン。1669 年の記録画ではなく後世の絵）。3D：鍋と火・光るフラスコ（再現）。
Object.assign(KIT, { design: "dopa", scenes: ["open", "hook", "ki", "sho", "ten", "ketsu"], images: ["alchemist"],
  ci: { l03: [[.28, .65]], l06: [[-.22, 1.9]], l09: [[.25, 1.8], [-.1, 1.6], [.16, .6]], l11: [[0, .38]] },
  hits: [["hook", 1.2], ["l02", .8], ["l04", .8], ["l05", 1.0], ["l05b", 1.2], ["l07", 1.4], ["l08", 1.0], ["l10", .8], ["l12", 1.0], ["l13", .8]],
  opening: { img: "alchemist", box: [250, 640, 830, 1390], cy: .5, gray: 0, title: ["尿を煮詰めたら", "光る物質が出てきた"], credit: ["Joseph Wright of Derby（1771）", "パブリックドメイン"] } });
loadImages(KIT.images);

// ---------------------------------------------------------------- 3D：鍋と火・光るフラスコ（再現）
let pot, fire = [], steam, flask, glowM, glowL;
function buildHero() {
  pot = new THREE.Group(); const iron = M(0x2a2622, { roughness: .6, metalness: .6 }); Cine.surface(iron, "metal", { repeat: [3, 3], normal: .8 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(.45, 48, 24, 0, Math.PI * 2, Math.PI * .35, Math.PI * .65), iron); body.position.y = .95; body.castShadow = true; pot.add(body);
  const liq = new THREE.Mesh(new THREE.CircleGeometry(.4, 48), new THREE.MeshStandardMaterial({ color: C(0x8a7020), roughness: .2, emissive: C(0x2a1a04) })); liq.rotation.x = -Math.PI / 2; liq.position.y = 1.18; pot.add(liq);
  for (let i = 0; i < 9; i++) { const f = new THREE.Mesh(new THREE.ConeGeometry(.09, .45, 12, 1, true), new THREE.MeshBasicMaterial({ color: C(i % 2 ? 0xffa040 : 0xff6020), transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false }));
    const a = i / 9 * Math.PI * 2; f.position.set(Math.cos(a) * .2, .45, Math.sin(a) * .2); f.userData.noAO = true; pot.add(f); fire.push(f); }
  steam = Cine.dust({ min: [-.4, 1.2, -.4], max: [.4, 2.6, .4], count: 400, size: .05, seed: 9 }); pot.add(steam.points); STAGE_HERO.add(pot);
  flask = new THREE.Group(); const gl = Cine.glass({ thickness: .004, roughness: .03 }); const b = new THREE.Mesh(new THREE.SphereGeometry(.3, 48, 32), gl); b.position.y = .55; b.userData.noAO = true; flask.add(b);
  const n = new THREE.Mesh(new THREE.CylinderGeometry(.06, .07, .5, 24, 1, true), gl); n.position.y = 1.05; n.userData.noAO = true; flask.add(n);
  glowM = new THREE.MeshStandardMaterial({ color: C(0xd8ffe8), emissive: C(0x7affc8), emissiveIntensity: 2.2, roughness: .5 }); const p = sph(.13, glowM, 0, .37, 0, flask, 24); p.scale.y = .5; p.userData.noAO = true;
  glowL = new THREE.PointLight(C(0x7affc8), 0, 3, 2); glowL.position.y = .5; flask.add(glowL); STAGE_HERO.add(flask);
}
function heroShot(t, mode, u, { glow = 1, burn = 0, cam } = {}) { pot.visible = mode === "pot"; flask.visible = mode === "flask";
  if (mode === "pot") { fire.forEach((f, i) => f.scale.y = .8 + .4 * Math.abs(Math.sin(t * 9 + i * 1.3))); steam.update(t, 1);
    stageShot(t, { cam: cam || [V3(1.1 - .3 * u, 1.4, 2.0 - .3 * u), V3(0, 1.0, 0), 38], spin: .1, ring: 0xff8a3a, keyCol: 0xffc890, glow: .6, exp: .9 }); return; }
  const g = glow * (.85 + .15 * Math.sin(t * 3)); glowM.emissiveIntensity = 2.2 * g; glowL.intensity = 6 * g;
  if (burn > 0) { glowM.emissive = C(0x7affc8).lerp(C(0xff7a20), burn); glowL.color = C(0x7affc8).lerp(C(0xff7a20), burn); }
  else { glowM.emissive = C(0x7affc8); glowL.color = C(0x7affc8); }
  stageShot(t, { cam: cam || [V3(.8 - .3 * u, .9, 1.6 - .3 * u), V3(0, .65, 0), 36], spin: .2, ring: burn > 0 ? 0xff7a20 : 0x7affc8, keyCol: 0x6a7a8a, glow: 1.2, exp: .85 }); }

// ---------------------------------------------------------------- 2D の図
function urineDiag(X, t, a) { panel(X); lab2(X, "使った尿の量（資料で違う）", 540, 410, T(30), "#B8DFF2", 800);
  [["1000L超", 1000, "#FFE2A8"], ["5000L超", 5000, "#FF9A8A"]].forEach(([s, v, c], i) => { const k = easeOut(clamp((t - a - .2 - i * .5) / .6)), h = 600 * v / 5000 * k, x = 330 + i * 420;
    X.fillStyle = c; X.fillRect(x - 90, 1150 - h, 180, h); lab2(X, s, x, 1150 - h - 50, T(40), c, 900); }); }

// ---------------------------------------------------------------- ショットの一覧
function ciShot(t, P) { heroShot(t, "pot", 0, { cam: [[V3(.9, .7, 1.2), V3(0, 1.0, 0), 34], [V3(.3, 1.8, .6), V3(0, 1.1, 0), 30], [V3(-1.4, 1.5, 2.2), V3(0, .9, 0), 42]][P.p] }); }
SHOTS = [
  { at: "l01", kind: "3d", draw: (t, u) => heroShot(t, "pot", u), slam: { s: "1669年ごろ", sub: "ドイツ・ハンブルク", size: 130 } },
  { at: "l02", kind: "photo", img: "alchemist", box: [200, 380, 880, 1260], cy: .55, gray: 0, slam: { s: "錬金術師", cols: PINK, glow: "rgba(255,80,180,1)", y: 300 }, slam2: { s: "金を作る！", off: 1.4, y: 1340 }, credit: ["Joseph Wright of Derby（1771）／パブリックドメイン"], creditY: 1290 },
  { at: "l03", kind: "3d", draw: (t, u) => heroShot(t, "pot", u), slam: { s: "なんと 尿", size: 150, cols: GOLD, off: .5 } },
  { at: "l04", kind: "3d", draw: (t, u) => heroShot(t, "pot", u, { cam: [V3(.6, 1.9, 1.0), V3(0, 1.1, 0), 34] }), slam: { s: "煮詰める！", cols: RED, glow: "rgba(255,80,40,1)" } },
  { at: "l05", kind: "holo", draw: (X, t) => urineDiag(X, t, CUE.l05) },
  { at: "l05b", kind: "holo", draw: (X, t) => { panel(X); bigNum(X, "1100L", 640, 110, "#FFE2A8"); lab2(X, "↓", 540, 790, T(60), "#EAF2F8", 900); bigNum(X, "約60g", 960, 120, "#9AF0D0"); lab2(X, "ある解説での数字", 540, 1140, T(26), "#B8C7D6", 600); } },
  { at: "l06", kind: "3d", draw: (t, u) => heroShot(t, "flask", u), slam: { s: "光った！", cols: LIME, glow: "rgba(90,255,180,1)", size: 150, off: .5 } },
  { at: "l07", kind: "holo", draw: (X, t) => { panel(X); bigNum(X, "Phosphorus", 640, 90, "#9AF0D0"); lab2(X, "光を運ぶもの", 540, 860, T(48), "#EAF2F8", 900); lab2(X, "（ギリシャ語）", 540, 960, T(28), "#B8C7D6", 600); }, slam: { s: "リン", size: 150, off: .1 } },
  { at: "l08", kind: "3d", draw: (t, u) => heroShot(t, "flask", u, { cam: [V3(-.6, .8, 1.4), V3(0, .6, 0), 36] }), slam: { s: "名前の残る最古級の元素", size: 80, cols: GOLD } },
  { at: "l08b", kind: "holo", draw: (X, t) => { panel(X); lab2(X, "光るしくみ（模式）", 540, 410, T(30), "#B8DFF2", 800); bigNum(X, "リン ＋ 酸素", 700, 70, "#9AF0D0"); lab2(X, "ゆっくり反応して 光る", 540, 900, T(38), "#EAF2F8", 900); } },
  { at: "l09", kind: "3d", draw: (t, u) => heroShot(t, "flask", u), slam: { s: "秘密にして売った", cols: WHITE, size: 96 } },
  { at: "l10", kind: "holo", draw: (X, t) => { panel(X); lab2(X, "作り方は広まった", 540, 410, T(32), "#B8DFF2", 800); [["ブラント", 520], ["クラフト／クンケル", 740], ["ボイル（自分の方法で）", 960]].forEach(([s, y], i) => { const k = clamp((t - CUE.l10 - .2 - i * .5) / .3); X.globalAlpha = k; lab2(X, s, 540, y, T(40), i ? "#EAF2F8" : "#FFE2A8", 900); X.globalAlpha = 1; }); } },
  { at: "l11", kind: "3d", draw: (t, u) => heroShot(t, "flask", u, { burn: clamp(u * 2), glow: 1 + u }), slam: { s: "ひとりでに燃える！", cols: RED, glow: "rgba(255,80,40,1)", size: 100, off: .6 } },
  { at: "l12", kind: "photo", img: "alchemist", box: [200, 380, 880, 1260], cy: .5, gray: 0, z0: 1.1, z1: 1.3, slam: { s: "およそ100年後の絵", size: 84, y: 300 }, credit: ["Joseph Wright of Derby（1771）／パブリックドメイン"], creditY: 1290 },
  { at: "l13", kind: "3d", draw: (t, u) => heroShot(t, "flask", u, { cam: [V3(.4, .9, 1.4 + 1.2 * u), V3(0, .6, 0), 38] }), slam: { s: "自ら光る元素", cols: LIME, glow: "rgba(90,255,180,1)", off: 1.0 } },
];
const _ds = drawScene; drawScene = function (t, name) { const P = ciPhase(t); if (P && P.c === "l09") { ciShot(t, P); return "3d"; } return _ds(t, name); };
function fxEp(t, name) { if (name === "sho" && t < CUE.l07) S.rays(bg, 540, 900, t, "rgba(120,255,190,.10)", 24); }
function buildMood() { const c = CUE; MOOD = [[0, { warm: .3, sat: 1.1, vig: .6 }], [c.hook, { warm: .4, sat: 1.3, vig: .48 }], [c.ki, { warm: .45, sat: 1.35, vig: .45 }], [c.sho, { cool: .2, sat: 1.3, glow: .3, glowX: .5, glowY: .5, vig: .5 }],
  [c.ten, { warm: .2, sat: 1.15, vig: .55 }], [c.ketsu, { warm: .3, sat: 1.25, vig: .5 }], [c.l13, { cool: .2, sat: 1.3, glow: .35, glowX: .5, glowY: .55, vig: .45 }]]; }
function thumb() { CUE = CUE || {}; CUE.t0 = 0; heroShot(1, "flask", .5); S.moodGrade(bg, 0, [[0, { cool: .2, sat: 1.3, vig: .5 }]]); Cine.bloom(bg, .4); addGrain(0);
  slam(ui, "尿を煮詰めたら", 540, 330, 110, 0, 9, { cols: WHITE, glow: "rgba(255,120,60,.9)", rot: -.03 }); slam(ui, "光る元素", 540, 520, 150, 0, 9, { cols: LIME, glow: "rgba(90,255,180,1)", rot: .02 }); slam(ui, "1669年", 540, 1420, 110, 0, 9, { cols: GOLD }); }
kitStart(() => { buildStage({}); buildHero(); });
</script>
</body></html>
