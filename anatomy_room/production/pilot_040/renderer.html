<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>pilot_040 renderer</title>
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0}
</style>
</head><body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="ui" width="1080" height="1920"></canvas>
</div>
<script src="../common/vendor/three.min.js"></script>
<script src="../ext/vendor/three147/GLTFLoader.js"></script>
<script src="../ext/vendor/three147/RGBELoader.js"></script>
<script src="../ext/vendor/three147/Pass.js"></script>

<script>
// pilot_040 のレンダラー（選択設計）。ギムリー・グライダー。前半は機長の目線（操縦室）。3D は Blender。写真なし（権利の確かなものがない）。
// 選択設計（templates/DESIGN_MODES.md）：前半は当事者の目線（Blender の POV＋pov.js）、後半は三人称の解説。文字は知的設計の字幕だけ（オープニングの問いは大きく）。
Object.assign(KIT, { design: "intel", scenes: ["open", "pov", "ask", "exp", "after"], images: ['thumbbg'], ci: {}, hits: [],
  opening: { img: null, bg: openBG, title: ["", ""], size1: 1, size2: 1, credit: [] } });
loadImages(KIT.images);
const HEAD = ["高度1万メートル", "エンジン全停止"];   // 冒頭の見出し（上：場面、中：核心）
const SYUKU = '"YujiSyuku", serif';   // 札の字体（OFL、assets.js の font_syuku）
const CHOICE = { a: "閉鎖された／滑走路に降りる", b: "湖に／不時着する", ans: "A", reveal: "l07b" };

const CUTS = {l00_2: ["l00", 1.0], l00_3: ["l00", 2.4], l03_2: ["l03", 1.2], l04_2: ["l04", 1.2]};   // カットの区切り（もとの cue からの秒。2026-11-03〜）
SHOTS = [
  { at: "l01", kind: "3d", draw: blShot("l01") },
  { at: "l02", kind: "3d", draw: blShot("l02") },
  { at: "l03", kind: "3d", draw: blShot("l03") },
  { at: "l03_2", kind: "3d", draw: blShot("l03_2") },
  { at: "l04", kind: "3d", draw: blShot("l04") },
  { at: "l04_2", kind: "3d", draw: blShot("l04_2") },
  { at: "l05", kind: "3d", draw: blShot("l05") },
  { at: "l06", kind: "3d", draw: blShot("l06") },
  { at: "l07", kind: "3d", draw: blShot("l07") },
  { at: "l08", kind: "3d", draw: blShot("l08") },
  { at: "l09", kind: "3d", draw: blShot("l09") },
  { at: "l10", kind: "3d", draw: blShot("l10") },
  { at: "l11", kind: "3d", draw: blShot("l11") },
  { at: "l12", kind: "3d", draw: blShot("l12") },
];
const FX = {
  l00: (t, u) => { POV.shake(t, 4); POV.alert(t, .5); },
  l02: (t, u) => { POV.shake(t, 2); POV.alert(t, .45); },
  l03: (t, u) => { POV.shake(t, 6); POV.alert(t, .75, 1.6); },
  l04: (t, u) => { POV.shake(t, 4); POV.alert(t, .55); },
  l05: (t, u) => { POV.shake(t, 4); },
  l06: (t, u, a) => { POV.shake(t, 3); POV.alert(t, .5); POV.heart(t, 115, .12 * clamp((t - a) / 4)); },
};
Object.assign(FX, {l03_2: FX.l03 || (() => {}), l04_2: FX.l04 || (() => {})});   // カットにも同じ揺れ
function buildMood() { const c = CUE; for (const k in CUTS) CUE[k] = CUE[CUTS[k][0]] + CUTS[k][1]; MOOD = [[0, { cool: .4, sat: .8, vig: .45 }], [c.pov, { cool: .42, sat: .78, vig: .72 }], [c.ask, { cool: .5, sat: .6, vig: .86 }], [c.exp, { warm: .05, sat: .9, vig: .6 }], [c.after, { warm: .2, sat: .95, glow: .2, glowX: .5, glowY: .4, vig: .5 }]]; }
function thumb() { CUE = CUE || {}; CUE.t0 = 0; photo(bg, IMG.thumbbg, 1, 1.05, 1.05, 0, { box: [0, 0, 1080, 1920], cy: .5, gray: 0, frame: "none" }); bg.fillStyle = "rgba(0,4,10,.35)"; bg.fillRect(0, 0, W, H); S.moodGrade(bg, 0, [[0, { cool: .4, sat: .85, vig: .7 }]]); addGrain(0); label(ui, "エンジンが両方止まった", 540, 470, 66, "#EAF2F8", { stroke: "#05080c", sw: .14 }); label(ui, "あなたは？", 540, 620, 110, "#FFD58A", { stroke: "#05080c", sw: .14 }); choicePair(0, 1000, 170, 1); }

// ---------------------------------------------------------------- 選択肢の札（2026-11-02 ユーザーの指示：前半は「選択」が主役。A・B を同時に見せる）
// CHOICE = { a, b, ans: "A"|"B", reveal: 答えを言う行の cue }
const GRIT = (() => { const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d"), d = x.createImageData(256, 256), r = S.rng(77);
  for (let i = 0; i < d.data.length; i += 4) { const v = r(); d.data[i + 3] = v < .55 ? 0 : (v - .55) * 170; } x.putImageData(d, 0, 0); return c; })();   // 札のざらつき
function choiceCard(ctx, letter, text, x, y, w, h, k, hi = 0, dim = 0) { if (k <= 0) return;   // 札：おどろおどろしい背景（A＝赤、B＝青）と筆の字体 Yuji Syuku（2026-11-04 ユーザーの指示）
  const A = letter === "A", col = A ? [225, 48, 40] : [60, 120, 255], tt = NOW || 0, fl = .85 + .15 * Math.sin(tt * 9 + (A ? 0 : 2)) * Math.sin(tt * 3.1);
  ctx.save(); ctx.globalAlpha = k * (1 - .65 * dim);
  ctx.save(); rrect(ctx, x, y, w, h, 18); ctx.clip();
  const g = ctx.createLinearGradient(x, y, x + w * .3, y + h); g.addColorStop(0, A ? "#3e0707" : "#07143e"); g.addColorStop(.55, A ? "#170203" : "#020819"); g.addColorStop(1, "#030103");
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  const rg = ctx.createRadialGradient(x + w * .5, y + h * .5, h * .2, x + w * .5, y + h * .5, w * .62); rg.addColorStop(0, `rgba(${col},${.22 * fl + .2 * hi})`); rg.addColorStop(1, "rgba(0,0,0,.6)");
  ctx.fillStyle = rg; ctx.fillRect(x, y, w, h); ctx.fillStyle = ctx.createPattern(GRIT, "repeat"); ctx.fillRect(x, y, w, h); ctx.restore();
  ctx.lineWidth = 4 + 6 * hi; ctx.strokeStyle = `rgba(${col},${.75 * fl + .25 * hi})`; ctx.shadowColor = `rgba(${col},.9)`; ctx.shadowBlur = 18 + 30 * hi; rrect(ctx, x, y, w, h, 18); ctx.stroke(); ctx.shadowBlur = 0;
  const r = Math.min(62, h * .28), cx = x + 30 + r;
  ctx.fillStyle = `rgba(${col},.95)`; ctx.beginPath(); ctx.arc(cx, y + h / 2, r, 0, Math.PI * 2); ctx.fill();
  label(ctx, letter, cx, y + h / 2 + 2, r * 1.5, "#0a0204", { font: SYUKU, sw: 0 });
  const lines = text.split("／"), x0 = cx + r + 20, wt = Math.min(x + w - 24, 900) - x0, n = Math.max(...lines.map(l => l.length)),
    fs = Math.min(lines.length > 1 ? h * .34 : h * .44, wt / (n * 1.02)), lh = fs * 1.18;
  lines.forEach((l, i) => label(ctx, l, x0 + wt / 2, y + h / 2 + (i - (lines.length - 1) / 2) * lh, fs, "#F1E8E2", { font: SYUKU, stroke: "#050102", sw: .12 }));
  ctx.restore(); }
function choicePair(t, y, h, k, hiA = 0, hiB = 0, dimA = 0, dimB = 0) { choiceCard(ui, "A", CHOICE.a, 70, y, 940, h, k, hiA, dimA); choiceCard(ui, "B", CHOICE.b, 70, y + h + 34, 940, h, k, hiB, dimB); }
function choiceUI(t, name) {
  if (name === "open") { const k = 1, a = CUE.l00a, b = CUE.l00b;   // 冒頭：1 秒で状況が分かる大きな見出し＋大きな札（2026-11-03）
    if (t >= a) { const A = t < b; choiceCard(ui, A ? "A" : "B", A ? CHOICE.a : CHOICE.b, 50, 190, 980, 300, k, .5 + .5 * clamp((t - (A ? a : b)) / .2), 0); return; }   // A・B を読むところは、その札だけを上に大きく（2026-11-04）
    HUD.title(ui, [[HEAD[0], Math.min(72, Math.floor(860 / HEAD[0].length)), "#D8E6F0"], [HEAD[1], Math.min(126, Math.floor(820 / HEAD[1].length)), "#FFFFFF"], ["あなたは？", 96, "#FFD58A"]], 540, 440, k, t);
    choicePair(t, 870, 236, k, 0, 0, 0, 0); return; }
  const { s } = shotAt(t), es = TL.ending_start;
  if (name === "pov") { const k = clamp((t - CUE.pov) / .4) * clamp((CUE.ask - t) / .3); ui.save(); ui.globalAlpha = .85 * k;   // 上に小さく：A・B のどちらか
    for (const [L, x, c] of [["A", 270, "rgba(225,48,40,.9)"], ["B", 810, "rgba(60,120,255,.9)"]]) { ui.fillStyle = "rgba(6,12,20,.6)"; rrect(ui, x - 250, 200, 500, 70, 35); ui.fill(); ui.strokeStyle = c; ui.lineWidth = 3; rrect(ui, x - 250, 200, 500, 70, 35); ui.stroke();
      label(ui, L + "　" + (L === "A" ? CHOICE.a : CHOICE.b).replace("／", ""), x, 236, 30, "#EAF2F8", { weight: 700 }); } ui.restore(); }
  if (name === "ask") { const k = clamp((t - CUE.ask) / .35); choicePair(t, 620, 170, k); }
  const r = CUE[CHOICE.reveal]; if (r !== undefined && t >= r && t < r + 3.2) { const k = clamp((t - r) / .25) * clamp((r + 3.2 - t) / .4), hi = clamp((t - r - .3) / .3), A = CHOICE.ans === "A";
    choicePair(t, 300, 150, k, A ? hi : 0, A ? 0 : hi, A ? 0 : hi, A ? hi : 0); }
}
// オープニングの背景：状況 → A の行動の CG → B の行動の CG（2026-11-02 ユーザーの指示）
const OPEN_SHOTS = {l00: blShot("l00"), l00_2: blShot("l00_2"), l00_3: blShot("l00_3"), l00a: blShot("l00a"), l00b: blShot("l00b")};
function openBG(t) { const o = KIT.opening; if (o.img0 === undefined) { o.img0 = o.img; o.credit0 = o.credit; } o.img = t < CUE.l00a ? o.img0 : null; o.credit = o.img ? o.credit0 : o.credit0.filter(c => !c.startsWith("写真"));   // 本物の写真は状況を読むあいだだけ、A・B では CG を全面に
  OPEN_SHOTS[Object.keys(OPEN_SHOTS).filter(k => CUE[k] <= t + 1e-6).sort((a, b) => CUE[b] - CUE[a])[0] || "l00"](t); }   // 冒頭は複数のカット
// 最後の暗転の注意書き（2026-11-02 ユーザーの指示）
function endNote(t) { const es = TL.ending_start; if (t < es) return; ui.fillStyle = `rgba(0,0,0,${easeInOut(clamp((t - es) / 1.0))})`; ui.fillRect(0, 0, W, H);   // 1 秒で真っ暗に
  if (t < es + .7) return; const k = clamp((t - es - .7) / .5);
  ui.save(); ui.globalAlpha = k; ["※これは過去の出来事の紹介です。", "必ずしも正しい選択を", "示すものではありません。"].forEach((l, i) => label(ui, l, 540, 900 + i * 66, 44, "#D8E2EA", { stroke: "#000", sw: .1 })); ui.restore(); }
{ const _du = drawUI; drawUI = function (t, name) { _du(t, name); if (t < TL.ending_start) choiceUI(t, name); }; }
// ---------------------------------------------------------------- 目線の演出（pov.js）。FX[ショット] = (t, u, a) => { ... }
// 冒頭は暗くしすぎない：何が起きているか分かる明るさに（2026-11-03 ユーザーの指示。揺れ・警告灯などの緊迫感はそのまま）
const LIFT_C = document.createElement("canvas"); LIFT_C.width = W; LIFT_C.height = H; const LIFT_X = LIFT_C.getContext("2d");
function liftOpen(k) { if (k <= 1.001) return; LIFT_X.clearRect(0, 0, W, H); LIFT_X.drawImage(bg.canvas, 0, 0); bg.save(); bg.filter = `brightness(${k}) contrast(1.06) saturate(1.08)`; bg.drawImage(LIFT_C, 0, 0); bg.restore(); }
function fxEp(t, name) {
  liftOpen(name === "open" ? 1.5 : 1 + .5 * (1 - clamp((t - CUE.pov) / 1.2)));
  if (name === "open") { (FX.l00 || (() => {}))(t, clamp(t / Math.max(.3, CUE.l01)), 0); return; }
  const { s, a, u } = shotAt(t); const f = FX[s.at]; if (f) f(t, u, a);
}
kitStart(() => {}); BL.install();
window.READY = window.READY.then(() => window.ASSETS.font_syuku ? new FontFace("YujiSyuku", b64buf(window.ASSETS.font_syuku)).load().then(f => document.fonts.add(f)) : 0);
{ const rf = window.renderFrame; window.renderFrame = t => { const r = rf(t); if (r && r.then) return r.then(() => endNote(t)); endNote(t); return r; }; }
</script>
