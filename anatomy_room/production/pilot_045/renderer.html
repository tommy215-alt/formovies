<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>pilot_045 renderer</title>
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0}
</style>
</head><body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="ui" width="1080" height="1920"></canvas>
</div>
<script src="../common/vendor/three.min.js"></script>
<script src="../ext/vendor/three147/GLTFLoader.js"></script>
<script src="../ext/vendor/three147/RGBELoader.js"></script>
<script src="../ext/vendor/three147/Pass.js"></script>
<script src="../ext/vendor/three147/EffectComposer.js"></script>

<script src="../ext/vendor/three147/ShaderPass.js"></script>
<script src="../ext/vendor/three147/CopyShader.js"></script>
<script src="../ext/vendor/three147/SimplexNoise.js"></script>
<script src="../ext/vendor/three147/SSAOShader.js"></script>
<script src="../ext/vendor/three147/SSAOPass.js"></script>
<script src="../ext/vendor/three147/BokehShader.js"></script>
<script src="../ext/vendor/three147/BokehPass.js"></script>
<script src="../common/stage.js"></script>
<script src="../common/cine.js"></script>
<script src="../ext/hud_ext.js"></script>
<script src="assets/assets.js"></script>
<script src="assets/plan.js"></script>
<script src="../ext/kit/scene_assets.js"></script>
<script src="../ext/kit/kit.js"></script>

<script>
// pilot_045 のレンダラー（もしも設計、templates/DESIGN_MODES.md）。東京にゾンビが一体現れたら？ v2（2026-11-06）。
// ナレーションなし：情報はすべてポップアップ（時計と数の札・出来事の札・スペックと警察の札）。ショットと出来事は plan.py（assets/plan.js）。
// 3D は Blender（blender/scene.py）。数字は計算の結果（scripts/pilot_045/sim/results.md）。「想定」の札は計算に入っていない出来事（fact_check.md の 7.）。
// 昼と夜は時計に合わせて背景の色で（地図のショット）。早送りで昼夜が速すぎる所は、色の揺れを弱めて「早送り」の印を出す。
const PL = window.PLAN, SH = {}; PL.shots.forEach(s => SH[s.id] = s);
const IDS = PL.shots.map(s => s.id);
Object.assign(KIT, { design: "intel", scenes: ["open", "l01"], images: [], ci: {}, hits: [],
  opening: { img: null, bg: blShot("l00"), title: ["東京に突然ゾンビが一匹。", "どうなる？"], size1: 62, size2: 120, credit: [] } });
SHOTS = IDS.slice(1).map(k => ({ at: k, kind: "3d", draw: blShot(k) }));
S.docSub = () => {};   // 字幕なし（ナレーションがない）

// ---------------------------------------------------------------- 時計（scene.py の clock と同じ式）
function clockAt(k, t) {   // t：ショットの頭からの秒
  const s = SH[k], u = clamp(t / s.dur), c = s.c;
  for (let i = 0; i < c.length - 1; i++) { const [u0, c0] = c[i], [u1, c1] = c[i + 1];
    if (u <= u1 || i === c.length - 2) { const v = clamp((u - u0) / Math.max(1e-9, u1 - u0));
      return s.log && c0 > 0 && c1 > 0 ? Math.exp(Math.log(c0) + (Math.log(c1) - Math.log(c0)) * v) : c0 + (c1 - c0) * v; } }
  return c[c.length - 1][1];
}
function curId(t) { let k = IDS[0]; for (const id of IDS) if (CUE[id] !== undefined && t >= CUE[id]) k = id; return k; }
function clockNow(t) { const k = curId(t); return clockAt(k, t - CUE[k]); }
function zombiesAt(c) {   // 計算の表を、時計と数の両方とも対数で補間
  const Z = PL.zombies; if (c <= Z[0][0]) return 1;
  for (let i = 0; i < Z.length - 1; i++) { const [a, za] = Z[i], [b, zb] = Z[i + 1]; if (c <= b) { const v = a > 0 ? (Math.log(c) - Math.log(a)) / (Math.log(b) - Math.log(a)) : c / b; return Math.exp(Math.log(za) + (Math.log(zb) - Math.log(za)) * clamp(v)); } }
  return Z[Z.length - 1][1];
}
const pad = n => String(Math.floor(n)).padStart(2, "0");
function tod(c) { const s = 12 * 3600 + c, d = Math.floor(s / 86400), r = s - d * 86400; return { day: d + 1, h: Math.floor(r / 3600), m: Math.floor(r / 60) % 60, s: Math.floor(r) % 60, hours: r / 3600 }; }
function stamp(c) { const o = tod(c); if (c >= 86400 && Math.abs(c / 86400 - Math.round(c / 86400)) < 1e-6) return `${Math.round(c / 86400)}日後`;   // 日単位の出来事は計算の表と同じ「N日後」
  return o.day > 1 ? `${o.day}日目 ${pad(o.h)}:${pad(o.m)}` : `${pad(o.h)}:${pad(o.m)}`; }
function elapsed(c) { if (c < 60) return `${Math.floor(c)}秒`; if (c < 3600) return `${Math.floor(c / 60)}分`; if (c < 86400) return `${(Math.floor(c / 360) / 10).toFixed(c < 36000 ? 1 : 0)}時間`; return `${Math.floor(c / 86400)}日`; }
const zfmt = z => z < 10000 ? Math.round(z).toLocaleString("ja-JP") + "体" : z < 1e8 ? "約" + (z / 1e4 >= 100 ? Math.round(z / 1e4).toLocaleString("ja-JP") : (Math.round(z / 1e3) / 10).toLocaleString("ja-JP")) + "万体" : "約" + (Math.round(z / 1e6) / 100) + "億体";
// 桁が上がった瞬間（ゾンビの数が 10・100・1,000…を超えた時）から 0.7 秒：1→0 の強さ（大きくなって光り、元に戻る）
function zAt(t) { return zombiesAt(clockNow(t)); }
function digitPop(t) {
  const d = n => Math.floor(Math.log10(Math.max(1, n)) + 1e-9), now = d(zAt(t));
  for (let k = 1; k <= 21; k++) { const tp = t - k / 30; if (tp < CUE.l02) break; if (d(zAt(tp)) < now) { const u = (k - 1) / 30; return u < .12 ? easeOut(u / .12) : 1 - easeInOut(clamp((u - .12) / .58)); } }
  return 0;
}
function rate(t) { const k = curId(t), a = t - CUE[k]; return (clockAt(k, a + .05) - clockAt(k, a)) / .05; }   // 時計の秒 / 動画の秒
function daylight(c) { const h = tod(c).hours; return clamp((Math.cos((h - 12.5) / 24 * 2 * Math.PI) + .15) / .9); }   // 0＝夜、1＝昼
function dayAmp(t) { return t < CUE.l14 ? 1 : 0; }   // v2.2：停電までは昼夜を交互に（ユーザー「パニック感」）。そのあとは暗いまま

// ---------------------------------------------------------------- 左上：時計・経過・ゾンビの数
function sunMoon(x, y, dl, r = 22) {
  ui.save(); ui.translate(x, y);
  if (dl > .5) { ui.fillStyle = "#FFC84A"; ui.beginPath(); ui.arc(0, 0, r * .55, 0, 7); ui.fill(); ui.strokeStyle = "#FFC84A"; ui.lineWidth = 4;
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ui.beginPath(); ui.moveTo(Math.cos(a) * r * .8, Math.sin(a) * r * .8); ui.lineTo(Math.cos(a) * r * 1.1, Math.sin(a) * r * 1.1); ui.stroke(); } }
  else { ui.fillStyle = "#CFE0FF"; ui.beginPath(); ui.arc(0, 0, r * .8, 0, 7); ui.fill(); ui.globalCompositeOperation = "destination-out"; ui.beginPath(); ui.arc(r * .38, -r * .25, r * .7, 0, 7); ui.fill(); }
  ui.restore();
}
function ffMark(x, y, k) { if (k <= 0) return; ui.save(); ui.globalAlpha *= k; ui.fillStyle = "#8FDCFF";
  for (const dx of [0, 22]) { ui.beginPath(); ui.moveTo(x + dx, y - 13); ui.lineTo(x + dx + 20, y); ui.lineTo(x + dx, y + 13); ui.closePath(); ui.fill(); }
  text(ui, "早送り", x + 104, y + 1, 30, "#8FDCFF", { weight: 800, align: "center" }); ui.restore(); }
function statusUI(t) {
  const k = curId(t); if (k === "l00" || k === "l01" || t < CUE.l02) return;
  const loop = k === "l18", c = loop ? 0 : clockNow(t), o = tod(c), z = loop ? 1 : zombiesAt(c), a = CUE[k], u = t - a;
  const pop = 1 + .14 * Math.pow(1 - clamp(u / .2), 2) * (k === "l02" ? 0 : 1);
  const x0 = 40, y0 = 176, w = 640, h = 250, dl = daylight(c) * dayAmp(t) + .45 * (1 - dayAmp(t));
  ui.save(); ui.translate(x0, y0); ui.scale(pop, pop);
  ui.fillStyle = "rgba(6,10,16,.8)"; rrect(ui, 0, 0, w, h, 18); ui.fill(); ui.strokeStyle = "rgba(255,70,60,.7)"; ui.lineWidth = 3; rrect(ui, 0, 0, w, h, 18); ui.stroke();
  ui.fillStyle = "#ff3b30"; ui.fillRect(0, 20, 8, h - 40);
  S.group(() => {
    sunMoon(62, 64, dl);
    const hm = c < 600 && !loop ? `${pad(o.h)}:${pad(o.m)}:${pad(o.s)}` : `${pad(o.h)}:${pad(o.m)}`;
    text(ui, hm, 110, 66, 64, "#FFFFFF", { weight: 900, align: "left" });
    text(ui, `${o.day}日目`, w - 34, 66, 40, "#FFD58A", { weight: 900, align: "right" });
    text(ui, "経過", 40, 140, 32, "#9FB2C4", { weight: 700, align: "left" }); text(ui, loop ? "0秒" : elapsed(c), 122, 140, 40, "#EAF2F8", { weight: 800, align: "left" });
    text(ui, "ゾンビ", 40, 206, 34, "#FF9A90", { weight: 800, align: "left" });
    { const g = loop ? 0 : digitPop(t); ui.save(); ui.translate(w - 34, 204); ui.scale(1 + .55 * g, 1 + .55 * g);
      if (g > 0) { ui.shadowColor = `rgba(255,90,60,${.95 * g})`; ui.shadowBlur = 50 * g; }
      text(ui, zfmt(z), 0, 0, 66, g > .05 ? `rgb(255,${Math.round(90 + 150 * g)},${Math.round(78 + 140 * g)})` : "#FF5A4E", { weight: 900, align: "right", stroke: "#1a0404", sw: 6 }); ui.restore(); }
  }, [x0, y0, x0 + w, y0 + h]);
  ui.restore();
  const ff = rate(t) > 300 && !loop ? clamp((t - a - .2) / .3) : 0; if (ff) S.group(() => ffMark(x0 + 18, y0 + h + 44, ff));
}

// ---------------------------------------------------------------- 下：出来事の札（新しいものが下に積み上がる。古いものは消える）
// 札の種類（v2.2、ユーザー「範囲、インフラ、対応みたいなアクションで分けて」）：何が起きたかで分ける。インフラは計算に入っていない予想なので「予想」と添える
const TAGC = { S: ["広がり", "#FF5A4E"], Z: ["ゾンビ", "#B38CFF"], R: ["対応", "#2AC8FF"], H: ["人々", "#7FE0A0"], I: ["インフラ（予想）", "#FFB02E"] };
const EVS = []; PL.shots.forEach(s => (s.ev || []).forEach((e, j) => EVS.push({ at: s.id, off: e[0], c: e[1], s: e[2], kind: e[3] })));
function evTime(e) { return CUE[e.at] + e.off; }
function eventsUI(t) {
  if (t >= CUE.l18) return;
  const live = EVS.filter(e => t >= evTime(e) && t < evTime(e) + 5.2).slice(-3), y1 = 1560, hh = 112, gap = 14;
  live.forEach((e, i) => {
    const u = t - evTime(e), k = easeOut(clamp(u / .25)) * (1 - clamp((u - 4.8) / .4)), y = y1 - (live.length - i) * (hh + gap) + hh / 2, x0 = 40 - 60 * (1 - k);
    const c = e.c === null ? clockAt(e.at, e.off) : e.c, [tg, tc] = TAGC[e.kind];
    ui.save(); ui.globalAlpha *= k; ui.font = `800 44px ${S.FONT}`; const tw = Math.min(700, ui.measureText(e.s).width), w = Math.max(560, tw + 120);
    const pop = 1 + .12 * Math.pow(1 - clamp(u / .18), 2); ui.translate(x0, y); ui.scale(pop, pop); ui.translate(-x0, -y);
    ui.fillStyle = "rgba(6,10,16,.84)"; rrect(ui, x0, y - hh / 2, w, hh, 14); ui.fill(); ui.fillStyle = tc; ui.fillRect(x0, y - hh / 2 + 12, 7, hh - 24);
    S.group(() => {
      const st = stamp(c); text(ui, st, x0 + 30, y - 24, 30, "#FFD58A", { weight: 700, align: "left" });
      ui.font = `700 30px ${S.FONT}`; const sw_ = ui.measureText(st).width, gw = (ui.font = `700 26px ${S.FONT}`, ui.measureText(tg).width) + 24;
      ui.fillStyle = tc; rrect(ui, x0 + 48 + sw_, y - 42, gw, 36, 6); ui.fill(); text(ui, tg, x0 + 48 + sw_ + gw / 2, y - 23, 26, "#0A0E14", { weight: 700 });
      const sz = tw > 660 ? Math.floor(44 * 660 / tw) : 44; text(ui, e.s, x0 + 30, y + 24, sz, "#FFFFFF", { weight: 800, align: "left" });
    }, [x0, y - hh / 2, x0 + w, y + hh / 2]);
    ui.restore();
  });
}

// ---------------------------------------------------------------- 大きな札：ゾンビのスペック（条件）、警察と機動隊の動き、最後の一言
const CARDS = {   // v2.1：情報を 3 行に絞って大きく
  spec: { title: "ゾンビの設定", col: "#B38CFF", rows: [["速さ", "ボルト並み"], ["かまれたら", "10秒でゾンビに"], ["弱点", "銃弾3発・泳げない"]] },
  police: { title: "警察の対応", col: "#2AC8FF", rows: [["12:02", "警察官が到着"], ["拳銃", "当たるのは4発に1発"], ["5分後", "55人で倒せたのは約6体"]] },
};
function bigCard(t, id) {
  const cd = CARDS[id], a = CUE[`card_${curId(t)}`]; if (a === undefined) return; const u = t - a, k = easeOut(clamp(u / .3)), end = CUE[IDS[IDS.indexOf(curId(t)) + 1]] - .25, ko = 1 - clamp((t - end) / .25);
  const pol = id === "police", x0 = 60, w = 960, rh = 104, y0 = pol ? 440 : 300, h = 140 + cd.rows.length * rh;
  ui.save(); ui.globalAlpha *= k * ko; const pop = 1 + .1 * Math.pow(1 - clamp(u / .22), 2); ui.translate(540, y0 + h / 2); ui.scale(pop, pop); ui.translate(-540, -y0 - h / 2);
  ui.fillStyle = "rgba(6,10,18,.88)"; rrect(ui, x0, y0, w, h, 16); ui.fill(); ui.strokeStyle = cd.col; ui.lineWidth = 3; rrect(ui, x0, y0, w, h, 16); ui.stroke();
  ui.fillStyle = cd.col; ui.fillRect(x0, y0 + 18, 10, 76);
  S.group(() => {
    text(ui, cd.title, x0 + 44, y0 + 58, 60, "#FFFFFF", { weight: 700, align: "left" });
    cd.rows.forEach(([l, r, kd], i) => { const ru = u - .35 - i * .45, rk = easeOut(clamp(ru / .22)); if (rk <= 0) return; const y = y0 + 150 + i * rh, dx = 30 * (1 - rk);
      ui.save(); ui.globalAlpha *= rk; ui.fillStyle = "rgba(255,255,255,.07)"; rrect(ui, x0 + 26 + dx, y - 44, w - 52, 88, 10); ui.fill();
      text(ui, l, x0 + 56 + dx, y + 2, 40, cd.col, { weight: 700, align: "left" }); text(ui, r, x0 + 290 + dx, y + 2, 52, "#FFFFFF", { weight: 700, align: "left" });
      if (kd) { const [tg, tc] = TAGC[kd]; text(ui, tg, x0 + w - 50, y - 24, 30, tc, { weight: 700, align: "right" }); }
      ui.restore(); });
  }, [x0, y0, x0 + w, y0 + h]);
  ui.restore();
}
function loopCard(t) {
  const a = CUE.l18, u = t - a - .5; if (u < 0) return; const k = easeOut(clamp(u / .5));
  ui.save(); ui.globalAlpha *= k; S.group(() => { text(ui, "始まりは", 540, 700, 80, "#EAF2F8", { weight: 700, stroke: "#05080c", sw: 12 }); text(ui, "たった一匹だった", 540, 830, 96, "#FF5A4E", { weight: 700, stroke: "#05080c", sw: 14 }); }); ui.restore();
}
{ const _du = drawUI; drawUI = function (t, name) { if (name === "open") { _du(t, name); return; }
  const k = curId(t); statusUI(t); eventsUI(t);
  if (k === "l01") bigCard(t, "spec"); if (k === "l06") bigCard(t, "police"); if (k === "l18") loopCard(t); }; }

// ---------------------------------------------------------------- 昼と夜（地図のショットの背景の色）
const MAPSHOTS = ["l09", "l12", "l13", "l15", "l16", "l17"], DAY3D = ["l01", "l02", "l03", "l04", "l05", "l06", "l07", "l08"];
function fxEp(t, name) {   // v2.2：昼は空と海を明るく、夜は暗い背景に街の明かり（地図の人の光）が残る。停電のあとは暗いまま
  const k = curId(t);
  if (DAY3D.includes(k) || name === "open") { bg.save(); bg.globalCompositeOperation = "screen"; bg.fillStyle = "rgba(70,90,120,.22)"; bg.fillRect(0, 0, W, H); bg.restore(); return; }   // 正午の街：少し明るく
  if (k === "l10") { bg.save(); bg.globalCompositeOperation = "screen"; bg.fillStyle = "rgba(90,60,40,.25)"; bg.fillRect(0, 0, W, H); bg.restore(); return; }   // 夕方の道路
  if (!MAPSHOTS.includes(k)) return;
  const after = t >= CUE.l14, dl = after ? 0 : daylight(clockNow(t));
  bg.save(); bg.globalCompositeOperation = "screen"; const g = bg.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgba(${lerp(14, 120, dl)},${lerp(20, 170, dl)},${lerp(48, 230, dl)},${lerp(.25, .62, dl)})`); g.addColorStop(1, `rgba(${lerp(8, 60, dl)},${lerp(12, 100, dl)},${lerp(30, 150, dl)},${lerp(.2, .5, dl)})`);
  bg.fillStyle = g; bg.fillRect(0, 0, W, H);
  if (after) { bg.globalCompositeOperation = "multiply"; bg.fillStyle = "rgb(150,140,150)"; bg.fillRect(0, 0, W, H); }   // 停電のあと：灯りの消えた暗さ
  bg.restore();
}

function buildMood() { const c = CUE; MOOD = [[0, { cool: .25, sat: .9, vig: .45 }], [c.l02, { cool: .22, sat: .95, vig: .55 }], [c.l05, { cool: .3, sat: .9, vig: .55 }],
  [c.l11, { cool: .5, sat: .85, vig: .7 }], [c.l12, { cool: .35, sat: .95, vig: .6 }], [c.l14, { cool: .45, sat: .9, vig: .7 }], [c.l15, { cool: .35, sat: .95, vig: .6 }], [c.l18, { cool: .25, sat: .9, vig: .5 }]]; }
function thumb() { CUE = CUE || {}; CUE.t0 = 0; bg.fillStyle = "#05070c"; bg.fillRect(0, 0, W, H); S.group(() => { text(ui, "東京に突然", 540, 430, 100, "#EAF2F8", { weight: 700, stroke: "#05080c", sw: 14 }); text(ui, "ゾンビが一匹。", 540, 570, 100, "#EAF2F8", { weight: 700, stroke: "#05080c", sw: 14 }); text(ui, "どうなる？", 540, 740, 140, "#FF5A4E", { weight: 700, stroke: "#05080c", sw: 18 }); }); }

// 書体（v2.1、ユーザー「ゴシック風でもっと堅めのフォントで、真面目感」）：BIZ UDPゴシック Bold（OFL、assets/make_assets.py で埋め込み）
const bizReady = window.ASSETS.font_biz ? new FontFace("Noto Sans CJK JP", b64buf(window.ASSETS.font_biz), { weight: "100 900" }).load().then(f => document.fonts.add(f)) : Promise.resolve();
kitStart(() => {}); window.READY = Promise.all([window.READY, bizReady]); BL.install();
</script>
