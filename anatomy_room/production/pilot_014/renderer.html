<script>
// pilot_014「目の見えない少年が、世界の読み方を変えた——ルイ・ブライユ」のレンダラー（標準ルール v5・ガイドライン v2.1）。
// 冒頭と終盤の本・村・作業場・学校・教室・地球・現代は 3D（cine.js の映像品質）。点字の図解（12 点 → 6 点、A〜J、63 の形）は 2D で正確に描く。
// 人物は顔のない人形。手のアップは使わない（ガイドライン 6）。点字の点の配置は scripts/pilot_014/fact_check.md の「点字の図の正確さ」。
const S = Stage, { W, H, clamp, lerp, easeOut, easeIn, easeInOut, prog, win, text, rrect } = Stage;
const TS = S.TEXT_SCALE;
const bg = document.getElementById("bg").getContext("2d");
const ui = document.getElementById("ui").getContext("2d");
const SCN = ["hook", "village", "school", "barbier", "invent", "struggle", "spread", "today"];
let TL, CUE, MOOD = [];
const k_ = (t, cue, d = .4, off = 0) => easeOut(prog(t, CUE[cue] + off, d));
const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const lerpV = (a, b, k) => a.clone().lerp(b, k);

// ---------------------------------------------------------------- 点字（正確な配置）
// 点の番号：左の列が上から 1・2・3、右の列が上から 4・5・6
const BR = { a: [1], b: [1, 2], c: [1, 4], d: [1, 4, 5], e: [1, 5], f: [1, 2, 4], g: [1, 2, 4, 5], h: [1, 2, 5], i: [2, 4], j: [2, 4, 5],
  k: [1, 3], l: [1, 2, 3], m: [1, 3, 4], n: [1, 3, 4, 5], o: [1, 3, 5], p: [1, 2, 3, 4], q: [1, 2, 3, 4, 5], r: [1, 2, 3, 5], s: [2, 3, 4], t: [2, 3, 4, 5],
  u: [1, 3, 6], v: [1, 2, 3, 6], x: [1, 3, 4, 6], y: [1, 3, 4, 5, 6], z: [1, 3, 5, 6] };
const dotPos = n => [n <= 3 ? 0 : 1, (n - 1) % 3];   // [列, 段]

// ---------------------------------------------------------------- WebGL（超解像度 1.5 倍）
const SS = 1.5;
const glc = document.createElement("canvas"); glc.width = W * SS; glc.height = H * SS;
const R = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(W * SS, H * SS, false); R.outputEncoding = THREE.sRGBEncoding;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.2;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.shadowMap.autoUpdate = false;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(40, W / H, .01, 200);
const C = c => new THREE.Color(c).convertSRGBToLinear();
let FOGC = C(0x0e141c);
scene.fog = new THREE.FogExp2(FOGC, .03);
const hemi = new THREE.HemisphereLight(C(0x8ea2bd), C(0x1a1612), .45); scene.add(hemi);
const key = new THREE.SpotLight(C(0xffd9a8), 2.5, 0, .7, .55, 1); key.castShadow = true; scene.add(key); scene.add(key.target);
key.shadow.mapSize.set(4096, 4096); key.shadow.bias = -.0004; key.shadow.normalBias = .01;
const rim = new THREE.DirectionalLight(C(0x9fd4ff), .9); scene.add(rim); scene.add(rim.target);
const fill = new THREE.PointLight(C(0x6fa8d8), 0, 12, 2); scene.add(fill);
const sets = {};
function set(name) { const g = new THREE.Group(); g.visible = false; scene.add(g); sets[name] = g; return g; }
function show(...names) { for (const k in sets) sets[k].visible = names.includes(k); }
function setCam(pos, look, fov = 40, near = .02, far = 200, up = null) {
  cam.up.copy(up || V3(0, 1, 0)); cam.position.copy(pos); cam.fov = fov; cam.near = near; cam.far = far; cam.lookAt(look); cam.updateProjectionMatrix(); cam.updateMatrixWorld();
}
function lights({ hemiI = .45, keyI = 30, keyPos, keyAt, keyCol = 0xffd9a8, angle = .7, rimI = .9, rimCol = 0x9fd4ff, rimPos = [3, 4, -4], fillI = 0, fillCol = 0x6fa8d8, fillPos = [0, 2, 2], fog = .03, fogC = 0x0e141c, exp = 1.1, hemiSky = 0x8ea2bd, hemiGround = 0x1a1612 }) {
  hemi.intensity = hemiI; hemi.color = C(hemiSky); hemi.groundColor = C(hemiGround); key.intensity = keyI * .085; key.color = C(keyCol); key.angle = angle;
  key.position.set(...keyPos); key.target.position.set(...keyAt); key.target.updateMatrixWorld();
  rim.intensity = rimI * .6; rim.color = C(rimCol); rim.position.set(...rimPos); fill.intensity = fillI * .2; fill.color = C(fillCol); fill.position.set(...fillPos);
  FOGC = C(fogC); scene.fog.color = FOGC; scene.fog.density = fog; R.toneMappingExposure = exp;
}
const FX = [];   // 加算の光の筋・埃（被写界深度の透明な層には描かない）
function draw3D(dof) {
  R.shadowMap.needsUpdate = true;
  const n0 = cam.near, f0 = cam.far;
  if (!dof) { R.setClearColor(FOGC, 1); R.render(scene, cam); bg.imageSmoothingQuality = "high"; bg.drawImage(glc, 0, 0, W, H); return; }
  const { focus, slab, far: bf, near: bn } = dof;
  const pass = (n, f, blur, clearAlpha) => {
    const fx = clearAlpha === 0 ? FX : [], vis = fx.map(o => o.visible); fx.forEach(o => o.visible = false);
    cam.near = Math.max(n0, n); cam.far = Math.min(f0, f); cam.updateProjectionMatrix();
    R.setClearColor(FOGC, clearAlpha); R.render(scene, cam); R.shadowMap.needsUpdate = false;
    fx.forEach((o, i) => o.visible = vis[i]);
    bg.save(); bg.imageSmoothingQuality = "high"; bg.filter = blur > .3 ? `blur(${blur}px)` : "none"; bg.drawImage(glc, 0, 0, W, H); bg.restore();
  };
  pass(n0, f0, bf, 1);
  pass(Math.max(n0, focus - slab), focus + slab, 0, 0);
  if (focus - slab > n0 + .001) pass(n0, focus - slab + .002, bn, 0);
  cam.near = n0; cam.far = f0; cam.updateProjectionMatrix();
}
function proj(v) { const p = v.clone().project(cam); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z]; }
function guardBox(b) { if (b && b[2] > 0 && b[0] < W && b[3] > 0 && b[1] < H && (b[2] - b[0]) > 30) S.CHARLOG.push(b); }
const FIT_TOP = 210, FIT_BOT = 1360;
function fitB(items, yTop = FIT_TOP, yBot = FIT_BOT) {
  items = items.filter(Boolean); if (!items.length) return;
  const ang = y => Math.atan((1 - 2 * y / H) * Math.tan(cam.fov * Math.PI / 360));
  for (let pass = 0; pass < 3; pass++) {
    cam.updateMatrixWorld();
    const bs = items.map(i => i.box()).filter(Boolean); if (!bs.length) return;
    const top = Math.min(...bs.map(b => b[1])), bot = Math.max(...bs.map(b => b[3])), A = yBot - yTop;
    if (bot - top > A) { const c = items.reduce((m, i) => m.add(i.c()), V3(0, 0, 0)).multiplyScalar(1 / items.length);
      cam.position.copy(c.clone().add(cam.position.clone().sub(c).multiplyScalar((bot - top) / A * 1.03))); continue; }
    if (bot > yBot) cam.rotateX(-(ang(yBot) - ang(bot)));
    else if (top < yTop) cam.rotateX(ang(top) - ang(yTop));
  }
  cam.updateMatrixWorld();
}
const P_ = p => ({ box: () => p.g.visible ? p.box(cam, W, H) : null, c: () => p.g.position.clone().add(V3(0, .85 * (p.S || 1), 0)) });
function guardP(p) { if (p.g.visible) guardBox(p.box(cam, W, H)); }

// ---------------------------------------------------------------- 画像
function canvasTex(w, h, draw, rep = [1, 1], srgb = true) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 16; return t;
}
function normalFromCanvas(src, strength = 3) {   // 文字の形（白＝高い）から凹凸の地図を作る（浮き出し文字）
  const w = src.width, h = src.height, d = src.getContext("2d").getImageData(0, 0, w, h).data, c = document.createElement("canvas"); c.width = w; c.height = h;
  const o = c.getContext("2d").createImageData(w, h), hv = (x, y) => d[(((y + h) % h) * w + ((x + w) % w)) * 4] / 255;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const dx = (hv(x + 1, y) - hv(x - 1, y)) * strength, dy = (hv(x, y + 1) - hv(x, y - 1)) * strength, l = Math.hypot(dx, dy, 1), i = (y * w + x) * 4;
    o.data[i] = (-dx / l * .5 + .5) * 255; o.data[i + 1] = (dy / l * .5 + .5) * 255; o.data[i + 2] = (1 / l * .5 + .5) * 255; o.data[i + 3] = 255; }
  c.getContext("2d").putImageData(o, 0, 0); const t = new THREE.CanvasTexture(c); t.anisotropy = 16; return t;
}
const rnd = S.rng(14);
const woodTex = (base, dark, rep) => canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = base; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 140; i++) { x.strokeStyle = `rgba(${dark},${.05 + rnd() * .12})`; x.lineWidth = 1 + rnd() * 3; const y = rnd() * h;
    x.beginPath(); x.moveTo(0, y); for (let k = 0; k <= 8; k++) x.lineTo(k * w / 8, y + Math.sin(k * 1.3 + i) * 4 * rnd()); x.stroke(); }
}, rep);
const deskWood = woodTex("#5a3d26", "25,14,6", [2, 1]), floorWood = woodTex("#5a4030", "28,16,8", [6, 6]);
const stoneTex = canvasTex(512, 512, (x, w, h) => { x.fillStyle = "#6a665e"; x.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { const v = 90 + rnd() * 30; x.fillStyle = `rgb(${v},${v - 4},${v - 10})`; x.beginPath(); x.ellipse(c * 64 + 32 + (r % 2) * 16, r * 64 + 32, 28, 26, 0, 0, 6.283); x.fill(); } }, [10, 10]);
const plasterTex = canvasTex(512, 512, (x, w, h) => { x.fillStyle = "#c8bca4"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++) { x.fillStyle = `rgba(${rnd() < .5 ? "100,90,70" : "230,220,200"},${.03 + rnd() * .05})`; x.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 5, 1 + rnd() * 3); } }, [4, 2]);
// 本のページ（普通の文字。blurK でぼやける：冒頭の「読めない」）
const pageC = document.createElement("canvas"); pageC.width = 768; pageC.height = 1024;
const pageTex = new THREE.CanvasTexture(pageC); pageTex.encoding = THREE.sRGBEncoding; pageTex.anisotropy = 16;
const pageLines = (() => { const words = "Il était une fois un petit village au bord de la rivière où les enfants apprenaient à lire et à écrire chaque matin avant le travail des champs".split(" "), r = S.rng(3), L = [];
  for (let i = 0; i < 22; i++) { let s = ""; while (s.length < 26) s += words[Math.floor(r() * words.length)] + " "; L.push(s.trim()); } return L; })();
let pageDrawn = -1;
function drawPage(blurK) {
  const k = Math.round(blurK * 20); if (k === pageDrawn) return; pageDrawn = k;
  const x = pageC.getContext("2d"), w = pageC.width, h = pageC.height, r = S.rng(5);
  x.filter = "none"; x.fillStyle = "#e8dfc8"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) { x.fillStyle = `rgba(120,100,70,${.02 + r() * .04})`; x.fillRect(r() * w, r() * h, 1 + r() * 4, 1); }
  x.filter = blurK > .02 ? `blur(${(blurK * 9).toFixed(1)}px)` : "none"; x.globalAlpha = 1 - .75 * blurK;
  x.fillStyle = "#2a2218"; x.font = "30px serif"; pageLines.forEach((s, i) => x.fillText(s, 60, 90 + i * 42));
  x.globalAlpha = 1; x.filter = "none"; pageTex.needsUpdate = true;
}
drawPage(0);
// 浮き出し文字の本（アユイの方式のイメージ：大きな普通の文字を紙から浮き出させる）
const embC = document.createElement("canvas"); embC.width = 1024; embC.height = 1024;
{ const x = embC.getContext("2d"); x.fillStyle = "#000"; x.fillRect(0, 0, 1024, 1024); x.fillStyle = "#fff"; x.font = "700 120px serif";
  ["LE PETIT", "LIVRE DE", "LECTURE"].forEach((s, i) => x.fillText(s, 70, 240 + i * 230)); x.filter = "blur(3px)"; x.drawImage(embC, 0, 0); }
const embNormal = normalFromCanvas(embC, 4);
const embColor = canvasTex(1024, 1024, (x, w, h) => { x.fillStyle = "#e4dac2"; x.fillRect(0, 0, w, h); for (let i = 0; i < 3000; i++) { x.fillStyle = `rgba(120,100,70,${.02 + rnd() * .04})`; x.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 4, 1); }
  x.globalAlpha = .12; x.drawImage(embC, 0, 0); x.globalAlpha = 1; });
const title1829 = canvasTex(768, 1024, (x, w, h) => { x.fillStyle = "#e6dcc4"; x.fillRect(0, 0, w, h); x.fillStyle = "#2a2218"; x.textAlign = "center";
  x.font = "700 40px serif"; x.fillText("PROCÉDÉ", w / 2, 220); x.font = "30px serif";
  ["POUR ÉCRIRE LES PAROLES,", "LA MUSIQUE ET LE PLAIN-CHANT", "AU MOYEN DE POINTS,", "À L'USAGE DES AVEUGLES"].forEach((s, i) => x.fillText(s, w / 2, 300 + i * 46));
  x.font = "italic 32px serif"; x.fillText("par Louis Braille", w / 2, 580); x.font = "30px serif"; x.fillText("PARIS", w / 2, 860); x.fillText("1829", w / 2, 910);
  x.strokeStyle = "rgba(40,30,20,.6)"; x.lineWidth = 2; x.beginPath(); x.moveTo(250, 640); x.lineTo(518, 640); x.stroke(); });

// ---------------------------------------------------------------- 材質と形
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: C(c), roughness: .7, metalness: 0, ...o });
const steel = M(0xb8bec4, { roughness: .3, metalness: .9 });
const iron = M(0x3a3e44, { roughness: .45, metalness: .7 });
const brass = M(0x9a7a3c, { roughness: .35, metalness: .85 });
const deskM = new THREE.MeshStandardMaterial({ map: deskWood, roughness: .6 });
const leatherM = M(0x6a3e22, { roughness: .6 }), leatherD = M(0x4a2a16, { roughness: .65 });
const glowMat = c => new THREE.MeshStandardMaterial({ color: C(0x111111), emissive: C(c), emissiveIntensity: 2.2 });
function box(w, h, d, mat, x = 0, y = 0, z = 0, parent) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; if (parent) parent.add(m); return m; }
function cyl(r, h, mat, x = 0, y = 0, z = 0, parent, rotZ = 0, seg = 32, r2 = null) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r2 ?? r, h, seg), mat); m.position.set(x, y, z); m.rotation.z = rotZ; m.castShadow = m.receiveShadow = true; if (parent) parent.add(m); return m; }
function plane(w, h, mat, parent, x = 0, y = 0, z = 0, ry = 0) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; if (parent) parent.add(m); return m; }
function floor(mat, parent, size = 40) { const f = new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat); f.rotation.x = -Math.PI / 2; f.receiveShadow = true; parent.add(f); return f; }
function person({ dress = null, hair = null, coat = null, scale = 1, skin = 0xd5dbe4, smock = null } = {}) {
  const p = S.mochi3D(THREE, { color: skin }); const P = p.parts;
  if (hair) { const hm = M(hair, { roughness: .8 }); const crown = new THREE.Mesh(new THREE.SphereGeometry(.214, 32, 14, 0, 6.283, 0, .75), hm); crown.rotation.x = -.45; P.head.add(crown);
    const back = new THREE.Mesh(new THREE.SphereGeometry(.214, 32, 20, Math.PI, Math.PI, 0, 1.9), hm); P.head.add(back); }
  const cm = coat || smock;
  if (cm) { const m = M(cm, { roughness: .8 });
    const jk = new THREE.Mesh(new THREE.CapsuleGeometry(.27, smock ? .34 : .44, 8, 24), m); jk.position.y = .27; jk.scale.set(1.06, 1, .97); P.hips.add(jk); jk.castShadow = true;
    for (const a of [P.armL, P.armR]) { const sl = new THREE.Mesh(new THREE.CapsuleGeometry(.084, .2, 6, 16), m); sl.position.y = -.12; a.a.add(sl); }
    for (const l of [P.legL, P.legR]) { const tr = new THREE.Mesh(new THREE.CapsuleGeometry(.1, .22, 6, 16), M(0x2a2826)); tr.position.y = -.14; l.a.add(tr); } }
  if (dress) { const dm = M(dress, { roughness: .85 }); const bod = new THREE.Mesh(new THREE.CapsuleGeometry(.245, .28, 8, 24), dm); bod.position.y = .3; P.hips.add(bod); }
  p.g.scale.setScalar(scale); p.S = scale;
  const pose0 = p.pose; p.pose = o => { pose0({ ...o, sx: scale, sy: scale }); };
  return p;
}

// ================================================================ 場面：暗闇の本（冒頭・終盤）
const bookSet = set("book");
const BOOK = new THREE.Group(); bookSet.add(BOOK);
let leftPage, rightPage, coverL, dots3D, dotsWarm = [];
{
  floor(M(0x14110e, { roughness: .9 }), bookSet, 20);
  const coverM = M(0x3a2418, { roughness: .55 });
  coverL = new THREE.Group(); BOOK.add(coverL);                                          // 左の表紙（めくれる）
  box(.42, .012, .56, coverM, -.21, 0, 0, coverL);
  box(.42, .012, .56, coverM, .21, 0, 0, BOOK);                                           // 右の表紙
  const pageM = new THREE.MeshStandardMaterial({ map: pageTex, roughness: .9 });
  const embossM = new THREE.MeshStandardMaterial({ map: embColor, normalMap: embNormal, normalScale: new THREE.Vector2(1.4, 1.4), roughness: .85 });
  const mkPage = (mat, sx) => { const g = new THREE.PlaneGeometry(.39, .53, 24, 1), pos = g.attributes.position;
    for (let i = 0; i < pos.count; i++) { const x = pos.getX(i); pos.setZ(i, .02 * Math.sin(Math.PI * (x / .39 + .5)) * (1 - Math.abs(x / .39 + .5 - .5))); } g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat); m.rotation.x = -Math.PI / 2; m.position.set(sx * .2, .014, 0); m.receiveShadow = true; return m; };
  leftPage = mkPage(pageM, -1); coverL.add(leftPage); leftPage.position.x = -.2;
  rightPage = mkPage(pageM, 1); BOOK.add(rightPage);
  for (let i = 0; i < 6; i++) box(.39, .003, .53, M(0xe2d8c0, { roughness: .95 }), .2, .006 + i * .001, 0, BOOK);
  // 右のページに浮き上がる点字（3D の半球）：1 行目に BRAILLE、続けて文字の行
  const rows = ["braille", "lire et", "ecrire"], cellW = .036, dotS = .0085, geo = new THREE.SphereGeometry(.0034, 14, 8, 0, 6.283, 0, Math.PI / 2);
  const dm = M(0xf0e8d4, { roughness: .45 });
  const pts = [];
  rows.forEach((w, r) => [...w].forEach((ch, c) => { const cell = BR[ch]; if (!cell) return; cell.forEach(n => { const [cx, cy] = dotPos(n);
    pts.push([.06 + c * cellW + cx * dotS, -.12 + r * .05 + cy * dotS, r]); }); }));
  dots3D = new THREE.InstancedMesh(geo, dm, pts.length); dots3D.castShadow = true; dots3D.userData.pts = pts; BOOK.add(dots3D);
}
// 右のページの紙のふくらみ（mkPage と同じ式）。点はこの高さの上に置く（置かないと紙の下に埋もれる）
const pageH = X => { const u = (X - .2) / .39; return .014 + .02 * Math.cos(Math.PI * u) * (1 - Math.abs(u)); };
function setDots(k, t) {   // k：0→1 で点が紙から押し出される（行ごとに少し遅れて）
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  dots3D.userData.pts.forEach(([x, z, r], i) => { const e = easeOut(clamp(k * 1.6 - r * .3)); m.compose(V3(x, pageH(x) + .0002, z), q, V3(1, Math.max(.001, e), 1)); dots3D.setMatrixAt(i, m); });
  dots3D.instanceMatrix.needsUpdate = true;
}

// ================================================================ 場面：19 世紀の村と馬具の作業場
const village = set("village");
{
  floor(new THREE.MeshStandardMaterial({ map: stoneTex, roughness: .9 }), village, 80);
  const wm = new THREE.MeshStandardMaterial({ map: plasterTex, roughness: .95 });
  for (let i = 0; i < 8; i++) { const s = i % 2 ? 1 : -1, z = -2 - Math.floor(i / 2) * 5, h = 4 + (i % 3) * .8;
    const hs = new THREE.Group(); hs.position.set(s * 4.2, 0, z); village.add(hs);
    box(4, h, 4.6, wm, 0, h / 2, 0, hs);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(3.4, 1.8, 4), M(0x4a3a30, { roughness: .9 })); roof.position.y = h + .9; roof.rotation.y = Math.PI / 4; roof.scale.set(1, 1, 1.25); hs.add(roof);

// 色調：暗闇の本（冷たい）→ 村の夕方（茶）→ 光を失う → 学校（灰・寒色）→ 図解（暗い背景に点）→ 63 の形で光 → 冷たい教室 → 夜 → 1854 で温かい光 → 地球 → 現代（自然光と暖色）→ 温かい本

    [c.school + .5, { cool: .3, sat: .72, vig: .55 }], [c.barbier, { cool: .3, sat: .8, vig: .6 }], [c.grid63 - .2, { cool: .3, sat: .8, vig: .6 }],
    [c.grid63 + 1.6, { cool: .1, warm: .2, sat: 1.0, glow: .3, glowX: .5, glowY: .45, vig: .5 }], [c.slate, { cool: .05, warm: .2, sat: .95, vig: .5 }],
    [c.struggle - .1, { cool: .05, warm: .15, sat: .95, vig: .5 }], [c.struggle + .8, { cool: .45, sat: .6, vig: .65 }], [c.death + .5, { cool: .5, sat: .55, vig: .75 }],
    [c.y1854 - .1, { cool: .5, sat: .55, vig: .75 }], [c.y1854 + 1.2, { cool: .05, warm: .25, sat: 1.0, glow: .35, glowX: .5, glowY: .4, vig: .5 }],
    [c.world, { cool: .05, warm: .1, sat: 1.05, vig: .45 }], [c.today, { cool: 0, warm: .15, sat: 1.0, glow: .2, glowX: .2, glowY: .15, vig: .35 }],
    [c.back, { cool: 0, warm: .25, sat: 1.0, glow: .3, glowX: .6, glowY: .5, vig: .5 }], [c.card + 2, { cool: 0, warm: .28, sat: .95, glow: .3, glowX: .6, glowY: .5, vig: .6 }],
  ];
}
function envFor(t, name) {

  if (name === "invent") return t >= CUE.slate ? ["warm", .55] : ["cold", .45];
  if (name === "struggle") return ["cold", .55];

    const X = .06 + 1.5 * .036, p = proj(BOOK.localToWorld(V3(X, pageH(X), -.12 + .0085))); S.hudTarget(bg, p[0], p[1], 120, k_(t, "dots", .5, .6), t);
