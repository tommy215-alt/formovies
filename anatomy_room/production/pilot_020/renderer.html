// 部品の多くは pilot_019 の renderer.html と同じ（slam・popSub・punch・3D の土台・人体・嵐の海と帆船・ホログラムの台）。
const S = Stage, { W, H, clamp, lerp, easeOut, easeIn, easeInOut, prog, win, text, rrect } = Stage;
const bg = document.getElementById("bg").getContext("2d");

let TL, CUE, MOOD = [];
const k_ = (t, cue, d = .4, off = 0) => easeOut(prog(t, CUE[cue] + off, d));
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const b64buf = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };

// ---------------------------------------------------------------- 派手な文字（フォント：Dela Gothic One＝DG、Mochiy Pop One＝MP）

let GSEQ = 500000;

// 叩きつける文字：大きく出て一瞬で縮み（行き過ぎて戻る）、色ずれ・揺れ・光。cols＝[上の色, 下の色]

// 跳ねる字幕：塊が変わるたびに飛び出す。斜めの黒い帯＋色の縁、強調は黄色、太い縁取り

  { let a2 = 0; for (let i = 0; i < idx; i++) a2 += lens[i]; cs = line.start + (line.end - line.start) * a2 / tot; }

    parts.forEach((p, j) => { if (!p) return; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.lineJoin = "round"; ctx.lineWidth = size * .22; ctx.strokeStyle = "#0a0408"; ctx.strokeText(p, x, y);
      ctx.fillStyle = j % 2 ? "#9FE8FF" : "#FFFFFF"; ctx.fillText(p, x, y); x += ws[j]; });
    logBox(ctx, r.replace(/\*\*/g, ""), -tw / 2, y - size * .58, tw / 2, y + size * .58, size); });

// 画面全体の一打：ズーム（拡大して戻る）と揺れ（閃光は使わない）
const tmpC = document.createElement("canvas"); tmpC.width = W; tmpC.height = H; const tmpX = tmpC.getContext("2d");

  ctx.save(); ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(z, z); ctx.drawImage(tmpC, -W / 2, -H / 2); ctx.restore(); }
const HITS = [];   // [きっかけ, 強さ]：ここで画面がズームして揺れる
function hitAmt(t) { let z = 0, s = 0; const fade = 1 - .6 * darkK(t); for (const [c, k] of HITS) { const u = t - CUE[c]; if (u >= 0 && u < .45) { const e = Math.exp(-u * 9); z += .09 * k * e * fade; s += 26 * k * e * fade; } } return [1 + z, s]; }

  ctx.save(); ctx.font = `400 ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.lineJoin = "round"; ctx.lineWidth = size * sw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);

// ---------------------------------------------------------------- 本物の写真・図
const IMG = {}; const imgReady = [];
for (const k of ["pole5", "polheim"]) { const im = new Image(); imgReady.push(new Promise(r => { im.onload = r; im.onerror = r; })); im.src = window.ASSETS[k]; IMG[k] = im; }
function photo(ctx, im, k, z0, z1, u, { cx = .5, cy = .45, box = [90, 330, 990, 1290], gray = 1, rot = 0, sepia = 0, frame = "#fff", invert = 0, bright = .95 } = {}) {
  if (k <= 0 || !im.width) return; const [x0, y0, x1, y1] = box, bw = x1 - x0, bh = y1 - y0, z = lerp(z0, z1, u), sc = Math.max(bw / im.width, bh / im.height) * z, dw = im.width * sc, dh = im.height * sc;

// ---------------------------------------------------------------- 人体（MPFB の GLB、pilot_018 と同じ作り）：服・髪・肌の材質を名前で決める。肌は頭のまわりだけ
const HUMANS = {};

    const u = clamp((t - CUE.manhaul) / (CUE.pole - CUE.manhaul)); teamPose(t, { speed: 1.2 }); const tz = lerp(0, -3, u);   // 人がそりを引く（低い位置から、大きく）

    if (t < CUE.tentp) { const u = clamp((t - CUE.blackflag) / (CUE.tentp - CUE.blackflag)); snowShot(t, { mode: "day", cp: V3(2.0 - .4 * u, 1.5, 3.6 - .6 * u), look: V3(.35, 1.8, 0), fov: 40, wind: .6, driftK: .5, flag: [0, 0, 0], dof: { focus: 3.6, aperture: .005, maxblur: .01 } }); return "3d"; }
    if (t < CUE.turn) return "2d";
    const u = easeInOut(clamp((t - CUE.turn2) / .5)), yaw = Math.PI * u, tz = -1;   // 振り向いて北へ（カメラも一緒に回り、後ろ姿のまま）
    teamPose(t, { stand: t < CUE.turn2 + .2 }); const ca = yaw, r = 6.5; snowShot(t, { mode: "grey", cp: V3(Math.sin(ca) * r * -1 + 1.2, 2.0, tz + Math.cos(ca) * r), look: V3(0, 1.2, tz), fov: 44, wind: .9, teamAt: [0, 0, tz, yaw] }); return "3d"; }
  if (name === "ret") { if (t < CUE.oates) { const u = clamp((t - CUE.ret) / (CUE.oates - CUE.ret)), f = 1 - clamp((t - CUE.evans) / .8), tz = lerp(0, -2, u); teamPose(t, { speed: .7, fade: [1, 1, 1, 1, f] });   // 5 人が 4 人に（消えていく）
      snowShot(t, { mode: "blizz", cp: V3(2.2, 1.8, tz + 6), look: V3(0, 1.1, tz - 3), fov: 44, wind: 1.2, teamAt: [0, 0, tz] }); return "3d"; }

  if (name === "tent") { if (t < CUE.blizz) return "2d";

    const u = clamp((t - CUE.last) / (CUE.found - CUE.last)); snowShot(t, { mode: "night", cp: V3(5.6 - 1.2 * u, 1.4, 6.6 - 1.3 * u), look: V3(0, 1.0, 0), fov: 40, wind: .5, driftK: .35, tent: { pos: [0, 0, 0], light: 0, glow: .07 + .02 * Math.sin(t * 13) * Math.sin(t * 5) }, exp: 1.0 }); return "3d"; }

    if (t < CUE.back) { const u = clamp((t - CUE.rocks) / (CUE.back - CUE.rocks)); snowShot(t, { mode: "grey", cp: V3(.7 - .15 * u, 1.35 - .15 * u, 1.0 - .2 * u), look: V3(0, .25, 0), fov: 40, wind: .3, driftK: .3, rocksAt: [0, 0, 0], dof: { focus: 1.6, aperture: .008, maxblur: .012 } }); return "3d"; }   // 岩石標本と化石の葉
    hookShot(t, true); return "3d"; }

}
function draw2D(t, name) {
  const X = holoX; X.setTransform(1, 0, 0, 1, 0, 0); X.clearRect(0, 0, W, H);
  if (name === "pole") { bg.fillStyle = "#060a10"; bg.fillRect(0, 0, W, H);
    if (t < CUE.diary) { S.rays(bg, 540, 800, t, "rgba(200,220,255,.07)", 20); photo(bg, IMG.polheim, k_(t, "tentp", .22), 1.0, 1.12, easeInOut(clamp((t - CUE.tentp) / (CUE.diary - CUE.tentp))), { box: [70, 440, 1010, 1100], cy: .5, rot: lerp(-.18, -.02, easeOut(clamp((t - CUE.tentp) / .22))) }); return; }

}

// ---------------------------------------------------------------- 画面の派手な文字と演出
const RED = ["#FF9AB0", "#B8143E"], GOLD = ["#FFFFFF", "#8FD0FF"], CYAN = ["#C8FFFF", "#2AC8FF"], WHITE = ["#FFFFFF", "#C8C8D8"];   // GOLD も冷たい色（氷）にする
function quote(s, k, y = 1250) { if (k <= 0) return; ui.save(); ui.globalAlpha = clamp(k); label(ui, s, 540, y, 38, "#E6EEF8", { font: '"Noto Serif", "Noto Sans CJK JP", serif', sw: .25 }); ui.restore(); }

  if (name === "pole") { if (t < CUE.blackflag) slam(ui, "1912年1月", 540, 330, 120, CUE.pole + .05, t, { cols: WHITE, rot: -.04, sub: "南極点の手前" });
    else if (t < CUE.tentp) slam(ui, "黒い旗", 540, 360, 190, CUE.blackflag, t, { cols: RED, glow: "rgba(255,30,60,1)", rot: -.06 });
    else if (t < CUE.diary) { if (t >= CUE.month) slam(ui, "1か月以上", 540, 300, 150, CUE.month, t, { cols: RED, glow: "rgba(255,30,60,1)", rot: -.06, sub: "先に着いていた" }); credit("写真：Henry Bowers（1912）／パブリックドメイン", k_(t, "tentp", .4, .3), 1180); }
    else if (t < CUE.turn) { quote("“Great God! this is an awful place”", k_(t, "awful", .6), 1150); credit("写真：Henry Bowers（1912）／パブリックドメイン", k_(t, "diary", .6, .3), 1230); }
    else if (t >= CUE.turn2) slam(ui, "生きて帰れ", 540, 360, 150, CUE.turn2, t, { cols: GOLD, glow: "rgba(120,200,255,1)", rot: -.06 }); }
  if (name === "ret") { if (t < CUE.oates) { if (t >= CUE.evans) slam(ui, "5人 → 4人", 540, 360, 120, CUE.evans + .3, t, { cols: WHITE, rot: -.03 }); }

    else slam(ui, "足りない", 540, 1230, 140, CUE.fuel + .7, t, { cols: RED, glow: "rgba(255,30,60,1)", rot: .04 }); }
  if (name === "tent") { if (t < CUE.blizz) slam(ui, "あと18km", 540, 420, 200, CUE.tent + .25, t, { cols: GOLD, glow: "rgba(120,200,255,1)", rot: -.07 });
    else if (t < CUE.last) { const d = Math.min(29, 21 + Math.floor(clamp((t - CUE.blizz) / (CUE.last - CUE.blizz - .3)) * 8.999)); slam(ui, `3月${d}日`, 540, 360, 130, CUE.blizz + .1, t, { cols: WHITE, rot: -.03 }); if (t >= CUE.noexit) slam(ui, "出られない", 540, 1240, 120, CUE.noexit + .1, t, { cols: RED, glow: "rgba(255,30,60,1)", rot: .04 }); }
    else quote("“For God's sake look after our people.”", k_(t, "lastw", .6), 1180); }
  if (name === "found") { if (t < CUE.rocks) slam(ui, "1912年11月", 540, 330, 120, CUE.found + .1, t, { cols: WHITE, rot: -.03, sub: "捜索隊がテントを見つけた" });
    else if (t < CUE.back) slam(ui, "約16kg", 540, 330, 170, CUE.rocks + .05, t, { cols: GOLD, rot: -.05, sub: "岩石の標本（化石の葉も）" });
    else if (t >= CUE.cut) { slam(ui, "届かなかった", 540, 420, 130, CUE.cut + .1, t, { cols: RED, glow: "rgba(255,30,60,1)", rot: .03 }); brokenLine(ui, t); } }
}
function brokenLine(ctx, t) {   // 冒頭とつなぐ：18 km の線が途中で途切れる
  const k = clamp((t - CUE.cut) / 1.2), x0 = 160, x1 = 920, y = 760, xe = lerp(x0, x0 + (x1 - x0) * .62, easeOut(k));
  ctx.save(); glowLine(ctx, "#9FD8FF", 10, 24, () => { ctx.moveTo(x0, y); ctx.lineTo(xe, y); }); ctx.setLineDash([16, 14]); glowLine(ctx, "rgba(255,255,255,.35)", 4, 0, () => { ctx.moveTo(xe + 30, y); ctx.lineTo(x1, y); }); ctx.setLineDash([]);
  ctx.fillStyle = "#7CFFB2"; ctx.beginPath(); ctx.arc(x1, y, 18, 0, 6.283); ctx.fill(); label(ctx, "補給所", x1 - 40, y + 70, 40, "#7CFFB2", { font: DG }); label(ctx, "18km", 540, y - 60, 52, "#fff", { font: DG }); ctx.restore(); }
function fx(t, name) {   // 画面全体の一打（ズーム・揺れ）、グリッチ、スピード線。閃光は使わない
  const [z, s] = hitAmt(t), r = S.rng(Math.floor(t * 30) + 11); punch(bg, z, (r() - .5) * s, (r() - .5) * s);
  for (const [c, d, a] of [["reveal", .25, 10], ["haul", .3, 10], ["blackflag", .3, 12], ["month", .25, 10], ["study", .25, 8], ["tent", .3, 12], ["noexit", .25, 8]]) if (CUE[c] !== undefined && t >= CUE[c] && t < CUE[c] + d) S.glitch(bg, t, a * (1 - (t - CUE[c]) / d), 3);
  if (name === "race" && (t < CUE.rival || (t >= CUE.rival && t < CUE.haul) || t >= CUE.manhaul)) S.speedLines(bg, 540, 820, t, "rgba(255,255,255,.22)", 50, 380, 9);
  if (name === "pole" && t >= CUE.turn2 && t < CUE.turn2 + .8) S.speedLines(bg, 540, 820, t, "rgba(200,230,255,.3)", 56, 360, 7);
  if (name === "tent" && t < CUE.blizz) S.speedLines(bg, 540, 760, t, "rgba(160,200,255,.25)", 50, 300, 5);
}

const grain = (() => { const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d"), d = x.createImageData(256, 256), r = S.rng(99);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 16; } x.putImageData(d, 0, 0); return c; })();
function addGrain(t) { const ox = Math.floor(S.rng(Math.floor(t * 30) + 7)() * 256), oy = Math.floor(S.rng(Math.floor(t * 30) + 91)() * 256);

function buildMood() {   // 色調：暖色を使わない。後半 2/3 は少しずつ彩度を落とし、周辺を暗く
  const c = CUE;
  MOOD = [[0, { cool: .4, sat: 1.0, vig: .6 }], [c.race, { cool: .35, sat: 1.05, vig: .55 }], [c.haul, { cool: .4, sat: .95, vig: .6 }], [c.pole, { cool: .35, sat: 1.0, vig: .58 }],
    [c.blackflag, { cool: .45, sat: .95, vig: .65 }], [c.tentp, { cool: .45, sat: .85, vig: .66 }], [c.diary, { cool: .5, sat: .7, vig: .7 }], [c.turn, { cool: .45, sat: .85, vig: .66 }],
    [c.ret, { cool: .55, sat: .75, vig: .72 }], [c.oates, { cool: .6, sat: .68, vig: .75 }], [c.cold, { cool: .6, sat: .7, vig: .75 }], [c.tent, { cool: .6, sat: .7, vig: .76 }],
    [c.blizz, { cool: .65, sat: .6, vig: .8 }], [c.last, { cool: .65, sat: .52, vig: .84 }], [c.found, { cool: .7, sat: .45, vig: .86 }], [c.back, { cool: .7, sat: .4, vig: .9 }]];
}
// 後半 2/3 の暗さ（0 → 1）：南極点の写真（tentp）から最後の一文の終わりまで、少しずつ
function darkK(t) { if (!TL || CUE.tentp === undefined) return 0; return clamp((t - CUE.tentp) / (TL.ending_start - CUE.tentp)); }
function renderFrame(t) {

  const es = TL.ending_start, name = S.sceneAt(Math.min(t, es - .001));
  const kind = drawScene(Math.min(t, es - .001), name); if (kind === "2d") draw2D(Math.min(t, es - .001), name);
  S.moodGrade(bg, t, MOOD); Cine.bloom(bg, .32 * (1 - .5 * darkK(t))); fx(t, name); addGrain(t);
  { const dk = darkK(t); if (dk > 0) { bg.fillStyle = `rgba(0,6,14,${.48 * Math.pow(dk, 1.3)})`; bg.fillRect(0, 0, W, H); } }   // 後半ほど暗く
  if (t < es) { drawUI(t, name); popSub(ui, t, es); }
  else { bg.fillStyle = `rgba(0,0,0,${clamp((t - es) / .1)})`; bg.fillRect(0, 0, W, H); }   // 共通エンディングなし：すぐに暗転（余韻なし）
  const [a] = S.sceneRange(name), i = SCN.indexOf(name);
  if (i > 0 && t < es) { const k = 1 - prog(t, a, .14); if (k > 0) { bg.fillStyle = `rgba(0,0,0,${.75 * k})`; bg.fillRect(0, 0, W, H); } }   // 場面の切り替えは短い暗転（閃光は使わない）
  bg.getImageData(0, 0, 1, 1); ui.getImageData(0, 0, 1, 1);
}
function renderThumb() {
  bg.clearRect(0, 0, W, H); ui.clearRect(0, 0, W, H); CUE = CUE || {};
  teamPose(2.0, {}); snowShot(2.0, { mode: "blizz", cp: V3(2.2, 1.9, 4.2), look: V3(0, 1.4, -8), fov: 44, wind: 1.3, flag: [-.6, 0, -9], teamAt: [0, 0, -1] });
  S.moodGrade(bg, 0, [[0, { cool: .45, sat: .9, vig: .65 }]]); Cine.bloom(bg, .3); addGrain(0);
  slam(ui, "あと18km", 540, 420, 210, 0, 5, { cols: GOLD, glow: "rgba(120,200,255,1)", rot: -.06 }); slam(ui, "届かなかった5人", 540, 1330, 110, 0, 5, { cols: RED, glow: "rgba(255,30,60,1)", rot: .03 });

}
function setTimeline(tl) { TL = tl; S.setup(tl, SCN); CUE = S.CUE; buildMood();
  HITS.length = 0; for (const [c, k] of [["reveal", 1.5], ["race", .8], ["goal", 1.1], ["rival", .9], ["dogs", 1.0], ["haul", .7], ["manhaul", 1.4], ["blackflag", 1.5], ["tentp", 1.3], ["month", 1.2],
    ["turn2", 1.5], ["evans", .4], ["gone", .4], ["cold", 1.0], ["fuel", .8], ["tent", 1.8], ["noexit", .8], ["rocks", .9], ["cut", .8]]) if (CUE[c] !== undefined) HITS.push([c, k]); }
window.READY = Promise.all([...imgReady, fontReady, loadHumans()]).then(() => { loadEnv(); buildSea(); icebergs(); buildSnow(); });
window.renderFrame = renderFrame; window.renderThumb = renderThumb; window.setTimeline = setTimeline;
</script>
