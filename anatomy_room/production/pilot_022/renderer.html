<script>
// pilot_022「自分で細菌を飲んだ医師——ピロリ菌」のレンダラー（知的設計＋ガイドライン v2.4＋冒頭のオープニング）。
// 知的設計（templates/DESIGN_MODES.md、参考 pilot_017）：落ち着いた科学ドキュメンタリー。字幕は S.docSub、見出しは uiCard、ゆっくりした寄り、決定的な瞬間だけ光の転換。
// オープニング（L00）：結論の文字を上〜中ほどに大きく、本物の図（A2：グレイ解剖学の胃の図、パブリックドメイン）を中央、背景は漂う菌の 3D。
// CG：Poly Haven の HDRI・PBR、SSAO・ボケ、MPFB の人体（pilot_020 の GLB。顔は映さない、手のアップなし）。小瓶・顕微鏡・培養皿・胃・メダルは再現・模式。
// 自己実験はまねしないよう、L01〜L09 の画面に注意書き。共通エンディングは短い版（HUD.endingOverlay）。
const S = Stage, { W, H, clamp, lerp, easeOut, easeIn, easeInOut, prog, win, text, rrect } = Stage;
const TS = S.TEXT_SCALE, T = s => Math.round(s * TS);
const bg = document.getElementById("bg").getContext("2d");
const ui = document.getElementById("ui").getContext("2d");
const SCN = ["open", "hook", "find", "grow", "self", "proof", "today"];
let TL, CUE, MOOD = [];
const k_ = (t, cue, d = .4, off = 0) => easeOut(prog(t, CUE[cue] + off, d));
const CUT = [.55, 1.15, 1.8];   // L08 の転換のカットの切れ目（秒、効果音の打点と同じ）
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const b64buf = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };

// ---------------------------------------------------------------- 本物の写真
const IMG = {}; const imgReady = [];
for (const k of ["gray"]) { const im = new Image(); imgReady.push(new Promise(r => { im.onload = r; im.onerror = r; })); im.src = window.ASSETS[k]; IMG[k] = im; }
function photo(ctx, im, k, z0, z1, u, { cx = .5, cy = .45, box = [90, 330, 990, 1290], gray = 1, frame = true, bright = .92 } = {}) {   // ゆっくり寄る・暗い縁取り
  if (k <= 0 || !im.width) return;
  const [x0, y0, x1, y1] = box, bw = x1 - x0, bh = y1 - y0, z = lerp(z0, z1, u), sc = Math.max(bw / im.width, bh / im.height) * z;

  const g = ctx.createRadialGradient((x0 + x1) / 2, (y0 + y1) / 2, Math.min(bw, bh) * .35, (x0 + x1) / 2, (y0 + y1) / 2, Math.max(bw, bh) * .75); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(2,6,12,.75)");

// ---------------------------------------------------------------- 3D の土台（pilot_017 と同じ）

      const mat3 O = mat3(vec3(1.60475,-0.10208,-0.00327), vec3(-0.53108,1.10813,-0.07276), vec3(-0.07367,-0.00605,1.07602));

const composer = new THREE.EffectComposer(R); composer.setPixelRatio(1); composer.setSize(GW, GH);
const rpass = new THREE.RenderPass(scene, cam);
const ssao = new THREE.SSAOPass(scene, cam, GW, GH); ssao.kernelRadius = .22; ssao.minDistance = .0004; ssao.maxDistance = .02;
{ const ro = ssao.renderOverride.bind(ssao); ssao.renderOverride = (...a) => { const hid = []; scene.traverse(o => { if (o.visible && (o.isPoints || o.userData.noAO)) { o.visible = false; hid.push(o); } }); ro(...a); hid.forEach(o => o.visible = true); }; }
const bokeh = new THREE.BokehPass(scene, cam, { focus: 1, aperture: .002, maxblur: .008, width: GW, height: GH });
composer.addPass(rpass); composer.addPass(ssao); composer.addPass(bokeh); composer.addPass(OUT);
function draw3D({ ao = true, dof = null } = {}) {   // dof＝{ focus：焦点までの距離（m）, aperture, maxblur }
  R.shadowMap.needsUpdate = true; R.setClearColor(FOGC, 1);
  rpass.enabled = !ao; ssao.enabled = ao; bokeh.enabled = !!dof;
  if (dof) { bokeh.uniforms.focus.value = dof.focus; bokeh.uniforms.aperture.value = dof.aperture ?? .002; bokeh.uniforms.maxblur.value = dof.maxblur ?? .008; bokeh.uniforms.nearClip.value = cam.near; bokeh.uniforms.farClip.value = cam.far; bokeh.uniforms.aspect.value = cam.aspect; }
  composer.render(); bg.imageSmoothingQuality = "high"; bg.drawImage(glc, 0, 0, W, H);
}
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: C(c), roughness: .7, metalness: 0, ...o });
function box(w, h, d, mat, x = 0, y = 0, z = 0, parent) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; if (parent) parent.add(m); return m; }

// ---------------------------------------------------------------- Poly Haven の質感（PBR：色・凹凸・粗さ）と HDRI
const TEX = {}; const texLoader = new THREE.TextureLoader();

}
let ENV_ROOM = null;

}

// ---------------------------------------------------------------- 人体（MPFB の GLB、pilot_020 と同じ作り。男性・白衣）

function loadHumans() { const L = new THREE.GLTFLoader(); return Promise.all(Object.entries(window.ASSETS3D.glb).map(([k, s]) => new Promise(res => L.parse(b64buf(s), "", g => { HUMANS[k] = g.scene; res(); }, e => { console.error(e); res(); })))); }

  const g = new THREE.Group(), body = HUMANS[kindKey].clone(true);

  if (bodyMesh && hb0) { const P = bodyMesh.geometry.attributes.position, col = new Float32Array(P.count * 3), cs = C(0xc9a08a), cc = C(coat), hc = new THREE.Vector3(); hb0.getCenter(hc); hc.y = hb0.max.y - .11;
    for (let i = 0; i < P.count; i++) { const d = Math.hypot(P.getX(i) - hc.x, (P.getY(i) - hc.y) * .8, P.getZ(i) - hc.z), k = clamp((.135 - d) / .02) * clamp((P.getY(i) - (hc.y - .16)) / .02); const cl = cc.clone().lerp(cs, k); col.set([cl.r, cl.g, cl.b], i * 3); }
    bodyMesh.geometry.setAttribute("color", new THREE.BufferAttribute(col, 3)); }

// ---------------------------------------------------------------- 研究室（1980 年代の病院の研究室、再現）：実験台・小瓶・顕微鏡・培養皿・窓の光
const lab = set("lab"); let vial, vialLiquid, scope, dishes = [], dishTex = [], doc1, doc2, labLamp, labDust;
function dishCanvas(seed) { const c = document.createElement("canvas"); c.width = c.height = 256; const tx = new THREE.CanvasTexture(c); tx.encoding = THREE.sRGBEncoding; tx.userData = { c, seed, k: -1 }; return tx; }

  if (Math.abs(tx.userData.k - k) < .01) return; tx.userData.k = k; const x = tx.userData.c.getContext("2d");
  const g = x.createRadialGradient(128, 128, 10, 128, 128, 128); g.addColorStop(0, "#9a2a2a"); g.addColorStop(1, "#6a1818"); x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  const r = S.rng(tx.userData.seed); for (let i = 0; i < 260; i++) { const a = r() * 6.283, d = Math.sqrt(r()) * 110, s = (1 + r() * 3) * clamp(k * 1.4 - r() * .4); if (s <= .1) continue;
    x.fillStyle = `rgba(210,210,200,${.6 + .3 * r()})`; x.beginPath(); x.arc(128 + Math.cos(a) * d, 128 + Math.sin(a) * d, s, 0, 6.283); x.fill(); } tx.needsUpdate = true; }
function buildLab() {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), pbr("old_wood_floor", [6, 6], { tint: 0x7a7066 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; lab.add(floor);
  const wallM = M(0xc8ccc4, { roughness: .95 }); Cine.surface(wallM, "plaster", { repeat: [4, 2], normal: .4 });
  for (const [x, z, ry] of [[0, -3, 0], [-3.5, 0, Math.PI / 2], [3.5, 0, -Math.PI / 2]]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(10, 4.5), wallM); w.position.set(x, 2.25, z); w.rotation.y = ry; w.receiveShadow = true; lab.add(w); }

  doc1 = human("man_sit", { coat: 0xe6e6e0, hair: 0x6a6a64 }); doc1.position.set(.6, 0, -.05); doc1.rotation.y = Math.PI; lab.add(doc1);   // 顕微鏡の前（ウォレン、後ろ姿）
  doc2 = human("man_stand", { coat: 0xe6e6e0, hair: 0x3a2a20 }); doc2.position.set(-.2, 0, .15); doc2.rotation.y = Math.PI; lab.add(doc2);   // 実験台の前（マーシャル、後ろ姿）

  const sc = Math.min((bw - 60) / im.width, (bh - 60) / im.height) * z, dw = im.width * sc, dh = im.height * sc;

  ctx.save(); ctx.globalAlpha *= clamp(k); ctx.strokeStyle = "rgba(143,220,255,.5)"; ctx.lineWidth = 2; rrect(ctx, x0, y0, bw, bh, 10); ctx.stroke(); ctx.restore(); }
function callout(s, x, y, px, py, k) {   // 文字だけの札（細い線で胃を指す）
  if (k <= 0) return; ui.save(); ui.globalAlpha = clamp(k); ui.strokeStyle = "rgba(143,220,255,.8)"; ui.lineWidth = 3; ui.beginPath(); ui.moveTo(x, y + 40); ui.lineTo(lerp(x, px, k), lerp(y + 40, py, k)); ui.stroke();

function uiCard(lines, x, y, k = 1) {
  if (k <= 0) return; ui.save(); ui.globalAlpha *= clamp(k);
  const ws = lines.map(([s, sz, w = 700]) => { ui.font = `${w} ${sz}px ${S.FONT}`; return ui.measureText(s).width; });
  const pw = Math.max(...ws) + 64, ph = lines.reduce((a, [, sz]) => a + sz * 1.32, 0) + 36, x0 = x - pw / 2, y0 = y - ph / 2;
  rrect(ui, x0, y0, pw, ph, 12); ui.fillStyle = "rgba(8,14,26,.78)"; ui.fill(); ui.strokeStyle = "rgba(143,220,255,.35)"; ui.lineWidth = 1.5; ui.stroke(); ui.fillStyle = "#8fdcff"; ui.fillRect(x0, y0 + 14, 4, ph - 28);
  S.group(() => { let yy = y0 + 18; lines.forEach(([s, sz, w = 700, col = "#EAF2F8"]) => { yy += sz * 1.32 / 2; text(ui, s, x, yy + 2, sz, col, { weight: w }); yy += sz * 1.32 / 2; }); }, [x0, y0, x0 + pw, y0 + ph]);
  ui.restore();
}

  rrect(ui, x - w / 2, y - size * .8, w, size * 1.6, 8); ui.fillStyle = "rgba(8,14,26,.6)"; ui.fill();
  S.group(() => text(ui, s, x, y + 1, size, "#B8C7D6", { weight: 500 }), [x - w / 2, y - size * .8, x + w / 2, y + size * .8]); ui.restore();
}
const grain = (() => { const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d"), d = x.createImageData(256, 256), r = S.rng(99);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 14; } x.putImageData(d, 0, 0); return c; })();

    [c.self, { cool: .3, sat: .9, vig: .6 }], [c.sick, { cool: .35, sat: .85, vig: .68 }], [c.proof, { cool: .15, sat: 1.0, vig: .55 }], [c.medal, { warm: .25, sat: 1.05, glow: .3, glowX: .5, glowY: .45, vig: .5 }],
