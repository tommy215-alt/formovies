// pilot_017「宇宙の物差し——ヘンリエッタ・スワン・リービット」のレンダラー（標準ルール v8・ガイドライン v2.4）。

//   MPFB で作った人体（assets/make_human.py。顔は映さない：後ろ姿・遠景だけ。手のアップは使わない）。素材はどれも CC0（scripts/pilot_017/assets.md）。
// 本物の写真・図：肖像（A1）、1912 年の論文の Fig. 2（A2）、ESA/Hubble のアンドロメダ（A3）。グラフの点は 1912 年の論文の表 I の値。
// 再現・説明のための図：乾板と星の点、VAR! の乾板、宇宙へ伸びる物差し、銀河。共通エンディングは短い版（HUD.endingOverlay）。
const S = Stage, { W, H, clamp, lerp, easeOut, easeIn, easeInOut, prog, win, text, rrect } = Stage;
const TS = S.TEXT_SCALE, T = s => Math.round(s * TS);
const bg = document.getElementById("bg").getContext("2d");
const ui = document.getElementById("ui").getContext("2d");
const SCN = ["hook", "problem", "harvard", "find", "line", "ruler", "hubble", "letter", "today"];
let TL, CUE, MOOD = [];
const k_ = (t, cue, d = .4, off = 0) => easeOut(prog(t, CUE[cue] + off, d));
const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const b64buf = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };

// ---------------------------------------------------------------- 本物の写真・図
const IMG = {}; const imgReady = [];
for (const k of ["portrait", "fig2", "m31"]) { const im = new Image(); imgReady.push(new Promise(r => { im.onload = r; im.onerror = r; })); im.src = window.ASSETS[k]; IMG[k] = im; }
function photo(ctx, im, k, z0, z1, u, { cx = .5, cy = .45, box = [90, 330, 990, 1290], gray = 1, frame = true, bright = .92 } = {}) {   // ゆっくり寄る・暗い縁取り
  if (k <= 0 || !im.width) return;
  const [x0, y0, x1, y1] = box, bw = x1 - x0, bh = y1 - y0, z = lerp(z0, z1, u), sc = Math.max(bw / im.width, bh / im.height) * z;

  if (frame) { ctx.save(); ctx.globalAlpha *= clamp(k); ctx.strokeStyle = "rgba(143,220,255,.45)"; ctx.lineWidth = 2; rrect(ctx, x0, y0, bw, bh, 10); ctx.stroke(); ctx.restore(); }
}
function credit(s, k, y = 1300) {
  if (k <= 0) return;
  ui.save(); ui.globalAlpha = clamp(k) * .9; S.group(() => text(ui, s, 540, y, 26, "#B8C7D6", { weight: 500, stroke: "#04101c", sw: 5 })); ui.restore();
}
function photoGlow(t, cue, box) {   // 本物の写真に、斜めの光と小さな粒を重ねる
  const k = k_(t, cue, .8); if (k <= 0) return; const [x0, y0, x1, y1] = box; bg.save(); bg.globalCompositeOperation = "screen";
  const g = bg.createLinearGradient(x0, y0, x0 + (x1 - x0) * .7, y1); g.addColorStop(0, `rgba(160,210,255,${.16 * k})`); g.addColorStop(1, "rgba(160,210,255,0)"); bg.fillStyle = g; bg.fillRect(x0, y0, x1 - x0, y1 - y0);
  const r = S.rng(23); for (let i = 0; i < 90; i++) { const x = x0 + r() * (x1 - x0), y = y0 + (((r() * (y1 - y0) - t * 20 * (.5 + r())) % (y1 - y0)) + (y1 - y0)) % (y1 - y0); bg.fillStyle = `rgba(220,240,255,${.3 * k * r()})`; bg.fillRect(x, y, 2, 2); }

// ---------------------------------------------------------------- 1912 年の論文の表 I（小マゼラン雲の 25 個の変光星：周期〔日〕と極大の明るさ〔等級〕）
const TAB = [[1.25336, 14.8], [1.6637, 14.8], [1.7620, 14.8], [1.87502, 15.1], [2.17352, 14.7], [2.913, 14.4], [3.501, 14.7], [4.2897, 14.6], [4.547, 14.3], [4.9866, 14.3], [5.311, 14.4], [5.323, 14.3], [6.2926, 13.8],
  [6.650, 14.1], [7.483, 14.0], [8.397, 13.9], [10.336, 13.6], [11.645, 13.4], [12.417, 13.8], [13.08, 13.4], [13.47, 13.4], [16.75, 13.0], [31.94, 12.2], [65.8, 11.4], [127.0, 11.2]];
const FIT = (() => { const X = TAB.map(([p]) => Math.log10(p)), Y = TAB.map(([, m]) => m), n = X.length, mx = X.reduce((a, b) => a + b) / n, my = Y.reduce((a, b) => a + b) / n;
  let sxy = 0, sxx = 0; for (let i = 0; i < n; i++) { sxy += (X[i] - mx) * (Y[i] - my); sxx += (X[i] - mx) ** 2; } const b = sxy / sxx; return { b, a: my - b * mx }; })();

// ---------------------------------------------------------------- 3D：描画の土台（超解像度 1.5 倍）と仕上げ（SSAO・ボケ・ACES の色調）

function setCam(pos, look, fov = 40, near = .02, far = 300) { cam.position.copy(pos); cam.fov = fov; cam.near = near; cam.far = far; cam.lookAt(look); cam.updateProjectionMatrix(); cam.updateMatrixWorld(); }
function lights({ hemiI = .3, keyI = 30, keyPos = [0, 5, 0], keyAt = [0, 0, 0], keyCol = 0xffd9a8, angle = .7, rimI = .6, rimCol = 0x9fd4ff, rimPos = [3, 4, -4], fog = .02, fogC = 0x05070b, exp = 1.0, hemiSky = 0x8ea2bd, hemiGround = 0x1a1612 } = {}) {
  hemi.intensity = hemiI; hemi.color = C(hemiSky); hemi.groundColor = C(hemiGround); key.intensity = keyI * .085; key.color = C(keyCol); key.angle = angle;
  key.position.set(...keyPos); key.target.position.set(...keyAt); key.target.updateMatrixWorld(); rim.intensity = rimI; rim.color = C(rimCol); rim.position.set(...rimPos);

const OUT = new THREE.ShaderPass({   // 仕上げ：ACES の色調と sRGB（composer の中間は線形のため、最後にここで変換する）
  uniforms: { tDiffuse: { value: null }, exposure: { value: 1.0 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `uniform sampler2D tDiffuse; uniform float exposure; varying vec2 vUv;
    vec3 rvFit(vec3 v){ vec3 a = v * (v + 0.0245786) - 0.000090537; vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }

      const mat3 O = mat3(vec3(1.60475,-0.10208,-0.00327), vec3(-0.53108,1.10813,-0.07276), vec3(-0.07367,-0.00605,1.07602));

    vec3 rvSRGB(vec3 c){ return mix(pow(c, vec3(0.41666)) * 1.055 - vec3(0.055), c * 12.92, vec3(lessThanEqual(c, vec3(0.0031308)))); }
    void main(){ vec4 c = texture2D(tDiffuse, vUv); gl_FragColor = vec4(rvSRGB(rvAces(c.rgb)), 1.0); }` });
const composer = new THREE.EffectComposer(R); composer.setPixelRatio(1); composer.setSize(GW, GH);
const rpass = new THREE.RenderPass(scene, cam);
const ssao = new THREE.SSAOPass(scene, cam, GW, GH); ssao.kernelRadius = .22; ssao.minDistance = .0004; ssao.maxDistance = .02;
{ const ro = ssao.renderOverride.bind(ssao); ssao.renderOverride = (...a) => { const hid = []; scene.traverse(o => { if (o.visible && (o.isPoints || o.userData.noAO)) { o.visible = false; hid.push(o); } }); ro(...a); hid.forEach(o => o.visible = true); }; }

composer.addPass(rpass); composer.addPass(ssao); composer.addPass(bokeh); composer.addPass(OUT);
function draw3D({ ao = true, dof = null } = {}) {   // dof＝{ focus：焦点までの距離（m）, aperture, maxblur }
  R.shadowMap.needsUpdate = true; R.setClearColor(FOGC, 1);
  rpass.enabled = !ao; ssao.enabled = ao; bokeh.enabled = !!dof;
  if (dof) { bokeh.uniforms.focus.value = dof.focus; bokeh.uniforms.aperture.value = dof.aperture ?? .002; bokeh.uniforms.maxblur.value = dof.maxblur ?? .008; bokeh.uniforms.nearClip.value = cam.near; bokeh.uniforms.farClip.value = cam.far; bokeh.uniforms.aspect.value = cam.aspect; }
  composer.render(); bg.imageSmoothingQuality = "high"; bg.drawImage(glc, 0, 0, W, H);
}
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: C(c), roughness: .7, metalness: 0, ...o });

// ---------------------------------------------------------------- Poly Haven の質感（PBR：色・凹凸・粗さ）と HDRI
const TEX = {}; const texLoader = new THREE.TextureLoader();

  const t = k => { const key_ = name + "_" + k, tx = TEX[key_] || (TEX[key_] = texLoader.load(window.ASSETS3D.tex[key_])); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.anisotropy = 16; return tx; };

}
let ENV_ROOM = null;

// ---------------------------------------------------------------- 人体（MPFB の GLB）：服・髪・肌の材質を名前で決める。1900 年ごろの長いスカートとまとめ髪を足す
const HUMANS = {};
function loadHumans() {
  const L = new THREE.GLTFLoader();
  return Promise.all(Object.entries(window.ASSETS3D.glb).map(([k, s]) => new Promise(res => L.parse(b64buf(s), "", g => { HUMANS[k] = g.scene; res(); }, e => { console.error(e); res(); }))));
}
const SKIN = M(0xc9a08a, { roughness: .55 });
function human(kindKey, { coat = 0x2a2a30, skirt = 0x1e1e24, seated = false, hair = 0x3a2a20 } = {}) {
  const src = HUMANS[kindKey]; const g = new THREE.Group(); const body = src.clone(true);
  const coatM = M(coat, { roughness: .85 }), skirtM = M(skirt, { roughness: .9 }), hairM = M(hair, { roughness: .5 }); hairM.color.multiplyScalar(.55); Cine.surface(coatM, "fabric", { repeat: [8, 8], normal: .7 }); Cine.surface(hairM, "wood", { repeat: [1, 6], normal: .9, roughness: 1 }); Cine.surface(skirtM, "fabric", { repeat: [10, 10], normal: .7 });
  const bb = new THREE.Box3(); let bodyMesh = null;
  body.traverse(o => { if (!o.isMesh) return; o.castShadow = o.receiveShadow = true; const n = o.name.toLowerCase();
    if (/braid|ponytail|bob|hair/.test(n)) o.material = hairM; else if (/suit/.test(n)) o.material = coatM; else if (/shoe/.test(n)) o.material = M(0x141010, { roughness: .4 });
    else { o.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .8 }); Cine.surface(o.material, "fabric", { repeat: [8, 8], normal: .5 }); bodyMesh = o; }
    o.geometry.computeBoundingBox(); });
  bb.setFromObject(body); body.position.y = -bb.min.y; g.add(body);
  let hb0 = null; body.traverse(o => { if (o.isMesh && o.material === hairM) hb0 = new THREE.Box3().setFromObject(o); });
  if (bodyMesh && hb0) { const P = bodyMesh.geometry.attributes.position, col = new Float32Array(P.count * 3), cs = C(window.__dbgSkin ?? 0xc9a08a), cc = C(coat), hc = new THREE.Vector3(); hb0.getCenter(hc); hc.y += bb.min.y; hc.y = hb0.max.y - .11;   // 頭（と首）だけ肌、ほかは服の色（1900 年ごろの長袖）
    for (let i = 0; i < P.count; i++) { const d = Math.hypot(P.getX(i) - hc.x, (P.getY(i) - hc.y) * .8, P.getZ(i) - hc.z), k = clamp((.135 - d) / .02) * clamp((P.getY(i) - (hc.y - .16)) / .02); const cl = cc.clone().lerp(cs, k); col.set([cl.r, cl.g, cl.b], i * 3); } bodyMesh.geometry.setAttribute("color", new THREE.BufferAttribute(col, 3)); }
  let hb = null; body.traverse(o => { if (o.isMesh && o.material === hairM) hb = new THREE.Box3().setFromObject(o); });
  if (hb) { const bun = new THREE.Mesh(new THREE.SphereGeometry(.065, 32, 20), hairM); bun.scale.set(1, .85, .8);   // まとめ髪（後頭部）
    bun.position.set((hb.min.x + hb.max.x) / 2, hb.max.y - bb.min.y - (seated ? .1 : .09), hb.min.z + (seated ? .06 : .03)); bun.castShadow = true; g.add(bun); }

  const sk = new THREE.Mesh(new THREE.LatheGeometry(prof.map(([r, y]) => new THREE.Vector2(r, y)), 48), skirtM); sk.position.set(0, top, seated ? .14 : .03); sk.scale.set(1.05, 1, seated ? .9 : .85); sk.castShadow = sk.receiveShadow = true;

}

// ---------------------------------------------------------------- 乾板（再現）：ガラスの板と、星の点（写真の陰画なので、星は黒い点）
const plateC = document.createElement("canvas"); plateC.width = plateC.height = 2048;
(() => { const x = plateC.getContext("2d"), r = S.rng(17);
  const g = x.createRadialGradient(1024, 1024, 200, 1024, 1024, 1500); g.addColorStop(0, "#d8dcd6"); g.addColorStop(1, "#b8bcb2"); x.fillStyle = g; x.fillRect(0, 0, 2048, 2048);

function lightbox() {   // 乾板を下から照らす箱（木の枠・乳白色の板）
  const g = new THREE.Group(); const wood = pbr("wood_table_001", [1, 1], { tint: 0x8a6a4a });

// ---------------------------------------------------------------- 天文台の部屋（20 世紀のはじめ：木の床・腰板・漆喰の壁・高い窓・机の列）
