<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>pilot_055 renderer</title>
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0}
/* もしも設計：上にタイトルの帯（黒地に赤、TBAR）。3D の画は帯の半分だけ下げる（空の隕石が帯に隠れないように、下は地面が少し切れる） */
#stage canvas:not(#ui){top:218px}
</style>
</head><body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="ui" width="1080" height="1920"></canvas>
</div>
<script src="../common/vendor/three.min.js"></script>
<script src="../ext/vendor/three147/GLTFLoader.js"></script>
<script src="../ext/vendor/three147/RGBELoader.js"></script>
<script src="../ext/vendor/three147/Pass.js"></script>
<script src="../ext/vendor/three147/EffectComposer.js"></script>
<script src="../ext/vendor/three147/RenderPass.js"></script>
<script src="../ext/vendor/three147/ShaderPass.js"></script>
<script src="../ext/vendor/three147/CopyShader.js"></script>
<script src="../ext/vendor/three147/SimplexNoise.js"></script>
<script src="../ext/vendor/three147/SSAOShader.js"></script>
<script src="../ext/vendor/three147/SSAOPass.js"></script>
<script src="../ext/vendor/three147/BokehShader.js"></script>
<script src="../ext/vendor/three147/BokehPass.js"></script>
<script src="../common/stage.js"></script>
<script src="../common/cine.js"></script>
<script src="../ext/hud_ext.js"></script>
<script src="assets/assets.js"></script>
<script src="assets/plan.js"></script>
<script src="../ext/kit/scene_assets.js"></script>
<script src="../ext/kit/kit.js"></script>
<script src="../ext/kit/shots.js"></script>
<script src="work/blender/index.js"></script>
<script src="../ext/blender/blframes.js"></script>
<script>
// pilot_055 のレンダラー（もしも設計の既定、templates/DESIGN_MODES.md。土台は pilot_053）。10万ボルトの電撃が、現実にあったら？
// ナレーションなし：情報はポップアップ（下の出来事の札・l04 の電圧のはしご・l07 の大きな札）。ショットと出来事は plan.py（assets/plan.js）。
// 3D は Blender（blender/scene.py）。数字は scripts/pilot_055/sim/spark.json。上にタイトルの帯（黒地に赤、Dela Gothic One）。作品名・キャラクター・技の絵は出さない。
const PL = window.PLAN, SH = {}; PL.shots.forEach(s => SH[s.id] = s);
const IDS = PL.shots.map(s => s.id), SIM = PL.sim;
Object.assign(KIT, { design: "intel", scenes: ["open", "l01"], images: [], ci: {}, hits: [],
  opening: { img: null, bg: blShot("l00"), title: ["10万ボルトの電撃が", "現実にあったら？"], size1: 92, size2: 104, credit: [] } });
SHOTS = IDS.slice(1).map(k => ({ at: k, kind: "3d", draw: blShot(k) }));
S.docSub = () => {};   // 字幕なし（ナレーションがない）
function curId(t) { let k = IDS[0]; for (const id of IDS) if (CUE[id] !== undefined && t >= CUE[id]) k = id; return k; }

// ---------------------------------------------------------------- 上：タイトルの帯（もしも設計の既定：黒地に赤、Dela Gothic One、最初から最後まで）
const TBAR = 436;   // 2026-11-10 ユーザー「タイトル帯をあと 5% 下げて」→ 帯を 96px 高くして文字を 96px 下げた
function fitText(s, size, maxw) { ui.font = `400 ${size}px TitleBlack`; const w = ui.measureText(s).width; return w > maxw ? Math.floor(size * maxw / w) : size; }
function titleBar() {
  ui.save(); ui.fillStyle = "#000"; ui.fillRect(0, 0, W, TBAR);
  const [l1, l2] = KIT.opening.title, s1 = fitText(l1, 92, 1000), s2 = fitText(l2, 104, 1000);
  S.group(() => { ui.fillStyle = "#FF2A2A"; ui.textAlign = "center"; ui.textBaseline = "middle";
    ui.font = `400 ${s1}px TitleBlack`; ui.fillText(l1, 540, 236); ui.font = `400 ${s2}px TitleBlack`; ui.fillText(l2, 540, 354); }, [0, 0, W, TBAR]);   // 2026-11-10 全画面で上が少し見切れる → 22px 下げた
  ui.restore();
}

// ---------------------------------------------------------------- 下：出来事の札
const TAGC0 = { V: ["電気", "#FFD23C"], P: ["届いた距離", "#7FD0FF"], C: ["比べると", "#B38CFF"] };
const EVS = []; PL.shots.forEach(s => (s.ev || []).forEach(e => EVS.push({ at: s.id, off: e[0], s: e[1], kind: e[2] })));
function eventsUI(t) {
  if (t >= CUE.l07) return;
  const live = EVS.filter(e => t >= CUE[e.at] + e.off && t < CUE[e.at] + e.off + 3.6).slice(-2), y1 = 1520, hh = 120, gap = 16;
  live.forEach((e, i) => {
    const u = t - CUE[e.at] - e.off, k = easeOut(clamp(u / .25)) * (1 - clamp((u - 3.2) / .4)), y = y1 - (live.length - i) * (hh + gap) + hh / 2, x0 = 40 - 60 * (1 - k);
    const [tg, tc] = TAGC0[e.kind];
    ui.save(); ui.globalAlpha *= k; ui.font = `800 50px ${S.FONT}`; const tw = Math.min(900, ui.measureText(e.s).width), w = Math.max(520, tw + 80);
    const pop = 1 + .12 * Math.pow(1 - clamp(u / .18), 2); ui.translate(x0, y); ui.scale(pop, pop); ui.translate(-x0, -y);
    ui.fillStyle = "rgba(6,10,16,.86)"; rrect(ui, x0, y - hh / 2, w, hh, 14); ui.fill(); ui.fillStyle = tc; ui.fillRect(x0, y - hh / 2 + 12, 7, hh - 24);
    S.group(() => {
      const gw = (ui.font = `700 26px ${S.FONT}`, ui.measureText(tg).width) + 24;
      ui.fillStyle = tc; rrect(ui, x0 + 30, y - 46, gw, 34, 6); ui.fill(); text(ui, tg, x0 + 30 + gw / 2, y - 28, 26, "#0A0E14", { weight: 700 });
      const sz = tw > 900 ? Math.floor(50 * 900 / tw) : 50; text(ui, e.s, x0 + 30, y + 26, sz, "#FFFFFF", { weight: 800, align: "left" });
    }, [x0, y - hh / 2, x0 + w, y + hh / 2]);
    ui.restore();
  });
}

// ---------------------------------------------------------------- l04：電圧のはしご（火花の長さの目安）
const LAD = [["冬の静電気", "約3,000V", "1mmほど", .1], ["新幹線の架線", "2万5,000V", "約8mm", .83], ["10万ボルト", "10万V", "約3cm", 3.3], ["送電線", "50万V", "約17cm", 17], ["雷", "約1億V", "何kmも", -1]];
function zig(ctx, x0, y, len, amp, seed, w, col) {
  const r = S.rng(seed); ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = "round"; ctx.shadowColor = "rgba(255,220,80,.9)"; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.moveTo(x0, y); const n = Math.max(2, Math.floor(len / 14)); for (let i = 1; i <= n; i++) ctx.lineTo(x0 + len * i / n, y + (i < n ? (r() - .5) * 2 * amp : 0)); ctx.stroke(); ctx.restore(); }
function ladderUI(t) {
  if (curId(t) !== "l04") return; const u0 = t - CUE.l04, k = easeOut(clamp(u0 / .3)), x0 = 50, y0 = TBAR + 90, w = 980, rh = 196;
  ui.save(); ui.globalAlpha *= k; ui.fillStyle = "rgba(6,10,18,.88)"; rrect(ui, x0, y0, w, 150 + LAD.length * rh, 18); ui.fill(); ui.strokeStyle = "#FFD23C"; ui.lineWidth = 3; rrect(ui, x0, y0, w, 150 + LAD.length * rh, 18); ui.stroke();
  S.group(() => { text(ui, "電圧と、火花が飛ぶ長さ（目安）", x0 + 40, y0 + 70, 50, "#FFFFFF", { weight: 800, align: "left" }); }, [x0, y0, x0 + w, y0 + 120]);
  LAD.forEach(([nm, v, len, cm], i) => {
    const a = .6 + i * 1.0, uu = u0 - a, rk = easeOut(clamp(uu / .25)); if (rk <= 0) return; const y = y0 + 150 + i * rh + rh / 2 - 20, hi = nm === "10万ボルト";
    ui.save(); ui.globalAlpha *= rk; if (hi) { ui.fillStyle = "rgba(255,210,60,.16)"; rrect(ui, x0 + 18, y - rh / 2 + 14, w - 36, rh - 18, 12); ui.fill(); }
    S.group(() => { text(ui, nm, x0 + 44, y - 36, hi ? 50 : 44, hi ? "#FFD23C" : "#EAF2F8", { weight: 800, align: "left" }); text(ui, v, x0 + 44, y + 26, 40, "#B8C7D6", { weight: 700, align: "left" });
      text(ui, len, x0 + w - 190, y - 36, hi ? 52 : 44, hi ? "#FFD23C" : "#FFFFFF", { weight: 900, align: "right" }); }, [x0 + 20, y - rh / 2, x0 + w - 20, y + rh / 2]);
    const L = cm < 0 ? 520 : 30 + 115 * Math.log10(cm / .1), grow = clamp(uu / .35);   // 火花の長さは対数の目盛り（雷は画面いっぱい）
    zig(ui, x0 + 400, y + 30, L * grow, cm < 0 ? 22 : 4 + 3 * Math.log10(cm / .1 + 1), 7 * i + Math.floor(t * 12), cm < 0 ? 7 : hi ? 6 : 4, "#FFF6C0");
    ui.restore(); });
  ui.restore();
}

// ---------------------------------------------------------------- l07：結果
function shoutCard(t, a, l1, l2, c1, c2, sub) {
  const u = t - a; if (u < 0) return; const k = easeOut(clamp(u / .4)), k2 = easeOut(clamp((u - .5) / .4)), k3 = easeOut(clamp((u - 1.2) / .4));
  ui.save(); ui.globalAlpha *= k; S.group(() => text(ui, l1, 540, 760, 92, c1, { weight: 900, stroke: "#05080c", sw: 16 })); ui.restore();
  ui.save(); ui.globalAlpha *= k2; ui.translate(540, 910); ui.scale(1 + .25 * (1 - k2), 1 + .25 * (1 - k2)); S.group(() => text(ui, l2, 0, 0, 100, c2, { weight: 900, stroke: "#05080c", sw: 16 })); ui.restore();
  if (sub) { ui.save(); ui.globalAlpha *= k3; S.group(() => sub.forEach((s, i) => text(ui, s, 540, 1060 + i * 70, 56, "#FFFFFF", { weight: 800, stroke: "#05080c", sw: 12 }))); ui.restore(); }
}
{ const _du = drawUI; drawUI = function (t, name) { titleBar(); if (name === "open") return;
  const k = curId(t); eventsUI(t); ladderUI(t);
  if (k === "l07") shoutCard(t, CUE.l07 + .15, "10万ボルトの電撃", "届くのは 約3cm", "#FFFFFF", "#FFD23C", ["当てるには 目の前まで近づく"]); }; }

function buildMood() { MOOD = [[0, { cool: .0, sat: 1.05, vig: .22 }]]; }
function thumb() { CUE = CUE || {}; CUE.t0 = 0; bg.fillStyle = "#0c1018"; bg.fillRect(0, 0, W, H); S.group(() => { text(ui, "10万ボルトの電撃", 540, 450, 96, "#EAF2F8", { weight: 700, stroke: "#05080c", sw: 14 }); text(ui, "届くのは？", 540, 600, 110, "#FFD23C", { weight: 700, stroke: "#05080c", sw: 16 }); }); }

// 書体：BIZ UDPゴシック Bold（OFL、assets/make_assets.py で埋め込み）
const bizReady = window.ASSETS.font_biz ? new FontFace("Noto Sans CJK JP", b64buf(window.ASSETS.font_biz), { weight: "100 900" }).load().then(f => document.fonts.add(f)) : Promise.resolve();
const titleReady = window.ASSETS.font_title ? new FontFace("TitleBlack", b64buf(window.ASSETS.font_title), { weight: "400" }).load().then(f => document.fonts.add(f)) : Promise.resolve();
kitStart(() => {}); window.READY = Promise.all([window.READY, bizReady, titleReady]); BL.install();
</script>
</body></html>
