<script>
// pilot_012「手を洗うだけで、救える命があった」（ゼンメルワイス）のレンダラー（標準ルール v3：暗めのテック調を基本に、色調を物語の感情に合わせて変える。
// 字幕と重要な画面内テキストは従来の約 1.2 倍＝Stage.docSub・Stage.TEXT_SCALE、色調は Stage.moodGrade）。
// renderFrame(t) が時刻 t の 1 コマを描く（決定的：乱数はすべて種つき）。3D は画面外の WebGL に描いて bg（2D）に重ね、ui（2D）に文字。
// 人物は顔のない人形（stage.js の mochi3D に服を付ける）。実際の顔・苦しむ患者・遺体は描かない。
const S = Stage, { W, H, clamp, lerp, easeOut, easeIn, easeInOut, prog, win, text, rrect } = Stage;
const TS = S.TEXT_SCALE;                                    // 画面内テキストの倍率（1.2）
const bg = document.getElementById("bg").getContext("2d");
const ui = document.getElementById("ui").getContext("2d");
const SCN = ["hook", "ward", "clinics", "search", "wash", "numbers", "conflict", "today"];
let TL, CUE, MOOD = [];
const k_ = (t, cue, d = .4, off = 0) => easeOut(prog(t, CUE[cue] + off, d));
const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const lerpV = (a, b, k) => a.clone().lerp(b, k);

// ---------------------------------------------------------------- WebGL
const SS = 1.5;                                             // 超解像度：1.5 倍で描いて縮める（輪郭と細かい模様のちらつきを減らす。GPU の余力を使う）
const glc = document.createElement("canvas"); glc.width = W * SS; glc.height = H * SS;
const R = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(W * SS, H * SS, false); R.outputEncoding = THREE.sRGBEncoding;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.2;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.shadowMap.autoUpdate = false;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(40, W / H, .01, 200);
const C = c => new THREE.Color(c).convertSRGBToLinear();
let FOGC = C(0x0e141c);
scene.fog = new THREE.FogExp2(FOGC, .03);
const hemi = new THREE.HemisphereLight(C(0x8ea2bd), C(0x1a1612), .45); scene.add(hemi);
const key = new THREE.SpotLight(C(0xffd9a8), 2.5, 0, .7, .55, 1); key.castShadow = true; scene.add(key); scene.add(key.target);
key.shadow.mapSize.set(4096, 4096); key.shadow.bias = -.0004; key.shadow.normalBias = .01;
const rim = new THREE.DirectionalLight(C(0x9fd4ff), .9); scene.add(rim); scene.add(rim.target);
const fill = new THREE.PointLight(C(0x6fa8d8), 0, 12, 2); scene.add(fill);
const sets = {};
function set(name) { const g = new THREE.Group(); g.visible = false; scene.add(g); sets[name] = g; return g; }
function show(...names) { for (const k in sets) sets[k].visible = names.includes(k); }
function setCam(pos, look, fov = 40, near = .02, far = 200) {
  cam.position.copy(pos); cam.fov = fov; cam.near = near; cam.far = far; cam.lookAt(look); cam.updateProjectionMatrix(); cam.updateMatrixWorld();
}
function lights({ hemiI = .45, keyI = 30, keyPos, keyAt, keyCol = 0xffd9a8, angle = .7, rimI = .9, rimCol = 0x9fd4ff, rimPos = [3, 4, -4], fillI = 0, fillCol = 0x6fa8d8, fillPos = [0, 2, 2], fog = .03, fogC = 0x0e141c, exp = 1.1, hemiSky = 0x8ea2bd }) {
  hemi.intensity = hemiI; hemi.color = C(hemiSky); key.intensity = keyI * .085; key.color = C(keyCol); key.angle = angle;   // 値は旧来の光の単位（r149 の既定）。0.085 倍で実際の強さ
  key.position.set(...keyPos); key.target.position.set(...keyAt); key.target.updateMatrixWorld();
  rim.intensity = rimI * .6; rim.color = C(rimCol); rim.position.set(...rimPos); fill.intensity = fillI * .2; fill.color = C(fillCol); fill.position.set(...fillPos);
  FOGC = C(fogC); scene.fog.color = FOGC; scene.fog.density = fog; R.toneMappingExposure = exp;
}
function draw3D(dof) {
  R.shadowMap.needsUpdate = true;
  const n0 = cam.near, f0 = cam.far;
  if (!dof) { R.setClearColor(FOGC, 1); R.render(scene, cam); bg.imageSmoothingQuality = "high"; bg.drawImage(glc, 0, 0, W, H); return; }
  const { focus, slab, far: bf, near: bn } = dof;
  const pass = (n, f, blur, clearAlpha) => {
    cam.near = Math.max(n0, n); cam.far = Math.min(f0, f); cam.updateProjectionMatrix();
    const fx = clearAlpha === 0 && typeof shafts !== "undefined" ? [...shafts, wardDust.points] : [], vis = fx.map(o => o.visible);
    fx.forEach(o => o.visible = false);                     // 光の筋と埃（加算）は下地の 1 回目だけ：透明な層に描くと不透明な暗い色として残り、画面を覆った
    R.setClearColor(FOGC, clearAlpha); R.render(scene, cam); R.shadowMap.needsUpdate = false;
    fx.forEach((o, i) => o.visible = vis[i]);
    bg.save(); bg.imageSmoothingQuality = "high"; bg.filter = blur > .3 ? `blur(${blur}px)` : "none"; bg.drawImage(glc, 0, 0, W, H); bg.restore();
  };
  pass(n0, f0, bf, 1);                                      // 下地：全体をぼかす（切り出すと境目に帯が出るため）
  pass(Math.max(n0, focus - slab), focus + slab, 0, 0);       // 焦点の前後（くっきり）
  if (focus - slab > n0 + .001) pass(n0, focus - slab + .002, bn, 0);
  cam.near = n0; cam.far = f0; cam.updateProjectionMatrix();
}
function proj(v) { const p = v.clone().project(cam); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z]; }
function guardBox(b) { if (b && b[2] > 0 && b[0] < W && b[3] > 0 && b[1] < H && (b[2] - b[0]) > 30) S.CHARLOG.push(b); }
// 被写体を字幕の帯より上に収める（1.2 倍の字幕は 3 行で上端 ≈ 1377）。下端が帯にかかるならカメラを少し下へ向け、収まらないほど大きければ少し引く
const FIT_TOP = 210, FIT_BOT = 1360;
function objPts(o) { o.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(o); const c = (y) => [V3(bb.min.x, y, bb.min.z), V3(bb.max.x, y, bb.min.z), V3(bb.min.x, y, bb.max.z), V3(bb.max.x, y, bb.max.z)];
  return { b: c(bb.min.y), t: c(bb.max.y) }; }
function fit(list, yTop = FIT_TOP, yBot = FIT_BOT) {
  list = list.filter(Boolean); if (!list.length) return;
  const px = v => (1 - v.clone().project(cam).y) / 2 * H;
  const bots = list.flatMap(o => o.b), tops = list.flatMap(o => o.t), all = bots.concat(tops);
  cam.updateMatrixWorld();
  const span = Math.max(...bots.map(px)) - Math.min(...tops.map(px)), A = yBot - yTop;
  if (span > A) {
    const c = all.reduce((m, v) => m.add(v), V3(0, 0, 0)).multiplyScalar(1 / all.length);
    cam.position.copy(c.clone().add(cam.position.clone().sub(c).multiplyScalar(span / A * 1.03))); cam.updateMatrixWorld();
  }
  const yb = Math.max(...bots.map(px));
  if (yb > yBot) { const ang = y => Math.atan((1 - 2 * y / H) * Math.tan(cam.fov * Math.PI / 360)); cam.rotateX(-(ang(yBot) - ang(yb))); cam.updateMatrixWorld(); }
}
function fitB(items, yTop = FIT_TOP, yBot = FIT_BOT) {
  items = items.filter(Boolean); if (!items.length) return;
  const ang = y => Math.atan((1 - 2 * y / H) * Math.tan(cam.fov * Math.PI / 360));
  for (let pass = 0; pass < 3; pass++) {
    cam.updateMatrixWorld();
    const bs = items.map(i => i.box()).filter(Boolean); if (!bs.length) return;
    const top = Math.min(...bs.map(b => b[1])), bot = Math.max(...bs.map(b => b[3])), A = yBot - yTop;
    if (bot - top > A) { const c = items.reduce((m, i) => m.add(i.c()), V3(0, 0, 0)).multiplyScalar(1 / items.length);
      cam.position.copy(c.clone().add(cam.position.clone().sub(c).multiplyScalar((bot - top) / A * 1.03))); continue; }
    if (bot > yBot) cam.rotateX(-(ang(yBot) - ang(bot)));
    else if (top < yTop) cam.rotateX(ang(top) - ang(yTop));
  }
  cam.updateMatrixWorld();
}
const P_ = p => ({ box: () => p.g.visible ? p.box(cam, W, H) : null, c: () => p.g.position.clone().add(V3(0, .85 * (p.S || 1), 0)) });
function guardP(p) { if (p.g.visible) guardBox(p.box(cam, W, H)); }
function boxOf(obj) {
  obj.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(obj); if (bb.isEmpty()) return null;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) for (const z of [bb.min.z, bb.max.z]) {
    const [px, py, pz] = proj(V3(x, y, z)); if (pz > 1) return null; x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); }
  return [x0, y0, x1, y1];
}

// ---------------------------------------------------------------- 画像（床・壁・タイル・記録簿）
function canvasTex(w, h, draw, rep = [1, 1]) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 8; return t;
}
const rnd = S.rng(12);
const stoneTex = canvasTex(512, 512, (x, w, h) => {            // 石の床（大きな四角い石）
  x.fillStyle = "#5a5852"; x.fillRect(0, 0, w, h);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) { const v = 78 + rnd() * 26; x.fillStyle = `rgb(${v},${v - 2},${v - 6})`; x.fillRect(c * 128 + 2, r * 128 + 2, 124, 124);
    for (let i = 0; i < 60; i++) { x.fillStyle = `rgba(30,28,24,${.04 + rnd() * .06})`; x.fillRect(c * 128 + rnd() * 124, r * 128 + rnd() * 124, 2 + rnd() * 8, 1 + rnd() * 3); } }
}, [8, 8]);
const plasterTex = canvasTex(512, 512, (x, w, h) => {          // しっくいの壁（下の腰壁は少し暗く）
  x.fillStyle = "#b9b6ac"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++) { x.fillStyle = `rgba(${rnd() < .5 ? "90,86,78" : "220,216,206"},${.03 + rnd() * .05})`; x.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 5, 1 + rnd() * 3); }
}, [6, 2]);
const tileTex = canvasTex(512, 512, (x, w, h) => {              // 現代の白いタイル
  x.fillStyle = "#e9edf0"; x.fillRect(0, 0, w, h); x.strokeStyle = "#c9d0d6"; x.lineWidth = 3;
  for (let i = 0; i <= 8; i++) { x.beginPath(); x.moveTo(i * 64, 0); x.lineTo(i * 64, h); x.stroke(); x.beginPath(); x.moveTo(0, i * 64); x.lineTo(w, i * 64); x.stroke(); }
}, [6, 4]);
const WOODS = new Set();
const woodTex = (base, dark, rep) => { const t = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = base; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 140; i++) { x.strokeStyle = `rgba(${dark},${.05 + rnd() * .12})`; x.lineWidth = 1 + rnd() * 3; const y = rnd() * h;
    x.beginPath(); x.moveTo(0, y); for (let k = 0; k <= 8; k++) x.lineTo(k * w / 8, y + Math.sin(k * 1.3 + i) * 4 * rnd()); x.stroke(); }
}, rep); WOODS.add(t); return t; };
const tableWood = woodTex("#5a3d26", "25,14,6", [2, 1]);
const floorWood = woodTex("#4a3524", "20,12,6", [6, 6]);
const lightWood = woodTex("#a07a52", "60,40,20", [3, 3]);
// 記録簿（手書きの行。数字は読めない線にし、実際の数字は画面のグラフだけで示す）。writeK で新しい行が書き込まれる
const ledCanvas = document.createElement("canvas"); ledCanvas.width = 1024; ledCanvas.height = 720;
const ledTex = new THREE.CanvasTexture(ledCanvas); ledTex.encoding = THREE.sRGBEncoding; ledTex.anisotropy = 8;
let ledDrawn = -1;
function drawLedger(writeK = 0, mark = 0) {
  const key_ = Math.round(writeK * 40) + mark * 100; if (key_ === ledDrawn) return; ledDrawn = key_;
  const x = ledCanvas.getContext("2d"), w = ledCanvas.width, h = ledCanvas.height, r = S.rng(31);
  x.fillStyle = "#d9cdb0"; x.fillRect(0, 0, w, h); x.fillStyle = "#b8a780"; x.fillRect(w / 2 - 4, 0, 8, h);
  for (let i = 0; i < 1400; i++) { x.fillStyle = `rgba(120,100,70,${.03 + r() * .05})`; x.fillRect(r() * w, r() * h, 1 + r() * 4, 1); }
  for (let p = 0; p < 2; p++) {
    const x0 = 40 + p * w / 2;
    x.strokeStyle = "rgba(90,60,40,.45)"; x.lineWidth = 2;
    for (const cx of [0, 150, 300, 400]) { x.beginPath(); x.moveTo(x0 + cx, 60); x.lineTo(x0 + cx, h - 40); x.stroke(); }
    x.beginPath(); x.moveTo(x0, 90); x.lineTo(x0 + w / 2 - 80, 90); x.stroke();
    x.strokeStyle = "rgba(40,30,22,.75)"; x.lineWidth = 3;
    const rows = p === 1 ? Math.round(6 + 10 * writeK) : 16;
    for (let i = 0; i < rows; i++) {
      const y = 120 + i * 34;
      for (const [cx, len] of [[10, 120], [160, 120], [310, 70], [410, 30]]) {
        x.beginPath(); x.moveTo(x0 + cx, y); let xx = x0 + cx;
        while (xx < x0 + cx + len * (.6 + r() * .4)) { xx += 6 + r() * 6; x.lineTo(xx, y + (r() - .5) * 9); }
        x.stroke();
      }
    }
  }
  if (mark) { x.strokeStyle = "rgba(160,30,20,.8)"; x.lineWidth = 5; x.beginPath(); x.ellipse(w * .63, 120 + 9 * 34, 110, 24, 0, 0, 6.283); x.stroke(); }
  ledTex.needsUpdate = true;
}
drawLedger(0);

// ---------------------------------------------------------------- 材質と形
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: C(c), roughness: .7, metalness: 0, ...o });
const iron = M(0x3a3f46, { roughness: .45, metalness: .6 });
const brass = M(0x9a7a3c, { roughness: .35, metalness: .85 });
const linen = M(0xd8d4c8, { roughness: .92 });
const linenDark = M(0xa8a498, { roughness: .95 });
const porcelain = M(0xe8e6df, { roughness: .25, metalness: .02 });
const steel = M(0xc8ced4, { roughness: .2, metalness: .9 });
const woodM = new THREE.MeshStandardMaterial({ map: tableWood, roughness: .65 });
const glowMat = c => new THREE.MeshStandardMaterial({ color: C(0x111111), emissive: C(c), emissiveIntensity: 2.2 });
function box(w, h, d, mat, x = 0, y = 0, z = 0, parent) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; if (parent) parent.add(m); return m; }
function cyl(r, h, mat, x = 0, y = 0, z = 0, parent, rotZ = 0, seg = 24) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat); m.position.set(x, y, z); m.rotation.z = rotZ; m.castShadow = m.receiveShadow = true; if (parent) parent.add(m); return m; }
function plane(w, h, mat, parent, x = 0, y = 0, z = 0, ry = 0) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; if (parent) parent.add(m); return m; }
function floor(mat, parent, size = 40) { const f = new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat); f.rotation.x = -Math.PI / 2; f.receiveShadow = true; parent.add(f); return f; }
// 窓（光る面）と光の筋。col は場面ごとに変える（冷たい青 → 暖かい光）
function windowPane(parent, x, y, z, ry, w = 1.2, h = 2.4) {
  const pane = plane(w, h, new THREE.MeshBasicMaterial({ color: C(0x6a8098) }), parent, x, y, z, ry);
  for (let k = 0; k < 3; k++) { const m = box(.03, h, .03, M(0x1a1612), 0, 0, 0, parent); m.position.set(x, y, z); m.rotation.y = ry; m.translateX(-w / 2 + k * w / 2); m.translateZ(.01); }
  const bar = box(w, .03, .03, M(0x1a1612), 0, 0, 0, parent); bar.position.set(x, y, z); bar.rotation.y = ry; bar.translateZ(.01);
  const ray = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.3, 7), new THREE.MeshBasicMaterial({ color: C(0xbcd4e4), transparent: true, opacity: .05, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  ray.position.set(x, y - 1.6, z); ray.rotation.y = ry; ray.translateZ(1.6); ray.rotateX(.7); parent.add(ray);
  return { pane, ray };
}

// ---------------------------------------------------------------- 人物（顔のない人形）と手
function person({ dress = null, hair = null, coat = null, apron = false, cap = null, scale = 1, skin = 0xd5dbe4, scrubs = null } = {}) {
  const p = S.mochi3D(THREE, { color: skin }); const P = p.parts;
  if (hair) {
    const hm = M(hair, { roughness: .8 });
    const crown = new THREE.Mesh(new THREE.SphereGeometry(.214, 32, 12, 0, 6.283, 0, .6), hm); crown.rotation.x = -.5; P.head.add(crown);
    const back = new THREE.Mesh(new THREE.SphereGeometry(.214, 32, 20, Math.PI, Math.PI, 0, 2.0), hm); P.head.add(back);
    const bun = new THREE.Mesh(new THREE.SphereGeometry(.085, 20, 14), hm); bun.position.set(0, .06, -.2); P.head.add(bun);
  }
  if (dress) {
    const dm = M(dress, { roughness: .85 });
    const skirt = new THREE.Mesh(new THREE.CylinderGeometry(.2, .36, .66, 28, 1, true), dm); skirt.position.y = .33; skirt.material.side = THREE.DoubleSide; P.body.add(skirt);
    const bod = new THREE.Mesh(new THREE.CapsuleGeometry(.245, .28, 8, 24), dm); bod.position.y = .3; bod.scale.set(1.04, 1, .92); P.hips.add(bod);
    for (const a of [P.armL, P.armR]) { const sl = new THREE.Mesh(new THREE.CapsuleGeometry(.083, .2, 6, 16), dm); sl.position.y = -.12; a.a.add(sl); }
    P.legL.a.visible = P.legR.a.visible = false;
    [skirt, bod].forEach(o => { o.castShadow = o.receiveShadow = true; });
  }
  if (apron) { const ap = new THREE.Mesh(new THREE.PlaneGeometry(.34, .6), M(0xcfc6b2, { roughness: .9 })); ap.position.set(0, .4, .33); ap.rotation.x = -.18; P.body.add(ap); }
  if (coat || scrubs) {
    const cm = M(coat || scrubs, { roughness: .75 });
    const jk = new THREE.Mesh(new THREE.CapsuleGeometry(.27, scrubs ? .3 : .44, 8, 24), cm); jk.position.y = scrubs ? .3 : .25; jk.scale.set(1.06, 1, .97); P.hips.add(jk);
    for (const a of [P.armL, P.armR]) { const sl = new THREE.Mesh(new THREE.CapsuleGeometry(.084, scrubs ? .08 : .2, 6, 16), cm); sl.position.y = scrubs ? -.06 : -.12; a.a.add(sl); }
    for (const l of [P.legL, P.legR]) { const tr = new THREE.Mesh(new THREE.CapsuleGeometry(.1, .22, 6, 16), M(scrubs || 0x1c1f24)); tr.position.y = -.14; l.a.add(tr); }
    jk.castShadow = true;
  }
  if (cap) { const cm = M(cap, { roughness: .8 }); const c = new THREE.Mesh(new THREE.SphereGeometry(.215, 28, 12, 0, 6.283, 0, 1.2), cm); c.position.y = .02; P.head.add(c); }
  p.g.scale.setScalar(scale); p.S = scale;
  const pose0 = p.pose; p.pose = o => { pose0({ ...o, sx: scale, sy: scale }); };
  return p;
}
function hand(sleeve = 0x2b3442, skin = 0xd5dbe4, cuff = null) {   // 手と前腕だけ（手もとのアップ用）。指先は +x
  const g = new THREE.Group(), sm = M(skin, { roughness: .55, emissive: C(skin), emissiveIntensity: .03 });
  const fore = new THREE.Mesh(new THREE.CapsuleGeometry(.032, .2, 8, 16), M(sleeve, { roughness: .85 })); fore.rotation.z = Math.PI / 2; fore.position.x = -.16; g.add(fore);
  if (cuff) { const cf = new THREE.Mesh(new THREE.CylinderGeometry(.036, .036, .02, 16), M(cuff)); cf.rotation.z = Math.PI / 2; cf.position.x = -.06; g.add(cf); }
  const palm = new THREE.Mesh(new THREE.SphereGeometry(.045, 20, 14), sm); palm.scale.set(1.25, .55, 1); g.add(palm);
  for (let i = 0; i < 4; i++) { const f = new THREE.Mesh(new THREE.CapsuleGeometry(.011, .04, 4, 10), sm); f.rotation.z = Math.PI / 2; f.position.set(.07, 0, -.03 + i * .02); g.add(f); }
  const th = new THREE.Mesh(new THREE.CapsuleGeometry(.012, .035, 4, 10), sm); th.position.set(.03, -.005, .055); th.rotation.set(0, -.6, Math.PI / 2); g.add(th);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
