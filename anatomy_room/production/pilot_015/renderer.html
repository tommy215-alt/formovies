    else if (t < CUE.bars) {                                // 決定的な映像：H と He の線だけが光る
      const sx0 = 80, sx1 = 1000, sy0 = 700, sy1 = 940, gk = sstep(CUE.hhe - .1, CUE.hhe + .8, t);
      spectrum(bg, sx0, sy0, sx1, sy1, 1, { glow: ["H", "He"], gk, dark: 1 - .45 * gk });
      HUD.tag(bg, lx(656.3, sx0, sx1), sy0, 820, 430, "H", "水素", k_(t, "hhe", .6, .3), "255,214,150");
      HUD.tag(bg, lx(587.6, sx0, sx1), sy0, 470, 430, "He", "ヘリウム", k_(t, "hhe", .6, .55), "255,214,150");
    } else barsScene(bg, t, prog(t, CUE.bars, .5), prog(t, CUE.million - .3, 1.0));
  }
  if (name === "letter") {
    if (t >= CUE.letterread && t < CUE.thesis) { const bx = LETTER.box(); if (bx) { const p0 = paperPoint(letterMesh, LETTER.tex, bx[0], bx[1]), p1 = paperPoint(letterMesh, LETTER.tex, bx[2], bx[3]);
      HUD.ink(bg, Math.min(p0[0], p1[0]), Math.min(p0[1], p1[1]), Math.max(p0[0], p1[0]), Math.max(p0[1], p1[1]), k_(t, "impossible", .45, .25)); } }
    if (t >= CUE.notreal) { const bx = PAGE188.box(); if (bx) { const p0 = paperPoint(pageMesh, PAGE188.tex, bx[0], bx[1]), p1 = paperPoint(pageMesh, PAGE188.tex, bx[2], bx[3]);
      S.hudBox(bg, Math.min(p0[0], p1[0]) - 24, Math.min(p0[1], p1[1]) - 24, Math.max(p0[0], p1[0]) + 24, Math.max(p0[1], p1[1]) + 24, k_(t, "notreal", .5, .1)); } }
  }
  if (name === "after" && t < CUE.assist) {                 // 1929：再び H の線が光る
    const sx0 = 80, sx1 = 1000, sy0 = 820, sy1 = 1000, gk = sstep(CUE.y1929, CUE.y1929 + 1.0, t);
    spectrum(bg, sx0, sy0, sx1, sy1, prog(t, CUE.after, .6), { glow: ["H"], gk });
    HUD.tag(bg, lx(656.3, sx0, sx1), sy0, 820, 560, "H", "水素", k_(t, "y1929", .6, .5), "255,214,150");
  }
  if (name === "today") {

        const g = bg.createRadialGradient(x, y, 0, x, y, 26); g.addColorStop(0, `rgba(255,250,230,${k})`); g.addColorStop(1, "rgba(255,200,120,0)"); bg.fillStyle = g; bg.beginPath(); bg.arc(x, y, 26, 0, 6.283); bg.fill(); }
      bg.restore(); HUD.ring(bg, 540, 860, ((t - CUE.core) * .9) % 1, 200, "255,214,150");
    } else if (t < CUE.back) { skyScene(bg, t, 1); SKYSTARS.forEach(([x, y, s, n], i) => HUD.tag(bg, x, y, x + (i === 1 ? -150 : 150), y + 170, s, n, k_(t, "sky", .5, .3 + i * .35))); }

}
function drawUI(t, name) {
  const T = s => Math.round(s * TS);
  if (name === "hook" && t < CUE.who + .2) HUD.title(ui, [["太陽は", T(110), "#FFF4E0"], ["何でできている？", T(96), "#FFD58A"]], 540, 760, k_(t, "t0", .45, .05), t);   // 冒頭の見出し（この間は字幕を出さない）
  if (name === "hook" && t >= CUE.who) uiNote("※人物と場面は再現CG", 540, 250, win(t, CUE.who + .2, CUE.letter0, .3, .3));
  if (name === "cambridge" && t < CUE.lecture) uiCard([["ケンブリッジ大学", T(34), 800], ["イギリス", T(26), 500, "#B8C7D6"]], 540, 340, k_(t, "cambridge", .45, .4) * (1 - prog(t, CUE.lecture - .4, .35)));
  if (name === "cambridge" && t >= CUE.lecture && t < CUE.degree) uiCard([["1919年の日食の観測", T(30), 800]], 540, 330, k_(t, "lecture", .45, .5) * (1 - prog(t, CUE.degree - .4, .35)));
  if (name === "harvard" && t < CUE.plate) uiCard([["ハーバード大学天文台", T(34), 800], ["アメリカ", T(26), 500, "#B8C7D6"]], 540, 340, k_(t, "harvard", .45, .3) * (1 - prog(t, CUE.plate - .3, .35)));
  if (name === "method" && t >= CUE.lines && t < CUE.temp) uiNote("※説明のための図", 540, 250, win(t, CUE.lines, CUE.temp, .3, .3));
  if (name === "letter" && t < CUE.letterread) uiCard([["1925年1月", T(34), 800]], 540, 340, k_(t, "letter", .45, .3));
  if (name === "letter" && t >= CUE.thesis && t < CUE.notreal) uiCard([["博士論文（1925）", T(32), 800], [t >= CUE.p188 ? "188ページ" : "表 XXVIII（184ページ）", T(26), 500, "#B8C7D6"]], 540, 320, k_(t, "thesis", .45, .3));
  if (name === "after" && t < CUE.assist) uiCard([["1929年", T(36), 800]], 540, 360, k_(t, "y1929", .45));
  if (name === "after" && t >= CUE.prof) uiCard([["1956年", T(36), 800]], 540, 340, k_(t, "prof", .45, .2));
}
// 色調：冒頭の太陽（暖かい光と深い黒）→ 机（冷たい夜）→ ケンブリッジ（霧の灰）→ ハーバード（ランプの琥珀）→ 方法（集中の青）→ 発見（光が差す）
//       → 手紙と留保（冷える）→ その後（少しずつ温かく）→ 現代（暖かく、安心）
function buildMood() {
  const c = CUE;
  MOOD = [
    [0, { warm: .2, sat: 1.05, vig: .55 }], [c.who - .05, { warm: .15, sat: 1.0, vig: .55 }], [c.who + .1, { cool: .35, sat: .8, vig: .65 }], [c.stamp, { cool: .4, sat: .75, vig: .7 }],
    [c.cambridge, { cool: .3, sat: .7, vig: .55 }], [c.ship, { cool: .45, sat: .75, vig: .6 }], [c.harvard, { cool: .05, warm: .2, sat: .9, vig: .55 }],
    [c.method, { cool: .25, sat: 1.0, vig: .5 }], [c.saha, { cool: .3, sat: .8, vig: .6 }], [c.result, { cool: .25, sat: .95, vig: .5 }],
    [c.hhe - .1, { cool: .2, sat: 1.0, vig: .5 }], [c.hhe + 1.5, { cool: 0, warm: .25, sat: 1.05, glow: .35, glowX: .5, glowY: .4, vig: .45 }], [c.letter - .1, { cool: .05, warm: .15, sat: 1.0, vig: .5 }],
    [c.letter + .6, { cool: .45, sat: .7, vig: .65 }], [c.notreal + .5, { cool: .55, sat: .6, vig: .72 }], [c.after - .1, { cool: .45, sat: .7, vig: .65 }],
    [c.y1929 + 1.2, { cool: .1, warm: .2, sat: 1.0, glow: .25, glowX: .5, glowY: .45, vig: .5 }], [c.assist, { cool: .25, sat: .85, vig: .55 }], [c.prof + 1.5, { cool: 0, warm: .22, sat: 1.0, glow: .2, glowX: .7, glowY: .3, vig: .5 }],
    [c.today, { cool: 0, warm: .2, sat: 1.05, vig: .45 }], [c.sky, { cool: .1, warm: .05, sat: 1.0, vig: .45 }], [c.back, { cool: 0, warm: .25, sat: 1.05, glow: .25, glowX: .5, glowY: .45, vig: .5 }],
  ];
}
function bloomK(t, name) { return name === "hook" && t < CUE.who ? .6 : (name === "result" && t >= CUE.hhe) || (name === "today" && (t < CUE.sky || t >= CUE.back)) || (name === "after" && t < CUE.assist) ? .45 : .25; }
function renderFrame(t) {

    const e = TL.lines.filter(x => x.ending);

    ui.getImageData(0, 0, 1, 1); return;

  Cine.motionBlur(bg, t, { n: 3, shutter: 1 / 60 }, tk => { const nm = S.sceneAt(tk); atmos(tk, nm); drawScene(tk, nm); });
  drawDiagram(t, name);
  S.moodGrade(bg, t, MOOD); Cine.bloom(bg, bloomK(t, name)); addGrain(t);
  drawUI(t, name);
  S.header(ui, false);
  if (!(name === "hook" && t < CUE.who)) S.docSub(ui, t, { endAt: TL.ending_start });
  const [a] = S.sceneRange(name), i = SCN.indexOf(name);
  if (i > 0) { const k = 1 - prog(t, a, .3); if (k > 0) { bg.fillStyle = `rgba(4,8,14,${.85 * k})`; bg.fillRect(0, 0, W, H); } }
  if (name === "today" && t > CUE.card) extraDip = sstep(es - 1.0, es - .05, t) * .9;
  if (extraDip > 0) { bg.fillStyle = `rgba(4,8,14,${extraDip})`; bg.fillRect(0, 0, W, H); }
  bg.getImageData(0, 0, 1, 1); ui.getImageData(0, 0, 1, 1);
}
function renderThumb() {
  bg.clearRect(0, 0, W, H); ui.clearRect(0, 0, W, H);
  const t = .9; atmos(t, "hook"); drawScene(t, "hook"); drawDiagram(t, "hook"); S.moodGrade(bg, 0, [[0, { warm: .2, sat: 1.05, vig: .55 }]]); Cine.bloom(bg, .6); addGrain(0);
  HUD.title(ui, [["太陽は", 130, "#FFF4E0"], ["何でできている？", 112, "#FFD58A"]], 540, 760, 1, 9);
  text(ui, "「ありえない」と", 540, 1360, 88, "#EAF2F8", { weight: 900, stroke: "#06101c", sw: 14 });
  text(ui, "言われた答え", 540, 1480, 96, "#FFE2A8", { weight: 900, stroke: "#06101c", sw: 14 });

function setTimeline(tl) { TL = tl; S.setup(tl, SCN); CUE = S.CUE; buildMood(); }
window.renderFrame = renderFrame; window.renderThumb = renderThumb; window.setTimeline = setTimeline;
</script>
