<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>long_001 renderer</title>
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0a1220}
#stage canvas{position:absolute;left:0;top:0}
</style>
</head><body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <canvas id="ui" width="1920" height="1080"></canvas>
</div>
<script src="../common/vendor/three.min.js"></script>
<script src="assets/assets.js"></script>
<script src="kit_long.js"></script>
<script>
// long_001 v2「心理学の3分の2は、やり直すと消えた」の描画（台本 v3、横長）。部品は kit_long.js。v1 は versions/renderer_v1.html。
// 画面は「ビート」（1 行〜数行のセリフに 1 つの画）の連なり。ビートの頭で画が切り替わり（クロスフェード＋横に少し滑る＋一瞬の寄り）、
// 背景のテーマ（色と模様）もビートごとに変える（実験は lab・種明かしは red など。ユーザーの指示 2026-11-05）。3D は冒頭 L00 と最後 L73〜L74 だけ。
"use strict";

// ---------------------------------------------------------------- 5 枚のカード
const CARD = [
  { cap: "見た目が55%", col: C.cyan, art: () => { picto(-40, 40, .9, C.ink); icon("eye", 50, -40, .7, C.cyan); txt("55%", 50, 40, 52, C.cyan, "center", 900); } },
  { cap: "モーツァルトで頭が良くなる", col: C.violet, art: () => { icon("note", -50, 0, .9, C.violet); arrow(-5, 0, 25, 0, 1, C.ink, 5); icon("brain", 70, 0, .7, C.ink); } },
  { cap: "一瞬の「コーラを飲め」", col: C.red, art: () => { icon("film", -45, 0, .85, C.ink); icon("bottle", 65, 0, 1, C.red); } },
  { cap: "右脳型と左脳型", col: C.pink, art: () => { icon("brainLR", 0, -6, 1.15, C.ink); txt("左", -40, 64, 30, C.cyan, "center", 900); txt("右", 40, 64, 30, C.pink, "center", 900); } },
  { cap: "1万時間で一流に", col: C.amber, art: () => { icon("violin", -40, 0, .95, C.amber); icon("clock", 60, -10, .7, C.ink); txt("1万時間", 60, 58, 28, C.amber, "center", 900); } },
];
function card(i, x, y, s, a = 1, rot = 0, dim = 0) {
  const c = CARD[i];
  at(x, y, s, a, () => {
    panel(-160, -190, 320, 380, 1, c.col, "rgba(16,30,52,0.95)", 26);
    g.save(); g.translate(0, -40); c.art(); g.restore();
    txt(c.cap, 0, 130, 32, C.ink, "center", 800, 1, 280);
    if (dim > 0) { g.save(); g.globalAlpha *= dim * .6; g.fillStyle = "#050a14"; rr(-160, -190, 320, 380, 26); g.fill(); g.restore(); }
  }, rot);
}
const ROW = [-720, -360, 0, 360, 720].map(x => W / 2 + x);
const T = S;
const LX = W * .27, RX = W * .7;

// ---------------------------------------------------------------- ビート
// beat(行の ID の配列, テーマ, 章の表示, 描画 fn(t, A))
const BEATS = [];
function beat(ids, theme, tag, fn) { BEATS.push({ ids, theme, tag, fn }); }
function layout() {
  BEATS.forEach((b, i) => { b.a = (i === 0 ? 0 : T(b.ids[0]) - .3); });
  BEATS.forEach((b, i) => { b.b = i < BEATS.length - 1 ? BEATS[i + 1].a : 1e9; });
}
const XF = .45;

function title2(a, s1, s2, col, A, y = H * .44) {      // 章の札（大きな番号と 2 行の題）
  const k = pr(NOW, a, .55, ease.back);
  txt(s1[0], W / 2 - 520, y, 340 * (2 - k), col, "center", 900, A * .9 * Math.min(1, k * 2));
  txt("理由", W / 2 - 140, y - 110, 46, C.dim, "left", 700, A * k);
  txt(s2[0], W / 2 - 140 + (1 - k) * 200, y, 76, C.ink, "left", 900, A * k, 1020);
  txt(s2[1], W / 2 - 140 + (1 - k) * 260, y + 110, 70, col, "left", 900, A * k, 1020);
}
function face(x, y, s, a, mood = 0, col = C.ink, pen = null) {   // 顔のない丸い顔。mood：1＝笑顔の口、-1＝とがらせた口
  at(x, y, s, a, () => {
    g.strokeStyle = col; g.lineWidth = 7; g.beginPath(); g.arc(0, 0, 60, 0, 7); g.stroke();
    g.lineCap = "round"; g.beginPath();
    if (mood > 0) { g.arc(0, 8, 30, .2 * Math.PI, .8 * Math.PI); } else if (mood < 0) { g.ellipse(0, 26, 10, 8, 0, 0, 7); } else { g.moveTo(-20, 26); g.lineTo(20, 26); }
    g.stroke();
    if (pen) { g.strokeStyle = C.amber; g.lineWidth = 9; g.beginPath(); if (pen === "teeth") { g.moveTo(-58, 30); g.lineTo(58, 30); } else { g.moveTo(-6, 26); g.lineTo(-76, 56); } g.stroke(); }
  });
}
function bigNote(s, y, col, A, size = 64) { txt(s, W / 2, y, size, col, "center", 900, A, 1700); }
function darken(a) { if (a <= 0) return; g.save(); g.globalAlpha = a; g.fillStyle = "#050a14"; g.fillRect(0, 0, W, H); g.restore(); }
function personRow(n, x0, y, gap, s, col, A, k0, kd = .03) { for (let i = 0; i < n; i++) picto(x0 + i * gap, y, s * pr(NOW, k0 + i * kd, .35, ease.back), col, "stand", 0, A); }
const gcol = i => `hsl(${i * 18},80%,62%)`;
function gummy(x, y, s, col, a, glowOn = false) {
  at(x, y, s, a, () => { g.fillStyle = col; if (glowOn) glow(C.green, 30); g.beginPath(); g.arc(0, -34, 22, 0, 7); g.fill(); g.beginPath(); g.arc(-17, -50, 9, 0, 7); g.arc(17, -50, 9, 0, 7); g.fill(); rr(-26, -16, 52, 58, 20); g.fill(); });
}
function head(x, y, s, a, col = C.cyan) {
  at(x, y, s, a, () => {
    g.fillStyle = "rgba(79,209,255,0.08)"; g.strokeStyle = col; g.lineWidth = 8; glow(col, 20);
    g.beginPath(); g.moveTo(-150, 220); g.lineTo(-150, 120); g.bezierCurveTo(-250, 40, -230, -230, 0, -240); g.bezierCurveTo(200, -240, 250, -100, 220, 0);
    g.lineTo(260, 60); g.lineTo(220, 80); g.bezierCurveTo(230, 140, 180, 160, 120, 150); g.lineTo(120, 220); g.fill(); g.stroke(); g.shadowBlur = 0;
  });
}
let NOWB = null;
function reveal(n, title, t, A) { chip(`種明かし ${n}`, 220, 140, C.amber, A * pr(t, NOWB.a + .3, .4, ease.back), 32); txt(title, W / 2 + 80, 140, 46, C.ink, "center", 900, A * pr(t, NOWB.a + .3, .4), 1300); }
function milgram(t, A, k, lvl) {
  g.save(); g.globalAlpha = A * k; g.strokeStyle = C.line; g.lineWidth = 6; g.beginPath(); g.moveTo(W * .56, H * .26); g.lineTo(W * .56, H * .8); g.stroke(); g.restore();
  picto(W * .3, H * .66, 1.4 * k, C.cyan, "sit", 0, A); txt("先生役（参加者）", W * .3, H * .82, 28, C.cyan, "center", 800, A * k);
  picto(W * .14, H * .62, 1.5 * k, "#e8eef8", "stand", 0, A); txt("実験者", W * .14, H * .82, 28, C.dim, "center", 800, A * k);
  picto(W * .76, H * .66, 1.4 * k, C.pink, "sit", 0, A); txt("生徒役", W * .76, H * .82, 28, C.pink, "center", 800, A * k);
  at(W * .42, H * .5, k, A, () => { g.fillStyle = "#2a3a55"; rr(-90, -60, 180, 120, 10); g.fill(); for (let i = 0; i < 6; i++) { g.fillStyle = i < lvl * 6 ? (i > 3 ? C.red : C.amber) : "#46587a"; rr(-76 + i * 26, -30, 18, 40, 4); g.fill(); } txt("ショック", 0, 40, 22, C.ink, "center", 800); });
  if (lvl > 0) icon("bolt", W * .66, H * .48, .8 * k, C.amber, A * (.5 + .5 * Math.sin(t * 12)));
}

function setup() {
  BEATS.length = 0;
  // ============ 冒頭 ============
  beat(["L00", "L01", "L02", "L03", "L04", "L05", "L06", "L07"], "base", null, (t, A) => {
    if (t < E("L00") + .3) return;                    // L00 は 3D
    const tIn = ["L01", "L02", "L03", "L04", "L05"].map(id => T(id));
    const tStamp = T("L06", .62), tOut = T("L07");
    for (let i = 0; i < 5; i++) {
      const k = pr(t, tIn[i] - .15, .55, ease.back); if (k <= 0) continue;
      const nxt = i < 4 ? tIn[i + 1] : T("L06");
      const big = (t < nxt - .1 ? 1 : 0) * pr(t, tIn[i] - .15, .5) * (1 - pr(t, nxt - .2, .4));
      const out = pr(t, tOut, .8, ease.inOut);
      const x = ROW[i] + (i - 2) * 260 * out + (1 - k) * 600, y = H * .44 - big * 30;
      const s = lerp(.88, 1.3, big) * (1 - .3 * out);
      const ks = pr(t, tStamp + i * .16, .35);
      card(i, x, y + ks * 14, s, A * k * (1 - out), ks * (i % 2 ? .06 : -.06), ks);
      if (ks > 0) at(x, y + ks * 14, s, A * (1 - out), () => stamp("？", 0, -10, (t - tStamp - i * .16) / .5, C.red, 150, -.12));
      const kb = pr(t, T("L06") + .25 + i * .1, .4, ease.back) * (1 - pr(t, tStamp + i * .16, .2));
      if (kb > 0) at(x + 120 * s, y - 170 * s, kb, A * (1 - out), () => badge("check", 0, 0, .55, C.green));
    }
    if (t > T("L06") - .2 && t < tStamp + 1) chip("科学で証明された", W / 2, 150, C.green, A * win(t, T("L06"), tStamp + .6, .3, .4), 40);
    const kb = pr(t, tOut + .3, .7, ease.back), kt = pr(t, E("L07") + .2, .7, ease.back);
    if (kb > 0) {
      const fade = 1 - pr(t, E("L07"), .4);
      badge("brain", W / 2 - 160, H * .44, 1.5 * kb, C.cyan, A * fade);
      icon("question", W / 2 - 160, H * .44 - 150, kb, C.amber, A * fade * win(t, tOut + .5, T("L07", .6), .3, .3));
      const kl = pr(t, T("L07", .62), .5, ease.back);
      arrow(W / 2 - 20, H * .44, W / 2 + 120, H * .44, kl, C.amber, 8, 0, A * fade);
      badge("lock", W / 2 + 230, H * .44, 1.3 * kl, C.amber, A * fade);
    }
    if (kt > 0) {
      txt("心理学の3分の2は、", W / 2, H * .36, 104, C.ink, "center", 900, A * kt);
      txt("やり直すと消えた", W / 2, H * .36 + 140, 128, C.amber, "center", 900, A * kt);
      for (let i = 0; i < 3; i++) {
        const fade = i === 0 ? 1 : 1 - pr(t, E("L07") + 1.0 + i * .25, .5);
        g.save(); g.globalAlpha = A * kt; g.lineWidth = 6; g.strokeStyle = C.amber; g.fillStyle = C.amber; glow(C.amber, 20);
        g.beginPath(); g.arc(W / 2 + (i - 1) * 110, H * .36 + 290, 30, 0, 7); g.stroke(); g.globalAlpha *= fade; g.fill(); g.restore();
      }
    }
  });
  // ============ 第 1 部 5 つの話の、もとの研究 ============
  beat(["L08"], "base", "5つの話の、もとの研究", (t, A) => {
    for (let i = 0; i < 5; i++) card(i, ROW[i], H * .46, .82, A * pr(t, T("L08") + i * .1, .5, ease.back));
    chip("本当は 何が分かっていた？", W / 2, 150, C.cyan, A * pr(t, T("L08") + .4, .4, ease.back), 44);
  });
  // --- メラビアン
  beat(["L09"], "violet", "① 見た目が55%", (t, A) => {
    card(0, LX, H * .48, 1.15, A * pr(t, T("L09"), .5, ease.back));
    arrow(LX + 230, H * .48, RX - 200, H * .48, pr(t, T("L09", .5), .6), C.violet, 9, -40, A);
    picto(RX, H * .56, 1.8 * pr(t, T("L09", .55), .6, ease.back), C.violet, "think", 0, A);
    chip("心理学者 メラビアンの実験", RX, H * .26, C.violet, A * pr(t, T("L09", .6), .4, ease.back), 40);
  });
  beat(["L10"], "violet", "① 見た目が55%", (t, A) => {
    const items = [["speech", "言葉", "「好き」「嫌い」", C.cyan], ["wave", "声の調子", "やさしい／冷たい", C.violet], ["face", "顔写真の表情", "笑顔／しかめ顔", C.amber]];
    items.forEach(([ic, nm, ex, col], j) => {
      const k = pr(t, T("L10") + .6 + j * .7, .5, ease.back), y = H * .26 + j * 200;
      badge(ic, W * .14, y, .75 * k, col, A); txt(nm, W * .22, y - 20, 40, C.ink, "left", 900, A * k); txt(ex, W * .22, y + 26, 30, col, "left", 700, A * k);
      arrow(W * .42, y, W * .58, H * .48, pr(t, T("L10") + 1.0 + j * .7, .5), col, 6, 30 * (j - 1), A);
    });
    picto(W * .68, H * .56, 1.7 * pr(t, T("L10", .6), .5, ease.back), C.ink, "think", 0, A);
    at(W * .84, H * .3, pr(t, T("L10", .75), .5, ease.back), A, () => { panel(-190, -60, 380, 120, 1, C.violet); txt("この人は 自分を", 0, -18, 32, C.ink, "center", 800); txt("どう思ってる？", 0, 24, 32, C.violet, "center", 900); });
  });
  beat(["L11"], "violet", "① 見た目が55%", (t, A) => {
    const k = pr(t, T("L11"), .5, ease.back);
    chip("食い違うと…", W * .2, H * .14, C.ink, A * k, 36);
    at(W * .2, H * .32, k, A, () => { ICON.speech(C.cyan); txt("好き", 0, -6, 34, C.bg0, "center", 900); });
    badge("wave", W * .2, H * .52, .7 * k, C.violet, A); txt("冷たい声", W * .2 + 90, H * .52, 32, C.violet, "left", 800, A * k);
    face(W * .2, H * .72, .75 * k, A, -1, C.amber); txt("しかめ顔", W * .2 + 90, H * .72, 32, C.amber, "left", 800, A * k);
    const kp = pr(t, T("L11", .3), .6, ease.inOut);
    arrow(W * .33, H * .52, W * .44, H * .5, kp, C.violet, 8, 0, A); arrow(W * .33, H * .72, W * .44, H * .56, kp, C.amber, 8, 0, A);
    txt("声と表情を", W * .5, H * .5, 40, C.ink, "left", 900, A * kp); txt("信じやすい", W * .5, H * .57, 40, C.ink, "left", 900, A * kp);
    const kb = pr(t, T("L11", .55), 1.0, ease.out);
    [["言葉", 7, C.cyan], ["声", 38, C.violet], ["表情", 55, C.amber]].forEach(([nm, v, col], j) => vbar(W * .7 + j * 170, H * .86, 110, 300, v / 60 * kb, col, nm, `${Math.round(v * kb)}%`, A * pr(t, T("L11", .5), .4)));
  });
  beat(["L12"], "violet", "① 見た目が55%", (t, A) => {
    chip("気持ちが 食い違って伝わったときの 実験", W / 2, 140, C.violet, A * pr(t, T("L12"), .4, ease.back), 40);
    const kq = pr(t, T("L12", .25), .6, ease.back);
    panel(W * .5 - 640, H * .25, 1280, 190, A * kq, C.amber);
    txt("相手が 自分の気持ちを話している場面でなければ、", W / 2, H * .25 + 62, 40, C.ink, "center", 800, A * kq, 1200);
    txt("この式は 当てはまらない", W / 2, H * .25 + 120, 46, C.amber, "center", 900, A * kq);
    txt("— A. メラビアン（本人のサイト）", W * .5 + 620, H * .25 + 220, 26, C.dim, "right", 500, A * kq);
    const kx = pr(t, T("L12", .66), .6, ease.back);
    picto(W * .42, H * .82, 1.2 * kx, C.dim, "stand", 0, A); picto(W * .58, H * .82, 1.2 * kx, C.dim, "point", 0, A);
    txt("初めて会った人の印象", W / 2, H * .64, 40, C.ink, "center", 800, A * kx);
    icon("cross", W / 2, H * .76, 2.0 * pr(t, T("L12", .8), .4, ease.back), C.red, A);
  });
  // --- モーツァルト
  beat(["L13"], "warm", "② モーツァルト", (t, A) => {
    const k = pr(t, T("L13"), .6, ease.back);
    image("mozart", W * .14, H * .48, 250 * k + 1, A, -.03);
    txt("Barbara Krafft（1819）／パブリックドメイン", W * .14, H * .48 + 195, 20, C.dim, "center", 500, A * k);
    chip("1993年の実験", W * .5, 130, C.amber, A * pr(t, T("L13", .15), .4, ease.back), 40);
    const k1 = pr(t, T("L13", .25), .5, ease.back);
    badge("headphones", W * .36, H * .4, .8 * k1, C.amber, A); txt("10分間 聴く", W * .36, H * .4 + 90, 32, C.ink, "center", 800, A * k1);
    arrow(W * .43, H * .4, W * .52, H * .4, pr(t, T("L13", .4), .4), C.amber, 7, 0, A);
    const k2 = pr(t, T("L13", .5), 2.4, ease.inOut);
    at(W * .7, H * .4, 1, A * pr(t, T("L13", .45), .4), () => {
      const f = Math.min(1, k2 * 2);
      g.fillStyle = "#e9eef6"; g.fillRect(-150, -110, 300 - 150 * f, 220);
      g.strokeStyle = C.amber; g.setLineDash([10, 8]); g.lineWidth = 3; g.beginPath(); g.moveTo(0, -110); g.lineTo(0, 110); g.stroke(); g.setLineDash([]);
      if (k2 > .5) { icon("scissors", -60, -20, .8, C.red); g.fillStyle = "#3a2a18"; g.beginPath(); g.arc(-150, 0, 40 * (k2 - .5) * 2, -Math.PI / 2, Math.PI / 2); g.fill(); }
    });
    txt("紙を折って切ると、広げたらどんな形？", W * .7, H * .4 + 170, 34, C.ink, "center", 800, A * pr(t, T("L13", .6), .4), 760);
    icon("question", W * .9, H * .36, pr(t, T("L13", .8), .4, ease.back), C.amber, A);
  });
  beat(["L14"], "warm", "② モーツァルト", (t, A) => {
    const kb = pr(t, T("L14") + .3, 1.0, ease.out);
    [["何も聴かない", .55, C.dim], ["リラックス用", .56, C.dim], ["モーツァルト", .66, C.amber]].forEach(([nm, v, col], j) =>
      vbar(W * .12 + j * 270, H * .78, 150, 330, v * kb, col, nm, "", A * pr(t, T("L14") + j * .3, .4)));
    txt("図形の問題の成績（模式図）", W * .4, H * .2, 30, C.dim, "center", 700, A);
    const kc = pr(t, T("L14", .3), .6, ease.back);
    badge("clock", W * .76, H * .28, .9 * kc, C.amber, A); txt("10〜15分ほどで 消えた", W * .76, H * .28 + 110, 40, C.amber, "center", 900, A * kc);
    const kx = pr(t, T("L14", .5), .5, ease.back);
    chip("頭が良くなった", W * .76, H * .56, C.dim, A * kx, 40);
    g.save(); g.globalAlpha = A * kx; g.strokeStyle = C.red; g.lineWidth = 8; g.beginPath(); g.moveTo(W * .76 - 170, H * .56); g.lineTo(W * .76 - 170 + 340 * pr(t, T("L14", .55), .4), H * .56); g.stroke(); g.restore();
    const km = pr(t, T("L14", .75), .6);
    txt("多くの研究をまとめると：効果は小さい", W * .76, H * .72, 32, C.ink, "center", 800, A * km, 700);
    hbar(W * .76 - 260, H * .77, 520, 20, .18 * km, C.violet, A * km);
  });
  // --- コーラ
  beat(["L15"], "cinema", "③ 一瞬の「コーラを飲め」", (t, A) => {
    chip("1957年 アメリカ", W / 2, 130, C.red, A * pr(t, T("L15"), .4, ease.back), 40);
    const kf = pr(t, T("L15") + .3, .5);
    g.save(); g.globalAlpha = A * kf; g.fillStyle = "#1a1012"; g.fillRect(0, H * .24, W, 260); g.restore();
    for (let i = 0; i < 9; i++) {
      const x = ((i * 240 - (t * 260)) % (W + 240) + W + 240) % (W + 240) - 120, flash = i === 4;
      g.save(); g.globalAlpha = A * kf; g.fillStyle = flash ? "#fff2dc" : "#3a2a2e"; rr(x - 100, H * .24 + 30, 200, 200, 8); g.fill(); g.restore();
      if (flash) { txt("コーラを", x, H * .24 + 100, 36, C.red, "center", 900, A * kf); txt("飲め", x, H * .24 + 150, 36, C.red, "center", 900, A * kf); }
      else picto(x, H * .24 + 175, .7, "rgba(200,180,190,0.6)", "stand", 0, A * kf);
    }
    txt("目に見えないほど 一瞬だけ映した", W / 2, H * .24 + 300, 36, C.ink, "center", 800, A * pr(t, T("L15", .45), .4));
    const ks = pr(t, T("L15", .75), .6, ease.back);

// ---------------------------------------------------------------- 3D（冒頭 L00・最後 L73〜L74）
function cg(t) {
  if (t < E("L00") + .5) { G3.stamp(clamp(t / (E("L00") + .5))); return 1 - pr(t, E("L00") + .1, .5); }
  if (t >= S("L73") - .3) { G3.card(clamp((t - S("L73") + .3) / (E("L74") - S("L73") + .3)), (t - S("L73", .75)) / .5); return pr(t, S("L73") - .3, .5); }
  G3.clear(); return 0;
}
function cgOverlay(t) {
  if (t < E("L00") + .5) {
    txt("今から言う5つ。", W / 2, H * .09, 56, C.ink, "center", 900, pr(t, .2, .8) * (1 - pr(t, E("L00"), .4)));

  }
  if (t >= S("L73") - .3) {
    const a = 1 - pr(t, S("L74") - .2, .4);
    txt("よく聞く、それっぽい話", W / 2, H * .12, 48, C.dim, "center", 800, a * pr(t, S("L73"), .5));
    const k = pr(t, S("L74"), .6, ease.back);
    if (k > 0) {
      darken(k * .86);
      txt("それらしい話ほど、", W / 2, H * .3, 80, C.ink, "center", 900, k);
      txt("一度だけ、根拠を調べる。", W / 2, H * .3 + 110, 80, C.amber, "center", 900, pr(t, S("L74", .2), .6));
      txt("本当のことは、調べても、逃げません。", W / 2, H * .62, 60, C.ink, "center", 800, pr(t, S("L74", .55), .8));
      ["magnifier", "repeat", "paper"].forEach((n, i) => badge(n, W / 2 + (i - 1) * 200, H * .8 - 20, .55 * pr(t, S("L74", .3) + i * .15, .5, ease.back), [C.cyan, C.green, C.amber][i], k));
    }
  }
}
function ending(t) {
  const es = TL.ending_start; if (t < es - .1) return;
  const k = pr(t, es, .6), k2 = pr(t, LN.END2 ? LN.END2.start : es + 1, .6);
  darken(k * .93);
  txt("リバース", W / 2, H * .42, 150, C.ink, "center", 900, k);
  txt("世界の仕組みを、はじめから。", W / 2, H * .42 + 130, 56, C.amber, "center", 800, k2);
  ["ナレーション：" + TL.credits.join("／"), "音楽：Kevin MacLeod (incompetech.com) CC BY 4.0"].forEach((s, i) => txt(s, W / 2, H * .82 + i * 40, 24, C.dim, "center", 500, k2, 1700));
}

// ---------------------------------------------------------------- 1 コマを描く
function kick(t) {
  let v = 0;
  for (const b of BEATS) { const d = t - (b.a + .3); if (d > 0 && d < 1.2) v += .026 * Math.exp(-d * 4.5) * Math.sin(Math.min(d * 9, Math.PI / 2)); }
  return v;
}
function themeAt(t) {
  const i = BEATS.findIndex(b => t >= b.a && t < b.b); if (i < 0) return ["base", null, 0];
  const b = BEATS[i], p = i > 0 ? BEATS[i - 1] : null, k = clamp((t - b.a) / .6);
  return p && p.theme !== b.theme && k < 1 ? [p.theme, b.theme, ease.inOut(k)] : [b.theme, null, 0];
}
function draw(t) {
  const cgA = cg(t);
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
  if (cgA < 1) {
    const [th0, th1, tk] = themeAt(t);
    g.save(); g.globalAlpha = 1 - cgA; background(t, th0, th1, tk); g.restore();
    const z = 1 + kick(t) + .012 * Math.sin(t * .21);
    g.save(); g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2); g.globalAlpha = 1 - cgA;
    let tag = null;
    for (const b of BEATS) {
      if (t < b.a || t > b.b + XF) continue;
      const A = clamp(Math.min((t - b.a) / XF, 1 - (t - b.b) / XF));
      if (A <= 0) continue;
      if (t < b.b) tag = b;
      NOWB = b;
      const slide = (1 - ease.out(clamp((t - b.a) / .5))) * 50 - (t > b.b ? ease.inOut(clamp((t - b.b) / XF)) * 50 : 0);
      g.save(); g.globalAlpha *= A; g.translate(slide, 0); b.fn(t, A); g.restore();
    }
    g.restore();
    if (tag && tag.tag) chapterTag(tag.tag, C.cyan, (1 - cgA) * clamp((t - tag.a) / .5));
  }
  cgOverlay(t);
  ending(t);
  subtitle(t);
}
