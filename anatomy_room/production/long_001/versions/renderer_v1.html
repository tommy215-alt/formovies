<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>long_001 renderer</title>
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0a1220}
#stage canvas{position:absolute;left:0;top:0}
</style>
</head><body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <canvas id="ui" width="1920" height="1080"></canvas>
</div>
<script src="../common/vendor/three.min.js"></script>
<script src="assets/assets.js"></script>
<script src="kit_long.js"></script>
<script>
// long_001「心理学の3分の2は、やり直すと消えた」の描画（長い動画・横長）。部品は kit_long.js。
// 2D の図が中心（ピクトグラム・矢印・アイコン）。3D は問いかけの 3 か所だけ（冒頭 L00・L42・L57〜L58）。
// 場面は「時刻の窓」で決まる。場面の頭で大きく動いて止め（メリハリ）、あとはゆっくり漂わせる。
"use strict";

// ---------------------------------------------------------------- 5 枚のカード（冒頭・正体・結論で使う）
const CARD = [
  { cap: "見た目が55%", col: C.cyan, art: (s) => { picto(-40, 40, .9, C.ink); icon("eye", 50, -40, .7, C.cyan); txt("55%", 50, 40, 52, C.cyan, "center", 900); } },
  { cap: "モーツァルトで頭が良くなる", col: C.violet, art: () => { icon("note", -50, 0, .9, C.violet); arrow(-5, 0, 25, 0, 1, C.ink, 5); icon("brain", 70, 0, .7, C.ink); } },
  { cap: "一瞬の「コーラを飲め」", col: C.red, art: () => { icon("film", -45, 0, .85, C.ink); icon("bottle", 65, 0, 1, C.red); } },
  { cap: "胸を張るとホルモンが変わる", col: C.amber, art: () => { picto(-40, 45, 1, C.amber, "power"); icon("molecule", 65, -20, .65, C.ink); } },
  { cap: "マシュマロで将来がわかる", col: C.pink, art: () => { icon("marsh", -55, 10, 1, "#fff2f8"); arrow(-10, 10, 25, 10, 1, C.ink, 5); icon("trophy", 75, 10, .8, C.amber); } },
];
function card(i, x, y, s, a = 1, rot = 0, dim = 0) {
  const c = CARD[i];
  at(x, y, s, a, () => {
    panel(-160, -190, 320, 380, 1, c.col, "rgba(16,30,52,0.95)", 26);
    g.save(); g.translate(0, -40); c.art(); g.restore();
    txt(c.cap, 0, 130, 32, C.ink, "center", 800, 1, 280);
    if (dim > 0) { g.save(); g.globalAlpha *= dim * .6; g.fillStyle = "#050a14"; rr(-160, -190, 320, 380, 26); g.fill(); g.restore(); }
  }, rot);
}
const ROW = [-720, -360, 0, 360, 720].map(x => W / 2 + x);

// ---------------------------------------------------------------- 場面
// 場面の切り替え（時刻の窓）。a：始まり、b：終わり。重なり 0.5 秒で前後をなめらかにつなぐ
const XF = .5;
const SC = [];
function scene(name, a, b, draw, tag = null, tagCol = C.cyan) { SC.push({ name, a, b, draw, tag, tagCol }); }

function setup() {
  SC.length = 0;
  const T = S;
  // ============ 冒頭（フック） ============
  scene("open", 0, T("L08") - .3, (t, A) => {
    // L01〜L05：カードが 1 枚ずつ飛び込む。話している札を大きく、ほかは列に
    const tIn = [T("L01"), T("L02"), T("L03"), T("L04"), T("L05")];
    const tStamp = T("L06b") + 1.5, tOut = T("L07a");
    for (let i = 0; i < 5; i++) {
      const k = pr(t, tIn[i] - .15, .55, ease.back);
      if (k <= 0) continue;
      const cur = t < (i < 4 ? tIn[i + 1] - .1 : T("L06a")) ? 1 : 0;
      const big = cur * pr(t, tIn[i] - .15, .5) * (1 - pr(t, (i < 4 ? tIn[i + 1] : T("L06a")) - .2, .4));
      const out = pr(t, tOut, .8, ease.inOut);
      const x = lerp(lerp(W / 2 + (i - 2) * 120, ROW[i], 1), ROW[i] + (i - 2) * 260 * out, 1) + (1 - k) * 600;
      const y = H * .44 - big * 30 + out * (i % 2 ? 260 : -260) * 0;
      const s = lerp(.88, 1.3, big) * (1 - .3 * out);
      // L06b：判子が順に押され、カードが傾いて暗くなる
      const ks = pr(t, tStamp + i * .16, .35);
      card(i, x, y + ks * 14, s, A * k * (1 - out), ks * (i % 2 ? .06 : -.06), ks);
      if (ks > 0) at(x, y + ks * 14, s, A * (1 - out), () => stamp("？", 0, -10, (t - tStamp - i * .16) / .5, C.red, 150, -.12));
      // L06a：「科学的に証明済み」のバッジ
      const kb = pr(t, T("L06a") + .25 + i * .1, .4, ease.back) * (1 - pr(t, tStamp + i * .16, .2));
      if (kb > 0) at(x + 120 * s, y - 170 * s, kb, A * (1 - out), () => badge("check", 0, 0, .55, C.green));
    }
    if (t > T("L06a") - .2 && t < tStamp + 1) chip("科学的に証明された", W / 2, 150, C.green, A * win(t, T("L06a"), tStamp + .6, .3, .4), 40);
    // L07：脳と鍵（理由も説明できる）→ タイトル
    const kb = pr(t, tOut + .3, .7, ease.back), kt = pr(t, E("L07b") + .2, .7, ease.back);
    if (kb > 0) {
      const fade = 1 - pr(t, E("L07b"), .4);
      badge("brain", W / 2 - 160, H * .44, 1.5 * kb, C.cyan, A * fade);
      icon("question", W / 2 - 160, H * .44 - 150, kb, C.amber, A * fade * win(t, tOut + .5, T("L07b") + .4, .3, .3));
      const kl = pr(t, T("L07b") + .4, .5, ease.back);
      arrow(W / 2 - 20, H * .44, W / 2 + 120, H * .44, kl, C.amber, 8, 0, A * fade);
      badge("lock", W / 2 + 230, H * .44, 1.3 * kl, C.amber, A * fade);
    }
    if (kt > 0) {
      txt("心理学の3分の2は、", W / 2, H * .36, 104, C.ink, "center", 900, A * kt);
      txt("やり直すと消えた", W / 2, H * .36 + 140, 128, C.amber, "center", 900, A * kt);
      for (let i = 0; i < 3; i++) {
        const fade = i === 0 ? 1 : 1 - pr(t, E("L07b") + 1.0 + i * .25, .5);
        g.save(); g.globalAlpha = A * kt; g.lineWidth = 6; g.strokeStyle = C.amber; g.fillStyle = C.amber; glow(C.amber, 20);
        g.beginPath(); g.arc(W / 2 + (i - 1) * 110, H * .36 + 290, 30, 0, 7); g.stroke(); g.globalAlpha *= fade; g.fill(); g.restore();
      }
    }
  });
  // ============ 第 0 章 5 つの話の正体 ============
  scene("truth", T("L08") - .3, T("L15") - .5, (t, A) => {
    // 上の列：5 枚の小さなカード。いま調べている 1 枚が光る
    const items = [["L09a", "L10a"], ["L10a", "L11"], ["L11", "L12"], ["L12", "L13a"], ["L13a", "L14a"]];
    const k0 = pr(t, T("L08") - .2, .7, ease.back);
    const cur = items.findIndex(([a, b]) => t >= T(a) - .2 && t < T(b) - .2);
    const allBack = pr(t, T("L14a") - .2, .7, ease.inOut);
    for (let i = 0; i < 5; i++) {
      const on = cur === i ? 1 : 0;
      const yy = lerp(lerp(H * .44, 128, pr(t, T("L09a") - .5, .6, ease.inOut)), H * .42, allBack);
      const ss = lerp(lerp(.82, .36, pr(t, T("L09a") - .5, .6, ease.inOut)), .78, allBack);
      const xx = lerp(ROW[i], W / 2 + (i - 2) * 150, pr(t, T("L09a") - .5, .6, ease.inOut) * (1 - allBack));
      card(i, xx, yy + on * 6, ss * (1 + .12 * on), A * k0, 0, (cur >= 0 && !on) ? .7 : 0);
    }
    if (t < T("L09a")) chip("5つの話の正体", W / 2, 150, C.cyan, A * win(t, T("L08"), T("L09a") - .3), 44);
    const L = W * .27, R = W * .72, Y = H * .55;
    // 左右の見出し（広まった話 → 元の研究）
    const showLR = win(t, T("L09a"), T("L14a") - .3, .5, .5);
    if (showLR > 0) {
      txt("広まった話", L, 300, 36, C.dim, "center", 700, A * showLR);
      txt("元の研究", R, 300, 36, C.dim, "center", 700, A * showLR);
      arrow(L + 230, Y, R - 330, Y, pr(t, T("L09a") + .6, .6), C.amber, 9, -40, A * showLR);
    }
    // --- メラビアン
    const m = win(t, T("L09a"), T("L10a") - .2);
    if (m > 0) {
      card(0, L, Y, 1, A * m * pr(t, T("L09a"), .5, ease.back) * (1 - pr(t, S("L09c") + .2, .5)));
      const ch = [["speech", "言葉", "7%", C.cyan], ["wave", "声", "38%", C.violet], ["face", "顔", "55%", C.amber]];
      ch.forEach(([ic, nm, v, col], j) => {
        const k = pr(t, T("L09b") + j * .35, .5, ease.back);
        const y = Y - 236 + j * 128;
        badge(ic, R - 220, y, .62 * k, col, A * m);
        txt(nm, R - 140, y - 16, 34, C.ink, "left", 800, A * m * k); txt(v, R - 140, y + 26, 34, col, "left", 900, A * m * k);
        arrow(R - 40, y, R + 140, Y - 50, pr(t, T("L09b") + .6 + j * .3, .5), col, 6, 20 * (j - 1), A * m);
      });
      badge("heart", R + 230, Y - 50, pr(t, T("L09b") + 1.2, .5, ease.back) * .9, C.pink, A * m);
      txt("好き／嫌い", R + 230, Y + 60, 34, C.pink, "center", 800, A * m * pr(t, T("L09b") + 1.2, .5));
      const kq = pr(t, T("L09c") + .2, .6, ease.back);
      if (kq > 0) {
        panel(R - 360, Y + 120, 720, 150, A * m * kq, C.amber);
        txt("「気持ちや態度の話でなければ、", R, Y + 168, 34, C.ink, "center", 700, A * m * kq);
        txt("この式は当てはまらない」", R, Y + 214, 34, C.ink, "center", 700, A * m * kq);
        txt("— A. メラビアン（本人のサイト）", R + 330, Y + 290, 26, C.dim, "right", 500, A * m * kq);
        // 「ふつうの会話」に ×
        picto(L - 90, Y + 80, 1.1, C.dim, "stand", 0, A * m * kq); picto(L + 90, Y + 80, 1.1, C.dim, "stand", 0, A * m * kq); txt("ふつうの会話", L, Y + 190, 32, C.dim, "center", 700, A * m * kq);
        icon("speech", L, Y - 120, .7, C.dim, A * m * kq);
        icon("cross", L, Y - 10, kq * 2.2, C.red, A * m * kq);
      }
    }
    // --- モーツァルト
    const mz = win(t, T("L10a"), T("L11") - .2);
    if (mz > 0) {
      const k = pr(t, T("L10a"), .6, ease.back);
      image("mozart", L, Y + 10, 300, A * mz * k, -.03);
      txt("Barbara Krafft（1819）／パブリックドメイン", L, Y + 230, 22, C.dim, "center", 500, A * mz * k);
      badge("cube", R - 200, Y - 90, .9 * pr(t, T("L10a") + .8, .5, ease.back), C.cyan, A * mz);
      txt("空間の問題", R - 200, Y + 10, 34, C.ink, "center", 800, A * mz * pr(t, T("L10a") + .8, .5));
      // 一時的に少し上がって戻る線
      const kc = pr(t, T("L10a") + 1.5, 2.2, ease.inOut);
      g.save(); g.globalAlpha = A * mz; g.strokeStyle = C.cyan; g.lineWidth = 7; glow(C.cyan, 14); g.beginPath();
      for (let i = 0; i <= 60 * kc; i++) { const u = i / 60, x = R - 60 + u * 360, y = Y - 40 - 70 * Math.exp(-Math.pow((u - .35) / .16, 2)); i ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke(); g.restore();
      badge("clock", R + 340, Y - 120, .6 * pr(t, T("L10a") + 3, .5, ease.back), C.amber, A * mz);
      txt("一時的", R + 340, Y - 40, 32, C.amber, "center", 800, A * mz * pr(t, T("L10a") + 3, .5));
      const kx = pr(t, T("L10b"), .5, ease.back);
      if (kx > 0) {
        chip("頭が良くなる", R, Y + 120, C.dim, A * mz * kx, 38);
        g.save(); g.globalAlpha = A * mz * kx; g.strokeStyle = C.red; g.lineWidth = 8; g.beginPath(); g.moveTo(R - 150, Y + 120); g.lineTo(R - 150 + 300 * pr(t, T("L10b") + .3, .4), Y + 120); g.stroke(); g.restore();
        const km = pr(t, T("L10b", .5), .6);
        txt("のちの研究をまとめると：効果は小さい", R, Y + 220, 32, C.ink, "center", 700, A * mz * km);
        hbar(R - 250, Y + 260, 500, 18, .18 * km, C.violet, A * mz * km);
      }
    }
    // --- コーラ（年表）
    const co = win(t, T("L11"), T("L12") - .2);
    if (co > 0) {
      card(2, L, Y, 1, A * co * pr(t, T("L11"), .5, ease.back));
      const x0 = R - 300, x1 = R + 300, y = Y - 20;
      g.save(); g.globalAlpha = A * co; g.strokeStyle = C.line; g.lineWidth = 6; g.beginPath(); g.moveTo(x0 - 60, y); g.lineTo(x0 - 60 + 720 * pr(t, T("L11") + .3, 1.2, ease.inOut), y); g.stroke(); g.restore();
      const k1 = pr(t, T("L11") + .5, .5, ease.back), k2 = pr(t, T("L11", .45), .5, ease.back);
      badge("film", x0, y - 120, .7 * k1, C.red, A * co); txt("1957年", x0, y + 50, 44, C.red, "center", 900, A * co * k1); txt("「売上が増えた」と発表", x0, y + 104, 30, C.ink, "center", 700, A * co * k1);
      badge("speech", x1, y - 120, .7 * k2, C.amber, A * co); txt("のちに", x1, y + 50, 44, C.amber, "center", 900, A * co * k2);
      txt("「データは少なすぎた」", x1, y + 104, 30, C.ink, "center", 700, A * co * k2); txt("と認めたと伝えられる", x1, y + 146, 30, C.ink, "center", 700, A * co * k2);
      arrow(x0 + 90, y - 120, x1 - 90, y - 120, pr(t, T("L11", .45) - .3, .5), C.dim, 6, -30, A * co);
    }
    // --- パワーポーズ
    const pp = win(t, T("L12"), T("L13a") - .2);
    if (pp > 0) {
      picto(L, Y + 70, 2.0 * pr(t, T("L12"), .6, ease.back), C.amber, "power", 0, A * pp);
      icon("molecule", L + 170, Y - 140, .8, C.ink, A * pp * pr(t, T("L12") + .4, .5));
      // ホルモンの棒：元の研究（上がる）と大きな追試（平ら）
      const kb = pr(t, T("L12") + 1.0, .8, ease.out), kr = pr(t, T("L12", .3), .8, ease.out);
      vbar(R - 180, Y + 150, 150, 330, .62 * kb, C.amber, "元の研究", "↑", A * pp);
      vbar(R + 180, Y + 150, 150, 330, .05 * kr, C.dim, "大きな追試", "→", A * pp * kr);
      txt("ホルモンの変化", R, Y - 230, 36, C.ink, "center", 800, A * pp);
      const kq = pr(t, T("L12", .55), .6, ease.back);
      if (kq > 0) { panel(R - 380, Y + 230, 760, 96, A * pp * kq, C.amber); txt("共著者：「この効果は本物だと思わない」（2016年）", R, Y + 278, 32, C.ink, "center", 700, A * pp * kq); }
    }
    // --- マシュマロ（線の太さが細くなる）
    const ms = win(t, T("L13a"), T("L14a") - .2);
    if (ms > 0) {
      const k = pr(t, T("L13a"), .6, ease.back);
      child(L - 40, Y + 60, 1.6 * k, C.pink, A * ms); icon("marsh", L + 70, Y + 70, .7, "#fff2f8", A * ms * k);
      picto(R + 200, Y + 70, 1.6 * k, C.ink, "stand", 0, A * ms); icon("trophy", R + 330, Y - 30, .8, C.amber, A * ms * k);
      const k1 = pr(t, T("L13a", .55), .8), k2 = pr(t, T("L13b", .45), .8);
      const wv = lerp(lerp(40, 20, k1), 7, k2);
      g.save(); g.globalAlpha = A * ms * pr(t, T("L13a") + .5, .6); g.strokeStyle = C.pink; g.lineWidth = wv; g.lineCap = "round"; glow(C.pink, 20);
      g.beginPath(); g.moveTo(L + 150, Y); g.quadraticCurveTo(W / 2, Y - 160, R + 80, Y); g.stroke(); g.restore();
      txt("4歳の我慢", L, Y + 190, 32, C.ink, "center", 700, A * ms * k); txt("15歳の成績", R + 200, Y + 190, 32, C.ink, "center", 700, A * ms * k);
      chip(k2 > .5 ? "家庭の環境などをそろえると さらに3分の2小さく" : k1 > .5 ? "2018年の追試：元の研究の半分" : "元の研究：強い関係", W / 2, Y - 230, k2 > .5 ? C.amber : C.pink, A * ms, 34);
    }
    // --- まとめ：ゲージ「言われているほど確かではない」→「なぜ？」
    const sm = win(t, T("L14a"), T("L15") - .3);
    if (sm > 0) {
      const kg = pr(t, T("L14a", .45), 1.0, ease.inOut);
      txt("言われている確かさ", W * .3, H * .7, 34, C.dim, "center", 700, A * sm * (1 - pr(t, T("L14b"), .4)));
      hbar(W * .42, H * .7 - 14, 600, 28, lerp(.95, .35, kg), lerp(0, 1, kg) > .5 ? C.amber : C.green, A * sm * (1 - pr(t, T("L14b"), .4)));
      const kw = pr(t, T("L14b"), .6, ease.back);
      if (kw > 0) { g.save(); g.globalAlpha = A * sm * kw * .94; g.fillStyle = "#050a14"; g.fillRect(0, 0, W, H); g.restore(); txt("なぜ？", W / 2, H * .45, 220 * (2 - kw), C.amber, "center", 900, A * sm * kw); }
    }
  });
  // ============ 仕組み①〜⑤ の章の札 ============
  function chapterCard(t, A, line, num, title, col, ic) {
    const a = T(line) - .3, b = E(line) + .2, k = pr(t, a, .55, ease.back), o = pr(t, b - .35, .45, ease.inOut);
    if (k <= 0 || o >= 1) return 0;
    at(W / 2 - 520 - o * 400, H * .44, 1, A * (1 - o), () => {
      txt(num, 0, 0, 340 * (2 - k), col, "center", 900, .9);
    });
    badge(ic, W / 2 - 520 - o * 400, H * .44 + 230, .8 * k, col, A * (1 - o));
    txt("仕組み", W / 2 - 140 + o * 400, H * .44 - 110, 46, C.dim, "left", 700, A * k * (1 - o));
    txt(title[0], W / 2 - 140 + o * 400 + (1 - k) * 200, H * .44, 84, C.ink, "left", 900, A * k * (1 - o), 1020);
    if (title[1]) txt(title[1], W / 2 - 140 + o * 400 + (1 - k) * 260, H * .44 + 110, 84, col, "left", 900, A * k * (1 - o), 1020);
    return 1 - o;
  }
  // ============ 仕組み① 偶然 ============
  scene("m1", T("L15") - .5, T("L20") - .4, (t, A) => {
    chapterCard(t, A, "L15", "1", ["偶然は、必ず", "「大発見」を作る"], C.cyan, "dice");
    if (t < T("L16") - .3) return;
    // 20 色のグミ
    const cols = Array.from({ length: 20 }, (_, i) => `hsl(${i * 18},80%,62%)`);
    const GX = i => W / 2 - 4.5 * 150 + (i % 10) * 150, GY = i => H * .40 + Math.floor(i / 10) * 170;
    const tNews = T("L19") + .8;
    const sc = 1 - pr(t, tNews, .6, ease.inOut);
    const scan = pr(t, T("L18a") + .3, 3.6, ease.inOut) * 20;
    for (let i = 0; i < 20; i++) {
      const k = pr(t, T("L16") + i * .05, .5, ease.back);
      const hit = i === 7 && scan > 7.5;
      const gray = (t > T("L16", .7) && !hit) ? .55 * pr(t, T("L16", .7), .5) : 0;
      at(GX(i), GY(i) - (hit ? 20 * pr(t, T("L18a") + 1.6, .4, ease.back) : 0), (hit ? 1.35 : 1) * k * (i === 7 ? 1 : sc), A * (i === 7 ? 1 : sc), () => {
        g.fillStyle = hit ? C.green : cols[i]; if (hit) glow(C.green, 30);
        g.beginPath(); g.arc(0, -34, 22, 0, 7); g.fill(); g.beginPath(); g.arc(-17, -50, 9, 0, 7); g.arc(17, -50, 9, 0, 7); g.fill();
        rr(-26, -16, 52, 58, 20); g.fill(); g.shadowBlur = 0;
        if (gray) { g.globalAlpha *= gray; g.fillStyle = "#0a1220"; rr(-30, -62, 60, 108, 20); g.fill(); }
      });
    }
    if (t < T("L17a")) { chip("どの色がニキビに効く？", W / 2, 190, C.cyan, A * pr(t, T("L16") + .4, .4), 40); if (t > T("L16", .7)) chip("本当は どれも効かない", W / 2, H * .78, C.dim, A * pr(t, T("L16", .7), .4), 34); }
    // 5% ＝ 20 マスに 1 マス
    const k5 = win(t, T("L17a"), T("L18a") - .1);

    const ch = win(t, T("L53") - .2, T("L57") - .3);
    if (ch > 0) {
      const ks = pr(t, T("L53"), .6, ease.back);
      if (t < T("L54")) {
        badge("sieve", W / 2, H * .38, 1.4 * ks, C.cyan, A * ch);
        chip("確かめられたもの", W * .28, H * .64, C.green, A * ch * pr(t, T("L53") + .8, .4, ease.back), 40);
        chip("それらしいだけのもの", W * .72, H * .64, C.dim, A * ch * pr(t, T("L53") + 1.4, .4, ease.back), 40);
        txt("三つだけ 確かめる", W / 2, H * .8, 52, C.ink, "center", 900, A * ch * pr(t, T("L53", .65), .4));
      } else {
        const its = [["L54", "magnifier", "元の研究は 本当にそう言っている？", C.cyan], ["L55", "repeat", "ほかの研究者が やり直して確かめた？", C.green], ["L56", "paper", "その数字は どこから来た？", C.amber]];
        its.forEach(([id, ic, s, col], i) => {
          const k = pr(t, T(id) - .2, .6, ease.back), y = H * .26 + i * 190, cur = t >= T(id) - .2 && (i === 2 || t < T(its[i + 1][0]) - .2);
          panel(W * .14, y - 75, W * .72, 150, A * ch * k, cur ? col : C.line, cur ? "rgba(24,44,72,0.95)" : C.panel);
          txt(`${i + 1}`, W * .14 + 80, y, 80, col, "center", 900, A * ch * k);
          badge(ic, W * .14 + 210, y, .6 * k, col, A * ch);
          txt(s, W * .14 + 310, y, 50, C.ink, "left", 900, A * ch * k, W * .55);
        });
      }
    }
  }, "結論", C.green);
}

// ---------------------------------------------------------------- 3D の問いかけ（L00・L42・L57〜L58）
function cg(t) {
  if (t < E("L00") + .5) { G3.stamp(clamp(t / (E("L00") + .5))); return 1 - pr(t, E("L00") + .1, .5); }
  if (t >= T42() - .3 && t < E("L42") + .9) { G3.dots(clamp((t - T42() + .3) / (E("L42") - T42() + 1.0))); return Math.min(pr(t, T42() - .3, .5), 1 - pr(t, E("L42") + .4, .5)); }
  if (t >= S("L57") - .3 && t < TL.ending_start + 10) { G3.card(clamp((t - S("L57") + .3) / (E("L58") - S("L57") + .3)), (t - S("L57", .6)) / .5); return pr(t, S("L57") - .3, .5); }
  G3.clear(); return 0;
}
const T42 = () => S("L42");

// 3D の上に重ねる文字
function cgOverlay(t) {
  if (t < E("L00") + .5) {
    const k = pr(t, .2, .8);
    txt("今から言う5つ。", W / 2, H * .09, 56, C.ink, "center", 900, k * (1 - pr(t, E("L00"), .4)));
    txt("あなたは、たぶん全部知っている。", W / 2, H * .09 + 70, 46, C.amber, "center", 900, pr(t, S("L00", .45), .6) * (1 - pr(t, E("L00"), .4)));
  }
  if (t >= T42() - .3 && t < E("L42") + .9) {
    const a = Math.min(pr(t, T42() + .4, .6), 1 - pr(t, E("L42") + .4, .5));
    txt("あなたの「常識」も、", W / 2, H * .16, 64, C.ink, "center", 900, a);
    txt("この消えた点の中に？", W / 2, H * .16 + 86, 64, C.amber, "center", 900, a);
  }
  if (t >= S("L57") - .3) {
    const a = 1 - pr(t, S("L58") - .2, .4);
    txt("よく聞く、それっぽい話", W / 2, H * .12, 48, C.dim, "center", 800, a * pr(t, S("L57"), .5));
    const k = pr(t, S("L58"), .6, ease.back);
    if (k > 0) {
      g.save(); g.globalAlpha = k * .86; g.fillStyle = "#050a14"; g.fillRect(0, 0, W, H); g.restore();
      txt("それらしい話ほど、", W / 2, H * .3, 80, C.ink, "center", 900, k);
      txt("一度だけ、根拠を調べる。", W / 2, H * .3 + 110, 80, C.amber, "center", 900, pr(t, S("L58", .2), .6));
      const k2 = pr(t, S("L58", .55), .8);
      txt("本当のことは、調べても、逃げません。", W / 2, H * .62, 60, C.ink, "center", 800, k2);
      const ic = ["magnifier", "repeat", "paper"];
      ic.forEach((n, i) => badge(n, W / 2 + (i - 1) * 200, H * .8 - 20, .55 * pr(t, S("L58", .3) + i * .15, .5, ease.back), [C.cyan, C.green, C.amber][i], k));
    }
  }
}

// ---------------------------------------------------------------- エンディング（短い版：最後の画の上にロゴと決めゼリフ）
function ending(t) {
  const es = TL.ending_start; if (t < es - .1) return;
  const k = pr(t, es, .6), k2 = pr(t, LN.END2 ? LN.END2.start : es + 1, .6);
  g.save(); g.globalAlpha = k * .93; g.fillStyle = "#050a14"; g.fillRect(0, 0, W, H); g.restore();
  txt("リバース", W / 2, H * .42, 150, C.ink, "center", 900, k);
  txt("世界の仕組みを、はじめから。", W / 2, H * .42 + 130, 56, C.amber, "center", 800, k2);
  const cr = ["ナレーション：" + TL.credits.join("／"), "音楽：Kevin MacLeod (incompetech.com) CC BY 4.0"];
  cr.forEach((s, i) => txt(s, W / 2, H * .82 + i * 40, 24, C.dim, "center", 500, k2, 1700));
}

// ---------------------------------------------------------------- 1 コマを描く
function kick(t) {
  // 場面の頭で一瞬寄る（メリハリ）
  const ks = ["L08", "L09a", "L10a", "L11", "L12", "L13a", "L14b", "L15", "L16", "L17a", "L19", "L20", "L21", "L22b", "L23", "L24", "L25", "L27a", "L28", "L29", "L30", "L31a", "L32", "L33", "L34", "L35a", "L37a", "L37b", "L38b", "L40", "L41", "L43a", "L43b", "L44", "L45", "L46", "L47", "L48", "L49", "L50a", "L51", "L52a", "L53", "L54", "L55", "L56"];
  let v = 0; for (const id of ks) { const d = t - S(id); if (d > 0 && d < 1.2) v += .028 * Math.exp(-d * 4.5) * Math.sin(Math.min(d * 9, Math.PI / 2)); }
  return v;
}
function draw(t) {
  const cgA = cg(t);
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
  if (cgA < 1) {
    g.save(); g.globalAlpha = 1 - cgA; background(t); g.restore();
    const z = 1 + kick(t) + .012 * Math.sin(t * .21);
    g.save(); g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2); g.globalAlpha = 1 - cgA;
    let tag = null;
    for (const s of SC) {
      const A = clamp(Math.min((t - s.a) / XF + 1, (s.b - t) / XF));
      if (A <= 0) continue;
      if (s.tag && t >= s.a && t < s.b) tag = s;
      g.save(); g.globalAlpha *= A; s.draw(t, A); g.restore();
    }
    g.restore();
    if (tag) chapterTag(tag.tag, tag.tagCol, (1 - cgA) * win(t, tag.a, tag.b, .6, .4));
  }
  cgOverlay(t);
  ending(t);
  subtitle(t);
}

window.setTimeline = tl => { TL = tl; LN = {}; tl.lines.forEach(x => LN[x.id] = x); setup(); };
window.READY = READY_IMG;
window.renderFrame = t => { NOW = t; TEXTLOG.length = 0; draw(t); };
window.renderThumb = () => {
  TEXTLOG.length = 0; G3.clear(); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); background(12);
  for (let i = 0; i < 5; i++) { card(i, 230 + i * 130, 760 + (i % 2) * 30, .62, 1, (i - 2) * .07, .55); at(230 + i * 130, 740, .62, 1, () => stamp("？", 0, -10, 1, C.red, 150, -.12)); }
  txt("心理学の", 1300, 250, 120, C.ink, "center", 900);
  txt("3分の2は", 1300, 420, 170, C.amber, "center", 900);
  txt("やり直すと消えた", 1300, 590, 110, C.ink, "center", 900);
  for (let i = 0; i < 3; i++) { g.save(); g.lineWidth = 8; g.strokeStyle = C.amber; g.fillStyle = C.amber; glow(C.amber, 24); g.beginPath(); g.arc(1180 + i * 120, 760, 40, 0, 7); g.stroke(); if (!i) g.fill(); g.restore(); }
  txt("100の研究を やり直したら", 1300, 880, 52, C.dim, "center", 800);
};
