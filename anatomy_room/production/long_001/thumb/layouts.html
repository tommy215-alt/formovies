<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>long_001 thumbnail layouts</title>
<style>
@font-face { font-family: "NotoBlack"; src: url("fonts/NotoSansJP-VF.ttf"); font-weight: 100 900; }
@font-face { font-family: "ZenAntique"; src: url("fonts/ZenAntique-Regular.ttf"); }
html, body { margin: 0; background: #000; }
#c { display: block; }
</style>
</head><body>
<canvas id="c" width="2560" height="1440"></canvas>
<script>
// long_001 のサムネイルのレイアウト案（10 個）。layouts.html?l=1〜10。字体は仮に Noto Sans JP Black（あとでユーザーが選ぶ）。
// 2026-11-05 ユーザーの指示「レイアウトとか色々変えてみて、背景の配色とかも。まずはレイアウト案 10 個」。
const L = +(new URLSearchParams(location.search).get("l") || 1);
const F = "900 %spx NotoBlack";
const cv = document.getElementById("c"), g = cv.getContext("2d"), W = 2560, H = 1440;
let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------------------------------------------------------------- 背景
function radial(c0, c1, c2, x = .7, y = .45) { const gr = g.createRadialGradient(W * x, H * y, 80, W * x, H * y, W * .9); gr.addColorStop(0, c0); gr.addColorStop(.45, c1); gr.addColorStop(1, c2); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function linear(c0, c1, ang = 0) { const gr = g.createLinearGradient(0, 0, W * Math.cos(ang), H * Math.sin(ang) + (ang ? 0 : 0)); gr.addColorStop(0, c0); gr.addColorStop(1, c1); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function dots(col, step = 60) { g.fillStyle = col; for (let x = 0; x < W; x += step) for (let y = 0; y < H; y += step) { g.beginPath(); g.arc(x, y, 2.5, 0, 7); g.fill(); } }
function grid(col, step = 80) { g.strokeStyle = col; g.lineWidth = 2; for (let x = 0; x < W; x += step) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); } for (let y = 0; y < H; y += step) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); } }

// ---------------------------------------------------------------- 頭（アイコンのタイルで埋めた横顔）
function headPath(cx, cy, s) {
  const p = new Path2D(), P = (x, y) => [cx + x * s, cy + y * s];
  p.moveTo(...P(150, 560)); p.bezierCurveTo(...P(150, 470), ...P(170, 400), ...P(230, 330)); p.bezierCurveTo(...P(330, 230), ...P(400, 60), ...P(380, -110));
  p.bezierCurveTo(...P(360, -330), ...P(170, -470), ...P(-60, -460)); p.bezierCurveTo(...P(-240, -450), ...P(-330, -330), ...P(-350, -200));
  p.bezierCurveTo(...P(-355, -150), ...P(-345, -110), ...P(-360, -80)); p.bezierCurveTo(...P(-375, -50), ...P(-410, 10), ...P(-420, 40));
  p.bezierCurveTo(...P(-425, 58), ...P(-405, 70), ...P(-372, 74)); p.bezierCurveTo(...P(-372, 92), ...P(-382, 104), ...P(-372, 118));
  p.bezierCurveTo(...P(-388, 130), ...P(-380, 146), ...P(-366, 150)); p.bezierCurveTo(...P(-374, 170), ...P(-366, 196), ...P(-352, 208));
  p.bezierCurveTo(...P(-356, 245), ...P(-340, 280), ...P(-296, 292)); p.bezierCurveTo(...P(-240, 306), ...P(-190, 306), ...P(-160, 330));
  p.bezierCurveTo(...P(-140, 400), ...P(-130, 480), ...P(-140, 560)); p.closePath(); return p;
}
const MINI = [
  (s) => { g.beginPath(); g.arc(0, 0, s * .32, 0, 7); g.stroke(); g.beginPath(); g.arc(0, 0, s * .18, -2.2, 1.2); g.stroke(); g.beginPath(); g.moveTo(0, 0); g.lineTo(s * .22, -s * .1); g.stroke(); },
  (s) => { g.strokeRect(-s * .22, -s * .22, s * .44, s * .44); for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(-s * .34, k * s * .12); g.lineTo(-s * .22, k * s * .12); g.moveTo(s * .22, k * s * .12); g.lineTo(s * .34, k * s * .12); g.stroke(); } },
  (s) => { [-.2, 0, .2].forEach((x, k) => g.fillRect(x * s - s * .06, s * .25 - s * (.15 + k * .12), s * .12, s * (.15 + k * .12))); },
  (s) => { g.strokeRect(-s * .32, -s * .22, s * .64, s * .38); g.beginPath(); g.moveTo(-s * .2, s * .05); g.lineTo(-s * .05, -s * .08); g.lineTo(s * .08, s * .02); g.lineTo(s * .22, -s * .12); g.stroke(); },
  (s) => { for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; g.beginPath(); g.moveTo(Math.cos(a) * s * .2, Math.sin(a) * s * .2); g.lineTo(Math.cos(a) * s * .32, Math.sin(a) * s * .32); g.stroke(); } g.beginPath(); g.arc(0, 0, s * .2, 0, 7); g.stroke(); },
  (s) => { g.beginPath(); g.arc(0, 0, s * .3, 0, 7); g.stroke(); g.beginPath(); g.ellipse(0, 0, s * .12, s * .3, 0, 0, 7); g.stroke(); g.beginPath(); g.moveTo(-s * .3, 0); g.lineTo(s * .3, 0); g.stroke(); },
  (s) => { g.strokeRect(-s * .24, -s * .3, s * .48, s * .6); for (let k = 0; k < 4; k++) g.fillRect(-s * .16, -s * .18 + k * s * .11, s * (k === 3 ? .18 : .32), s * .04); },
  (s) => { g.beginPath(); g.arc(0, 0, s * .3, 0, 7); g.stroke(); g.beginPath(); g.arc(0, 0, s * .06, 0, 7); g.fill(); },
  (s) => { g.beginPath(); for (let k = 0; k <= 20; k++) { const x = -s * .32 + k * s * .032, y = Math.sin(k * .9) * s * .14; k ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); },
  (s) => { g.beginPath(); g.moveTo(-s * .25, s * .2); g.lineTo(-s * .25, -s * .05); g.lineTo(0, -s * .05); g.lineTo(0, -s * .25); g.lineTo(s * .25, -s * .25); g.stroke(); },
];
// o：{ cx, cy, s, flip, tile:[r,g,b] の基準色, ink, edge, net, red }
function head(o) {
  g.save();
  if (o.flip) { g.translate(o.cx, 0); g.scale(-1, 1); g.translate(-o.cx, 0); }
  spread(o);
  const hp = headPath(o.cx, o.cy, o.s);
  g.save(); g.fillStyle = o.base || "#0d1f36"; g.fill(hp); g.clip(hp);
  const x0 = o.cx - 450 * o.s, y0 = o.cy - 480 * o.s, x1 = o.cx + 420 * o.s, y1 = o.cy + 580 * o.s;
  const tile = (x, y, sz, d) => {
    const pts = [[x, y], [x + sz, y], [x, y + sz], [x + sz, y + sz]], ins = pts.map(([a, b]) => g.isPointInPath(hp, a, b));
    const edge = ins.some(v => v) && ins.some(v => !v), inside = g.isPointInPath(hp, x + sz / 2, y + sz / 2);
    if ((edge || rnd() < .55) && sz > 26 && d < 4) { const h = sz / 2; tile(x, y, h, d + 1); tile(x + h, y, h, d + 1); tile(x, y + h, h, d + 1); tile(x + h, y + h, h, d + 1); return; }
    if (!inside && !edge) return;
    const [r, gg, b] = o.tile, v = rnd();
    g.save(); g.translate(x + sz / 2, y + sz / 2);
    g.fillStyle = `rgba(${r + 40 * v},${gg + 40 * v},${b + 40 * v},0.92)`; g.fillRect(-sz / 2 + 1.5, -sz / 2 + 1.5, sz - 3, sz - 3);
    const a = .55 + rnd() * .45; g.strokeStyle = o.ink.replace("A", a); g.fillStyle = o.ink.replace("A", a); g.lineWidth = Math.max(1.5, sz * .045);
    if (sz >= 28) MINI[Math.floor(rnd() * MINI.length)](sz);
    g.restore();
  };
  for (let y = y0; y < y1; y += 112) for (let x = x0; x < x1; x += 112) tile(x, y, 112, 0);
  g.restore();
  g.save(); g.strokeStyle = o.edge; g.lineWidth = 4; g.shadowColor = o.edge; g.shadowBlur = o.glow ?? 24; g.stroke(hp); g.restore();
  g.restore();
}
function spread(o) {
  const s = o.s;
  for (let i = 0; i < 46; i++) {
    const a = -1.9 + rnd() * 2.6; let x = o.cx + Math.cos(a) * 400 * s + 40 * s, y = o.cy - 120 * s + Math.sin(a) * 400 * s;
    g.save(); g.strokeStyle = o.net.replace("A", .35 + rnd() * .4); g.lineWidth = 2.5; g.beginPath(); g.moveTo(x, y);
    for (let k = 0, n = 3 + Math.floor(rnd() * 4); k < n; k++) { if (k % 2) x += (40 + rnd() * 120) * s; else y += (rnd() - .6) * 140 * s; g.lineTo(x, y); }
    g.stroke(); g.fillStyle = rnd() < .2 ? o.red : o.net.replace("A", 1); g.beginPath(); g.arc(x, y, (4 + rnd() * 7) * s, 0, 7); g.fill(); g.restore();
  }
  const nodes = []; for (let i = 0; i < 60; i++) nodes.push({ x: o.cx + (150 + rnd() * 700) * s, y: o.cy + (-620 + rnd() * 900) * s, r: (3 + rnd() * 8) * s, red: rnd() < .18 });
  nodes.forEach(n => nodes.slice().sort((a, b) => Math.hypot(a.x - n.x, a.y - n.y) - Math.hypot(b.x - n.x, b.y - n.y)).slice(1, 3)
    .forEach(m => { g.save(); g.strokeStyle = o.net.replace("A", .3); g.lineWidth = 2; g.beginPath(); g.moveTo(n.x, n.y); g.lineTo(m.x, m.y); g.stroke(); g.restore(); }));
  nodes.forEach(n => { g.save(); g.fillStyle = n.red ? o.red : o.net.replace("A", .95); g.beginPath(); g.arc(n.x, n.y, n.r, 0, 7); g.fill(); g.strokeStyle = o.net.replace("A", .5); g.lineWidth = 2; g.beginPath(); g.arc(n.x, n.y, n.r * 1.9, 0, 7); g.stroke(); g.restore(); });
}

// ---------------------------------------------------------------- 文字
function word(s, x, y, size, fill, o = {}) {
  g.save(); g.font = o.font ? `${size}px ${o.font}` : F.replace("%s", size); g.textAlign = o.align || "left"; g.textBaseline = "alphabetic"; g.lineJoin = "round";
  if (o.shadow !== false) { g.shadowColor = "rgba(0,0,0,0.5)"; g.shadowBlur = size * .08; g.shadowOffsetY = size * .05; }
  if (o.outer !== null) { g.lineWidth = size * (o.ow || .22); g.strokeStyle = o.outer || "#05080f"; g.strokeText(s, x, y); }
  g.shadowColor = "transparent";
  if (o.inner !== null) { g.lineWidth = size * .1; g.strokeStyle = o.inner || "#ffffff"; g.strokeText(s, x, y); }
  g.fillStyle = fill; g.fillText(s, x, y); g.restore();
}
// 割れた文字：文字を別の画に描き、ひびの線で切り抜き、かけらを少しずつずらして重ねる（白い背景ではひびが白く見える）
function crackWord(s, x, y, size, fill, o = {}) {
  const off = document.createElement("canvas"); off.width = W; off.height = H; const c = off.getContext("2d");
  c.font = `${size}px ${o.font}`; c.textBaseline = "alphabetic"; c.lineJoin = "round";
  const w = c.measureText(s).width;
  c.lineWidth = size * (o.ow || .16); c.strokeStyle = o.outer || "#ffffff"; c.strokeText(s, x, y);
  c.fillStyle = fill; c.fillText(s, x, y);
  const lines = [], n = o.cracks || 7;
  for (let i = 0; i < n; i++) {
    const px = x + (i + .5 + (rnd() - .5) * .5) / n * w, py = y - size * (.15 + rnd() * .65), ang = (i % 2 ? .32 : -.32) * Math.PI + (rnd() - .5) * .8;
    lines.push({ px, py, dx: Math.cos(ang), dy: Math.sin(ang) });
  }
  c.globalCompositeOperation = "destination-out"; c.lineWidth = size * .034;
  lines.forEach(L => { c.beginPath(); c.moveTo(L.px - L.dx * 3000, L.py - L.dy * 3000); c.lineTo(L.px + L.dx * 3000, L.py + L.dy * 3000); c.stroke(); });
  // 細かいひびの枝
  c.lineWidth = size * .018;
  for (let i = 0; i < 26; i++) { const L = lines[i % n], t0 = (rnd() - .5) * size * 1.2; let bx = L.px + L.dx * t0, by = L.py + L.dy * t0; c.beginPath(); c.moveTo(bx, by); for (let k = 0; k < 2; k++) { bx += (rnd() - .5) * size * .35; by += (rnd() - .5) * size * .35; c.lineTo(bx, by); } c.stroke(); }
  c.globalCompositeOperation = "source-over";
  const use = lines.slice(0, 7);
  for (let k = 0; k < (1 << use.length); k++) {
    g.save();
    use.forEach((L, i) => { const sd = (k >> i) & 1 ? 1 : -1, nx = -L.dy * sd, ny = L.dx * sd, R = 6000; g.beginPath(); g.moveTo(L.px - L.dx * R, L.py - L.dy * R); g.lineTo(L.px + L.dx * R, L.py + L.dy * R); g.lineTo(L.px + L.dx * R + nx * R, L.py + L.dy * R + ny * R); g.lineTo(L.px - L.dx * R + nx * R, L.py - L.dy * R + ny * R); g.closePath(); g.clip(); });
    g.drawImage(off, (rnd() - .5) * size * .07, (rnd() - .5) * size * .07); g.restore();
  }
}
function vword(s, x, y, size, fill, o = {}) { [...s].forEach((ch, i) => { const r = "ー、".includes(ch); g.save(); g.translate(x, y + i * size * 1.02); if (r) { g.rotate(Math.PI / 2); } word(ch, 0, size * .38, size, fill, { ...o, align: "center" }); g.restore(); }); }
function band(x, y, w, h, col, skew = 0) { g.fillStyle = col; g.beginPath(); g.moveTo(x + skew, y); g.lineTo(x + w + skew, y); g.lineTo(x + w, y + h); g.lineTo(x, y + h); g.closePath(); g.fill(); }
function chip(s, x, y, size, bgc, fg, skew = 26) { g.save(); g.font = F.replace("%s", size); const w = g.measureText(s).width + size * 1.4; band(x, y - size * .9, w, size * 1.6, bgc, skew); g.fillStyle = fg; g.textBaseline = "middle"; g.fillText(s, x + size * .7, y - size * .1); g.restore(); }

// ---------------------------------------------------------------- 10 のレイアウト
const NAVY = { tile: [20, 45, 85], ink: "rgba(207,230,255,A)", edge: "rgba(207,230,255,0.9)", net: "rgba(170,215,255,A)", red: "#ff5a5a" };
const LAYOUTS = {
  11: () => { // 決定版：2 の白い背景、「間違った科学」「広まるのか」は Zen Antique（「間違った科学」はひび割れ）、ほかは Noto Sans JP Black
    linear("#ffffff", "#dfe7f1", Math.PI / 2); dots("rgba(30,60,110,0.08)");
    head({ tile: [18, 38, 70], ink: "rgba(220,235,255,A)", base: "#13284a", edge: "rgba(19,40,74,0.9)", glow: 0, net: "rgba(25,60,110,A)", red: "#e0303a", cx: W * .78, cy: H * .52, s: 1.0 });
    word("なぜ、", 110, 400, 150, "#13284a", { inner: null, outer: "#ffffff", shadow: false });
    crackWord("間違った科学", 90, 740, 270, "#e0303a", { font: "ZenAntique", outer: "#ffffff", ow: .16, cracks: 9 });
    word("ほど", 110, 1040, 150, "#13284a", { inner: null, outer: "#ffffff", shadow: false });
    word("広まるのか", 400, 1090, 270, "#13284a", { font: "ZenAntique", outer: "#ffffff", ow: .16, inner: null, shadow: false });
    band(0, 1260, W, 180, "#13284a"); g.fillStyle = "#fff"; g.font = F.replace("%s", 70); g.textBaseline = "middle"; g.fillText("あなたの常識、本当に正しいですか？", 110, 1350);
  },
  1: () => { // 定番：左に文字、右に頭（濃紺）
    radial("#173a63", "#0a1a33", "#02050b"); head({ ...NAVY, cx: W * .81, cy: H * .52, s: .98 });
    chip("あなたの常識、本当に正しい？", 100, 170, 54, "#d8242f", "#fff");
    word("なぜ、", 110, 450, 150, "#fff"); word("間違った科学", 90, 760, 250, "#ff3b3b"); word("ほど", 110, 1080, 150, "#fff"); word("広まるのか", 400, 1120, 250, "#ffd23f");
  },
  2: () => { // 白い背景（参考の画のように明るく清潔）
    linear("#ffffff", "#dfe7f1", Math.PI / 2); dots("rgba(30,60,110,0.08)");
    head({ tile: [18, 38, 70], ink: "rgba(220,235,255,A)", base: "#13284a", edge: "rgba(19,40,74,0.9)", glow: 0, net: "rgba(25,60,110,A)", red: "#e0303a", cx: W * .78, cy: H * .52, s: 1.0 });
    word("なぜ、", 110, 400, 150, "#13284a", { inner: null, outer: "#ffffff", shadow: false });
    word("間違った科学", 90, 720, 250, "#e0303a", { outer: "#ffffff", ow: .16, inner: null, shadow: false });
    word("ほど", 110, 1040, 150, "#13284a", { inner: null, outer: "#ffffff", shadow: false });
    word("広まるのか", 400, 1080, 250, "#13284a", { outer: "#ffffff", ow: .16, inner: null, shadow: false });
    band(0, 1260, W, 180, "#13284a"); g.fillStyle = "#fff"; g.font = F.replace("%s", 70); g.textBaseline = "middle"; g.fillText("あなたの常識、本当に正しいですか？", 110, 1350);
  },
  3: () => { // 頭が左（右向き）、文字が右寄せ（深い紫）
    radial("#3a1f66", "#1a0f36", "#07040f", .25); grid("rgba(200,170,255,0.05)");
    head({ tile: [55, 30, 95], ink: "rgba(235,220,255,A)", base: "#22133f", edge: "rgba(230,210,255,0.9)", net: "rgba(220,200,255,A)", red: "#ff5a8a", cx: W * .2, cy: H * .52, s: .98, flip: true });
    word("なぜ、", W - 110, 420, 150, "#fff", { align: "right" }); word("間違った科学", W - 90, 740, 250, "#ff4d7d", { align: "right" });
    word("ほど広まるのか", W - 90, 1080, 230, "#ffe066", { align: "right" });
    chip("あなたの常識、本当に正しい？", W - 1150, 1290, 54, "#ff4d7d", "#fff");
  },
  4: () => { // 中央に大きな頭、文字は上下（黒×水色）
    radial("#0b2a33", "#05141a", "#000000", .5, .5);
    head({ tile: [12, 50, 60], ink: "rgba(170,250,255,A)", base: "#082028", edge: "rgba(120,240,255,0.9)", net: "rgba(120,240,255,A)", red: "#ff5a5a", cx: W * .5, cy: H * .58, s: 1.05 });
    g.fillStyle = "rgba(0,0,0,0.45)"; g.fillRect(0, 0, W, 330); g.fillRect(0, H - 330, W, 330);
    word("なぜ、間違った科学ほど", W / 2, 250, 190, "#ffffff", { align: "center" });
    word("広まるのか", W / 2, H - 80, 250, "#4ff0ff", { align: "center" });
  },
  5: () => { // 赤×黒（警告）
    radial("#5a0d14", "#26050a", "#080102", .75); dots("rgba(255,120,120,0.06)");
    head({ tile: [70, 15, 22], ink: "rgba(255,225,225,A)", base: "#2a070c", edge: "rgba(255,200,200,0.9)", net: "rgba(255,190,190,A)", red: "#ffd23f", cx: W * .8, cy: H * .52, s: .98 });
    word("なぜ、", 110, 430, 150, "#fff"); word("間違った科学", 90, 750, 250, "#ffffff", { inner: "#e01e2b" }); word("ほど", 110, 1080, 150, "#fff"); word("広まるのか", 400, 1120, 250, "#ffd23f");
    chip("あなたの常識、本当に正しい？", 100, 170, 54, "#ffd23f", "#200");
  },
  6: () => { // 太い赤い帯に「間違った科学」（帯で強調）
    radial("#1d2c45", "#0d1626", "#03060c", .8);
    head({ ...NAVY, cx: W * .83, cy: H * .52, s: .95 });
    word("なぜ、", 120, 400, 160, "#fff");
    band(0, 470, 1700, 330, "#e12631", 60); word("間違った科学", 110, 735, 250, "#ffffff", { outer: "#7a0b12", ow: .1, inner: null });
    word("ほど", 120, 1050, 160, "#fff"); word("広まるのか", 430, 1100, 250, "#ffd23f");
  },
  7: () => { // 斜めの二分割（明るい青と濃紺）
    g.fillStyle = "#06101f"; g.fillRect(0, 0, W, H);
    g.fillStyle = "#1f6fd1"; g.beginPath(); g.moveTo(0, 0); g.lineTo(W * .62, 0); g.lineTo(W * .42, H); g.lineTo(0, H); g.closePath(); g.fill();
    g.fillStyle = "rgba(255,255,255,0.06)"; for (let i = 0; i < 30; i++) { g.fillRect(rnd() * W * .5, rnd() * H, 4, 4); }
    head({ ...NAVY, cx: W * .79, cy: H * .52, s: 1.0 });
    word("なぜ、", 110, 420, 150, "#fff", { outer: "#0b2d5c" }); word("間違った科学", 90, 740, 250, "#ffe14d", { outer: "#0b2d5c" }); word("ほど", 110, 1070, 150, "#fff", { outer: "#0b2d5c" }); word("広まるのか", 400, 1110, 250, "#ffffff", { outer: "#0b2d5c", inner: "#ff3b3b" });
  },
  8: () => { // ネットワークが画面いっぱい、文字は中央に大きく
    radial("#0f3d4f", "#062030", "#01070c", .5, .5);
    head({ ...NAVY, tile: [15, 55, 75], cx: W * .86, cy: H * .66, s: .72 });
    for (let i = 0; i < 140; i++) { const x = rnd() * W, y = rnd() * H; g.fillStyle = `rgba(150,230,255,${.1 + rnd() * .3})`; g.beginPath(); g.arc(x, y, 3 + rnd() * 6, 0, 7); g.fill(); }
    g.fillStyle = "rgba(0,0,0,0.35)"; g.fillRect(0, 360, W, 720);
