<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>long_001 thumbnail</title>
<style>
@font-face { font-family: "Dela"; src: url("../../pilot_021/assets/fonts/delagothicone_DelaGothicOne-Regular.ttf"); }
html, body { margin: 0; background: #000; }
#c { display: block; }
</style>
</head><body>
<canvas id="c" width="2560" height="1440"></canvas>
<script>
// long_001 のサムネイル（YouTube 用 1280×720 を 2 倍で描く）。参考：ユーザーが送ったホラー系のサムネイル（太い文字・縁取り・グラデーション・発光）。
// 「参考より少しスマートに」：血や汚れの質感は使わず、暗い青の背景に、点でできた横顔が崩れて消えていく画と、金・赤の極太の文字。フォントは Dela Gothic One（OFL）。
const cv = document.getElementById("c"), g = cv.getContext("2d"), W = 2560, H = 1440;
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

function bg() {
  const gr = g.createRadialGradient(W * .72, H * .48, 60, W * .6, H * .5, W * .8);
  gr.addColorStop(0, "#16345a"); gr.addColorStop(.45, "#0b1a33"); gr.addColorStop(1, "#03060d");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // 細い格子と、データの縦の流れ
  g.strokeStyle = "rgba(120,180,255,0.06)"; g.lineWidth = 2;
  for (let x = 0; x < W; x += 80) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 80) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.font = "700 26px monospace";
  for (let i = 0; i < 70; i++) {
    const x = W * .45 + rnd() * W * .55, y0 = rnd() * H;
    for (let k = 0; k < 10; k++) { g.fillStyle = `rgba(90,200,255,${.05 + .12 * (1 - k / 10) * rnd()})`; g.fillText(rnd() > .5 ? "1" : "0", x, y0 + k * 30); }
  }
}

// 横顔の形（右向き）。点で埋め、後頭部側（左）の点は崩れて左へ飛び、薄くなる
function headPath(cx, cy, s) {
  const p = new Path2D();
  const P = (x, y) => [cx + x * s, cy + y * s];
  p.moveTo(...P(-150, 230)); p.lineTo(...P(-150, 120));
  p.bezierCurveTo(...P(-250, 40), ...P(-230, -230), ...P(0, -240));
  p.bezierCurveTo(...P(200, -240), ...P(250, -100), ...P(222, 0));
  p.lineTo(...P(262, 62)); p.lineTo(...P(222, 82));
  p.bezierCurveTo(...P(232, 140), ...P(182, 160), ...P(122, 150)); p.lineTo(...P(122, 230)); p.closePath();
  return p;
}
function head() {
  const cx = W * .73, cy = H * .55, s = 2.25, hp = headPath(cx, cy, s);
  // 輪郭の発光
  g.save(); g.shadowColor = "#4fd1ff"; g.shadowBlur = 60; g.strokeStyle = "rgba(79,209,255,0.55)"; g.lineWidth = 5; g.stroke(hp); g.restore();
  // 点で埋める
  const step = 24;
  for (let y = cy - 260 * s; y < cy + 240 * s; y += step) for (let x = cx - 270 * s; x < cx + 280 * s; x += step) {
    if (!g.isPointInPath(hp, x, y)) continue;
    const u = (x - (cx - 260 * s)) / (520 * s);         // 0：後頭部 … 1：顔
    const brk = Math.max(0, .55 - u) / .55;              // 後頭部ほど崩れる
    const fly = brk * brk * (200 + rnd() * 700), dy = (rnd() - .5) * brk * 260;
    const a = Math.max(0, 1 - brk * (.6 + rnd() * .7));
    if (a <= .03) continue;
    const r = 5 + rnd() * 4 * (1 - brk);
    g.save(); g.globalAlpha = a; g.fillStyle = rnd() < .08 + brk * .25 ? "#ffb648" : "#7fdcff"; g.shadowColor = g.fillStyle; g.shadowBlur = 18;
    g.beginPath(); g.arc(x - fly, y + dy, r, 0, 7); g.fill(); g.restore();
  }
  // 脳の中の「？」
  g.save(); g.font = "220px Dela"; g.textAlign = "center"; g.textBaseline = "middle"; g.shadowColor = "#ff3b4b"; g.shadowBlur = 60;
  g.fillStyle = "#ff4d5e"; g.fillText("？", cx + 20 * s, cy - 70 * s); g.restore();
}

// 極太の文字：外側の発光 → 太い黒の縁 → 細い明るい縁 → グラデーションの塗り → 上半分の光沢
function bigText(s, x, y, size, stops, glowCol, opt = {}) {
  g.save(); g.font = `${size}px Dela`; g.textBaseline = "alphabetic"; g.textAlign = opt.align || "left";
  g.lineJoin = "round";
  if (opt.skew) g.setTransform(1, 0, opt.skew, 1, 0, 0);
  g.shadowColor = glowCol; g.shadowBlur = size * .35; g.lineWidth = size * .13; g.strokeStyle = "#04070d"; g.strokeText(s, x, y);
  g.shadowBlur = 0; g.lineWidth = size * .032; g.strokeStyle = opt.rim || "#ffffff"; g.strokeText(s, x, y);
  const gr = g.createLinearGradient(0, y - size * .9, 0, y + size * .1);
  stops.forEach(([o, c]) => gr.addColorStop(o, c)); g.fillStyle = gr; g.fillText(s, x, y);
  g.globalCompositeOperation = "source-atop";
  const sh = g.createLinearGradient(0, y - size * .9, 0, y - size * .35); sh.addColorStop(0, "rgba(255,255,255,0.45)"); sh.addColorStop(1, "rgba(255,255,255,0)");
  g.restore();
}
function ribbon(s, x, y) {
  g.save(); g.font = "62px Dela"; const w = g.measureText(s).width + 90;
  const gr = g.createLinearGradient(x, 0, x + w, 0); gr.addColorStop(0, "rgba(200,30,46,0.95)"); gr.addColorStop(1, "rgba(120,10,24,0.95)");
  g.fillStyle = gr; g.beginPath(); g.moveTo(x, y - 52); g.lineTo(x + w, y - 52); g.lineTo(x + w - 30, y + 42); g.lineTo(x - 30, y + 42); g.closePath(); g.fill();
  g.fillStyle = "#fff"; g.textBaseline = "middle"; g.fillText(s, x + 30, y - 3); g.restore();
}

(async () => {
  await document.fonts.load("200px Dela", "心理学の3分2が消えたあなたの常識本当に正しい？");
  bg(); head();
  ribbon("あなたの常識、本当に正しい？", 90, 150);
  bigText("心理学の", 110, 470, 230, [[0, "#ffffff"], [1, "#9fc8ff"]], "rgba(79,209,255,0.9)", { rim: "#cfe8ff" });
  bigText("3分の2", 90, 860, 380, [[0, "#fff3c4"], [.45, "#ffc24a"], [1, "#d9771a"]], "rgba(255,170,60,0.9)", { rim: "#fff2d0" });
  bigText("が", 110, 1250, 230, [[0, "#ffd1d6"], [.4, "#ff4a5c"], [1, "#a3101f"]], "rgba(255,60,80,0.9)", { rim: "#ffe0e4" });
  bigText("消えた", 380, 1260, 360, [[0, "#ffd1d6"], [.4, "#ff4a5c"], [1, "#a3101f"]], "rgba(255,60,80,0.9)", { rim: "#ffe0e4" });
  // 「消えた」の右端が崩れて点になる
  for (let i = 0; i < 160; i++) {
    const x = 1420 + rnd() * 520, y = 960 + rnd() * 320, a = Math.max(0, 1 - (x - 1420) / 520) * .9;
    g.save(); g.globalAlpha = a; g.fillStyle = rnd() < .5 ? "#ff4a5c" : "#ffd1d6"; g.shadowColor = "#ff3b4b"; g.shadowBlur = 14; g.fillRect(x, y, 10 + rnd() * 14, 10 + rnd() * 14); g.restore();
  }
  // 周辺を暗く
  const vg = g.createRadialGradient(W / 2, H / 2, H * .5, W / 2, H / 2, W * .75); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.55)");
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  window.DONE = true;
})();
</script>
</body></html>
