  } else if (name === "wing") {
    // 小さな翼と毛のような羽（マクロ）→（L16〜L18 は観測室）
    if (t >= CUE.islands) return drawLab(t, ...S.sceneRange("wing"));
    birdAt(t, -1.0, { walk: 0, wing: .28 + .08 * Math.sin(t * 2.2), look: .1 * Math.sin(t * .7) });
    omoteG.g.visible = false;
    const bp = bird.position.clone(), m = prog(t, a, CUE.islands - a);
    const th = lerp(1.85, 1.45, m), d = lerp(.6, .52, sstep(.45, 1, m));
    setCam(V3(bp.x + Math.sin(th) * d, .12 + .015 * m, bp.z + Math.cos(th) * d), V3(bp.x - .005, .022, bp.z), 28, .005, 40);
    dof = { focus: d, slab: .03, far: 12, near: 10 };
    guardBox(birdBox());
  } else if (name === "outro") {

    const up = easeInOut(prog(t, CUE.rise, CUE.last + 1 - CUE.rise));
    if (t >= CUE.last + .6) return drawOutroAerial(t);
    const zW = lerp(-.4, -3.2, easeIn(prog(t, a, 3.2)));
    birdAt(t, zW, { dir: -1, walk: t * 9 }); bird.visible = zW > -3.1;
    const bp = bird.position.clone(), straighten = easeInOut(prog(t, a + 1.2, 2.2));
    omoteG.pose({ x: .78, z: -.45, yaw: Math.atan2(pathX(-2.2) - .78, -2.2 + .45), lean: lerp(.3, .02, straighten), nod: lerp(.5, .05, straighten) });
    const zc = 4.8 + 1.0 * up;
    setCam(V3(pathX(zc) - .3, lerp(1.1, 5.5, up), zc), V3(pathX(-1.2) + .7, lerp(.45, 0, up), -1.2), 36, .02, 80);
    if (up < .2) dof = { focus: cam.position.distanceTo(bp), slab: 1.2, far: 4, near: 4 };
    scene.fog.density = lerp(.09, .05, up);
    guardBox(omoteG.box(cam, W, H));
  }
  draw3D(dof);
}
function drawOutroAerial(t) {
  show("island"); waves(t, cam.position.x, cam.position.z);
  hemi.intensity = .55; key.intensity = 1.05; rim.intensity = .9; key.position.set(-3000, 2200, 3600); rim.position.set(2500, 900, -5000);
  boat.visible = false; omoteBig.g.visible = false;
  const u = easeInOut(prog(t, CUE.last + .6, TL.ending_start - CUE.last - .6));
  const th = TH0 + .6, rp = rimPoint(th, 0), outT = V3(Math.cos(th), 0, Math.sin(th) * IB / IA).normalize();
  const p0 = rp.clone().addScaledVector(outT, 1400).add(V3(0, 260, 0)), p1 = V3(outT.x * 16000, 2600, outT.z * 16000);
  setCam(lerpV(p0, p1, u ** .8), lerpV(rp.clone().add(V3(0, 150, 0)), V3(0, 150, 0), u), 40, 1, 160000);
  scene.fog.density = lerp(.0003, .000045, sstep(0, .6, u)); mist(u < .3);
  draw3D(null);
}
function drawLab(t, a, b) {
  show("lab", "globe"); hemi.intensity = .3; key.intensity = .9; rim.intensity = 1.1; key.castShadow = false; scene.fog.density = .02;
  key.position.set(-4, 5, 4); rim.position.set(3, 3, -4); spot.target.position.set(0, 1, 0);
  globe.position.set(0, 1.55, 0); atmo.visible = true; pin.visible = true; pinRing.material.opacity = .9; pin.scale.setScalar(1 + .4 * Math.sin(t * 3) ** 2);
  const evoPart = t < CUE.wing;
  globe.rotation.y = evoPart ? -.35 + .1 * Math.sin(t * .2) : -.35 + 2.2 * easeInOut(prog(t, CUE.islands, 4.5));
  // 弧：L12 で伸び、L13 で島に届き、L14 で点線に（渡り方は不明）
  const grow = evoPart ? prog(t, CUE.arc, CUE.arrive - CUE.arc) : 0, dashed = evoPart && t >= CUE.unknown;
  arcSegs.forEach((l, i) => { l.visible = evoPart && i / 80 < grow && (!dashed || i % 4 < 2); l.material.opacity = .9; });
  islandDots.forEach((m, i) => { m.visible = !evoPart; m.material.opacity = k_(t, "islands", .4, i * .25); });
  helix.visible = evoPart; helix.rotation.y = t * .5; helix.scale.setScalar(k_(t, "dna", .6) || .001);
  // オモテ：地球儀を見上げる。L18 でゆっくりうなずく
  const nod = !evoPart ? .35 * Math.sin(Math.PI * clamp((t - CUE.nod) / 1.2)) : 0;
  omoteLab.pose({ x: 1.35, z: .85, yaw: Math.atan2(-1.35, -.85), lean: .06, nod: -.12 + nod, tilt: evoPart ? 0 : .1 * Math.sin(t * .6) });
  const u = prog(t, a, b - a);
  setCam(V3(2.6 - .5 * u, 1.75 + .1 * Math.sin(t * .4), 8.2 - .8 * u), V3(-.15, .95, 0), 44, .05, 200);
  draw3D({ focus: cam.position.distanceTo(globe.position), slab: 1.6, far: 3, near: 3 });
  guardBox(omoteLab.box(cam, W, H));
  // 注記と情報（必要なものだけ）
  if (evoPart) {
    if (t >= CUE.dna) uiNote("※DNAのらせんはイメージ", 300, 1230, k_(t, "dna", .5, .4));
    if (t >= CUE.arc) uiCard([["祖先：南アメリカのクイナの仲間", 36, 700]], 540, 300, k_(t, "arc"));
    if (t >= CUE.arrive) uiCard([["到達：約150万年前（推定）", 40, 800]], 540, 420, k_(t, "arrive"));
    if (t >= CUE.unknown) uiCard([["渡り方：不明", 40, 800], ["飛んできた？／漂流物に助けられた？", 30, 500, "#B8C7D6"]], 540, 560, k_(t, "unknown"));
    if (t >= CUE.arc) uiNote("※経路の線はイメージ", 300, 1290, k_(t, "arc", .5, .4));
  } else {
    uiCard([["飛ぶ力を失ったクイナがいる（いた）島", 34, 700]], 540, 300, k_(t, "islands", .5, .2));
    uiNote("※一部の例", 540, 420, k_(t, "islands", .5, .6));
    const fk = k_(t, "factors"), f2 = k_(t, "factor2");
    if (fk > 0) uiCard([["天敵が少ない", 40, 800]], 320, 560, fk);
    if (f2 > 0) uiCard([["飛ぶためのエネルギーが大きい", 36, 800]], 600, 690, f2);
    if (t >= CUE.caveat) uiCard([["一つの理由では決めつけられない", 36, 800]], 540, 840, k_(t, "caveat"));
  }
}
function drawUI(t, name) {
  if (name === "hook") {
    if (t >= CUE.glimpse && t < CUE.glimpse + .55) uiNote("※再現CG", 900, 250, 1, 26);
  } else if (name === "aerial") {
    uiCard([["崖の高さ：約300m", 36, 700]], 540, 320, k_(t, "cliff", .5, .3) * (1 - prog(t, CUE.grass, .4)));
    uiCard([["Inaccessible ＝ 近づけない", 36, 700]], 540, 450, k_(t, "name", .5) * (1 - prog(t, CUE.grass, .4)));
  } else if (name === "bird") {
    uiCard([["イナクセシブルクイナ", 50, 800], ["この島だけにすむ固有種", 30, 500, "#B8C7D6"]], 540, 300, k_(t, "bird", .5, .25) * (1 - prog(t, CUE.size - .45, .35)));
    const half = CUE.size + (CUE.smallest - CUE.size) / 2;   // 頭のマクロの間だけ（脚のマクロではオモテの足と重なるため出さない）
    if (t >= CUE.size && t < half) uiCard([["体長 約13〜15cm", 44, 800]], 540, 300, k_(t, "size", .4, .2) * (1 - prog(t, half - .35, .3)));
    uiNote("※再現CG", 900, 250, k_(t, "bird", .4), 26);
  } else if (name === "wing" && t < CUE.islands) {
    uiCard([["小さく弱い翼", 40, 800]], 540, 300, k_(t, "wing", .5, .4));
    if (t >= CUE.feathers) uiCard([["羽の一部は毛のようにばらける", 34, 700]], 540, 420, k_(t, "feathers"));
    uiNote("※再現CG", 900, 250, k_(t, "wing", .4), 26);
  } else if (name === "evo" && t < CUE.dna) {
    uiNote("※再現CG", 900, 250, 1, 26);
  } else if (name === "alone") {
    if (t < CUE.edge) uiCard([["イナクセシブル島", 40, 800], ["面積 十数㎢", 30, 500, "#B8C7D6"]], 540, 330, k_(t, "alone", .5, .5) * (1 - prog(t, CUE.edge - .4, .3)));
    else {
      uiCard([["ネズミ・ネコ：侵入の記録なし", 34, 700]], 540, 320, k_(t, "edge", .5, .3));
      if (t >= CUE.boat) uiNote("※船の影はイメージ", 540, 430, k_(t, "boat", .5, .2));
      if (t >= CUE.iucn) uiCard([["国際自然保護連合（IUCN）の評価", 30, 500, "#B8C7D6"], ["危急種", 48, 800]], 540, 560, k_(t, "iucn"));
    }
  } else if (name === "outro" && t < CUE.last + .6) {
    uiNote("※再現CG", 900, 250, 1 - prog(t, CUE.rise, .5), 26);
  }
}

function renderFrame(t) {
  bg.clearRect(0, 0, W, H); ui.clearRect(0, 0, W, H);
  const es = TL.ending_start;
  if (t >= es) {
    const e = TL.lines.filter(x => x.ending);
    drawEnding(ui, t - es, { end1: e[0].start - es, end2: e[1].start - es, credits: TL.credits, brand: "", techno: true });
    ui.getImageData(0, 0, 1, 1); return;
  }
  window.__t = t;
  const name = S.sceneAt(t);
  drawScene(t, name);
  grade(t);
  drawUI(t, name);
  S.header(ui, false);
  docSub(t);
  // 場面のつなぎ：短い暗転（白い閃光は使わない）
  const [a] = S.sceneRange(name), i = SCN.indexOf(name);
  if (i > 0) { const k = 1 - prog(t, a, .35); if (k > 0) { bg.fillStyle = `rgba(4,8,14,${.85 * k})`; bg.fillRect(0, 0, W, H); } }
  bg.getImageData(0, 0, 1, 1); ui.getImageData(0, 0, 1, 1);
}
function renderThumb() {
  bg.clearRect(0, 0, W, H); ui.clearRect(0, 0, W, H); window.__t = 26;
  groundLights(); swayPlants(26); birdAt(26, -.6, { walk: 0, look: .3 }); omoteG.pose({ x: .55, z: .6, yaw: Math.atan2(pathX(-.6) - .55, -1.2), lean: .3, nod: .5 });
  const bp = bird.position; setCam(V3(bp.x + .45, .14, bp.z + .55), V3(bp.x, .07, bp.z), 30, .02, 60);
  draw3D({ focus: .72, slab: .18, far: 7, near: 8 }); grade(26);
  text(ui, "世界の果ての", 540, 1380, 92, "#EAF2F8", { weight: 900, stroke: "#06101c", sw: 14 });
  text(ui, "飛べない小さな鳥", 540, 1510, 100, "#A8E6FF", { weight: 900, stroke: "#06101c", sw: 14 });
  S.header(ui, false); bg.getImageData(0, 0, 1, 1); ui.getImageData(0, 0, 1, 1);
}
function setTimeline(tl) { TL = tl; S.setup(tl, SCN); CUE = S.CUE; }
window.__hide = (k) => { if (k === "sea") { seaNear.visible = false; seaFar.visible = false; } if (k === "isl") island.children[0].visible = false; };
window.__dbg = () => ({ bird: bird.position.toArray(), birdVis: bird.visible, cam: cam.position.toArray(), om: omoteG.g.position.toArray(), near: cam.near, far: cam.far, inTus: tussocks.filter(q => Math.hypot(q.x - cam.position.x, q.z - cam.position.z) < .5).length });
window.renderFrame = renderFrame; window.renderThumb = renderThumb; window.setTimeline = setTimeline;
</script>
