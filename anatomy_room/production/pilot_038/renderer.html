<style>

<script>
// pilot_038「あなたならどうする？——発射直後の雷（アポロ12号）」のレンダラー（当事者設計）。3D は Blender（blender/scene.py）。本物の写真：lightning（NASA、1969 年 11 月 14 日の落雷、PD）、launch（NASA、アポロ 12 号の発射、PD）、aaron（NASA、ジョン・アーロン、PD）。
// 当事者設計（templates/DESIGN_MODES.md）：前半は当事者の目線（Blender の POV＋pov.js）、後半は三人称の解説。文字は知的設計の字幕だけ（オープニングの問いは大きく）。
Object.assign(KIT, { design: "intel", scenes: ["open", "pov", "ask", "exp", "after"], images: ['lightning', 'launch', 'aaron'], ci: {}, hits: [],
  opening: { img: null, bg: openBG, title: ["", ""], size1: 1, size2: 1, credit: ["※再現CGを含みます"] } });
loadImages(KIT.images);
const HEAD = ["アポロ12号 発射直後", "雷が直撃"];   // 冒頭の見出し（上：場面、中：核心）
const CHOICE = { a: "計器の／復活を進める", b: "電気回路の／復活を進める", ans: "A", reveal: "l08b" };
// SCE の仕組み（模式）：センサー → SCE → 計器・地上。前半は乱れた信号、AUX に切り替えると整った信号
function sceDiag(X, t, a) { panel(X); const k = clamp((t - a - 2.4) / .4);
  lab2(X, "センサー", 250, 560, T(30), "#B8DFF2", 700); lab2(X, "SCE", 540, 560, T(40), "#FFE2A8", 900); lab2(X, "計器・地上", 830, 560, T(30), "#B8DFF2", 700);
  X.strokeStyle = "rgba(159,216,255,.8)"; X.lineWidth = 4; X.strokeRect(440, 500, 200, 120);
  for (const [x0, x1] of [[320, 440], [640, 760]]) { X.beginPath(); for (let x = x0; x <= x1; x += 3) { const ph = (x - t * 220) / 18, n = (1 - k) * (Math.sin(ph * 3.7) * 22 + Math.sin(ph * 9.1) * 14) + Math.sin(ph) * 16; X.lineTo(x, 700 + n); } X.strokeStyle = k > .5 ? "#9AF0D0" : "#FF9A8A"; X.lineWidth = 5; X.stroke(); }
  lab2(X, k > .5 ? "AUX：信号が戻る" : "雷で電圧が乱れる", 540, 840, T(32), k > .5 ? "#9AF0D0" : "#FF9A8A", 800); }
const CUTS = {l00_2: ["l00", 1.0], l00_3: ["l00", 2.3], l03_2: ["l03", 1.6], l04_2: ["l04", 2.2]};   // カットの区切り（もとの cue からの秒。2026-11-03〜）
SHOTS = [
  { at: "l01", kind: "3d", draw: blShot("l01") },
  { at: "l03", kind: "3d", draw: blShot("l03") },
  { at: "l03_2", kind: "3d", draw: blShot("l03_2") },
  { at: "l04", kind: "3d", draw: blShot("l04") },
  { at: "l04_2", kind: "3d", draw: blShot("l04_2") },
  { at: "l06", kind: "3d", draw: blShot("l06") },
  { at: "l07", kind: "3d", draw: blShot("l07") },
  { at: "l08", kind: "photo", img: "aaron", box: [90, 470, 990, 1060], cy: .4, z0: 1.0, z1: 1.15, gray: 0, credit: ["写真：NASA（管制官ジョン・アーロン）／パブリックドメイン"], creditY: 1120 },
  { at: "l09", kind: "3d", draw: blShot("l09") },
  { at: "l10", kind: "3d", draw: blShot("l10") },
  { at: "l11", kind: "holo", draw: (X, t) => sceDiag(X, t, CUE.l11) },
  { at: "l13", kind: "3d", draw: blShot("l13") },
];
const FX = {
  l00: (t, u) => { POV.shake(t, 4); POV.alert(t, .55); },
  l01: (t, u) => { POV.shake(t, 1.5); },
  l02: (t, u) => { POV.shake(t, 2 + 3 * u); },
  l03: (t, u, a) => { POV.shake(t, 2 + 4 * clamp((t - a) / 1.5)); POV.alert(t, .7 * clamp((t - a - .4) / .6)); },
  l04: (t, u) => { POV.shake(t, 9); POV.alert(t, .85); },
  l05: (t, u) => { POV.shake(t, 7 + 8 * (u > .45 ? 1 : 0)); POV.alert(t, .9, 1.6); },
  l06: (t, u) => { POV.shake(t, 6); },
  l07: (t, u, a) => { POV.shake(t, 2); POV.alert(t, .7); POV.heart(t, 120, .15 * clamp((t - a) / 4)); },
};
Object.assign(FX, {l03_2: FX.l03 || (() => {}), l04_2: FX.l04 || (() => {})});   // カットにも同じ揺れ
function buildMood() { const c = CUE; for (const k in CUTS) CUE[k] = CUE[CUTS[k][0]] + CUTS[k][1]; MOOD = [[0, { cool: .4, sat: .8, vig: .45 }], [c.pov, { cool: .45, sat: .75, vig: .7 }], [c.l03, { cool: .5, sat: .7, vig: .8 }], [c.ask, { cool: .55, sat: .6, vig: .85 }], [c.exp, { warm: .05, sat: .9, vig: .6 }], [c.after, { warm: .2, sat: .95, glow: .2, glowX: .5, glowY: .4, vig: .5 }]]; }
function thumb() { CUE = CUE || {}; CUE.t0 = 0; photo(bg, IMG.lightning, 1, 1.05, 1.05, 0, { box: [0, 0, 1080, 1920], cy: .5, cx: .7, gray: 0, frame: "none" }); bg.fillStyle = "rgba(0,4,10,.4)"; bg.fillRect(0, 0, W, H); S.moodGrade(bg, 0, [[0, { cool: .4, sat: .8, vig: .7 }]]); addGrain(0); label(ui, "計器が狂った。飛行は続ける", 540, 470, 66, "#EAF2F8", { stroke: "#05080c", sw: .14 }); label(ui, "まず、どうする？", 540, 620, 110, "#FFD58A", { stroke: "#05080c", sw: .14 }); choicePair(0, 1000, 170, 1); }

// ---------------------------------------------------------------- 選択肢の札（2026-11-02 ユーザーの指示：前半は「選択」が主役。A・B を同時に見せる）
// CHOICE = { a, b, ans: "A"|"B", reveal: 答えを言う行の cue }
function choiceCard(ctx, letter, text, x, y, w, h, k, hi = 0, dim = 0) { if (k <= 0) return;   // 札の文字と丸は札の高さに合わせて大きく（2026-11-03：冒頭は大きな文字で）
  const col = letter === "A" ? [80, 170, 255] : [255, 150, 70]; ctx.save(); ctx.globalAlpha = k * (1 - .65 * dim);
  ctx.fillStyle = `rgba(6,12,20,${.72 + .15 * hi})`; rrect(ctx, x, y, w, h, 26); ctx.fill();
  ctx.lineWidth = 5 + 7 * hi; ctx.strokeStyle = `rgba(${col},${.8 + .2 * hi})`; rrect(ctx, x, y, w, h, 26); ctx.stroke();
  if (hi > 0) { ctx.shadowColor = `rgba(${col},.9)`; ctx.shadowBlur = 40 * hi; ctx.stroke(); ctx.shadowBlur = 0; }
  const r = Math.min(62, h * .28), cx = x + 30 + r; ctx.fillStyle = `rgb(${col})`; ctx.beginPath(); ctx.arc(cx, y + h / 2, r, 0, Math.PI * 2); ctx.fill();
  label(ctx, letter, cx, y + h / 2 + 2, r * 1.45, "#06101a", { weight: 900 });
  const lines = text.split("／"), x0 = cx + r + 20, wt = x + w - 24 - x0, n = Math.max(...lines.map(l => l.length)),
    fs = Math.min(lines.length > 1 ? h * .34 : h * .44, wt / (n * 1.02)), lh = fs * 1.16;
  lines.forEach((l, i) => label(ctx, l, x0 + wt / 2, y + h / 2 + (i - (lines.length - 1) / 2) * lh, fs, "#EAF2F8", { weight: 800 }));
  ctx.restore(); }
function choicePair(t, y, h, k, hiA = 0, hiB = 0, dimA = 0, dimB = 0) { choiceCard(ui, "A", CHOICE.a, 70, y, 940, h, k, hiA, dimA); choiceCard(ui, "B", CHOICE.b, 70, y + h + 34, 940, h, k, hiB, dimB); }
function choiceUI(t, name) {
  if (name === "open") { const k = 1, a = CUE.l00a, b = CUE.l00b;   // 冒頭：1 秒で状況が分かる大きな見出し＋大きな札（2026-11-03）
    HUD.title(ui, [[HEAD[0], 62, "#D8E6F0"], [HEAD[1], 126, "#FFFFFF"], ["あなたは？", 96, "#FFD58A"]], 540, 440, k, t);
    choicePair(t, 930, 236, k, t >= a && t < b ? clamp((t - a) / .15) : 0, t >= b ? clamp((t - b) / .15) : 0, t >= b ? .6 : 0, t >= a && t < b ? .6 : 0); return; }
  const { s } = shotAt(t), es = TL.ending_start;
  if (name === "pov") { const k = clamp((t - CUE.pov) / .4) * clamp((CUE.ask - t) / .3); ui.save(); ui.globalAlpha = .85 * k;   // 上に小さく：A・B のどちらか
    for (const [L, x, c] of [["A", 270, "rgba(80,170,255,.9)"], ["B", 810, "rgba(255,150,70,.9)"]]) { ui.fillStyle = "rgba(6,12,20,.6)"; rrect(ui, x - 250, 200, 500, 70, 35); ui.fill(); ui.strokeStyle = c; ui.lineWidth = 3; rrect(ui, x - 250, 200, 500, 70, 35); ui.stroke();
      label(ui, L + "　" + (L === "A" ? CHOICE.a : CHOICE.b).replace("／", ""), x, 236, 30, "#EAF2F8", { weight: 700 }); } ui.restore(); }
  if (name === "ask") { const k = clamp((t - CUE.ask) / .35); choicePair(t, 620, 170, k); }
  const r = CUE[CHOICE.reveal]; if (r !== undefined && t >= r && t < r + 3.2) { const k = clamp((t - r) / .25) * clamp((r + 3.2 - t) / .4), hi = clamp((t - r - .3) / .3), A = CHOICE.ans === "A";
    choicePair(t, 300, 150, k, A ? hi : 0, A ? 0 : hi, A ? 0 : hi, A ? hi : 0); }
}
// オープニングの背景：状況 → A の行動の CG → B の行動の CG（2026-11-02 ユーザーの指示）
const OPEN_SHOTS = {l00: blShot("l00"), l00_2: blShot("l00_2"), l00_3: blShot("l00_3"), l00a: blShot("l00a"), l00b: blShot("l00b")};
function openBG(t) { const o = KIT.opening; if (o.img0 === undefined) { o.img0 = o.img; o.credit0 = o.credit; } o.img = t < CUE.l00a ? o.img0 : null; o.credit = o.img ? o.credit0 : o.credit0.filter(c => !c.startsWith("写真"));   // 本物の写真は状況を読むあいだだけ、A・B では CG を全面に
  OPEN_SHOTS[Object.keys(OPEN_SHOTS).filter(k => CUE[k] <= t + 1e-6).sort((a, b) => CUE[b] - CUE[a])[0] || "l00"](t); }   // 冒頭は複数のカット
// 最後の暗転の注意書き（2026-11-02 ユーザーの指示）
function endNote(t) { const es = TL.ending_start; if (t < es) return; ui.fillStyle = `rgba(0,0,0,${easeInOut(clamp((t - es) / 1.0))})`; ui.fillRect(0, 0, W, H);   // 1 秒で真っ暗に
  if (t < es + .7) return; const k = clamp((t - es - .7) / .5);
  ui.save(); ui.globalAlpha = k; ["※これは過去の出来事の紹介です。", "必ずしも正しい選択を", "示すものではありません。"].forEach((l, i) => label(ui, l, 540, 900 + i * 66, 44, "#D8E2EA", { stroke: "#000", sw: .1 })); ui.restore(); }
{ const _du = drawUI; drawUI = function (t, name) { _du(t, name); if (t < TL.ending_start) choiceUI(t, name); }; }
// ---------------------------------------------------------------- 目線の演出（pov.js）。FX[ショット] = (t, u, a) => { ... }
// 冒頭は暗くしすぎない：何が起きているか分かる明るさに（2026-11-03 ユーザーの指示。揺れ・警告灯などの緊迫感はそのまま）
const LIFT_C = document.createElement("canvas"); LIFT_C.width = W; LIFT_C.height = H; const LIFT_X = LIFT_C.getContext("2d");
function liftOpen(k) { if (k <= 1.001) return; LIFT_X.clearRect(0, 0, W, H); LIFT_X.drawImage(bg.canvas, 0, 0); bg.save(); bg.filter = `brightness(${k}) contrast(1.06) saturate(1.08)`; bg.drawImage(LIFT_C, 0, 0); bg.restore(); }
function fxEp(t, name) {
  liftOpen(name === "open" ? 1.5 : 1 + .5 * (1 - clamp((t - CUE.pov) / 1.2)));
  if (name === "open") { (FX.l00 || (() => {}))(t, clamp(t / Math.max(.3, CUE.l01)), 0); return; }
  const { s, a, u } = shotAt(t); const f = FX[s.at]; if (f) f(t, u, a);
}
kitStart(() => {}); BL.install();
{ const rf = window.renderFrame; window.renderFrame = t => { const r = rf(t); if (r && r.then) return r.then(() => endNote(t)); endNote(t); return r; }; }
</script>
