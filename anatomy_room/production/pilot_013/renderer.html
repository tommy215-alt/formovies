<script>
// pilot_013「宇宙飛行士の命を、数字で支えた女性——キャサリン・ジョンソン」のレンダラー（標準ルール v4：cine.js の映像品質、字幕 1.2 倍、色調の感情設計）。
// renderFrame(t) が時刻 t の 1 コマを描く（決定的：乱数はすべて種つき）。3D は画面外の WebGL に 1.5 倍で描いて bg（2D）に縮めて重ね、ui（2D）に文字。
// 人物は顔のない人形（stage.js の mochi3D）。実際の顔は描かない。地球の画像は NASA Visible Earth（パブリックドメイン、common/vendor/earth/）。
const S = Stage, { W, H, clamp, lerp, easeOut, easeIn, easeInOut, prog, win, text, rrect } = Stage;
const TS = S.TEXT_SCALE;
const bg = document.getElementById("bg").getContext("2d");
const ui = document.getElementById("ui").getContext("2d");
const SCN = ["hook", "girl", "naca", "orbit", "trust", "space", "end"];
let TL, CUE, MOOD = [];
const k_ = (t, cue, d = .4, off = 0) => easeOut(prog(t, CUE[cue] + off, d));
const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const lerpV = (a, b, k) => a.clone().lerp(b, k);

// ---------------------------------------------------------------- WebGL（超解像度 1.5 倍）
const SS = 1.5;
const glc = document.createElement("canvas"); glc.width = W * SS; glc.height = H * SS;
const R = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(W * SS, H * SS, false); R.outputEncoding = THREE.sRGBEncoding;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.2;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.shadowMap.autoUpdate = false;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(40, W / H, .01, 200);
const C = c => new THREE.Color(c).convertSRGBToLinear();
let FOGC = C(0x0e141c);
scene.fog = new THREE.FogExp2(FOGC, .03);
const hemi = new THREE.HemisphereLight(C(0x8ea2bd), C(0x1a1612), .45); scene.add(hemi);
const key = new THREE.SpotLight(C(0xffd9a8), 2.5, 0, .7, .55, 1); key.castShadow = true; scene.add(key); scene.add(key.target);
key.shadow.mapSize.set(4096, 4096); key.shadow.bias = -.0004; key.shadow.normalBias = .01;
const rim = new THREE.DirectionalLight(C(0x9fd4ff), .9); scene.add(rim); scene.add(rim.target);
const fill = new THREE.PointLight(C(0x6fa8d8), 0, 12, 2); scene.add(fill);
const sets = {};
function set(name) { const g = new THREE.Group(); g.visible = false; scene.add(g); sets[name] = g; return g; }
function show(...names) { for (const k in sets) sets[k].visible = names.includes(k); }
function setCam(pos, look, fov = 40, near = .02, far = 200, up = null) {
  cam.up.copy(up || V3(0, 1, 0)); cam.position.copy(pos); cam.fov = fov; cam.near = near; cam.far = far; cam.lookAt(look); cam.updateProjectionMatrix(); cam.updateMatrixWorld();
}
function lights({ hemiI = .45, keyI = 30, keyPos, keyAt, keyCol = 0xffd9a8, angle = .7, rimI = .9, rimCol = 0x9fd4ff, rimPos = [3, 4, -4], fillI = 0, fillCol = 0x6fa8d8, fillPos = [0, 2, 2], fog = .03, fogC = 0x0e141c, exp = 1.1, hemiSky = 0x8ea2bd, hemiGround = 0x1a1612 }) {
  hemi.intensity = hemiI; hemi.color = C(hemiSky); hemi.groundColor = C(hemiGround); key.intensity = keyI * .085; key.color = C(keyCol); key.angle = angle;
  key.position.set(...keyPos); key.target.position.set(...keyAt); key.target.updateMatrixWorld();
  rim.intensity = rimI * .6; rim.color = C(rimCol); rim.position.set(...rimPos); fill.intensity = fillI * .2; fill.color = C(fillCol); fill.position.set(...fillPos);
  FOGC = C(fogC); scene.fog.color = FOGC; scene.fog.density = fog; R.toneMappingExposure = exp;
}
const FX = [];   // 加算の光の筋・埃・炎（被写界深度の透明な層には描かない：不透明な暗い色として残り、画面を覆う）
function draw3D(dof) {
  R.shadowMap.needsUpdate = true;
  const n0 = cam.near, f0 = cam.far;
  if (!dof) { R.setClearColor(FOGC, 1); R.render(scene, cam); bg.imageSmoothingQuality = "high"; bg.drawImage(glc, 0, 0, W, H); return; }
  const { focus, slab, far: bf, near: bn } = dof;
  const pass = (n, f, blur, clearAlpha) => {
    const fx = clearAlpha === 0 ? FX : [], vis = fx.map(o => o.visible); fx.forEach(o => o.visible = false);
    cam.near = Math.max(n0, n); cam.far = Math.min(f0, f); cam.updateProjectionMatrix();
    R.setClearColor(FOGC, clearAlpha); R.render(scene, cam); R.shadowMap.needsUpdate = false;
    fx.forEach((o, i) => o.visible = vis[i]);
    bg.save(); bg.imageSmoothingQuality = "high"; bg.filter = blur > .3 ? `blur(${blur}px)` : "none"; bg.drawImage(glc, 0, 0, W, H); bg.restore();
  };
  pass(n0, f0, bf, 1);
  pass(Math.max(n0, focus - slab), focus + slab, 0, 0);
  if (focus - slab > n0 + .001) pass(n0, focus - slab + .002, bn, 0);
  cam.near = n0; cam.far = f0; cam.updateProjectionMatrix();
}
function proj(v, c = cam) { const p = v.clone().project(c); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z]; }
function guardBox(b) { if (b && b[2] > 0 && b[0] < W && b[3] > 0 && b[1] < H && (b[2] - b[0]) > 30) S.CHARLOG.push(b); }
const FIT_TOP = 210, FIT_BOT = 1360;
function objPts(o) { o.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(o); const c = (y) => [V3(bb.min.x, y, bb.min.z), V3(bb.max.x, y, bb.min.z), V3(bb.min.x, y, bb.max.z), V3(bb.max.x, y, bb.max.z)];
  return { b: c(bb.min.y), t: c(bb.max.y) }; }
function fitB(items, yTop = FIT_TOP, yBot = FIT_BOT) {
  items = items.filter(Boolean); if (!items.length) return;
  const ang = y => Math.atan((1 - 2 * y / H) * Math.tan(cam.fov * Math.PI / 360));
  for (let pass = 0; pass < 3; pass++) {
    cam.updateMatrixWorld();
    const bs = items.map(i => i.box()).filter(Boolean); if (!bs.length) return;
    const top = Math.min(...bs.map(b => b[1])), bot = Math.max(...bs.map(b => b[3])), A = yBot - yTop;
    if (bot - top > A) { const c = items.reduce((m, i) => m.add(i.c()), V3(0, 0, 0)).multiplyScalar(1 / items.length);
      cam.position.copy(c.clone().add(cam.position.clone().sub(c).multiplyScalar((bot - top) / A * 1.03))); continue; }
    if (bot > yBot) cam.rotateX(-(ang(yBot) - ang(bot)));
    else if (top < yTop) cam.rotateX(ang(top) - ang(yTop));
  }
  cam.updateMatrixWorld();
}
const P_ = p => ({ box: () => p.g.visible ? p.box(cam, W, H) : null, c: () => p.g.position.clone().add(V3(0, .85 * (p.S || 1), 0)) });
function guardP(p) { if (p.g.visible) guardBox(p.box(cam, W, H)); }
function boxOf(obj) {
  obj.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(obj); if (bb.isEmpty()) return null;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) for (const z of [bb.min.z, bb.max.z]) {
    const [px, py, pz] = proj(V3(x, y, z)); if (pz > 1) return null; x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); }
  return [x0, y0, x1, y1];
}

// ---------------------------------------------------------------- 画像
function canvasTex(w, h, draw, rep = [1, 1]) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 16; return t;
}
const rnd = S.rng(13);
const woodTex = (base, dark, rep) => canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = base; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 140; i++) { x.strokeStyle = `rgba(${dark},${.05 + rnd() * .12})`; x.lineWidth = 1 + rnd() * 3; const y = rnd() * h;
    x.beginPath(); x.moveTo(0, y); for (let k = 0; k <= 8; k++) x.lineTo(k * w / 8, y + Math.sin(k * 1.3 + i) * 4 * rnd()); x.stroke(); }
}, rep);
const deskWood = woodTex("#5a3d26", "25,14,6", [2, 1]), floorWood = woodTex("#6a4a30", "30,18,8", [6, 6]), porchWood = woodTex("#8a6a4a", "40,26,12", [2, 2]);
const linoTex = canvasTex(512, 512, (x, w, h) => {   // 1950 年代の床（市松のリノリウム）
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { x.fillStyle = (r + c) % 2 ? "#4a4e48" : "#6a6c64"; x.fillRect(c * 64, r * 64, 64, 64); }
  for (let i = 0; i < 2000; i++) { x.fillStyle = `rgba(20,20,18,${.03 + rnd() * .05})`; x.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 3, 1); }
}, [10, 10]);
const wallTex = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = "#9aa39a"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) { x.fillStyle = `rgba(${rnd() < .5 ? "60,66,60" : "200,206,196"},${.03 + rnd() * .05})`; x.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 5, 1 + rnd() * 3); }
}, [6, 2]);
const boardTex = canvasTex(1024, 512, (x, w, h) => {   // 大学の黒板：楕円と軌道に関係する式（チョーク）
  x.fillStyle = "#1f2b24"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++) { x.fillStyle = `rgba(200,210,200,${.02 + rnd() * .03})`; x.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 10, 1); }
  x.fillStyle = "rgba(235,240,230,.88)"; x.font = "italic 46px serif";
  x.fillText("x² / a²  +  y² / b²  =  1", 60, 110); x.fillText("r = a (1 − e²) / (1 + e cos θ)", 60, 210);
  x.fillText("v² = GM (2 / r − 1 / a)", 60, 310);
  x.strokeStyle = "rgba(235,240,230,.8)"; x.lineWidth = 3; x.beginPath(); x.ellipse(800, 270, 150, 95, 0, 0, 6.283); x.stroke();
  x.beginPath(); x.arc(860, 270, 6, 0, 6.283); x.fill(); x.beginPath(); x.moveTo(800, 175); x.lineTo(800, 365); x.moveTo(650, 270); x.lineTo(950, 270); x.stroke();
});
// 計算用紙（数字が書き込まれていく：writeK、×で消して書き直す：fixK）。数字は演出用の例（実際の記録ではない）
const padC = document.createElement("canvas"); padC.width = 1024; padC.height = 1320;
const padTex = new THREE.CanvasTexture(padC); padTex.encoding = THREE.sRGBEncoding; padTex.anisotropy = 16;
const padRows = (() => { const r = S.rng(31), L = []; for (let i = 0; i < 28; i++) { const row = []; for (let c = 0; c < 4; c++) row.push((r() * (c === 0 ? 300 : 9999)).toFixed(c === 0 ? 0 : 3)); L.push(row); } return L; })();
let padDrawn = "";
function drawPad(writeK = 1, fixK = 0, curve = 0) {
  const key_ = [Math.round(writeK * 120), Math.round(fixK * 10), Math.round(curve * 40)].join(); if (key_ === padDrawn) return; padDrawn = key_;
  const x = padC.getContext("2d"), w = padC.width, h = padC.height, r = S.rng(41);
  x.fillStyle = "#e6e0cc"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) { x.fillStyle = `rgba(120,100,70,${.02 + r() * .04})`; x.fillRect(r() * w, r() * h, 1 + r() * 4, 1); }
  x.strokeStyle = "rgba(60,110,160,.35)"; x.lineWidth = 2; for (let i = 0; i < 30; i++) { x.beginPath(); x.moveTo(0, 120 + i * 40); x.lineTo(w, 120 + i * 40); x.stroke(); }
  x.strokeStyle = "rgba(180,60,60,.4)"; x.beginPath(); x.moveTo(110, 0); x.lineTo(110, h); x.stroke();
  x.fillStyle = "rgba(30,30,40,.88)"; x.font = "italic 30px serif";
  const total = padRows.length * 4, n = Math.round(writeK * total);
  for (let k = 0; k < n; k++) { const i = Math.floor(k / 4), c = k % 4, yy = 152 + i * 40;
    if (yy > h - 40) break;
    x.save(); x.translate(130 + c * 220, yy); x.rotate((r() - .5) * .03); x.fillText(padRows[i][c], 0, 0); x.restore(); }
  if (fixK > 0) {   // 間違いを線で消し、横に書き直す
    const yy = 152 + 9 * 40; x.strokeStyle = "rgba(30,30,40,.85)"; x.lineWidth = 3; x.beginPath(); x.moveTo(345, yy - 10); x.lineTo(345 + 140 * clamp(fixK * 2), yy - 10); x.stroke();
    if (fixK > .5) { x.fillStyle = "rgba(30,30,40,.9)"; x.fillText("4718.205", 560, yy - 34); }
  }
  if (curve > 0) {   // 軌道の曲線（図）
    x.strokeStyle = "rgba(30,30,40,.8)"; x.lineWidth = 3; x.beginPath();
    for (let i = 0; i <= 100 * curve; i++) { const a = i / 100 * 6.283; const px = 700 + 220 * Math.cos(a), py = 1000 + 140 * Math.sin(a); i ? x.lineTo(px, py) : x.moveTo(px, py); } x.stroke();
    x.beginPath(); x.arc(770, 1000, 40, 0, 6.283); x.stroke();
  }

}
drawPad(1);
const printTex = canvasTex(512, 1024, (x, w, h) => {   // 計算機の出力の紙（連続用紙、数字の列）
  x.fillStyle = "#e8ecdf"; x.fillRect(0, 0, w, h); x.fillStyle = "rgba(150,190,150,.35)"; for (let i = 0; i < 32; i += 2) x.fillRect(0, i * 32, w, 32);
  x.fillStyle = "#555"; for (let i = 0; i < 32; i++) { x.beginPath(); x.arc(14, 16 + i * 32, 5, 0, 6.283); x.fill(); x.beginPath(); x.arc(w - 14, 16 + i * 32, 5, 0, 6.283); x.fill(); }
  x.fillStyle = "rgba(20,20,30,.85)"; x.font = "22px monospace"; const r = S.rng(51);
  for (let i = 0; i < 30; i++) x.fillText(`${String(i * 30).padStart(4, "0")}  ${(r() * 9999).toFixed(3).padStart(9)}  ${(r() * 999).toFixed(4).padStart(9)}`, 40, 40 + i * 32);
});
const signTex = text_ => canvasTex(768, 128, (x, w, h) => { x.fillStyle = "#e8e4d6"; x.fillRect(0, 0, w, h); x.strokeStyle = "#333"; x.lineWidth = 6; x.strokeRect(6, 6, w - 12, h - 12);
  x.fillStyle = "#222"; x.font = `700 ${Math.min(52, Math.floor(1300 / text_.length))}px sans-serif`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(text_, w / 2, h / 2 + 2); });

// ---------------------------------------------------------------- 材質と形
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: C(c), roughness: .7, metalness: 0, ...o });
const steel = M(0xc8ced4, { roughness: .2, metalness: .95 });
const darkMetal = M(0x2a2e34, { roughness: .4, metalness: .7 });
const deskM = new THREE.MeshStandardMaterial({ map: deskWood, roughness: .6 });
const paperM = new THREE.MeshStandardMaterial({ map: padTex, roughness: .9 });
const glowMat = c => new THREE.MeshStandardMaterial({ color: C(0x111111), emissive: C(c), emissiveIntensity: 2.2 });
function box(w, h, d, mat, x = 0, y = 0, z = 0, parent) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; if (parent) parent.add(m); return m; }
function rbox(w, h, d, r, mat, x = 0, y = 0, z = 0, parent) {   // 角を丸めた箱（家具・機械）。CG らしい鋭い角を減らす
  const s = new THREE.Shape(), a = w / 2 - r, b = h / 2 - r;
  s.moveTo(-a, -h / 2); s.lineTo(a, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -b); s.lineTo(w / 2, b); s.quadraticCurveTo(w / 2, h / 2, a, h / 2); s.lineTo(-a, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, b); s.lineTo(-w / 2, -b); s.quadraticCurveTo(-w / 2, -h / 2, -a, -h / 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: d - 2 * r, bevelEnabled: true, bevelThickness: r, bevelSize: r * .9, bevelSegments: 3, curveSegments: 6 }); g.translate(0, 0, -(d - 2 * r) / 2);
  const m = new THREE.Mesh(g, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; if (parent) parent.add(m); return m;
}
function cyl(r, h, mat, x = 0, y = 0, z = 0, parent, rotZ = 0, seg = 32, r2 = null) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r2 ?? r, h, seg), mat); m.position.set(x, y, z); m.rotation.z = rotZ; m.castShadow = m.receiveShadow = true; if (parent) parent.add(m); return m; }
function plane(w, h, mat, parent, x = 0, y = 0, z = 0, ry = 0) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; if (parent) parent.add(m); return m; }
function floor(mat, parent, size = 40) { const f = new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat); f.rotation.x = -Math.PI / 2; f.receiveShadow = true; parent.add(f); return f; }

// ---------------------------------------------------------------- 人物（顔のない人形）と手
const SKIN_K = 0x7d5a44;   // キャサリンと西区域計算部門の女性たちの肌の色（褐色）
function person({ dress = null, hair = null, coat = null, scale = 1, skin = 0xd5dbe4, apron = false, shirt = null } = {}) {
  const p = S.mochi3D(THREE, { color: skin }); const P = p.parts;
  if (hair) {
    const hm = M(hair, { roughness: .75 });
    const crown = new THREE.Mesh(new THREE.SphereGeometry(.216, 32, 14, 0, 6.283, 0, .75), hm); crown.rotation.x = -.45; P.head.add(crown);
    const back = new THREE.Mesh(new THREE.SphereGeometry(.216, 32, 20, Math.PI, Math.PI, 0, 2.05), hm); P.head.add(back);
    for (const s of [-1, 1]) { const curl = new THREE.Mesh(new THREE.TorusGeometry(.07, .035, 12, 24), hm); curl.position.set(s * .17, .02, -.06); curl.rotation.y = Math.PI / 2; P.head.add(curl); }   // 1950 年代のまとめ髪
  }
  if (dress) {
    const dm = M(dress, { roughness: .85 });
    const skirt = new THREE.Mesh(new THREE.CylinderGeometry(.21, .32, .62, 32, 1, true), dm); skirt.position.y = .36; skirt.material.side = THREE.DoubleSide; P.body.add(skirt);
    const bod = new THREE.Mesh(new THREE.CapsuleGeometry(.245, .28, 8, 24), dm); bod.position.y = .3; bod.scale.set(1.04, 1, .92); P.hips.add(bod);
    const collar = new THREE.Mesh(new THREE.TorusGeometry(.13, .025, 8, 24), M(0xe8e4da, { roughness: .8 })); collar.rotation.x = Math.PI / 2; collar.position.y = .6; P.hips.add(collar);
    for (const a of [P.armL, P.armR]) { const sl = new THREE.Mesh(new THREE.CapsuleGeometry(.083, .2, 6, 16), dm); sl.position.y = -.12; a.a.add(sl); }
    for (const l of [P.legL, P.legR]) { const sh = new THREE.Mesh(new THREE.CapsuleGeometry(.06, .05, 6, 12), M(0x1a1612, { roughness: .4 })); sh.position.set(0, -.44, .03); sh.rotation.x = Math.PI / 2; l.a.add(sh); }
    [skirt, bod].forEach(o => { o.castShadow = o.receiveShadow = true; });
  }
  if (apron) { const ap = new THREE.Mesh(new THREE.PlaneGeometry(.34, .5), M(0xe0d8c4, { roughness: .9 })); ap.position.set(0, .45, .3); ap.rotation.x = -.15; P.body.add(ap); }
  if (coat || shirt) {
    const cm = M(coat || shirt, { roughness: .75 });
    const jk = new THREE.Mesh(new THREE.CapsuleGeometry(.27, .4, 8, 24), cm); jk.position.y = .27; jk.scale.set(1.06, 1, .97); P.hips.add(jk);
    for (const a of [P.armL, P.armR]) { const sl = new THREE.Mesh(new THREE.CapsuleGeometry(.084, .2, 6, 16), cm); sl.position.y = -.12; a.a.add(sl); }
    for (const l of [P.legL, P.legR]) { const tr = new THREE.Mesh(new THREE.CapsuleGeometry(.1, .22, 6, 16), M(0x2a2c30)); tr.position.y = -.14; l.a.add(tr); }
    if (shirt) { const tie = new THREE.Mesh(new THREE.BoxGeometry(.05, .26, .02), M(0x3a2a24)); tie.position.set(0, .4, .26); P.hips.add(tie); }
    jk.castShadow = true;
  }
  p.g.scale.setScalar(scale); p.S = scale;
  const pose0 = p.pose; p.pose = o => { pose0({ ...o, sx: scale, sy: scale }); };

// 軌道の線（2D、太さ 3px）：3D の線は 1.5 倍で描いて縮めると細すぎて消えた。地球の裏側に回る部分は描かない
