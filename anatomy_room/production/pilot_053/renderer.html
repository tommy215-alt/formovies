<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>pilot_053 renderer</title>
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0}
/* もしも設計：上にタイトルの帯（黒地に赤、TBAR）。3D の画は帯の半分だけ下げる（空の隕石が帯に隠れないように、下は地面が少し切れる） */
#stage canvas:not(#ui){top:218px}
</style>
</head><body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="ui" width="1080" height="1920"></canvas>
</div>
<script src="../common/vendor/three.min.js"></script>
<script src="../ext/vendor/three147/GLTFLoader.js"></script>
<script src="../ext/vendor/three147/RGBELoader.js"></script>
<script src="../ext/vendor/three147/Pass.js"></script>
<script src="../ext/vendor/three147/EffectComposer.js"></script>
<script src="../ext/vendor/three147/RenderPass.js"></script>
<script src="../ext/vendor/three147/ShaderPass.js"></script>
<script src="../ext/vendor/three147/CopyShader.js"></script>
<script src="../ext/vendor/three147/SimplexNoise.js"></script>
<script src="../ext/vendor/three147/SSAOShader.js"></script>
<script src="../ext/vendor/three147/SSAOPass.js"></script>
<script src="../ext/vendor/three147/BokehShader.js"></script>
<script src="../ext/vendor/three147/BokehPass.js"></script>
<script src="../common/stage.js"></script>
<script src="../common/cine.js"></script>
<script src="../ext/hud_ext.js"></script>
<script src="assets/assets.js"></script>
<script src="assets/plan.js"></script>
<script src="../ext/kit/scene_assets.js"></script>
<script src="../ext/kit/kit.js"></script>
<script src="../ext/kit/shots.js"></script>
<script src="work/blender/index.js"></script>
<script src="../ext/blender/blframes.js"></script>
<script>
// pilot_053 のレンダラー（もしも設計の既定、templates/DESIGN_MODES.md。土台は pilot_052）。日本の観測史上最大の記録が、東京で同時に起きたら？
// ナレーションなし：情報はすべてポップアップ（左上の札・出来事の札・大きな札）。ショットと出来事は plan.py（assets/plan.js）。
// 3D は Blender（blender/scene.py）。数字は計算の結果（scripts/pilot_053/sim/disaster.json）。上にタイトルの帯（黒地に赤、Dela Gothic One）。
const PL = window.PLAN, SH = {}; PL.shots.forEach(s => SH[s.id] = s);
const IDS = PL.shots.map(s => s.id), SIM = PL.sim;
Object.assign(KIT, { design: "intel", scenes: ["open", "l01"], images: [], ci: {}, hits: [],
  opening: { img: null, bg: blShot("l00"), title: ["観測史上最大が", "東京で全部同時に起きたら？"], size1: 84, size2: 104, credit: [] } });
SHOTS = IDS.slice(1).map(k => k === "l02" ? { at: k, kind: "2d", draw: houseShot } : { at: k, kind: "3d", draw: blShot(k) });
S.docSub = () => {};   // 字幕なし（ナレーションがない）

// ---------------------------------------------------------------- 猫の数（plan の n を補間）
function curId(t) { let k = IDS[0]; for (const id of IDS) if (CUE[id] !== undefined && t >= CUE[id]) k = id; return k; }
function cAt(k, t) { const s = SH[k], u = clamp(t / s.dur), c = s.c;
  for (let i = 0; i < c.length - 1; i++) { const [u0, c0] = c[i], [u1, c1] = c[i + 1]; if (u <= u1 || i === c.length - 2) return c0 + (c1 - c0) * clamp((u - u0) / Math.max(1e-9, u1 - u0)); }
  return c[c.length - 1][1]; }
function cNow(t) { const k = curId(t); return cAt(k, t - CUE[k]); }
const snowH = c => Math.max(0, PL.snow * (1 - c / PL.melt_h)), waterH = c => Math.min(PL.water_end, (SIM.inflow_mm_h / 1000 - .05) * c);
function stamp(e) { return ""; }

// ---------------------------------------------------------------- 左上：経過・気温・雪・水
function statusUI(t) {
  const k = curId(t); if (["l00", "l01", "l02", "l08", "l09"].includes(k)) return;
  const c = cNow(t), x0 = 40, y0 = TBAR + 24, w = 560, h = 268, sh = snowH(c), wh = waterH(c), lake = sh < wh;
  ui.save(); ui.translate(x0, y0);
  ui.fillStyle = "rgba(6,10,16,.84)"; rrect(ui, 0, 0, w, h, 18); ui.fill(); ui.strokeStyle = "rgba(255,120,80,.8)"; ui.lineWidth = 3; rrect(ui, 0, 0, w, h, 18); ui.stroke();
  ui.fillStyle = "#FF7850"; ui.fillRect(0, 20, 8, h - 40);
  S.group(() => {
    const row = (i, l, v, col) => { text(ui, l, 36, 52 + i * 60, 32, "#FFD0B8", { weight: 800, align: "left" }); text(ui, v, w - 32, 52 + i * 60, 44, col, { weight: 900, align: "right" }); };
    row(0, "経過", `${Math.floor(c)}時間${String(Math.floor(c % 1 * 60)).padStart(2, "0")}分`, "#FFFFFF");
    row(1, "気温", "41.8℃", "#FF6A4C");
    row(2, "雪の深さ", lake ? "水の下" : `${sh.toFixed(1)}m`, "#EAF4FF");
    row(3, "水の深さ", `${wh.toFixed(1)}m`, "#7FD0FF");
  }, [x0, y0, x0 + w, y0 + h]);
  ui.restore();
}

// ---------------------------------------------------------------- l02：2 階建ての家の断面と雪（模式の図）
function houseShot(t, u) {
  bg.fillStyle = "#EEF3F8"; bg.fillRect(0, 0, W, H);
  const g = 1420, px = 52, sw = PL.snow * px, k = easeOut(clamp(u * 1.6)), sinkK = easeInOut(clamp((u - .55) / .25));   // 1 m ＝ 52 px
  bg.fillStyle = "#8C7B66"; bg.fillRect(0, g, W, 40);
  bg.fillStyle = "#FFFFFF"; bg.fillRect(0, g - sw * k, W, sw * k); bg.strokeStyle = "#B8C8DA"; bg.lineWidth = 3; bg.beginPath(); bg.moveTo(0, g - sw * k); bg.lineTo(W, g - sw * k); bg.stroke();
  const hx = 360, hw = 360, hh = 6 * px, roof = 2.2 * px, drop = sinkK * 1.2 * px;
  bg.fillStyle = "rgba(120,100,80,.25)"; bg.strokeStyle = "#5A4632"; bg.lineWidth = 6; bg.fillRect(hx, g - hh + drop * .4, hw, hh - drop * .4); bg.strokeRect(hx, g - hh + drop * .4, hw, hh - drop * .4);
  bg.beginPath(); bg.moveTo(hx - 30, g - hh + drop); bg.lineTo(hx + hw / 2, g - hh - roof + drop * 1.6); bg.lineTo(hx + hw + 30, g - hh + drop); bg.closePath(); bg.fillStyle = "rgba(90,70,60,.45)"; bg.fill(); bg.stroke();
  S.group(() => {
    const yTop = g - sw * k; bg.strokeStyle = "#34506E"; bg.lineWidth = 4; bg.beginPath(); bg.moveTo(820, g); bg.lineTo(820, yTop); bg.stroke();
    if (k > .3) text(bg, `${PL.snow.toFixed(2)}m`, 760, yTop - 40, 54, "#34506E", { weight: 900 });
    for (let i = 0; i < 5; i++) { const ax = hx + 40 + i * 70, ay = g - hh - roof - 120 + 30 * Math.sin(t * 3 + i); if (u > .3) { bg.fillStyle = "#D8442C"; bg.beginPath(); bg.moveTo(ax, ay + 60); bg.lineTo(ax - 16, ay + 30); bg.lineTo(ax + 16, ay + 30); bg.fill(); bg.fillRect(ax - 5, ay - 10, 10, 40); } }
    text(bg, "2階建ての家", hx + hw / 2, g - hh / 2, 40, "#5A4632", { weight: 800 });
  });
}

// ---------------------------------------------------------------- 下：出来事の札
const TAGC0 = { S: ["雪", "#EAF4FF"], T: ["暑さ", "#FF6A4C"], R: ["雨", "#7FD0FF"], W: ["風", "#B8F0C8"], Q: ["地震", "#FFB84C"], C: ["比べると", "#B38CFF"] };
const TAGC = new Proxy({}, { get: (_, k) => { const [n, c] = TAGC0[k[0]]; return [k.endsWith("?") ? n + "（予想）" : n, c]; } });
const EVS = []; PL.shots.forEach(s => (s.ev || []).forEach((e, j) => EVS.push({ at: s.id, off: e[0], s: e[1], kind: e[2] })));
function evTime(e) { return CUE[e.at] + e.off; }
function eventsUI(t) {
  if (t >= CUE.l08) return;
  const live = EVS.filter(e => t >= evTime(e) && t < evTime(e) + 4.6).slice(-3), y1 = 1560, hh = 112, gap = 14;
  live.forEach((e, i) => {
    const u = t - evTime(e), k = easeOut(clamp(u / .25)) * (1 - clamp((u - 4.2) / .4)), y = y1 - (live.length - i) * (hh + gap) + hh / 2, x0 = 40 - 60 * (1 - k);
    const [tg, tc] = TAGC[e.kind];
    ui.save(); ui.globalAlpha *= k; ui.font = `800 44px ${S.FONT}`; const tw = Math.min(760, ui.measureText(e.s).width), w = Math.max(560, tw + 120);
    const pop = 1 + .12 * Math.pow(1 - clamp(u / .18), 2); ui.translate(x0, y); ui.scale(pop, pop); ui.translate(-x0, -y);
    ui.fillStyle = "rgba(6,10,16,.84)"; rrect(ui, x0, y - hh / 2, w, hh, 14); ui.fill(); ui.fillStyle = tc; ui.fillRect(x0, y - hh / 2 + 12, 7, hh - 24);
    S.group(() => {
      const sw_ = -18, gw = (ui.font = `700 26px ${S.FONT}`, ui.measureText(tg).width) + 24;
      ui.fillStyle = tc; rrect(ui, x0 + 48 + sw_, y - 42, gw, 36, 6); ui.fill(); text(ui, tg, x0 + 48 + sw_ + gw / 2, y - 23, 26, "#0A0E14", { weight: 700 });
      const sz = tw > 720 ? Math.floor(44 * 720 / tw) : 44; text(ui, e.s, x0 + 30, y + 24, sz, "#FFFFFF", { weight: 800, align: "left" });
    }, [x0, y - hh / 2, x0 + w, y + hh / 2]);
    ui.restore();
  });
}

// ---------------------------------------------------------------- 大きな札：両者の紹介・作戦・結果
const CARDS = {
  spec: { title: "観測史上 1位を 全部 東京に", col: "#FF7850", rows: [["最高気温", "41.8℃"], ["積雪", "11.82m"], ["雨", "1時間 153mm"], ["風", "72.5m/s"], ["震度", "7"]] } };
function bigCard(t, id) {
  const cd = CARDS[id], a = CUE[`card_${curId(t)}`]; if (a === undefined) return; const u = t - a, k = easeOut(clamp(u / .3)), end = CUE[IDS[IDS.indexOf(curId(t)) + 1]] - .25, ko = 1 - clamp((t - end) / .25);
  const x0 = 60, w = 960, rh = 104, y0 = TBAR + 60, h = 140 + cd.rows.length * rh;
  ui.save(); ui.globalAlpha *= k * ko; const pop = 1 + .1 * Math.pow(1 - clamp(u / .22), 2); ui.translate(540, y0 + h / 2); ui.scale(pop, pop); ui.translate(-540, -y0 - h / 2);
  ui.fillStyle = "rgba(6,10,18,.88)"; rrect(ui, x0, y0, w, h, 16); ui.fill(); ui.strokeStyle = cd.col; ui.lineWidth = 3; rrect(ui, x0, y0, w, h, 16); ui.stroke();
  ui.fillStyle = cd.col; ui.fillRect(x0, y0 + 18, 10, 76);
  S.group(() => {
    text(ui, cd.title, x0 + 44, y0 + 58, 56, "#FFFFFF", { weight: 700, align: "left" });
    cd.rows.forEach(([l, r], i) => { const ru = u - .35 - i * .45, rk = easeOut(clamp(ru / .22)); if (rk <= 0) return; const y = y0 + 150 + i * rh, dx = 30 * (1 - rk);
      ui.save(); ui.globalAlpha *= rk; ui.fillStyle = "rgba(255,255,255,.07)"; rrect(ui, x0 + 26 + dx, y - 44, w - 52, 88, 10); ui.fill();
      text(ui, l, x0 + 56 + dx, y + 2, 38, cd.col, { weight: 700, align: "left" }); text(ui, r, x0 + 290 + dx, y + 2, 48, "#FFFFFF", { weight: 700, align: "left" });
      ui.restore(); });
  }, [x0, y0, x0 + w, y0 + h]);
  ui.restore();
}
function shoutCard(t, a, l1, l2, c1, c2, sub) {   // 画面の中央に大きな文字（少し遅れて 2 行目、さらに小さな 3 行目）
  const u = t - a; if (u < 0) return; const k = easeOut(clamp(u / .45)), k2 = easeOut(clamp((u - .45) / .45)), k3 = easeOut(clamp((u - 1.1) / .45));
  ui.save(); ui.globalAlpha *= k; S.group(() => text(ui, l1, 540, 820, 92, c1, { weight: 700, stroke: "#05080c", sw: 14 })); ui.restore();
  ui.save(); ui.globalAlpha *= k2; ui.translate(540, 970); ui.scale(1 + .25 * (1 - k2), 1 + .25 * (1 - k2)); S.group(() => text(ui, l2, 0, 0, 112, c2, { weight: 700, stroke: "#05080c", sw: 16 })); ui.restore();
  if (sub) { ui.save(); ui.globalAlpha *= k3; S.group(() => sub.forEach((s, i) => text(ui, s, 540, 1110 + i * 64, 50, "#EAF2F8", { weight: 700, stroke: "#05080c", sw: 10 }))); ui.restore(); }
}
// ---------------------------------------------------------------- 上：タイトルの帯（もしも設計の既定：黒地に赤、Dela Gothic One、最初から最後まで）
const TBAR = 436;   // 2026-11-10 ユーザー「タイトル帯をあと 5% 下げて」→ 帯を 96px 高くして文字を 96px 下げた
function fitText(s, size, maxw) { ui.font = `400 ${size}px TitleBlack`; const w = ui.measureText(s).width; return w > maxw ? Math.floor(size * maxw / w) : size; }
function titleBar() {
  ui.save(); ui.fillStyle = "#000"; ui.fillRect(0, 0, W, TBAR);
  const [l1, l2] = KIT.opening.title, s1 = fitText(l1, 92, 1000), s2 = fitText(l2, 104, 1000);
  S.group(() => { ui.fillStyle = "#FF2A2A"; ui.textAlign = "center"; ui.textBaseline = "middle";
    ui.font = `400 ${s1}px TitleBlack`; ui.fillText(l1, 540, 236); ui.font = `400 ${s2}px TitleBlack`; ui.fillText(l2, 540, 354); }, [0, 0, W, TBAR]);   // 2026-11-10 全画面で上が少し見切れる → 22px 下げた
  ui.restore();
}
{ const _du = drawUI; drawUI = function (t, name) { titleBar(); if (name === "open") return;
  const k = curId(t); statusUI(t); eventsUI(t);
  if (k === "l01") bigCard(t, "spec");
  if (k === "l08") shoutCard(t, CUE.l08 + .2, `水深 ${PL.water_end.toFixed(1)}m`, "東京が 湖に", "#EAF2F8", "#7FD0FF", ["一番こわいのは 暑さ×大雪"]); }; }

function buildMood() { MOOD = [[0, { cool: .0, sat: 1.05, vig: .22 }]]; }
function thumb() { CUE = CUE || {}; CUE.t0 = 0; bg.fillStyle = "#0c1018"; bg.fillRect(0, 0, W, H); S.group(() => { text(ui, "観測史上最大が", 540, 450, 100, "#EAF2F8", { weight: 700, stroke: "#05080c", sw: 14 }); text(ui, "全部同時に", 540, 600, 110, "#FF7850", { weight: 700, stroke: "#05080c", sw: 16 }); }); }

// 書体：BIZ UDPゴシック Bold（OFL、assets/make_assets.py で埋め込み）
const bizReady = window.ASSETS.font_biz ? new FontFace("Noto Sans CJK JP", b64buf(window.ASSETS.font_biz), { weight: "100 900" }).load().then(f => document.fonts.add(f)) : Promise.resolve();
const titleReady = window.ASSETS.font_title ? new FontFace("TitleBlack", b64buf(window.ASSETS.font_title), { weight: "400" }).load().then(f => document.fonts.add(f)) : Promise.resolve();
kitStart(() => {}); window.READY = Promise.all([window.READY, bizReady, titleReady]); BL.install();
</script>
</body></html>
