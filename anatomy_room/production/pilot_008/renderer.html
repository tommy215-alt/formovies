<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>pilot_008 renderer</title>
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0}
</style>
</head><body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="ui" width="1080" height="1920"></canvas>
</div>
<script src="../common/vendor/three.min.js"></script>
<script src="../common/stage.js"></script>
<script src="../common/ending.js"></script>
<script>
// pilot_008「298円と300円。その2円に騙されるな」のレンダラー（2D）。renderFrame(t) が時刻 t の 1 コマを描く（決定的）。
// 商品・店・メニューはすべて架空。「安く感じる度」のメーターは演出上のイメージ（研究の測定値ではない）。
const S = Stage, { W, H, C, clamp, lerp, easeOut, easeIn, easeInOut, back, prog, win, text, pill, note, rrect } = Stage;
const bg = document.getElementById("bg").getContext("2d");
const ui = document.getElementById("ui").getContext("2d");
const SCN = ["cold", "hook", "rain", "left", "same", "menu", "caveat", "rule", "final"];
let TL, CUE;
const TAG = "#E8312A";

// ---------------------------------------------------------------- 部品
function shelfBG(ctx, t) {
  S.gradientBG(ctx, "#FFFDF4", "#FFF3C9", "#FFE79A");
  // 棚板とお菓子の袋（架空）
  const cols = ["#FF7A2A", "#3E6FD8", "#20B26B", "#E8312A", "#7B5CFF", "#FFC83D"];
  for (const y of [420, 760]) {
    for (let i = 0; i < 8; i++) {
      const x = 40 + i * 132, c = cols[(i + (y > 500 ? 3 : 0)) % cols.length];
      ctx.fillStyle = c; rrect(ctx, x, y - 200, 112, 190, 18); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.ellipse(x + 56, y - 110, 34, 26, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = "#C88B3A"; ctx.fillRect(0, y, W, 28); ctx.fillStyle = "#E7B66A"; ctx.fillRect(0, y, W, 10);
  }
}
function bag(ctx, x, y, s, col, label = "さくさくチップ") {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = "rgba(0,0,0,.18)"; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-110, -150); ctx.lineTo(110, -150); ctx.lineTo(120, 150); ctx.lineTo(-120, 150); ctx.closePath(); ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.fillStyle = "rgba(0,0,0,.12)"; ctx.fillRect(-110, -150, 220, 26); ctx.fillRect(-120, 124, 240, 26);
  ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.ellipse(0, 10, 80, 58, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#FFC83D"; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.ellipse(-36 + i * 18, 14 + (i % 2) * 10, 20, 12, i, 0, 7); ctx.fill(); }
  text(ctx, label, 0, -90, 36, "#FFFFFF", { weight: 900 });
  ctx.restore();
}
function tag(ctx, x, y, s, price, k = 1, rot = 0, col = TAG) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); const sc = s * back(k); ctx.scale(sc, sc);
  ctx.shadowColor = "rgba(0,0,0,.2)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
  ctx.fillStyle = "#FFFFFF"; rrect(ctx, -150, -70, 300, 140, 18); ctx.fill(); ctx.shadowColor = "transparent";
  ctx.fillStyle = col; rrect(ctx, -150, -70, 300, 36, 18); ctx.fill(); ctx.fillRect(-150, -50, 300, 16);
  S.group(() => text(ctx, "税込", -100, -52, 30, "#FFFFFF", { weight: 800 }));
  ctx.font = `900 82px ${S.FONT}`; const pw = ctx.measureText(price).width;
  text(ctx, price, -14, 22, 82, col, { weight: 900 });
  text(ctx, "円", -14 + pw / 2 + 26, 36, 40, col, { weight: 900 });
  ctx.restore();
}
function basket(ctx, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = "#1F5E9C"; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(0, -40, 90, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = "#3E8EDE"; ctx.beginPath(); ctx.moveTo(-120, -40); ctx.lineTo(120, -40); ctx.lineTo(95, 70); ctx.lineTo(-95, 70); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 6; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 40, -30); ctx.lineTo(i * 34, 60); ctx.stroke(); }
  ctx.restore();
}
function uraWipe(t, expr, extra = {}) {
  const sp = S.speaking(t, "W");
  S.wipe(ui, t, "W", extra.x ?? 930, extra.y ?? 300, extra.r ?? 105, { expr: sp ? expr : (extra.idle || "smirk"), pop: extra.pop ?? 1 });
}
function om(t, x, y, s, o) { S.omote(ui, x, y, s, { talk: S.talk(t, "M"), ...o }); }
// 大きな数字（左端の桁を強調できる）
function bigNumber(ctx, str, cx, cy, size, col, emphK = 0, fadeK = 0) {
  S.group(() => bigNumber_(ctx, str, cx, cy, size, col, emphK, fadeK)); // 1 つの数字（桁ごとに描くが、ひとまとまりとして検査する）
}
function bigNumber_(ctx, str, cx, cy, size, col, emphK, fadeK) {
  ctx.save(); ctx.font = `900 ${size}px ${S.FONT}`;
  const ws = [...str].map(ch => ctx.measureText(ch).width), tot = ws.reduce((a, b) => a + b, 0);
  let x = cx - tot / 2;
  [...str].forEach((ch, i) => {
    const first = i === 0, sc = first ? 1 + .45 * emphK : 1 - .25 * fadeK, al = first ? 1 : 1 - .6 * fadeK;
    ctx.save(); ctx.translate(x + ws[i] / 2, cy); ctx.scale(sc, sc);
    text(ctx, ch, 0, 0, size, first && emphK > 0 ? C.orange : col, { weight: 900, alpha: al, stroke: "#FFFFFF", sw: 14 });
    ctx.restore(); x += ws[i];
  });
  ctx.restore();
}
function meter(ctx, cx, cy, v, label, k = 1) {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k;
  ctx.fillStyle = "#FFFFFF"; rrect(ctx, cx - 260, cy - 190, 520, 270, 36); ctx.fill();
  const r = 180;
  for (let i = 0; i < 3; i++) { ctx.strokeStyle = ["#9CD7FF", "#FFD27A", "#FF8F7A"][i]; ctx.lineWidth = 36; ctx.beginPath(); ctx.arc(cx, cy + 40, r - 40, Math.PI + i * Math.PI / 3, Math.PI + (i + 1) * Math.PI / 3); ctx.stroke(); }
  const an = Math.PI + clamp(v) * Math.PI;
  ctx.strokeStyle = C.navy2; ctx.lineWidth = 12; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(cx, cy + 40); ctx.lineTo(cx + Math.cos(an) * (r - 60), cy + 40 + Math.sin(an) * (r - 60)); ctx.stroke();
  ctx.fillStyle = C.navy2; ctx.beginPath(); ctx.arc(cx, cy + 40, 18, 0, 7); ctx.fill();
  text(ctx, label, cx, cy - 150, 34, C.navy2, { weight: 900 });
  ctx.restore();
}

// ---------------------------------------------------------------- 場面
function drawScene(t, name) {
  const [a, b] = S.sceneRange(name), lt = t - a;
  if (name === "cold") {
    coldScene(t);
  } else if (name === "hook") {
    shelfBG(bg, t);
    const q = back(prog(t, a, .25)) * (1 - prog(t, CUE.basket - .1, .3));
    if (q > 0) { ui.save(); ui.translate(540, 600); ui.scale(q, q); text(ui, "2円で安く感じる!?", 0, 0, 96, "#FFFFFF", { weight: 900, stroke: "#0A1022", sw: 18 }); ui.restore(); }
    // 298 と 300：同じお菓子に、値札がドン
    bag(bg, 420, 900, .8, "#FF7A2A"); bag(bg, 800, 900, .8, "#FF7A2A");
    const k1 = prog(t, .15, .35), k2 = prog(t, .45, .35);
    const inBasket = easeInOut(prog(t, CUE.basket, .6));
    if (inBasket < 1) tag(ui, 420, 1110, .9, "298", k1);
    tag(ui, 800, 1110, .9, "300", k2);
    text(ui, "たった 2 円の差", 540, 600, 64, C.navy2, { weight: 900, alpha: easeOut(prog(t, CUE.basket + .15, .4)) * (1 - prog(t, CUE.dare, .3)), stroke: "#FFFFFF", sw: 12 });
    // オモテ：298 円をカゴへ
    const ox = 150;
    om(t, ox, 1335, .5, { expr: t > CUE.jab0 ? (S.speaking(t, "M") ? "smug" : "shock") : t > CUE.basket ? "happy" : "think",
      armR: lerp(1.0, 2.2, inBasket), elbowR: .4, look: [1, -.4] });
    basket(ui, ox + 105, 1190, .42);
    if (inBasket > 0) { ui.save(); ui.__noCheck = true; ui.translate(lerp(420, ox + 105, inBasket), lerp(900, 1150, inBasket)); bag(ui, 0, 0, lerp(.8, .28, inBasket), "#FF7A2A"); ui.__noCheck = false; ui.restore(); }
    // ウラが指を鳴らす → 「ウラ商店（実験中）」の看板
    const sg = easeOut(prog(t, CUE.dare + .1, .5));
    if (sg > 0) {
      ui.save(); ui.translate(540, lerp(-200, 330, sg)); ui.rotate(-.03 + .03 * Math.sin(t * 3));
      ui.fillStyle = C.ura; rrect(ui, -330, -70, 660, 140, 30); ui.fill();
      text(ui, "ウラ商店（実験中）", 0, 4, 64, "#FFFFFF", { weight: 900 }); ui.restore();
      S.burst(ui, 860, 470, 70, prog(t, CUE.dare, .25) * (1 - prog(t, CUE.dare + .5, .2)), "パチン", { size: 30, fill: "#FFFFFF", stroke: C.ura, color: C.ura });
    }
    uraWipe(t, t > CUE.jab0 ? "amused" : "smirk", { y: 520 });
  } else if (name === "rain") {
    S.gradientBG(bg, "#FFF7D6", "#FFE08A", "#FFC94A");
    S.rays(bg, 540, 800, t, "rgba(255,255,255,.25)");
    const calm = easeOut(prog(t, CUE.calm, .5));
    const prices = ["298", "498", "980", "1,980", "198", "2,980", "398", "98", "4,980"];
    const r = S.rng(21);
    ui.__noCheck = true; // 降ってくる値札は背景の飾り（主要な文字はこの上に描く）
    for (let i = 0; i < 26; i++) {
      const x = 60 + r() * 960, sp = 500 + r() * 500, ph = r() * 3, rot = (r() - .5) * 1.4;
      const y = ((lt + ph) * sp) % 2200 - 200;
      const pi = Math.floor((lt * 3 + i) % prices.length);
      ui.save(); ui.globalAlpha = 1 - .75 * calm;
      tag(ui, x, y, .55 + r() * .2, prices[(pi + i) % prices.length], 1, rot + Math.sin(lt * 4 + i) * .3);
      ui.restore();
    }
    ui.__noCheck = false;
    const spin = Math.sin(lt * 7) * .25 * (1 - calm);
    om(t, 540, 1360, .75, { expr: calm > .5 ? "deadpan" : "dizzy", rot: spin, armL: 2.4 * (1 - calm) + .3, armR: 2.4 * (1 - calm) + .3, sweat: calm < .5 });
    if (t >= CUE.flip && calm < 1) S.burst(ui, 540, 520, 200, prog(t, CUE.flip, .3) * (1 - calm), "全部安い!?", { size: 64 });
    if (calm > 0) { pill(ui, "見せ方 ≠ 本当に得", 540, 520, 60, "#FFFFFF", C.ura, calm); }
    uraWipe(t, "smirk");
  } else if (name === "left") {
    leftScene(t, a, lt);
  } else if (name === "same") {
    sameScene(t, a, lt);
  } else if (name === "menu") {
    menuScene(t, a, lt);
  } else if (name === "caveat") {
    caveatScene(t, a, lt);
  } else if (name === "rule") {
    S.gradientBG(bg, "#F0FFF7", "#C9F5DE", "#A8EDC9");
    tag(bg, 540, 760, 2.0, "1,980", 1);
    const mk = easeInOut(prog(t, a + .3, 2.2));
    // 虫めがねが左端から最後の桁まで
    const mx = lerp(300, 780, mk);
    ui.save(); ui.strokeStyle = C.navy2; ui.lineWidth = 18; ui.beginPath(); ui.arc(mx, 780, 120, 0, 7); ui.stroke();
    ui.fillStyle = "rgba(255,255,255,.25)"; ui.fill(); ui.lineWidth = 28; ui.lineCap = "round";
    ui.beginPath(); ui.moveTo(mx + 85, 865); ui.lineTo(mx + 190, 980); ui.stroke(); ui.restore();
    pill(ui, "左端だけじゃなく、最後の桁まで", 495, 1080, 46, "#FFFFFF", C.green, easeOut(prog(t, a + .4, .4)));
    om(t, 930, 1360, .5, { expr: "think", armL: .3, look: [-1, -.6] }); // 下の札（x 130〜860）にかからない右側
    uraWipe(t, "excited");
  } else if (name === "final") {
    finalScene(t, a, lt);
  }
}

// 冒頭のつかみ（0〜1.5 秒、セリフなし）：巨大な「298」が叩きつけられ、大量の値札が噴き出してオモテを追い詰める
function coldScene(t) {
  S.gradientBG(bg, "#FFF3E0", "#FFE0C0", "#FFD0A0");
  const k = back(prog(t, .02, .22));
  const shake = 18 * Math.exp(-Math.max(0, t - .05) / .12);
  ui.save(); ui.translate(540 + shake * Math.sin(t * 90), 620); ui.scale(k * lerp(1.25, 1, easeOut(prog(t, .05, .5))), k * lerp(1.25, 1, easeOut(prog(t, .05, .5))));
  S.group(() => { text(ui, "298", 0, 0, 380, TAG, { weight: 900, stroke: "#FFFFFF", sw: 26 }); text(ui, "円", 330, 80, 120, TAG, { weight: 900, stroke: "#FFFFFF", sw: 14 }); });
  ui.restore();
  // 値札が噴き出して、オモテのまわりに集まる
  const r = S.rng(31), prices = ["298", "498", "980", "1,980", "198", "2,980", "398", "98"];
  const ox = lerp(760, 880, easeOut(prog(t, .4, .6)));
  ui.__noCheck = true; // 噴き出す値札は飾り
  for (let i = 0; i < 26; i++) {
    const d = .35 + r() * .25, kk = easeOut(prog(t, d, .7)), an = r() * 6.28, rr = 120 + r() * 160;
    if (kk <= 0) continue;
    const x = lerp(540, ox + Math.cos(an + t * 2) * rr, kk), y = lerp(620, 1080 + Math.sin(an + t * 2) * rr * .7, kk);
    tag(ui, x, y, .5, prices[i % prices.length], 1, Math.sin(t * 6 + i) * .5);
  }
  ui.__noCheck = false;
  om(t, ox, 1335, .58, { expr: t > .4 ? "panic" : "shock", armL: 2.4, armR: 2.4, sx: lerp(1, .9, prog(t, .6, .4)), sweat: t > .5, look: [-1, -.6] });
  S.speedLines(ui, 540, 620, t, "rgba(255,255,255,.7)", 48, 300);
  S.flash(ui, .6 * (1 - prog(t, 0, .12)));
  S.glitch(ui, t, prog(t, 1.2, .3), 11);
}
function leftScene(t, a, lt) {
  S.gradientBG(bg, "#FFFFFF", "#FFF1E0", "#FFE2C2");
  S.dots(bg, "rgba(255,122,42,.12)");
  const key = easeOut(prog(t, CUE.key, .4)), scan = prog(t, CUE.scanline, 1.4), bk = easeInOut(prog(t, CUE.bucket, 1.0));
  const emph = easeOut(prog(t, CUE.scanline + .5, .5));
  // 2 つの数字（298 / 300）。bucket で箱へ落ちる
  const y1 = lerp(500, 1060, bk), y2 = lerp(900, 1060, bk), x1 = lerp(540, 300, bk), x2 = lerp(540, 760, bk), sz = lerp(240, 130, bk);
  if (bk > 0) {
    for (const [x, lab, col] of [[300, "200円台", "#3E6FD8"], [760, "300円台", TAG]]) {
      ui.fillStyle = "#FFFFFF"; rrect(ui, x - 190, 900, 380, 300, 36); ui.fill(); ui.strokeStyle = col; ui.lineWidth = 10; ui.stroke();
      pill(ui, lab, x, 880, 46, "#FFFFFF", col, bk);
    }
  }
  bigNumber(ui, "298", x1, y1, sz, "#3E6FD8", emph, emph * (1 - bk));
  bigNumber(ui, "300", x2, y2, sz, TAG, emph, emph * (1 - bk));
  if (key > 0 && bk < .3) {
    ui.save(); ui.globalAlpha = key * (1 - bk / .3); ui.strokeStyle = C.orange; ui.lineWidth = 10;
    rrect(ui, 540 - 220, 420, 160, 600, 30); ui.stroke(); ui.restore();
    pill(ui, "いちばん左の数字", 400, 1200, 42, "#FFFFFF", C.orange, key * (1 - bk / .3));
  }
  // 視線（左 → 右）
  if (scan > 0 && scan < 1) {
    const ex = lerp(300, 820, scan);
    S.arrow(ui, 260, 360, ex, 360, "rgba(14,26,48,.75)", 12, 36);
    ui.fillStyle = "#FFFFFF"; ui.beginPath(); ui.ellipse(ex + 50, 360, 48, 30, 0, 0, 7); ui.fill();
    ui.strokeStyle = C.navy2; ui.lineWidth = 6; ui.stroke(); ui.fillStyle = C.navy2; ui.beginPath(); ui.arc(ex + 58, 360, 15, 0, 7); ui.fill();
    text(ui, "数字は左から読む", 540, 290, 44, C.navy2, { weight: 900 });
  }
  const nm = easeOut(prog(t, CUE.name, .4));
  if (nm > 0) { pill(ui, "左端の数字効果", 540, 560, 74, "#FFFFFF", C.ura, nm); note(ui, "Thomas & Morwitz（2005）ほか", 540, 660, nm, 30); }
  om(t, 950, 1360, .44, { expr: t > CUE.bucket ? "happy" : t > CUE.key ? "shock" : "smug", armL: t > CUE.bucket ? 2.6 : .3, look: [-1, -.6] });
  uraWipe(t, t > CUE.name ? "excited" : "smirk");
}

function sameScene(t, a, lt) {
  S.gradientBG(bg, "#F2F8FF", "#D9EBFF", "#C3DEFF");
  const cross = t >= CUE.cross, ck = easeInOut(prog(t, CUE.cross, .5));
  tag(ui, 300, 520, 1.15, cross ? "300" : "299", easeOut(prog(t, a + .1, .35)));
  tag(ui, 780, 520, 1.15, "298", easeOut(prog(t, a + .3, .35)));
  text(ui, "vs", 540, 520, 64, C.navy2, { weight: 900 });
  const v = cross ? lerp(.08, .85, ck) : .08 + .03 * Math.sin(t * 9);
  meter(ui, 540, 960, v, "298円が「安く感じる」度", easeOut(prog(t, CUE.flat - .3, .4)));
  if (t >= CUE.flat && !cross) pill(ui, "左端が同じ → ほぼ差なし", 540, 1130, 46, "#FFFFFF", "#3E6FD8", easeOut(prog(t, CUE.flat + .2, .3)));
  if (cross) pill(ui, "左端が変わる → 効く", 540, 1130, 46, "#FFFFFF", TAG, ck);
  note(ui, "※メーターはイメージ（研究の測定値ではない）", 540, 1215, easeOut(prog(t, CUE.flat - .3, .4)), 26);
  // 桁をまたぐ 2 円
  const ins = easeOut(prog(t, CUE.insight, .4));
  if (ins > 0) pill(ui, "2円で、左端が 3 → 2 に", 540, 330, 44, "#FFFFFF", C.orange, ins);
  om(t, 150, 1360, .45, { expr: t >= CUE.insight ? "smug" : "think", armR: t >= CUE.insight ? 2.3 : .3, look: [1, -.6] });
  uraWipe(t, "smirk");
}

const MENU = [["特上ランチ", "1,980"], ["上ランチ", "1,280"], ["並ランチ", "780"], ["小ランチ", "480"]];
function menuCard(ctx, x, y, s, items, k = 1, pickIdx = -1, title = "MENU") {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * back(k), s * back(k));
  ctx.shadowColor = "rgba(0,0,0,.2)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
  ctx.fillStyle = "#FFFBF0"; rrect(ctx, -300, -330, 600, 660, 36); ctx.fill(); ctx.shadowColor = "transparent";
  ctx.fillStyle = C.orange; rrect(ctx, -300, -330, 600, 110, 36); ctx.fill(); ctx.fillRect(-300, -260, 600, 40);
  text(ctx, title, 0, -272, 60, "#FFFFFF", { weight: 900 });
  items.forEach(([n, p], i) => {
    const yy = -150 + i * 125;
    if (i === pickIdx) { ctx.fillStyle = "rgba(255,200,61,.45)"; rrect(ctx, -280, yy - 50, 560, 100, 24); ctx.fill(); }
    text(ctx, n, -250, yy, 46, C.navy2, { weight: 800, align: "left" });
    text(ctx, p + "円", 250, yy, 50, TAG, { weight: 900, align: "right" });
  });
  ctx.restore();
}
function menuScene(t, a, lt) {
  S.gradientBG(bg, "#FFF8EE", "#FFE6C9", "#FFD6A8");
  const st = t >= CUE.study, sk = easeInOut(prog(t, CUE.study, .6));
  const pick = t >= CUE.pick ? 1 : -1;
  // メニュー（高い順）。study で左に縮み、安い順と並べる
  menuCard(ui, lerp(540, 285, sk), lerp(760, 720, sk), lerp(1, .68, sk), MENU, easeOut(prog(t, a + .1, .4)), pick, "MENU");
  const rv = easeOut(prog(t, CUE.reveal, .35));
  if (rv > 0) {
    const x = lerp(540, 285, sk) + lerp(330, 225, sk);
    S.arrow(ui, x, lerp(560, 580, sk), x, lerp(1030, 920, sk), C.ura, 16, 44, rv);
    pill(ui, "高い順", lerp(x - 95, 285, sk), lerp(500, 470, sk), 44, "#FFFFFF", C.ura, rv);
  }
  if (st) {
    menuCard(ui, 735, 720, .68, [...MENU].reverse(), sk, -1, "MENU");
    pill(ui, "安い順", 735, 470, 40, "#FFFFFF", "#3E6FD8", sk);
    text(ui, "高めが選ばれやすい", 285, 1020, 38, C.ura, { weight: 900, alpha: easeOut(prog(t, CUE.study + 1.0, .4)) });
    text(ui, "安めが選ばれやすい", 735, 1020, 38, "#3E6FD8", { weight: 900, alpha: easeOut(prog(t, CUE.study + 1.6, .4)) });
    note(ui, "※研究の一例（Suk ほか 2012）。条件で変わる", 600, 1110, sk, 26);
  }
  // オモテ：指さし → 論文どおり
  const pp = t >= CUE.paper, jb = t >= CUE.jab;
  om(t, 160, 1360, .5, { expr: jb ? "deadpan" : pp ? "deadpan" : t >= CUE.reveal ? "shock" : "think", armR: t >= CUE.pick && !st ? 2.0 : .3, look: [1, -.6] });
  if (pp) S.burst(ui, 420, 1250, 110, prog(t, CUE.paper, .3), "論文どおり", { size: 32, fill: "#FFFFFF", stroke: C.ura, color: C.ura, rot: .08 });
  uraWipe(t, jb ? "amused" : "smirk");
}

function caveatScene(t, a, lt) {
  S.gradientBG(bg, "#F7F7FB", "#E5E8F3", "#D6DCEE");
  const na = prog(t, CUE.notalways, .3);
  tag(ui, 540, 560, 1.3, "298", easeOut(prog(t, a + .1, .35)));
  text(ui, "必ず売れる？", 540, 760, 70, C.navy2, { weight: 900, alpha: easeOut(prog(t, a + .3, .35)) * (1 - prog(t, CUE.factors, .3)) });
  S.bigX(ui, 855, 760, 58, na * (1 - prog(t, CUE.factors, .3))); // 値札・文字を隠さないよう、横に小さく
  const cards = [["原価", "#3E6FD8"], ["ライバル店", C.orange], ["売り方", C.green]];
  cards.forEach(([lab, col], i) => {
    const k = easeOut(prog(t, CUE.factors + i * .25, .35));
    if (k <= 0) return;
    const x = 220 + i * 320, y = 880 - 80 * (1 - k);
    ui.save(); ui.globalAlpha = k; ui.fillStyle = "#FFFFFF"; rrect(ui, x - 140, y - 110, 280, 220, 30); ui.fill();
    ui.strokeStyle = col; ui.lineWidth = 8; ui.stroke(); ui.restore();
    text(ui, lab, x, y, 50, col, { weight: 900, alpha: k });
  });
  const nk = easeOut(prog(t, CUE.nine, .4));
  if (nk > 0) {
    ui.save(); ui.globalAlpha = nk; ui.fillStyle = "#FFFFFF"; rrect(ui, 90, 1040, 840, 170, 30); ui.fill(); ui.restore();
    text(ui, "9 で終わる値段で売上が伸びた実験も", 510, 1095, 40, C.navy2, { weight: 900, alpha: nk });
    text(ui, "Anderson & Simester（2003）。効き方は状況しだい", 510, 1160, 28, "#4A5B70", { weight: 800, alpha: nk });
  }
  om(t, 975, 1360, .42, { expr: t >= CUE.notalways ? "shock" : "smug", armL: t < CUE.notalways ? 2.3 : .3, look: [-1, -.6] });
  uraWipe(t, "stern");
}

function finalScene(t, a, lt) {
  shelfBG(bg, t);
  // 靴（架空）と 1,980 円
  const sh = easeOut(prog(t, CUE.shoes - .3, .4));
  const al = t >= CUE.almost, ak = easeOut(prog(t, CUE.almost, .3));
  om(t, 260, 1335, .58, { expr: t >= CUE.wallet ? "deadpan" : al ? "shock" : t >= CUE.shoes ? "smug" : "happy", armR: sh > 0 && !al ? 2.0 : .3, elbowR: .6, look: [1, -.4] });
  if (sh > 0) {
    ui.save(); ui.translate(560, 1000); ui.scale(sh * .8, sh * .8);
    ui.fillStyle = "#FFFFFF"; ui.beginPath(); ui.moveTo(-150, 40); ui.quadraticCurveTo(-150, -60, -60, -70); ui.lineTo(40, -20); ui.quadraticCurveTo(150, 0, 160, 60); ui.lineTo(-150, 60); ui.closePath(); ui.fill();
    ui.strokeStyle = "#3E6FD8"; ui.lineWidth = 10; ui.stroke(); ui.fillStyle = "#3E6FD8"; ui.fillRect(-150, 50, 310, 24);
    ui.restore();
    tag(ui, 760, 760, .9, "1,980", sh, .08);
    if (!al) S.burst(ui, 760, 560, 140, prog(t, CUE.shoes + .3, .3), "千円台!", { size: 52, fill: "#FFFFFF", stroke: C.omote, color: C.omote, rot: -.1 });
  }
  if (al) {
    ui.save(); ui.globalAlpha = ak * .5; ui.fillStyle = "#FFFFFF"; ui.fillRect(0, 0, W, H); ui.restore();
    text(ui, "ほぼ", 470, 300, 80, C.navy2, { weight: 900, alpha: ak, stroke: "#FFFFFF", sw: 12 });
    text(ui, "2,000円", 470, 450, 170, TAG, { weight: 900, alpha: ak, stroke: "#FFFFFF", sw: 18 });
  }
  // 財布が飛んでいく
  if (t >= CUE.wallet) {
    const k = prog(t, CUE.wallet, 1.6);
    const x = lerp(380, 1180, easeIn(k)), y = lerp(1050, 300, k) + Math.sin(k * 12) * 30;
    ui.save(); ui.translate(x, y); ui.rotate(k * 5);
    ui.fillStyle = "#8A5A2B"; rrect(ui, -70, -45, 140, 90, 16); ui.fill(); ui.fillStyle = "#C78A4A"; rrect(ui, -70, -45, 140, 30, 12); ui.fill();
    for (let i = 0; i < 6; i++) { const ph = (k * 3 + i / 6) % 1; ui.fillStyle = "#FFC83D"; ui.beginPath(); ui.arc(-30 - ph * 120, 20 + ph * 140 * (i % 2 ? 1 : -1), 16, 0, 7); ui.fill(); }
    ui.restore();
    S.burst(ui, 760, 1080, 110, prog(t, CUE.wallet, .3) * (1 - prog(t, CUE.punch - .2, .3)), "−2,000", { size: 48, fill: "#FFFFFF", stroke: TAG, color: TAG });
  }
  uraWipe(t, t >= CUE.punch ? "amused" : "smirk", { idle: t >= CUE.punch ? "amused" : "smirk" }); // ウラは姿を出さないので、波形は右上のまま
}

// ---------------------------------------------------------------- 1 コマ
function renderFrame(t) {
  bg.clearRect(0, 0, W, H); ui.clearRect(0, 0, W, H);
  const es = TL.ending_start;
  if (t >= es) {
    const e = TL.lines.filter(x => x.ending);
    drawEnding(ui, t - es, { end1: e[0].start - es, end2: e[1].start - es, credits: TL.credits, brand: "", techno: true });
    return;
  }
  window.__t = t;
  const name = S.sceneAt(t), [a, b] = S.sceneRange(name);
  S.camera([bg, ui], t, a, b, [.05, CUE.rain, CUE.bucket, CUE.cross, CUE.almost, CUE.punch], [540, 800]);
  drawScene(t, name);
  S.resetCam([bg, ui]);
  S.hud(ui, t);
  S.header(ui, false);
  S.subtitles(ui, t, 1495);
  const i = SCN.indexOf(name);
  if (i > 1) S.whip(ui, 1 - prog(t, a, .2), i);
}
function renderThumb() {
  bg.clearRect(0, 0, W, H); ui.clearRect(0, 0, W, H);
  shelfBG(bg, 0);
  tag(ui, 300, 760, 1.6, "298", 1, -.06); tag(ui, 780, 760, 1.6, "300", 1, .06);
  text(ui, "その2円に", 540, 1300, 110, C.navy, { weight: 900, stroke: "#FFFFFF", sw: 16 });
  text(ui, "騙されるな", 540, 1450, 130, TAG, { weight: 900, stroke: "#FFFFFF", sw: 16 });
  S.header(ui, false);
}
function setTimeline(tl) { TL = tl; S.setup(tl, SCN); CUE = S.CUE; }
window.renderFrame = renderFrame; window.renderThumb = renderThumb; window.setTimeline = setTimeline;
</script>
