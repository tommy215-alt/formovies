<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>pilot_028 renderer</title>
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0}
</style>
</head><body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="ui" width="1080" height="1920"></canvas>
</div>
<script src="../common/vendor/three.min.js"></script>
<script src="../ext/vendor/three147/GLTFLoader.js"></script>
<script src="../ext/vendor/three147/RGBELoader.js"></script>
<script src="../ext/vendor/three147/Pass.js"></script>
<script src="../ext/vendor/three147/EffectComposer.js"></script>
<script src="../ext/vendor/three147/RenderPass.js"></script>
<script src="../ext/vendor/three147/ShaderPass.js"></script>
<script src="../ext/vendor/three147/CopyShader.js"></script>
<script src="../ext/vendor/three147/SimplexNoise.js"></script>
<script src="../ext/vendor/three147/SSAOShader.js"></script>
<script src="../ext/vendor/three147/SSAOPass.js"></script>
<script src="../ext/vendor/three147/BokehShader.js"></script>
<script src="../ext/vendor/three147/BokehPass.js"></script>
<script src="../common/stage.js"></script>
<script src="../common/cine.js"></script>
<script src="../ext/hud_ext.js"></script>
<script src="assets/assets.js"></script>
<script src="../ext/kit/scene_assets.js"></script>
<script src="../ext/kit/kit.js"></script>
<script src="../ext/kit/shots.js"></script>
<script>
// pilot_028「自分の心臓に管を通した医者——ヴェルナー・フォルスマン」のレンダラー（ドパ設計）。制作の土台は ext/kit（kit.js・shots.js）。画面の構成は SHOTS。
// 本人の写真・1929 年の X 線写真は権利がはっきりしないので使わない（scripts/pilot_028/assets.md）。心臓と管・X 線の図は再現・模式。人物は後ろ姿（顔なし）。
Object.assign(KIT, { design: "dopa", scenes: ["open", "hook", "ki", "sho", "ten", "ketsu"], images: [],
  ci: { l03: [[.28, .65]], l06: [[-.22, 1.9]], l09: [[.25, 1.8], [-.1, 1.6], [.16, .6]], l11: [[0, .38]] },
  hits: [["hook", 1.2], ["l01m", .8], ["l02m", 1.2], ["l05", .8], ["l05b", 1.0], ["l07", 1.4], ["l08", .8], ["l10", .8], ["l10b", 1.4], ["l12", 1.0], ["l13", .8]],
  opening: { img: null, bg: t => heartShot(t, 1, { cam: [V3(.6, 1.2, 3.4), V3(0, 1.05, 0), 40] }), title: ["自分の心臓に", "管を通した医者"], credit: ["※再現CG"] } });
loadImages(KIT.images);

// ---------------------------------------------------------------- 3D：心臓と、腕から入る細い管（再現・模式）
let heart, tube, tubeLen = 0;
function buildHeart() {
  heart = new THREE.Group(); const hm = new THREE.MeshStandardMaterial({ color: C(0x9a1a22), roughness: .35, metalness: .1, emissive: C(0x2a0204), emissiveIntensity: .6 }); Cine.surface(hm, "skin", { repeat: [3, 3], normal: .8 });
  sph(.32, hm, -.17, 1.12, 0, heart, 48); sph(.32, hm, .17, 1.12, 0, heart, 48); const c = new THREE.Mesh(new THREE.ConeGeometry(.46, .66, 48), hm); c.rotation.z = Math.PI; c.position.y = .78; c.castShadow = true; heart.add(c);
  cyl(.09, .1, .4, M(0xb83a3a, { roughness: .4 }), .05, 1.48, 0, heart).rotation.z = -.3; cyl(.07, .08, .35, M(0x5a6ab8, { roughness: .4 }), -.22, 1.45, .05, heart).rotation.z = .4;
  const path = new THREE.CatmullRomCurve3([V3(1.9, .9, .9), V3(1.3, 1.1, .7), V3(.8, 1.45, .5), V3(.2, 1.55, .25), V3(-.18, 1.25, .1), V3(-.15, 1.02, .05)]);
  const geo = new THREE.TubeGeometry(path, 200, .018, 12, false); tubeLen = geo.index.count;
  tube = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: C(0xf0e0b0), roughness: .3, emissive: C(0x6a5020), emissiveIntensity: .5 })); tube.userData.noAO = true; heart.add(tube);
  STAGE_HERO.add(heart);
}
function heartShot(t, k, { cam = [V3(.9, 1.2, 2.6), V3(0, 1.05, 0), 38], glow = 0, ring = 0xff6a5a } = {}) {   // k：管の進み（0→1）
  tube.geometry.setDrawRange(0, Math.floor(tubeLen * clamp(k) / 3) * 3); heart.scale.setScalar(1 + .03 * Math.sin(t * 7.5));
  stageShot(t, { cam, spin: .25, ring, glow, keyCol: 0xffe0d0 });
}

// ---------------------------------------------------------------- 2D の図
function armDiag(X, t, a) {   // 腕の静脈から心臓へ（模式）
  panel(X); lab2(X, "腕の静脈 → 心臓（模式）", 540, 410, T(30), "#B8DFF2", 800);
  X.fillStyle = "#1e2a3a"; X.beginPath(); X.ellipse(470, 760, 170, 230, 0, 0, Math.PI * 2); X.fill(); X.fillRect(560, 640, 330, 90);
  X.fillStyle = "#c83a3a"; X.beginPath(); X.ellipse(430, 790, 60, 70, 0, 0, Math.PI * 2); X.fill(); lab2(X, "心臓", 430, 900, T(24), "#FF9A8A", 700);
  const k = easeInOut(clamp((t - a - .2) / 2.2)); X.strokeStyle = "#FFE2A8"; X.lineWidth = 8; X.lineCap = "round"; X.beginPath(); X.moveTo(860, 690);
  const pts = [[860, 690], [700, 680], [560, 650], [480, 700], [440, 780]], n = Math.floor(k * 40); for (let i = 0; i <= n; i++) { const f = i / 40 * (pts.length - 1), j = Math.min(pts.length - 2, Math.floor(f)), e = f - j; X.lineTo(lerp(pts[j][0], pts[j + 1][0], e), lerp(pts[j][1], pts[j + 1][1], e)); } X.stroke();
  lab2(X, "肘の静脈", 860, 620, T(24), "#B8C7D6", 700); if (k > .9) lab2(X, "60cm超", 700, 1080, T(48), "#FFE2A8", 900);
}
function xrayDiag(X, t, a) {   // X 線の写真（再現・模式）
  X.fillStyle = "#0a1018"; X.fillRect(140, 340, 800, 960); X.strokeStyle = "rgba(220,235,255,.55)"; X.lineWidth = 10;
  for (let i = 0; i < 7; i++) { const y = 480 + i * 85; X.beginPath(); X.ellipse(540, y, 300 - i * 6, 70, 0, Math.PI * 1.05, Math.PI * 1.95); X.stroke(); }
  X.fillStyle = "rgba(220,235,255,.25)"; X.beginPath(); X.ellipse(500, 900, 170, 150, -.3, 0, Math.PI * 2); X.fill(); X.fillStyle = "rgba(220,235,255,.6)"; X.fillRect(525, 380, 30, 820);
  const k = easeOut(clamp((t - a - .2) / 1.2)); X.strokeStyle = "#FFE2A8"; X.lineWidth = 6; X.beginPath(); X.moveTo(920, 560); X.quadraticCurveTo(700, 560, lerp(920, 560, k), lerp(560, 880, k)); X.stroke();
  lab2(X, "※再現（模式）", 540, 1260, T(24), "#B8C7D6", 600);
}

// ---------------------------------------------------------------- ショットの一覧
const HOSP = { cam: [V3(2.4, 1.6, 2.6), V3(-.2, 1.2, -1.5), 40], who: { white: [.6, -.9] } };
function ciShot(t, P) { const v = [[V3(1.8, .5, 1.4), V3(.4, 1.5, -1.4), 40], [V3(.9, 1.6, -.2), V3(.6, 1.4, -.9), 30], [V3(2.8, 2.0, 2.6), V3(0, 1.0, -1.4), 44]][P.p];
  roomShot(t, { cam: v, who: { white: [.6, -.9] }, warm: .3 }); }
SHOTS = [
  { at: "l01", kind: "3d", draw: (t, u) => roomShot(t, { ...HOSP, cam: [V3(2.4 - .4 * u, 1.6, 2.6 - .3 * u), V3(-.2, 1.2, -1.5), 40], warm: .4 }), slam: { s: "1929年", sub: "ドイツ・エーバースヴァルデ", size: 140 }, tags: [["25歳", 300, 1180, .6, "#e8402e"], ["研修医", 740, 1240, .9, "#3a7ad8"]] },
  { at: "l02", kind: "3d", draw: (t, u) => roomShot(t, { cam: [V3(-1.2, 1.5, 2.2), V3(.4, 1.3, -1.2), 38], who: { white: [.6, -.9], stand: [-.6, -1.0] } }), slam: { s: "心臓に管を？", cols: CYAN, glow: "rgba(40,200,255,.9)" }, slam2: { s: "上司：ダメ", cols: RED, off: 1.6, size: 110 } },
  { at: "l03", kind: "3d", draw: (t, u) => heartShot(t, u * .3), slam: { s: "自分の体でやる", cols: RED, size: 120, off: .5, glow: "rgba(255,40,60,1)" } },
  { at: "l04", kind: "3d", draw: (t, u) => roomShot(t, { cam: [V3(2.0, 1.5, 2.2), V3(0, 1.2, -1.2), 38], who: { white: [.5, -.9], stand: [-.3, -1.0] }, warm: .3 }), tags: [["看護師", 330, 1180, .3, "#2a9a5a"], ["ゲルダ・ディッツェン", 640, 1250, .6, "#3a7ad8"]] },
  { at: "l05", kind: "holo", draw: (X, t) => armDiag(X, t, CUE.l05), slam: { s: "60cm超", size: 130, off: 2.0, y: 1240 } },
  { at: "l05b", kind: "3d", draw: (t, u) => heartShot(t, .3 + .4 * u, { cam: [V3(1.6, 1.4, 1.6), V3(.8, 1.3, .5), 36] }), slam: { s: "本来は尿の管！", cols: PINK, glow: "rgba(255,80,180,1)" } },
  { at: "l06", kind: "3d", draw: (t, u) => roomShot(t, { cam: [V3(1.2, 1.5, 3.2 - u), V3(.2, 1.1, -1.2), 42], who: { walk: [.2 - .3 * u, .4 - .8 * u] }, warm: .2 }), slam: { s: "X線の部屋へ！", cols: CYAN, glow: "rgba(40,200,255,.9)", size: 120 } },
  { at: "l07", kind: "holo", draw: (X, t) => xrayDiag(X, t, CUE.l07), slam: { s: "心臓に届いた", cols: GOLD, off: 1.0 } },
  { at: "l08", kind: "holo", draw: (X, t) => { panel(X); bigNum(X, "1929", 700, 120); lab2(X, "論文として発表", 540, 900, T(40), "#EAF2F8", 900); }, slam: { s: "論文に！", size: 110 } },
  { at: "l09", kind: "3d", draw: (t, u) => roomShot(t, { cam: [V3(-1.0, 1.5, 2.0), V3(.4, 1.3, -1.2), 36], who: { white: [.6, -.9], stand: [-.6, -1.0] }, night: .4 }), slam: { s: "強い批判", cols: RED, glow: "rgba(255,40,60,1)" } },
  { at: "l10", kind: "3d", draw: (t, u) => roomShot(t, { cam: [V3(1.6, 1.4, 1.6 - .3 * u), V3(.6, 1.0, -1.2), 38], who: { sit: [.6, -1.0] }, night: 1 }), slam: { s: "泌尿器科の医師へ", cols: WHITE, size: 96 } },
  { at: "l10b", kind: "holo", draw: (X, t) => { panel(X); bigNum(X, "27年", 760, 150); lab2(X, "1929 → 1956", 540, 1000, T(40), "#EAF2F8", 900); } },
  { at: "l11", kind: "3d", draw: (t, u) => heartShot(t, 1, { ring: 0xffd27a, glow: 1.2, cam: [V3(0, 1.3, 3.2 - .6 * u), V3(0, 1.05, 0), 38] }), slam: { s: "ノーベル賞！", size: 130, off: .6 }, slam2: { s: "1956年", cols: WHITE, off: .9, y: 1260 } },
  { at: "l12", kind: "3d", draw: (t, u) => heartShot(t, 1, { ring: 0xffd27a, glow: .6, cam: [V3(-.8, 1.4, 2.6), V3(0, 1.05, 0), 40] }), tags: [["フォルスマン", 300, 1100, .2, "#e8402e"], ["クルナン", 760, 1170, .7, "#3a7ad8"], ["リチャーズ", 420, 1250, 1.2, "#2a9a5a"]] },
  { at: "l13", kind: "3d", draw: (t, u) => heartShot(t, 1, { cam: [V3(1.2 - .6 * u, 1.3, 2.2 + .8 * u), V3(0, 1.05, 0), 40] }), slam: { s: "始まりのひとつ", cols: GOLD, off: 1.2 } },
];
const _ds = drawScene; drawScene = function (t, name) { const P = ciPhase(t); if (P && P.c === "l09") { ciShot(t, P); return "3d"; } return _ds(t, name); };
function fxEp(t, name) { if (name === "ki" && t >= CUE.l05b && t < CUE.l06) S.speedLines(bg, 540, 900, t, "rgba(255,230,200,.25)", 50, 360, 8); if (name === "sho" && t < CUE.l07) S.speedLines(bg, 540, 900, t, "rgba(200,230,255,.25)", 50, 360, 8); }
function buildMood() { const c = CUE; MOOD = [[0, { warm: .2, sat: 1.1, vig: .6 }], [c.hook, { warm: .3, sat: 1.3, vig: .45 }], [c.ki, { warm: .35, sat: 1.4, vig: .42 }], [c.sho, { cool: .1, sat: 1.3, vig: .45 }],
  [c.ten, { cool: .3, sat: 1.0, vig: .6 }], [c.ketsu, { warm: .35, sat: 1.4, glow: .3, glowX: .5, glowY: .5, vig: .42 }]]; }
function thumb() { CUE = CUE || {}; CUE.t0 = 0; heartShot(1, .8, { cam: [V3(.9, 1.2, 2.6), V3(0, 1.05, 0), 38] }); S.moodGrade(bg, 0, [[0, { warm: .3, sat: 1.35, vig: .45 }]]); Cine.bloom(bg, .34); addGrain(0);
  slam(ui, "自分の心臓に", 540, 330, 110, 0, 9, { cols: WHITE, glow: "rgba(255,120,60,.9)", rot: -.03 }); slam(ui, "管を通した医者", 540, 520, 120, 0, 9, { cols: GOLD, glow: "rgba(255,120,60,.9)", rot: .02 }); slam(ui, "1929年", 540, 1420, 110, 0, 9, { cols: RED, glow: "rgba(255,40,60,1)" }); }
kitStart(() => { buildRoom({}); buildStage({}); buildHeart(); });
</script>
</body></html>
