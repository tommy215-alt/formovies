<html lang="ja"><head><meta charset="utf-8">

<style>

</head><body>

  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="ui" width="1080" height="1920"></canvas>
</div>

<script>
// pilot_039「あなたならどうする？——砂漠で迷子（マウロ・プロスペリ）」のレンダラー（当事者設計）。3D は Blender（blender/scene.py）。砂嵐の砂と戸口の枠は pov.js とこのファイル。本物の写真：mds（Ben Hammersley、マラソン・デ・サーブル、CC BY 2.0）。
// 当事者設計（templates/DESIGN_MODES.md）：前半は当事者の目線（Blender の POV＋pov.js）、後半は三人称の解説。文字は知的設計の字幕だけ（オープニングの問いは大きく）。
Object.assign(KIT, { design: "intel", scenes: ["open", "pov", "ask", "exp", "after"], images: ['mds'], ci: {}, hits: [],
  opening: { img: null, bg: blShot("l00"), title: ["砂漠で迷子。水はない。", "待つか、歩くか。"], size1: 64, size2: 104, credit: ["※再現CGを含みます"] } });
loadImages(KIT.images);
// 廟の戸口の枠（内側の暗い壁と、上が丸い入口）
function doorFrame() { bg.save(); bg.fillStyle = "#120c07"; bg.beginPath(); bg.rect(0, 0, W, H); bg.moveTo(180, 1920); bg.lineTo(180, 760); bg.arc(540, 760, 360, Math.PI, 0); bg.lineTo(900, 1920); bg.closePath(); bg.fill("evenodd");
  bg.strokeStyle = "rgba(120,90,60,.5)"; bg.lineWidth = 14; bg.beginPath(); bg.moveTo(180, 1920); bg.lineTo(180, 760); bg.arc(540, 760, 360, Math.PI, 0); bg.lineTo(900, 1920); bg.stroke(); bg.restore(); }
SHOTS = [
  { at: "l01", kind: "3d", draw: blShot("l01") },
  { at: "l02", kind: "3d", draw: blShot("l02") },
  { at: "l03", kind: "3d", draw: blShot("l03") },
  { at: "l04", kind: "3d", draw: blShot("l04") },
  { at: "l05", kind: "3d", draw: blShot("l05") },
  { at: "l06", kind: "3d", draw: blShot("l06") },
  { at: "l07", kind: "3d", draw: blShot("l07") },
  { at: "l08", kind: "3d", draw: blShot("l08") },
  { at: "l09", kind: "3d", draw: blShot("l09") },
  { at: "l10", kind: "3d", draw: blShot("l10") },
  { at: "l11", kind: "3d", draw: blShot("l11") },
  { at: "l12", kind: "3d", draw: blShot("l12") },
  { at: "l13", kind: "photo", img: "mds", box: [90, 470, 990, 1080], cy: .5, z0: 1.0, z1: 1.15, gray: 0, credit: ["写真：Ben Hammersley（マラソン・デ・サーブル）／CC BY 2.0"], creditY: 1140 },
];
const FX = {
  l00: (t, u) => { POV.shake(t, 9); POV.sand(t, .95, 1); POV.breath(t, .8, .55); POV.heart(t, 130, .3); },
  l01: (t, u) => { POV.shake(t, 6); POV.breath(t, .7, .3); },
  l02: (t, u) => { POV.shake(t, 5 + 6 * u); POV.sand(t, .2 + .85 * u, 1); POV.breath(t, .8, .4); },
  l03: (t, u) => { POV.shake(t, 2); POV.breath(t, .5, .35); },
  l04: (t, u) => { POV.breath(t, .35, .45); },
  l05: (t, u) => { POV.shake(t, 7); POV.breath(t, .9, .45); },
  l06: (t, u) => { POV.shake(t, 3); POV.breath(t, .55, .4); POV.blur(1.2); },
  l07: (t, u) => { doorFrame(); POV.breath(t, .4, .35); },
  l08: (t, u, a) => { doorFrame(); POV.breath(t, .45, .4); POV.heart(t, 125, .25 + .45 * clamp((t - a) / 4)); },
};
function buildMood() { const c = CUE; MOOD = [[0, { warm: .25, sat: .9, vig: .7 }], [c.pov, { warm: .2, sat: .95, vig: .65 }], [c.l04, { cool: .5, sat: .6, vig: .8 }], [c.l05, { warm: .2, sat: .9, vig: .65 }], [c.l07, { warm: .35, sat: .95, vig: .75 }], [c.ask, { warm: .3, sat: .8, vig: .85 }], [c.exp, { warm: .2, sat: .9, vig: .6 }], [c.after, { warm: .25, sat: 1.0, glow: .2, glowX: .5, glowY: .4, vig: .5 }]]; }
function thumb() { CUE = CUE || {}; CUE.t0 = 0; photo(bg, IMG.mds, 1, 1.05, 1.05, 0, { box: [0, 0, 1080, 1920], cy: .5, gray: 0, frame: "none" }); bg.fillStyle = "rgba(20,10,0,.4)"; bg.fillRect(0, 0, W, H); S.moodGrade(bg, 0, [[0, { warm: .3, sat: .9, vig: .7 }]]); addGrain(0); label(ui, "砂漠で迷子。水はない。", 540, 520, 74, "#EAF2F8", { stroke: "#05080c", sw: .14 }); label(ui, "待つか、歩くか。", 540, 680, 112, "#FFD58A", { stroke: "#05080c", sw: .14 }); label(ui, "あなたなら、どうする？", 540, 1420, 70, "#EAF2F8", { stroke: "#05080c", sw: .14 }); }

// ---------------------------------------------------------------- 目線の演出（pov.js）。FX[ショット] = (t, u, a) => { ... }
function fxEp(t, name) {
  if (name === "open") { (FX.l00 || (() => {}))(t, clamp(t / Math.max(.3, CUE.l01)), 0); return; }
  const { s, a, u } = shotAt(t); const f = FX[s.at]; if (f) f(t, u, a);
}
kitStart(() => {}); BL.install();
</script>
