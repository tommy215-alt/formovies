  ctx.save(); ctx.translate(540, 790); ctx.rotate(-.015); ctx.fillStyle = "#ece4d0"; ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 24; ctx.fillRect(-370, -300, 740, 600); ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(90,110,150,.35)"; ctx.lineWidth = 1.5; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(-340, -230 + i * 62); ctx.lineTo(340, -230 + i * 62); ctx.stroke(); }

  NOTE.forEach((s, i) => { const k = clamp((t - CUE.plan - .1 - i * .2) / .3); if (k <= 0) return; ctx.globalAlpha = k; ctx.font = `italic ${i ? 500 : 700} ${i ? 40 : 48}px Georgia, "Times New Roman", serif`; ctx.fillText(s, -330, -238 + i * 62 + (i ? 0 : -4)); });
  ctx.restore(); ctx.globalAlpha = 1;
  lab2(ctx, "犬の膵管をしばり 残った島から", 540, 1150, T(30), "#B8DFF2", 700); lab2(ctx, "分泌物を取り出す（展示の書き起こし）", 540, 1210, T(26), "#8FB0C8", 600); }
function sugarGraph(ctx, t, cue, human_) {   // 血糖（模式図）。数値は出さない
  panel(ctx); lab2(ctx, human_ ? "少年の血糖（模式図）" : "犬の血糖（模式図）", 540, 410, T(34), "#B8DFF2", 800);
  const x0 = 170, x1 = 910, y0 = 520, y1 = 1120, k = easeInOut(clamp((t - CUE[cue] - .15) / 1.5)), xi = human_ ? 360 : 420;
  ctx.strokeStyle = "rgba(143,220,255,.5)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.lineTo(x1, y1); ctx.stroke();
  lab2(ctx, "高い", x0 + 10, y0 - 30, T(24), "#8FB0C8", 600); lab2(ctx, "時間 →", x1 - 60, y1 + 44, T(24), "#8FB0C8", 600);
  if (human_) { ctx.fillStyle = "rgba(120,230,190,.16)"; ctx.fillRect(x0 + 2, 960, x1 - x0 - 2, 110); lab2(ctx, "正常の範囲", x1 - 120, 1015, T(26), "#9AF0D0", 800); }
  ctx.setLineDash([10, 10]); ctx.strokeStyle = "rgba(255,226,168,.7)"; ctx.beginPath(); ctx.moveTo(xi, y0); ctx.lineTo(xi, y1); ctx.stroke(); ctx.setLineDash([]);

  const f = x => { if (x < xi) return 600 + 30 * Math.sin(x * .03); const u = clamp((x - xi) / (human_ ? 380 : 330)); return lerp(600, human_ ? 1010 : 930, easeInOut(u)) + 10 * Math.sin(x * .05) * (1 - u); };
  const xe = lerp(x0, x1, k); ctx.strokeStyle = "#FF9A8A"; ctx.shadowColor = "#FF9A8A"; ctx.shadowBlur = 14; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.beginPath();
  for (let x = x0; x <= xe; x += 6) { const y = f(x); x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); ctx.shadowBlur = 0;
  if (human_ && k > .95) { lab2(ctx, "1日で", x1 - 140, 900, T(30), "#EAF2F8", 900); S.hudTarget(ui, x1 - 70, 1010, 50, clamp((k - .95) * 20), t); }
}
function letterView(t) {   // テディ・ライダーの手紙（本物、CC BY 2.0）

}

// ---------------------------------------------------------------- 場面
function ciShot(t, P) {   // 転（1 月 23 日）のカット A・B：澄んだ液の極端な寄り → 窓の光の病室
  const u = easeOut(clamp((P.d - CUT[P.p - 1]) / (CUT[P.p] - CUT[P.p - 1])));
  if (P.p === 1) { heroShot(t, u, 1, { near: .3 }); return; }
  wardShot(t, { dawn: .35 + .25 * u }); setCam(V3(.7 - .15 * u, 1.2, 1.5 - .25 * u), V3(-1.9, 1.35, -1.2), 40 - 4 * u, .02, 40); draw3D({ ao: true }); }
function drawScene(t, name) {
  const P = ciPhase(t); if (P && P.p === 0) return "2d"; if (P && P.c === "jan23") { ciShot(t, P); return "3d"; }
  if (name === "open") { driftShot(t); return "3d"; }
  if (name === "hook") { if (t < CUE.nodrug) { wardWide(t, easeInOut(clamp((t - CUE.hook) / (CUE.nodrug - CUE.hook)))); return "3d"; }   // 冬の病室（最初の 1 秒の決定的な映像）
    wardShot(t, { plate: true }); const u = easeInOut(clamp((t - CUE.nodrug - CUT[0]) / (CUE.idea - CUE.nodrug))), at = V3(BX + .9, .85, -1.95);   // 小さな食事と時計
    setCam(V3(BX + 1.35 - .1 * u, .98, -.95 - .15 * u), at, 40 - 4 * u, .02, 40); draw3D({ ao: true, dof: { focus: 1.1, aperture: .006, maxblur: .01 } }); return "3d"; }
  if (name === "idea") { if (t < CUE.plan) { labShot(t, { w1: true, night: true }); const u = easeInOut(clamp((t - CUE.idea - CUT[0]) / (CUE.plan - CUE.idea)));   // 夜の机の後ろ姿
      if (t < CUE.note) setCam(V3(1.2 - .1 * u, 1.55, 1.0 - .2 * u), V3(.62, 1.0, -.5), 40, .02, 30); else setCam(V3(.92 - .05 * u, 1.48, .32 - .05 * u), V3(.62, .94, -.5), 36, .02, 30);
      draw3D({ ao: true, dof: { focus: t < CUE.note ? 1.7 : .95, aperture: .006, maxblur: .012 } }); return "3d"; }
    if (t < CUE.lab) return "2d";
    if (t < CUE.dogfall) { labShot(t, { w1: true, w2: true }); const u = easeInOut(clamp((t - CUE.lab) / (CUE.dogfall - CUE.lab))); setCam(V3(1.6 - .2 * u, 1.7, 3.9 - .5 * u), V3(.2, 1.0, -.5), 38, .02, 30); draw3D({ ao: true, dof: { focus: 4.2, aperture: .003, maxblur: .008 } }); return "3d"; }   // 夏の研究室の 2 人
    return "2d"; }
  if (name === "fail") { if (t < CUE.collip) { const ab = clamp((t - CUE.abscess) / .8);   // 最初の注射：濁った液の注射器 → 沈む病室
      wardShot(t, { syr: true, exp: 1 - .15 * ab }); const sp = syrG.position, u = easeInOut(clamp((t - CUE.first) / (CUE.collip - CUE.first)));
      if (t < CUE.abscess) { const cp = V3(sp.x + .32 - .06 * u, sp.y + .16, sp.z + .38 - .08 * u); setCam(cp, V3(sp.x, sp.y + .01, sp.z), 32, .02, 30); draw3D({ ao: true, dof: { focus: cp.distanceTo(sp), aperture: .01, maxblur: .012 } }); }
      else { setCam(V3(1.1, 1.3, .2), V3(BX, .7, -1.2), 38 - 3 * ab, .02, 40); draw3D({ ao: true, dof: { focus: 2.0, aperture: .004, maxblur: .008 } }); }
      return "3d"; }
    heroShot(t, easeInOut(clamp((t - CUE.collip) / (CUE.jan23 - CUE.collip))), easeInOut(clamp((t - CUE.collip - .3) / 2.4))); return "3d"; }   // 澄んでいくフラスコ
  if (name === "turn") { if (t < CUE.normal) { const k = easeInOut(clamp((t - CUE.jan23 - CUT[2]) / 1.4)); wardWide(t, .3 + .3 * k, { dawn: .55 + .45 * k }); return "3d"; }   // 朝の光（光の転換）
    if (t < CUE.live) return "2d";
    if (t < CUE.letter) { wardWide(t, .6 + .3 * easeInOut(clamp((t - CUE.live) / (CUE.letter - CUE.live))), { dawn: 1 }); return "3d"; }
    return "2d"; }
  if (name === "legacy") { if (t < CUE.nobel) { rowsShot(t); return "3d"; } if (t < CUE.cure) { medalShot(t); return "3d"; } penShot(t); return "3d"; }
  if (name === "back") { wardWide(t, 1 - easeInOut(clamp((t - CUE.back) / 3)), { dawn: 1 }); return "3d"; }

}
function draw2D(t, name) {

  { const P = ciPhase(t); if (P && P.p === 0) { bg.fillStyle = "#000"; bg.fillRect(0, 0, W, H); return; } }   // カットインの暗転

  bg.fillStyle = "#000"; bg.fillRect(0, 0, W, H);

// ---------------------------------------------------------------- 画面の文字（オープニング・見出し・注記）
function openingUI(t) {   // 結論の文字を大きく（上〜中ほど）
  const k = k_(t, "t0", .4, .05);
  HUD.title(ui, [["死を待つだけの病に", T(66), "#EAF2F8"], ["薬が生まれた", T(96), "#FFD58A"]], 540, 420, k, t);
  credit("バンティング（右）とベスト、1921年", k, 1340); credit("写真：Thomas Fisher Rare Book Library／CC BY 2.0", k, 1380); }
function drawUI(t, name) {

    else uiCard([["インスリンができる前", T(32), 800], ["食事を減らすしかなかった", T(26), 500, "#B8C7D6"]], 540, 250, k_(t, "nodrug", .45, CUT[0])); }
  if (name === "idea") { if (t < CUE.plan) uiCard([["1920年10月", T(34), 800], ["外科医 フレデリック・バンティング", T(26), 500, "#B8C7D6"]], 540, 250, k_(t, "idea", .45, CUT[0]));
    else if (t >= CUE.lab && t < CUE.dogfall) uiCard([["1921年 夏 トロント大学", T(32), 800], ["マクラウド教授の研究室で 学生ベストと", T(24), 500, "#B8C7D6"]], 540, 250, k_(t, "lab", .45, .2)); }
  if (name === "fail") { if (t < CUE.collip) uiCard([["1922年1月11日", T(34), 800], ["最初の注射", T(26), 500, "#B8C7D6"]], 540, 250, k_(t, "first", .45, .2));

    if (t >= CUE.live && t < CUE.letter) uiCard([["レナード・トンプソン", T(32), 800], ["その後 13年を生きた", T(26), 500, "#B8C7D6"]], 540, 250, k_(t, "live", .45, .1));

    else if (t < CUE.cure) { uiCard([["1923年 ノーベル生理学・医学賞", T(30), 800], ["受賞 バンティング・マクラウド", T(26), 600, "#FFE2A8"]], 540, 250, k_(t, "nobel", .45, .2));
      uiCard([["賞金を分け合った", T(26), 600, "#B8C7D6"], ["ベスト・コリップ", T(30), 800]], 540, 1330, k_(t, "share", .45)); uiNote("※メダルは再現", 540, 380, k_(t, "nobel", .4)); }

function uiCard(lines, x, y, k = 1) {
  if (k <= 0) return; ui.save(); ui.globalAlpha *= clamp(k);
  const ws = lines.map(([s, sz, w = 700]) => { ui.font = `${w} ${sz}px ${S.FONT}`; return ui.measureText(s).width; });
  const pw = Math.max(...ws) + 64, ph = lines.reduce((a, [, sz]) => a + sz * 1.32, 0) + 36, x0 = x - pw / 2, y0 = y - ph / 2;
  rrect(ui, x0, y0, pw, ph, 12); ui.fillStyle = "rgba(8,14,26,.78)"; ui.fill(); ui.strokeStyle = "rgba(143,220,255,.35)"; ui.lineWidth = 1.5; ui.stroke(); ui.fillStyle = "#8fdcff"; ui.fillRect(x0, y0 + 14, 4, ph - 28);
  S.group(() => { let yy = y0 + 18; lines.forEach(([s, sz, w = 700, col = "#EAF2F8"]) => { yy += sz * 1.32 / 2; text(ui, s, x, yy + 2, sz, col, { weight: w }); yy += sz * 1.32 / 2; }); }, [x0, y0, x0 + pw, y0 + ph]);

}
function uiNote(s, x, y, k = 1, size = Math.round(24 * TS)) {

  rrect(ui, x - w / 2, y - size * .8, w, size * 1.6, 8); ui.fillStyle = "rgba(8,14,26,.6)"; ui.fill();
  S.group(() => text(ui, s, x, y + 1, size, "#B8C7D6", { weight: 500 }), [x - w / 2, y - size * .8, x + w / 2, y + size * .8]); ui.restore();
}
const grain = (() => { const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d"), d = x.createImageData(256, 256), r = S.rng(99);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 14; } x.putImageData(d, 0, 0); return c; })();
function addGrain(t) { const ox = Math.floor(S.rng(Math.floor(t * 30) + 7)() * 256), oy = Math.floor(S.rng(Math.floor(t * 30) + 91)() * 256);

    [c.first, { cool: .4, sat: .78, vig: .66 }], [c.abscess, { cool: .5, sat: .7, vig: .7 }], [c.collip, { cool: .2, sat: .92, vig: .6 }],

    [c.patent, { cool: .1, warm: .1, sat: 1.0, vig: .56 }], [c.nobel, { warm: .25, sat: 1.05, glow: .3, glowX: .5, glowY: .45, vig: .5 }], [c.cure, { cool: .1, warm: .1, sat: 1.0, vig: .55 }],

}
function renderFrame(t) {

  const [a] = S.sceneRange(name), i = SCN.indexOf(name);
  if (i > 0 && t < es && !ciPhase(t)) { const k = 1 - prog(t, a, .25); if (k > 0) { bg.fillStyle = `rgba(4,8,14,${.85 * k})`; bg.fillRect(0, 0, W, H); } }

  driftShot(1); bg.fillStyle = "rgba(2,4,12,.35)"; bg.fillRect(0, 0, W, H); photo(bg, IMG.dog, 1, 1.0, 1.06, .5, { box: [280, 590, 800, 1290], cy: .45, gray: 0, bright: 1.0 });

function setTimeline(tl) { TL = tl; S.setup(tl, SCN); CUE = S.CUE; buildMood(); }

</script>
