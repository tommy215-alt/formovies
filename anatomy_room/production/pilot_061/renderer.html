<script>
// pilot_061 のレンダラー（新ドパ設計 2 本目）。もしも世界中の現金が、いま金に変わったら。
// pilot_060 v3 のパターン A（物そのもので画面を埋め、物から物へ拍の頭で寄って突き抜ける）を引き継ぐ。
// 物：お札の束 → 金の延べ棒、古い紙の世界地図（NASA Visible Earth、PD）の上の金の山、国の金庫、表彰台、天秤、ゴルフボール、1 円玉、100 人の人形。
// 文字はセリフの句ごとに 帯・木の札・ポップ・光る文字。冒頭のタイトルは大きく（ユーザーの指示）。閃光なし。数字は scripts/pilot_061/sim/gold.py。
const PL = window.PLAN, BEAT = PL.beat, BP = BEAT.period;
const LN = PL.lines, SCN_IDS = LN.map(l => l.scene);
Object.assign(KIT, { design: "intel", scenes: SCN_IDS, images: [], ci: {}, hits: [] });
loadImages(["vault", "map", "tx_wood", "tx_plank", "tx_concrete"]);
const BIZ = '"Noto Sans CJK JP", sans-serif';
const CRED = "#C8281E", CGOLD = "#F2C14E", INK = "#1C140D";

// ---------------------------------------------------------------- 拍
const beatIdx = t => Math.floor(t / BP + 1e-6), beatPhase = t => t - beatIdx(t) * BP;
const pulse = t => Math.exp(-beatPhase(t) * 9);               // 拍の頭で 1 → すぐ 0
const barPulse = t => (beatIdx(t) % 4 === 0 ? 1 : .45) * pulse(t);
const spring = u => u <= 0 ? 0 : 1 - Math.exp(-6 * u) * Math.cos(10 * u);
const kin = (t, t0, d = .3) => easeOut(clamp((t - t0) / d));
function cur(t) { let i = 0; for (let k = 0; k < LN.length; k++) if (t >= CUE[LN[k].scene]) i = k; return i; }
const sEnd = i => i + 1 < LN.length ? CUE[LN[i + 1].scene] : TL.ending_start;

// ---------------------------------------------------------------- 画面の外の板（場面を描いてからカメラで写す）
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const SC = mk(W, H), sc = SC.getContext("2d"), SC2 = mk(W, H), sc2 = SC2.getContext("2d"), TMP = mk(W, 520), tmp = TMP.getContext("2d");
function pat(ctx, key, s = 1, ox = 0, oy = 0) { const im = IMG["tx_" + key]; if (!im || !im.width) return "#777"; const p = ctx.createPattern(im, "repeat"); p.setTransform(new DOMMatrix().translateSelf(ox, oy).scaleSelf(s, s)); return p; }
function texFill(ctx, key, s = 1, ox = 0, oy = 0, x = 0, y = 0, w = W, h = H) { ctx.fillStyle = pat(ctx, key, s, ox, oy); ctx.fillRect(x, y, w, h); }
function shade(ctx, col, a, x = 0, y = 0, w = W, h = H) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col; ctx.fillRect(x, y, w, h); ctx.restore(); }
function vignette(ctx, a = .55, cx = 540, cy = 900) { const g = ctx.createRadialGradient(cx, cy, 300, cx, cy, 1250); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function lightPool(ctx, x, y, r, col, a) { ctx.save(); ctx.globalCompositeOperation = "soft-light"; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }
// 彫った文字：影（左上）と光（右下）で凹ませる。reveal＝左から現れる割合
function carve(ctx, s, x, y, size, { font = MIN, w = 700, reveal = 1, col = "rgba(30,22,14,.55)", hi = "rgba(255,245,225,.35)", vertical = false, align = "center" } = {}) {
  if (reveal <= 0) return; ctx.save(); ctx.font = `${w} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = "middle";
  const draw = (dx, dy, c) => { ctx.fillStyle = c; if (vertical) [...s].forEach((ch, i) => ctx.fillText(ch, x + dx, y + dy + i * size * 1.05)); else ctx.fillText(s, x + dx, y + dy); };
  const tw = vertical ? size : ctx.measureText(s).width, th = vertical ? s.length * size * 1.05 : size, x0 = vertical ? x - size / 2 : align === "left" ? x : x - tw / 2, y0 = vertical ? y - size / 2 : y - size / 2;
  ctx.beginPath(); if (vertical) ctx.rect(x0 - 20, y0 - 20, tw + 40, (th + 40) * reveal); else ctx.rect(x0 - 20, y0 - 20, (tw + 40) * reveal, th + 40); ctx.clip();
  draw(size * .035, size * .035, hi); draw(-size * .03, -size * .03, "rgba(0,0,0,.55)"); draw(0, 0, col);
  if (ctx.globalAlpha > .35) logBox(ctx, s, x0, y0, x0 + tw, y0 + th, size); ctx.restore();
}
// 筆の文字（和紙の上）
function brush(ctx, s, x, y, size, col = INK, vertical = false, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.font = `700 ${size}px ${MIN}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = col;
  if (vertical) { [...s].forEach((ch, i) => ctx.fillText(ch, x, y + i * size * 1.04)); logBox(ctx, s, x - size / 2, y - size / 2, x + size / 2, y - size / 2 + s.length * size * 1.04, size); }
  else { ctx.fillText(s, x, y); const w = ctx.measureText(s).width; logBox(ctx, s, x - w / 2, y - size / 2, x + w / 2, y + size / 2, size); } ctx.restore(); }
// 朱の判子（物に押す）
function seal(ctx, s, x, y, size, t, t0, rot = -.1, col = CRED) { const u = t - t0; if (u < 0) return; const k = clamp(u / .14), sc0 = 1 + 1.3 * Math.pow(1 - k, 3);
  ctx.save(); ctx.globalAlpha *= Math.min(1, u / .05) * .93; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc0, sc0); ctx.font = `400 ${size}px ${DG}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const w = ctx.measureText(s).width + size * .7, h = size * 1.45; ctx.strokeStyle = col; ctx.lineWidth = size * .1; rrect(ctx, -w / 2, -h / 2, w, h, size * .14); ctx.stroke(); ctx.lineWidth = size * .03; rrect(ctx, -w / 2 + size * .15, -h / 2 + size * .15, w - size * .3, h - size * .3, size * .1); ctx.stroke();
  ctx.fillStyle = col; ctx.fillText(s, 0, size * .04); logBox(ctx, s, -w / 2, -h / 2, w / 2, h / 2, size); ctx.restore(); }
function pictoPerson(ctx, x, y, s, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y - 52 * s, 17 * s, 0, 7); ctx.fill(); rrect(ctx, x - 22 * s, y - 30 * s, 44 * s, 66 * s, 18 * s); ctx.fill(); }
function reliefPerson(ctx, x, y, s, key, pscale, a = 1) {   // 石に彫った人の形（凹み）：中は暗く、右下の縁に光
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; pictoPerson(ctx, x + 3 * s, y + 3 * s, s, "rgba(255,245,225,.38)"); pictoPerson(ctx, x, y, s, "rgba(22,18,14,.82)");
  ctx.save(); ctx.beginPath(); ctx.arc(x, y - 52 * s, 17 * s, 0, 7); rrect(ctx, x - 22 * s, y - 30 * s, 44 * s, 66 * s, 18 * s); ctx.clip(); pictoPerson(ctx, x - 4 * s, y - 4 * s, s * 1.02, "rgba(0,0,0,.5)"); ctx.restore(); ctx.restore(); }
function photoPrint(ctx, key, x, y, w, rot, credit, sepia = 0) {   // 白い縁の写真（小さめ）
  const im = IMG[key]; if (!im || !im.width) return; const h = w * im.height / im.width; ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(-w / 2 - 14, -h / 2 - 2, w + 40, h + 92); ctx.fillStyle = "#FBF7EC"; ctx.fillRect(-w / 2 - 20, -h / 2 - 20, w + 40, h + 90);
  if (sepia) ctx.filter = `sepia(${sepia}) contrast(1.05)`; ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.filter = "none";
  ctx.font = `700 ${Math.max(18, w * .045)}px ${BIZ}`; ctx.fillStyle = "#4A4038"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(credit, 0, h / 2 + 36); ctx.restore(); }

// 文字の検査は画面に出る層だけ（場面の板はカメラで写すので位置が違う）
const _logBox = logBox; logBox = (ctx, ...a) => { if (ctx === sc || ctx === sc2 || ctx === tmp) return; _logBox(ctx, ...a); };

// ---------------------------------------------------------------- 物：金の延べ棒・金の玉・天秤・1円玉・ゴルフボール・お札の束
const RG = {}; PL.regions.forEach(r => RG[r.name] = r);
const GOLDS = ["#FFF3BF", "#F6D36B", "#E2AE3E", "#B8862E", "#7A5518"];
function bar(c, x, y, w, a = 1) {   // 延べ棒 1 本（下の辺の中央が x, y）
  if (a <= 0) return; const fh = w * .26, td = w * .2; c.save(); c.globalAlpha *= a;
  let g = c.createLinearGradient(0, y - fh, 0, y); g.addColorStop(0, "#F7D872"); g.addColorStop(.55, "#D9A23A"); g.addColorStop(1, "#9A6A1C");
  c.fillStyle = g; c.beginPath(); c.moveTo(x - w / 2, y); c.lineTo(x + w / 2, y); c.lineTo(x + w * .4, y - fh); c.lineTo(x - w * .4, y - fh); c.closePath(); c.fill();
  g = c.createLinearGradient(x - w * .4, 0, x + w * .4, 0); g.addColorStop(0, "#FFF4C4"); g.addColorStop(.5, "#F2C860"); g.addColorStop(1, "#FFE9A0");
  c.fillStyle = g; c.beginPath(); c.moveTo(x - w * .4, y - fh); c.lineTo(x + w * .4, y - fh); c.lineTo(x + w * .33, y - fh - td); c.lineTo(x - w * .33, y - fh - td); c.closePath(); c.fill();
  c.strokeStyle = "rgba(90,60,10,.75)"; c.lineWidth = Math.max(1, w * .02); c.beginPath(); c.moveTo(x - w / 2, y); c.lineTo(x + w / 2, y); c.lineTo(x + w * .4, y - fh); c.lineTo(x + w * .33, y - fh - td); c.lineTo(x - w * .33, y - fh - td); c.lineTo(x - w * .4, y - fh); c.closePath(); c.stroke();
  c.beginPath(); c.moveTo(x - w * .4, y - fh); c.lineTo(x + w * .4, y - fh); c.stroke();
  c.strokeStyle = "rgba(150,100,20,.5)"; c.strokeRect(x - w * .14, y - fh - td * .78, w * .28, td * .5); c.restore();
}
// 山：下の段から積む。prog＝見えている本数（小数で、1 本ずつ上から落ちてくる）
function pileRows(n) { let M = 1; while (M * (M + 1) / 2 < n) M++; return M; }
function pile(c, cx, by, n, w, prog = 1e9, glow = 0) {
  const M = pileRows(n), fh = w * .26, td = w * .2; let i = 0;
  if (glow > 0) { c.save(); c.globalCompositeOperation = "lighter"; const r = M * w * .7, g = c.createRadialGradient(cx, by - M * fh * .8, 0, cx, by - M * fh * .8, r); g.addColorStop(0, `rgba(255,200,90,${.35 * glow})`); g.addColorStop(1, "rgba(255,200,90,0)"); c.fillStyle = g; c.fillRect(cx - r, by - M * fh - r, r * 2, r * 2); c.restore(); }
  c.save(); c.fillStyle = "rgba(20,10,0,.35)"; c.beginPath(); c.ellipse(cx + w * .1, by + w * .06, M * w * .58, w * .2, 0, 0, 7); c.fill(); c.restore();
  for (let r = 0; r < M && i < n; r++) { const m = M - r, y = by - r * (fh + td * .5);
    for (let k = 0; k < m && i < n; k++, i++) { const e = clamp(prog - i); if (e <= 0) return; const x = cx + (k - (m - 1) / 2) * w * 1.02;
      bar(c, x, y - 220 * Math.pow(1 - easeOut(e), 2), w, clamp(e * 4)); } }
}
const pileH = (n, w) => pileRows(n) * (w * .26 + w * .1) + w * .2;
function ball(c, x, y, rr, a = 1) {   // 金の玉
  if (a <= 0 || rr <= 0) return; c.save(); c.globalAlpha *= a; c.fillStyle = "rgba(20,10,0,.4)"; c.beginPath(); c.ellipse(x + rr * .15, y + rr * .95, rr * .95, rr * .2, 0, 0, 7); c.fill();
  const g = c.createRadialGradient(x - rr * .35, y - rr * .4, rr * .05, x, y, rr); g.addColorStop(0, "#FFF8D6"); g.addColorStop(.25, "#F7D46C"); g.addColorStop(.7, "#C8902C"); g.addColorStop(1, "#7A5214");
  c.fillStyle = g; c.beginPath(); c.arc(x, y, rr, 0, 7); c.fill(); c.globalCompositeOperation = "lighter"; c.fillStyle = "rgba(255,240,200,.25)"; c.beginPath(); c.ellipse(x + rr * .35, y + rr * .45, rr * .35, rr * .16, -.6, 0, 7); c.fill(); c.restore();
}
const ballR = g => 30 * Math.cbrt(g);
function golf(c, x, y, rr) { c.save(); c.fillStyle = "rgba(20,10,0,.35)"; c.beginPath(); c.ellipse(x + rr * .15, y + rr * .95, rr * .95, rr * .2, 0, 0, 7); c.fill();
  const g = c.createRadialGradient(x - rr * .35, y - rr * .4, rr * .05, x, y, rr); g.addColorStop(0, "#FFFFFF"); g.addColorStop(.7, "#E4E4E0"); g.addColorStop(1, "#9C9C98"); c.fillStyle = g; c.beginPath(); c.arc(x, y, rr, 0, 7); c.fill();
  c.save(); c.beginPath(); c.arc(x, y, rr, 0, 7); c.clip(); c.fillStyle = "rgba(120,120,115,.22)"; for (let a = 0; a < 7; a++) for (let k = -3; k <= 3; k++) { const px = x + k * rr * .27 + (a % 2) * rr * .13, py = y + (a - 3) * rr * .25; c.beginPath(); c.arc(px, py, rr * .065, 0, 7); c.fill(); } c.restore(); c.restore(); }
function coin1(c, x, y, rr) { c.save(); c.fillStyle = "rgba(20,10,0,.35)"; c.beginPath(); c.ellipse(x + 6, y + rr * .4, rr * 1.02, rr * .32, 0, 0, 7); c.fill();
  const g = c.createLinearGradient(x - rr, y - rr, x + rr, y + rr); g.addColorStop(0, "#F4F5F6"); g.addColorStop(.5, "#B9BCC0"); g.addColorStop(1, "#E8E9EA"); c.fillStyle = "#8D9094"; c.beginPath(); c.ellipse(x, y + rr * .1, rr, rr * .34, 0, 0, 7); c.fill();
  c.fillStyle = g; c.beginPath(); c.ellipse(x, y, rr, rr * .34, 0, 0, 7); c.fill(); c.strokeStyle = "rgba(90,90,95,.5)"; c.lineWidth = 2; c.beginPath(); c.ellipse(x, y, rr * .86, rr * .29, 0, 0, 7); c.stroke();
  c.font = `400 ${rr * .5}px ${DG}`; c.fillStyle = "rgba(90,92,96,.8)"; c.textAlign = "center"; c.textBaseline = "middle"; c.save(); c.translate(x, y); c.scale(1, .36); c.fillText("1", 0, 0); c.restore(); c.restore(); }
function card(c, x, y, w, rot) { const h = w * .63; c.save(); c.translate(x, y); c.rotate(rot); c.fillStyle = "rgba(0,0,0,.35)"; rrect(c, -w / 2 + 10, -h / 2 + 14, w, h, w * .06); c.fill();
  const g = c.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); g.addColorStop(0, "#2B4A7A"); g.addColorStop(1, "#16284A"); c.fillStyle = g; rrect(c, -w / 2, -h / 2, w, h, w * .06); c.fill();
  c.fillStyle = "#E2C46A"; rrect(c, -w * .36, -h * .12, w * .16, h * .22, 6); c.fill(); c.fillStyle = "rgba(255,255,255,.75)"; for (let k = 0; k < 4; k++) rrect(c, -w * .38 + k * w * .2, h * .2, w * .16, h * .07, 4), c.fill(); c.restore(); }
// お札の束（どこの国のお札でもない、記号だけ）
const NOTE_COL = [["#3E6B4A", "#9CC7A4", "$"], ["#5B3F72", "#C4A9DA", "¥"], ["#2F5A80", "#A6C8E6", "€"], ["#7A4A2A", "#E0B894", "£"]];
function notes(c, x, y, w, k, flip) {   // flip：0→1 で裏返って延べ棒になる
  const h = w * .5, sy = Math.abs(Math.cos(Math.PI * flip)); c.save(); c.translate(x, y); c.scale(1, Math.max(.02, sy));
  if (flip < .5) { const [d, l, s] = NOTE_COL[k % 4]; for (let j = 4; j >= 0; j--) { c.fillStyle = j ? "rgba(0,0,0,.22)" : d; c.fillRect(-w / 2 + j * 3, -h / 2 + j * 5, w, h); }
    c.fillStyle = l; c.fillRect(-w / 2 + 12, -h / 2 + 12, w - 24, h - 24); c.strokeStyle = d; c.lineWidth = 3; c.strokeRect(-w / 2 + 20, -h / 2 + 20, w - 40, h - 40);
    c.fillStyle = d; c.beginPath(); c.arc(w * .22, 0, h * .26, 0, 7); c.fill(); c.font = `400 ${h * .34}px ${DG}`; c.fillStyle = l; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(s, w * .22, 2);
    c.fillStyle = "#F4EAD2"; c.fillRect(-w * .12, -h / 2 - 2, w * .12, h + 4); }
  else { c.scale(1, 1); bar(c, 0, h * .32, w * .9); } c.restore(); }
function plate(c, s, x, y, size, a = 1, col = "#2A1A0C") {   // 木の小さな札（地図の上の数字）
  if (a <= 0) return; c.save(); c.globalAlpha *= a; c.font = `700 ${size}px ${BIZ}`; const w = c.measureText(s).width + size * .8, h = size * 1.4;
  c.fillStyle = "rgba(0,0,0,.35)"; rrect(c, x - w / 2 + 4, y - h / 2 + 6, w, h, 8); c.fill(); c.fillStyle = pat(c, "plank", .35, 0, 0); rrect(c, x - w / 2, y - h / 2, w, h, 8); c.fill();
  c.fillStyle = col; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(s, x, y + 1); c.restore(); }
function balance(c, cx, cy, ang, L, Rr, arm = 360) {   // 天秤：ang は傾き（左が下がると正）
  c.save(); const g = c.createLinearGradient(cx - 30, 0, cx + 30, 0); g.addColorStop(0, "#7A5518"); g.addColorStop(.5, "#F3D27A"); g.addColorStop(1, "#7A5518");
  c.fillStyle = "rgba(0,0,0,.35)"; c.beginPath(); c.ellipse(cx + 20, cy + 560, 220, 34, 0, 0, 7); c.fill(); c.fillStyle = g; c.fillRect(cx - 16, cy, 32, 540); rrect(c, cx - 170, cy + 520, 340, 46, 14); c.fill();
  const ex = Math.cos(ang) * arm, ey = Math.sin(ang) * arm, ends = [[cx - ex, cy + ey], [cx + ex, cy - ey]];
  c.strokeStyle = "#B8862E"; c.lineWidth = 22; c.lineCap = "round"; c.beginPath(); c.moveTo(ends[0][0], ends[0][1]); c.lineTo(ends[1][0], ends[1][1]); c.stroke();
  c.fillStyle = "#F3D27A"; c.beginPath(); c.arc(cx, cy, 26, 0, 7); c.fill();
  ends.forEach(([x, y], j) => { const py = y + 300; c.strokeStyle = "rgba(80,55,15,.85)"; c.lineWidth = 4; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 120, py); c.moveTo(x, y); c.lineTo(x + 120, py); c.stroke();
    const pg = c.createLinearGradient(0, py - 10, 0, py + 40); pg.addColorStop(0, "#F7DE96"); pg.addColorStop(1, "#8A6420"); c.fillStyle = pg; c.beginPath(); c.ellipse(x, py, 150, 30, 0, 0, Math.PI); c.fill(); c.fillStyle = "#E9C56A"; c.beginPath(); c.ellipse(x, py, 150, 16, 0, 0, 7); c.fill();
    (j ? Rr : L)(x, py); });
  c.restore(); }
function wobble(b, b0, amp) { const u = (b - b0) * BP; return u < 0 ? 0 : amp * Math.exp(-u * 2.4) * Math.cos(u * 9); }

// ---------------------------------------------------------------- 背景：木の机（暖かい光）
function desk(c, s = 1.4, light = [540, 700]) { texFill(c, "wood", s, 0, 0); shade(c, "#1A0E06", .18); lightPool(c, light[0], light[1], 1100, "rgba(255,210,140,1)", .9); }
// 地図（古い紙）：経度・緯度 → 画面
const MAP = { x: 0, y: 420, w: 1080, h: 1080 * 751 / 2048 };
