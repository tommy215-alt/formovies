<script>
// pilot_060 のレンダラー（新ドパ設計、templates/DESIGN_MODES.md の 9 つ目）。もし日本だけの終末時計があったら。
// 2D だけ。明るく暖かい紙の背景、真ん中に終末時計（最後の 5 分を 90° に拡大した文字盤）、下に人口の人形 10 人、右上に小さなポラロイドの写真（PD）。
// **BGM に合わせた編集**：動画の 0 秒＝曲の小節の頭。拍（BEAT.period）ごとに文字盤が小さく脈打ち、出現・針の移動・判子はすべて拍の頭。閃光なし。
// 時計：真夜中＝日本の人が一人もいなくなる。人口の 10 分の 1 を失うごとに 1 分（秒＝60×log10(1/割合)、scripts/pilot_060/sim/clock.py）。
const PL = window.PLAN, BEAT = PL.beat, BP = BEAT.period, EVK = {}; PL.events.forEach(e => EVK[e.key] = e);
const LN = PL.lines, SCN_IDS = LN.map(l => l.scene);
Object.assign(KIT, { design: "intel", scenes: SCN_IDS, images: [], ci: {}, hits: [] });
loadImages(["tenmei", "kanto", "war", "tohoku"]);
const BIZ = '"Noto Sans CJK JP", sans-serif';
const CPAPER = ["#F7EBD2", "#EFD7AA"], CINK = "#2A2118", CRED = "#C8281E", CDIM = "#8A7A66";

// ---------------------------------------------------------------- 拍
const beatIdx = t => Math.floor(t / BP + 1e-6), beatPhase = t => t - beatIdx(t) * BP;
const onBeat = t => Math.ceil(t / BP - 1e-6) * BP;            // その時刻のあとの最初の拍
const pulse = t => Math.exp(-beatPhase(t) * 9);               // 拍の頭で 1 → すぐ 0
function cur(t) { let i = 0; for (let k = 0; k < LN.length; k++) if (t >= CUE[LN[k].scene]) i = k; return i; }

// ---------------------------------------------------------------- 時計の針（秒）の予定：出来事ごとに、拍の頭で動く
let HAND = [];   // [[時刻, 秒, 年の表示], …]
function buildHand() {
  HAND = [[0, 300, ""]];
  LN.forEach((l, i) => { const t0 = CUE[l.scene];
    if (l.kind === "hit") HAND.push([t0, EVK[l.ev].sec_i, EVK[l.ev].year]);
    else if (l.kind === "ev" && l.ev !== "H1") HAND.push([t0 + 2 * BP, EVK[l.ev].sec_i, EVK[l.ev].year]);
    else if (l.kind === "rule") HAND.push([t0 + 4 * BP, 300, ""]); });
}
function handAt(t) {   // 新しい値へ 0.42 秒で（行き過ぎて戻る）
  let a = HAND[0][1], b = a, t0 = 0;
  for (let i = 1; i < HAND.length; i++) if (t >= HAND[i][0]) { a = HAND[i - 1][1]; b = HAND[i][1]; t0 = HAND[i][0]; }
  const u = clamp((t - t0) / .42), e = u >= 1 ? 1 : 1 - Math.pow(1 - u, 3) + .08 * Math.sin(u * Math.PI) ;
  return a + (b - a) * e;
}
function readoutAt(t) { const hs = HAND.filter(h => t >= h[0]), i = hs.length - 1; if (i < 1 || !hs[i][2]) return null; const pv = hs.slice(0, i).reverse().find(h => h[2]); return { v: hs[i][1], t0: hs[i][0], prev: pv ? pv[1] : 300 }; }

// ---------------------------------------------------------------- 背景：暖かい紙、ゆっくり動く窓の光、舞う埃
const DUST = (() => { const r = S.rng(60); return Array.from({ length: 70 }, () => [r() * W, r() * H, 1 + r() * 2.5, r() * 6.28, .2 + r() * .6]); })();
const PAL = { open: ["#F7EBD2", "#EFD7AA", "#2A2118"], rule: ["#F7EBD2", "#E9CF9E", "#2A2118"], H1: ["#E3E8D6", "#B8C4A2", "#25301E"], H2: ["#EEDDB8", "#C9A066", "#3A2614"],
  H3: ["#DDE2E7", "#A9B4C0", "#1E2733"], H4: ["#4A3029", "#21140F", "#F6E6D6"], H5: ["#D8EAF4", "#8FBAD6", "#10283A"], now: ["#2C2620", "#14100C", "#F6E6D6"],
  decline: ["#DFE5EC", "#AEBACA", "#18222E"], P1: ["#F3D9CE", "#D79A86", "#3A1810"], P2: ["#D2CCE0", "#8C84A8", "#1E1830"], end: ["#2B3244", "#12151E", "#F2ECE0"] };
function palKey(l) { return l.kind === "rule" ? "rule" : l.kind === "now" ? "now" : l.kind === "decline" ? "decline" : l.kind === "end" ? "end" : l.ev || "open"; }
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)), mixc = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",")})`; };
let HEADINK = "#2A2118";
function palAt(t) { const i = cur(t), now = PAL[palKey(LN[i])], prev = i ? PAL[palKey(LN[i - 1])] : now, k = easeInOut(clamp((t - CUE[LN[i].scene]) / BP)); return [0, 1, 2].map(j => mixc(prev[j], now[j], k)); }
function background(t, dark) {
  const pl = palAt(t); HEADINK = pl[2];
  const g = bg.createLinearGradient(0, 0, 0, H); g.addColorStop(0, pl[0]); g.addColorStop(1, pl[1]); bg.fillStyle = g; bg.fillRect(0, 0, W, H);
  bg.save(); bg.globalAlpha = .16; bg.fillStyle = "#FFF7E0";                   // 窓の光：ゆっくり横へ流れる 2 本の帯（明滅しない）
  for (let k = 0; k < 2; k++) { const x = ((t * 22 + k * 620) % 1700) - 500; bg.beginPath(); bg.moveTo(x, 0); bg.lineTo(x + 260, 0); bg.lineTo(x - 340, H); bg.lineTo(x - 600, H); bg.closePath(); bg.fill(); }
  bg.restore();
  bg.save(); for (const [x0, y0, r, p, s] of DUST) { const x = (x0 + Math.sin(t * .4 + p) * 30 + t * 8 * s) % W, y = (y0 - t * 14 * s + H) % H; bg.globalAlpha = .25 + .2 * Math.sin(t + p); bg.fillStyle = "#FFFFFF"; bg.beginPath(); bg.arc(x, y, r, 0, 7); bg.fill(); } bg.restore();
  bg.save(); bg.strokeStyle = "rgba(120,90,50,.08)"; bg.lineWidth = 2; for (let y = 120; y < H; y += 64) { bg.beginPath(); bg.moveTo(0, y); bg.lineTo(W, y); bg.stroke(); } bg.restore();   // 方眼の紙
  if (dark > 0) {   // 「いまは」：まわりを落としてスポットライト（閃光なし、ゆっくり）
    const v = bg.createRadialGradient(540, 760, 260, 540, 860, 1150); v.addColorStop(0, "rgba(20,14,8,0)"); v.addColorStop(1, `rgba(20,14,8,${.78 * dark})`); bg.fillStyle = v; bg.fillRect(0, 0, W, H);
  }
}

// ---------------------------------------------------------------- 終末時計（最後の 5 分を 90° に拡大）
const CLX = 540, CLY = 800, CLR = 340;
const angOf = sec => -Math.PI / 2 - (clamp(sec, 0, 300) / 300) * (Math.PI / 2);   // 0 秒＝真上、300 秒＝左（9 時）
function clockFace(t, sec, ghosts, red, small = false, cx = bg) {
  const pz = 1 + .018 * pulse(t);
  cx.save(); cx.translate(CLX, CLY); cx.scale(pz, pz);
  cx.fillStyle = "rgba(60,40,20,.18)"; cx.beginPath(); cx.arc(10, 18, CLR + 26, 0, 7); cx.fill();                     // 影
  cx.fillStyle = "#3B2A1C"; cx.beginPath(); cx.arc(0, 0, CLR + 26, 0, 7); cx.fill();                                // 縁
  const fg = cx.createRadialGradient(-80, -100, 40, 0, 0, CLR); fg.addColorStop(0, "#FFFBF0"); fg.addColorStop(1, "#EADCC0"); cx.fillStyle = fg; cx.beginPath(); cx.arc(0, 0, CLR, 0, 7); cx.fill();
  cx.fillStyle = `rgba(200,40,30,${.10 + .10 * red})`; cx.beginPath(); cx.moveTo(0, 0); cx.arc(0, 0, CLR - 8, -Math.PI / 2 - Math.PI / 12, -Math.PI / 2); cx.closePath(); cx.fill();   // 真夜中の手前（1 分以内）
  for (let s = 0; s <= 300; s += 10) { const a = angOf(s), big = s % 60 === 0, r0 = CLR - (big ? 54 : 26); cx.strokeStyle = big ? CINK : "#7A6A56"; cx.lineWidth = big ? 9 : 3;
    cx.beginPath(); cx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); cx.lineTo(Math.cos(a) * (CLR - 12), Math.sin(a) * (CLR - 12)); cx.stroke(); }
  cx.strokeStyle = "rgba(42,33,24,.25)"; cx.lineWidth = 3; cx.beginPath(); cx.arc(0, 0, CLR - 70, Math.PI, Math.PI * 1.5); cx.stroke();
  cx.restore();
  if (!small) S.group(() => { for (let m = 1; m <= 5; m++) { const a = angOf(m * 60), r = CLR - 98; text(cx, `${m}分`, CLX + Math.cos(a) * r * pz, CLY + Math.sin(a) * r * pz, 38, CINK, { weight: 800 }); }
    text(cx, "真夜中", CLX + 150, CLY - CLR - 30, 42, CRED, { weight: 900 }); });
  for (const [s, y, k] of ghosts) {   // これまでの出来事：うすい針と年
    const a = angOf(s); cx.save(); cx.globalAlpha = .35 * k; cx.strokeStyle = "#8A3A2A"; cx.lineWidth = 6; cx.beginPath(); cx.moveTo(CLX, CLY); cx.lineTo(CLX + Math.cos(a) * (CLR - 40), CLY + Math.sin(a) * (CLR - 40)); cx.stroke(); cx.restore();
    if (k > .5 && y === "737年") S.group(() => text(cx, y, CLX + Math.cos(a) * (CLR - 150) - 40, CLY + Math.sin(a) * (CLR - 150), 30, "#8A3A2A", { weight: 900 }));
  }
  const a = angOf(sec); cx.save(); cx.translate(CLX, CLY); cx.rotate(a + Math.PI / 2);
  cx.fillStyle = "rgba(0,0,0,.18)"; cx.fillRect(-7 + 6, -CLR + 50 + 8, 14, CLR - 30);                              // 針の影
  cx.fillStyle = CRED; cx.beginPath(); cx.moveTo(-12, 40); cx.lineTo(-6, -CLR + 46); cx.lineTo(0, -CLR + 20); cx.lineTo(6, -CLR + 46); cx.lineTo(12, 40); cx.closePath(); cx.fill();
  cx.fillStyle = CINK; cx.beginPath(); cx.arc(0, 0, 26, 0, 7); cx.fill(); cx.fillStyle = "#E8C070"; cx.beginPath(); cx.arc(0, 0, 10, 0, 7); cx.fill();
  cx.restore();
}

// ---------------------------------------------------------------- 残りの秒（数え上がる）
function readout(t) {
  const r = readoutAt(t); if (!r) return; const u = clamp((t - r.t0) / .5), v = Math.round(r.prev + (r.v - r.prev) * easeOut(u)), pop = 1 + .25 * Math.pow(1 - clamp((t - r.t0) / .25), 2);
  ui.save(); ui.translate(540, 1265); const pb = pop + .035 * pulse(t); ui.scale(pb, pb);
  S.group(() => { text(ui, "真夜中まで", -150, 6, 44, CINK, { weight: 900, align: "right" }); });
  ui.font = `400 150px ${DG}`; ui.textAlign = "center"; ui.textBaseline = "middle"; ui.fillStyle = v <= 60 ? CRED : CINK; ui.fillText(String(v), 30, 0); logBox(ui, String(v), -60, -80, 120, 80, 150);
  S.group(() => text(ui, "秒", 175, 26, 56, CINK, { weight: 900 }));
  ui.restore();
}

// ---------------------------------------------------------------- 人口の人形 10 人（失った割合を灰色に）
function person(ctx, x, y, s, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y - 52 * s, 17 * s, 0, 7); ctx.fill(); rrect(ctx, x - 22 * s, y - 30 * s, 44 * s, 66 * s, 18 * s); ctx.fill(); }
function peopleRow(t, share, t0, label) {
  const k = easeOut(clamp((t - t0) / .3)); if (k <= 0) return; const y = 1440, gap = 84, x0 = 540 - gap * 4.5;
  ui.save(); ui.globalAlpha *= k;
  for (let i = 0; i < 10; i++) { const x = x0 + i * gap, b = clamp((t - t0 - i * BP / 4) / .15), yy = y + 20 * (1 - easeOut(b)) - 10 * pulse(t + (i % 2) * BP / 2);
    person(ui, x, yy, 1, "#3A6EA5"); }
  const lost = clamp((t - t0 - 2 * BP) / .5) * share * 10;          // 右から灰色に（2 拍目から）
  for (let i = 0; i < 10; i++) { const f = clamp(lost - i); if (f <= 0) continue; const x = x0 + (9 - i) * gap; ui.save(); ui.beginPath(); ui.rect(x - 30, y - 90, 60, 140); ui.clip(); ui.beginPath(); ui.rect(x + 30 - 60 * f, y - 90, 60 * f, 140); ui.clip(); person(ui, x, y, 1, "#B9AFA2"); ui.restore(); }
  if (label) S.group(() => text(ui, label, 540, y + 92, 40, CINK, { weight: 800 }));
  ui.restore();
}

// ---------------------------------------------------------------- 年の大きな見出し・判子・ポラロイド
function yearHead(t, s, t0) {
  const u = t - t0; if (u < 0) return; const k = easeOut(clamp(u / .22)), sc = 1 + .5 * Math.pow(1 - k, 2);
  ui.save(); ui.globalAlpha *= k; ui.translate(330 + 40 * (1 - k), 270); ui.scale(sc, sc);
  ui.font = `400 96px ${DG}`; let fz = 96; { const w0 = ui.measureText(s).width; if (w0 > 420) { fz = Math.floor(96 * 420 / w0); ui.font = `400 ${fz}px ${DG}`; } } ui.textAlign = "left"; ui.textBaseline = "middle"; ui.fillStyle = HEADINK; ui.fillText(s, 0, 0); const w = ui.measureText(s).width; logBox(ui, s, 0, -fz * .57, w, fz * .57, fz);
  ui.fillStyle = CRED; ui.fillRect(0, 62, Math.min(w, 120 + 400 * k), 10); ui.restore();
}
function stamp(t, s, x, y, size, t0, rot = -.08, col = CRED) {   // 赤い判子：大きく出て押される
  const u = t - t0; if (u < 0) return; const k = clamp(u / .14), sc = 1 + 1.2 * Math.pow(1 - k, 3), a = Math.min(1, u / .05);
  ui.save(); ui.globalAlpha *= a * .92; ui.translate(x, y); ui.rotate(rot); ui.scale(sc, sc);
  ui.font = `400 ${size}px ${DG}`; ui.textAlign = "center"; ui.textBaseline = "middle"; const w = ui.measureText(s).width + size * .7, h = size * 1.45;
  ui.strokeStyle = col; ui.lineWidth = size * .09; rrect(ui, -w / 2, -h / 2, w, h, size * .16); ui.stroke(); ui.lineWidth = size * .03; rrect(ui, -w / 2 + size * .14, -h / 2 + size * .14, w - size * .28, h - size * .28, size * .1); ui.stroke();
  ui.fillStyle = col; ui.fillText(s, 0, size * .04); logBox(ui, s, -w / 2, -h / 2, w / 2, h / 2, size); ui.restore();
}
const CREDIT = { tenmei: "天明飢饉之図（1786年ごろ）／PD", kanto: "関東大震災（1923年）／PD", war: "空襲のあとの東京（1945年）米陸軍／PD", tohoku: "陸前高田（2011年）米海軍／PD" };
function polaroid(t, key, t0, t1) {
  const im = IMG[key]; if (!im || !im.width) return; const u = t - t0; if (u < 0 || t > t1 + .25) return;
  const k = easeOut(clamp(u / .3)), out = clamp((t - t1) / .25), w = 250, ih = w * .72, x = 905, y = 330 + 20 * Math.sin(u * 1.3);
  ui.save(); ui.globalAlpha *= k * (1 - out); ui.translate(x + 160 * (1 - k), y - 120 * (1 - k)); ui.rotate(.07 - .03 * Math.sin(u * 1.1) - .25 * (1 - k));
  ui.fillStyle = "rgba(40,25,10,.25)"; ui.fillRect(-w / 2 + 10, -ih / 2 - 20 + 14, w + 0, ih + 110);
  ui.fillStyle = "#FFFDF7"; ui.fillRect(-w / 2 - 18, -ih / 2 - 18, w + 36, ih + 100);
  const r = Math.max(w / im.width, ih / im.height), sw = w / r, sh = ih / r, z = 1 + .06 * u / 3; ui.drawImage(im, (im.width - sw / z) / 2, (im.height - sh / z) / 2, sw / z, sh / z, -w / 2, -ih / 2, w, ih);
  S.group(() => text(ui, CREDIT[key], 0, ih / 2 + 42, 19, "#5A5048", { weight: 700 }));
  ui.restore();
}

// ---------------------------------------------------------------- 字幕：下の暗い帯、声に合わせて文字が順に出る
function subtitle(t) {
  const L = TL.lines.filter(x => !x.ending && t >= x.start - .05 && t < x.end + .35).pop(); if (!L) return;
  const src = LN.find(l => l.id === L.id); const ln = (window.SUBS && window.SUBS[L.id]) || []; if (!ln.length) return;
  const all = ln.join(""), n = Math.ceil(all.length * clamp((t - L.start) / Math.max(.3, (L.end - L.start) * .72)));
  const y0 = 1532, lh = 70, h = ln.length * lh + 34; ui.save();
  ui.fillStyle = "rgba(24,18,12,.86)"; rrect(ui, 60, y0 - 20, 900, h, 14); ui.fill(); ui.fillStyle = src && src.who === "W" ? "#E8A0C0" : "#F2C14E"; ui.fillRect(60, y0 - 20, 10, h);
  let used = 0; ln.forEach((s, i) => { const m = clamp(n - used, 0, s.length); used += s.length; const show = s.slice(0, m);
    ui.font = `800 56px ${BIZ}`; let size = 56; const w = ui.measureText(s).width; if (w > 840) size = Math.floor(56 * 840 / w);
    S.group(() => text(ui, show, 100, y0 + 20 + i * lh, size, "#FFFFFF", { weight: 800, align: "left" })); });
  ui.restore();
}

// ---------------------------------------------------------------- 主役：出来事の図（真ん中の大きな場所、y 560〜1450）。時計は右上に小さく
const ART_Y0 = 560, ART_Y1 = 1450;
const kin = (t, t0, d = .3) => easeOut(clamp((t - t0) / d));
function card(t0, t, x0, y0, w, h) { const k = kin(t, t0, .28); ui.fillStyle = `rgba(255,251,240,${.9 * k})`; rrect(ui, x0, y0 + 30 * (1 - k), w, h, 22); ui.fill(); ui.strokeStyle = `rgba(42,33,24,${.15 * k})`; ui.lineWidth = 3; ui.stroke(); return k; }
// 100 人の人形（10×10）。lost 人を、拍ごとに少しずつ灰色に
function grid100(t, t0, lost, x0 = 230, y0 = 940, cell = 62, col = "#3A6EA5") {
  const k = kin(t, t0); if (k <= 0) return;
  const n = Math.min(lost, (t - t0 - 2 * BP) / (6 * BP) * lost);                    // 2 拍目から 6 拍で灰色に
  for (let i = 0; i < 100; i++) { const r = Math.floor(i / 10), c = i % 10, x = x0 + c * cell + cell / 2, y = y0 + r * 50 + 20;
    const b = kin(t, t0 + (r + c) * .02, .2), yy = y + 18 * (1 - b) - 5 * pulse(t + ((r + c) % 2) * BP / 2), f = clamp(n - (99 - i));
    ui.save(); ui.globalAlpha *= b; person(ui, x, yy + 26, .37, f >= 1 ? "#BDB3A6" : col); if (f > 0 && f < 1) { ui.globalAlpha *= f; person(ui, x, yy + 26, .37, "#BDB3A6"); } ui.restore(); }
}
// 細かい点の人（1,000 人・1 万人）。lost 人だけ赤い丸で囲む
function dotGeo(N) { const cols = N > 2000 ? 125 : 40, w = 780, cell = w / cols; return { cols, rows: N / cols, x0: 150, cell, y0: N > 2000 ? 920 : 960 }; }
function hitPos(N, lost, j = 0) { const g = dotGeo(N), r = S.rng(N + lost); let i = 0; for (let k = 0; k <= j; k++) i = Math.floor(r() * N * .8 + N * .1); return [g.x0 + (i % g.cols) * g.cell + g.cell / 2, g.y0 + Math.floor(i / g.cols) * g.cell + g.cell / 2]; }
function dots(t, t0, N, lost, label) {
  const k = kin(t, t0); if (k <= 0) return; const cols = N > 2000 ? 125 : 40, rows = N / cols, x0 = 150, w = 780, cell = w / cols, y0 = N > 2000 ? 920 : 960, ds = Math.max(1.6, cell * .32);
  ui.save(); ui.globalAlpha *= k; ui.fillStyle = "#3A6EA5"; const rv = Math.min(1, (t - t0) / (4 * BP));
  for (let i = 0; i < N * rv; i++) { const x = x0 + (i % cols) * cell + cell / 2, y = y0 + Math.floor(i / cols) * cell + cell / 2; ui.fillRect(x - ds, y - ds, ds * 2, ds * 2); }
  const r = S.rng(N + lost), hit = Array.from({ length: lost }, () => Math.floor(r() * N * .8 + N * .1));
  hit.forEach((i, j) => { const u = kin(t, t0 + (5 + j) * BP, .25); if (u <= 0) return; const x = x0 + (i % cols) * cell + cell / 2, y = y0 + Math.floor(i / cols) * cell + cell / 2;
    ui.fillStyle = "#BDB3A6"; ui.fillRect(x - ds * 1.4, y - ds * 1.4, ds * 2.8, ds * 2.8); ui.strokeStyle = CRED; ui.lineWidth = 6; ui.beginPath(); ui.arc(x, y, 30 + 30 * (1 - u) + 4 * pulse(t), 0, 7); ui.stroke(); });
  ui.restore(); S.group(() => text(ui, label, 540, y0 + rows * cell + 36, 44, CINK, { weight: 900 }));
}

function bigLabel(t, t0, s, y, col = CINK, size = 56) { const k = kin(t, t0, .25); if (k <= 0) return; ui.save(); ui.globalAlpha *= k; ui.translate(540, y + 20 * (1 - k)); S.group(() => text(ui, s, 0, 0, size, col, { weight: 900 })); ui.restore(); }

function artH1(t, t0) {   // 天然痘：ウイルスが流れ込み、100 人のうち 30 人が灰色に

function artNow(t, t0) { const k = kin(t, t0 + BP, .4); if (k <= 0) return; ui.save(); ui.globalAlpha *= k; ui.translate(540, 1000); const s = 1 + .06 * pulse(t); ui.scale(s, s); ui.font = `400 360px ${DG}`; ui.textAlign = "center"; ui.textBaseline = "middle"; ui.fillStyle = "#FFF4DA"; ui.fillText("？", 0, 0); logBox(ui, "？", -150, -180, 150, 180, 360); ui.restore(); }
// 人口のグラフ（大きく）：1920〜2120、推計は破線

// ---------------------------------------------------------------- 時計の置き場所：冒頭は大きく → 拍で右上へ小さく、最後にまた大きく

// ---------------------------------------------------------------- カメラ（図の層だけ）：[拍, 見る点 x, y, 倍率]。場面の頭は滑り込み、小節の頭で軽く跳ねる

function camAt(t, l, i, t0) {
