<script>
// pilot_060 v3 のレンダラー（新ドパ設計）。もし日本だけの終末時計があったら。
// v3（ユーザーの参考動画に合わせて）：背景はなく、場面ごとに「物」そのもので画面を埋める（大きな時計・石垣・巻物・掛け軸・地震計・石碑・砂時計）。
// 物から物へ、拍の頭で寄って突き抜ける／横に流す／砂のように溶ける。カメラは物の上を常に動く（拍で跳ねる）。
// 文字はセリフの句ごとに出し方を変える：帯・木の札・ポップ・光る文字・物に彫った文字・朱の判子。閃光なし（光は柔らかく）。
// 時計：真夜中＝日本の人が一人もいなくなる。人口の 10 分の 1 を失うごとに 1 分（秒＝60×log10(1/割合)、scripts/pilot_060/sim/clock.py）。
// 質感は Poly Haven（CC0、assets/textures.py で陰影を焼き込み）、和紙・真鍮・ガラスは描画。
const PL = window.PLAN, BEAT = PL.beat, BP = BEAT.period, EVK = {}; PL.events.forEach(e => EVK[e.key] = e);
const LN = PL.lines, SCN_IDS = LN.map(l => l.scene);
Object.assign(KIT, { design: "intel", scenes: SCN_IDS, images: [], ci: {}, hits: [] });
const TEXK = ["wood", "plank", "stone", "granite", "rock", "concrete", "tatami"];
loadImages(["tenmei", "kanto", "war", "tohoku", ...TEXK.map(k => "tx_" + k)]);
const BIZ = '"Noto Sans CJK JP", sans-serif';
const CRED = "#C8281E", CGOLD = "#F2C14E", INK = "#1C140D";

// ---------------------------------------------------------------- 拍
const beatIdx = t => Math.floor(t / BP + 1e-6), beatPhase = t => t - beatIdx(t) * BP;
const pulse = t => Math.exp(-beatPhase(t) * 9);               // 拍の頭で 1 → すぐ 0
const barPulse = t => (beatIdx(t) % 4 === 0 ? 1 : .45) * pulse(t);
const spring = u => u <= 0 ? 0 : 1 - Math.exp(-6 * u) * Math.cos(10 * u);
const kin = (t, t0, d = .3) => easeOut(clamp((t - t0) / d));
function cur(t) { let i = 0; for (let k = 0; k < LN.length; k++) if (t >= CUE[LN[k].scene]) i = k; return i; }
const sEnd = i => i + 1 < LN.length ? CUE[LN[i + 1].scene] : TL.ending_start;

// ---------------------------------------------------------------- 時計の針（秒）の予定：出来事ごとに、拍の頭で動く
let HAND = [];
function buildHand() {
  HAND = [[0, 300, ""]];
  LN.forEach(l => { const t0 = CUE[l.scene];
    if (l.kind === "hit") HAND.push([t0 + BP, EVK[l.ev].sec_i, EVK[l.ev].year]);
    else if (l.kind === "ev" && l.ev !== "H1") HAND.push([t0 + 2 * BP, EVK[l.ev].sec_i, EVK[l.ev].year]); });
}
function handAt(t) {
  let a = HAND[0][1], b = a, t0 = 0;

// ---------------------------------------------------------------- 画面の外の板（場面を描いてからカメラで写す）
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const SC = mk(W, H), sc = SC.getContext("2d"), SC2 = mk(W, H), sc2 = SC2.getContext("2d"), TMP = mk(W, 520), tmp = TMP.getContext("2d");

// 和紙（一度だけ作る）：生成りの地、繊維、まだら、縁の焼け
const WASHI = mk(W, H); (() => { const c = WASHI.getContext("2d"), r = S.rng(737); c.fillStyle = "#EFE2C4"; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 260; i++) { c.fillStyle = `rgba(${150 + r() * 60},${110 + r() * 50},${60 + r() * 40},${.03 + r() * .05})`; c.beginPath(); c.arc(r() * W, r() * H, 20 + r() * 140, 0, 7); c.fill(); }

  const g = c.createRadialGradient(540, 960, 500, 540, 960, 1150); g.addColorStop(0, "rgba(120,80,30,0)"); g.addColorStop(1, "rgba(120,80,30,.28)"); c.fillStyle = g; c.fillRect(0, 0, W, H); })();
// 錦（掛け軸の表装）
const NISHIKI = mk(W, H); (() => { const c = NISHIKI.getContext("2d"); const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#1D2B3E"); g.addColorStop(1, "#14202F"); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.strokeStyle = "rgba(214,176,92,.22)"; c.lineWidth = 2; for (let y = 0; y < H; y += 60) for (let x = (y / 60 % 2) * 30; x < W; x += 60) { c.beginPath(); c.moveTo(x, y - 12); c.lineTo(x + 12, y); c.lineTo(x, y + 12); c.lineTo(x - 12, y); c.closePath(); c.stroke(); } })();
function brassRing(ctx, x, y, r, w) { const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r); g.addColorStop(0, "#F7DE96"); g.addColorStop(.35, "#B8862E"); g.addColorStop(.6, "#F3D27A"); g.addColorStop(1, "#7A5518");
  ctx.save(); ctx.lineWidth = w; ctx.strokeStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke(); ctx.lineWidth = 3; ctx.strokeStyle = "rgba(60,35,5,.6)"; ctx.beginPath(); ctx.arc(x, y, r - w / 2, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y, r + w / 2, 0, 7); ctx.stroke(); ctx.restore(); }

// 彫った文字：影（左上）と光（右下）で凹ませる。reveal＝左から現れる割合
function carve(ctx, s, x, y, size, { font = MIN, w = 700, reveal = 1, col = "rgba(30,22,14,.55)", hi = "rgba(255,245,225,.35)", vertical = false, align = "center" } = {}) {

  const draw = (dx, dy, c) => { ctx.fillStyle = c; if (vertical) [...s].forEach((ch, i) => ctx.fillText(ch, x + dx, y + dy + i * size * 1.05)); else ctx.fillText(s, x + dx, y + dy); };
  const tw = vertical ? size : ctx.measureText(s).width, th = vertical ? s.length * size * 1.05 : size, x0 = vertical ? x - size / 2 : align === "left" ? x : x - tw / 2, y0 = vertical ? y - size / 2 : y - size / 2;
  ctx.beginPath(); if (vertical) ctx.rect(x0 - 20, y0 - 20, tw + 40, (th + 40) * reveal); else ctx.rect(x0 - 20, y0 - 20, (tw + 40) * reveal, th + 40); ctx.clip();

// 筆の文字（和紙の上）
function brush(ctx, s, x, y, size, col = INK, vertical = false, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.font = `700 ${size}px ${MIN}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = col;
  if (vertical) { [...s].forEach((ch, i) => ctx.fillText(ch, x, y + i * size * 1.04)); logBox(ctx, s, x - size / 2, y - size / 2, x + size / 2, y - size / 2 + s.length * size * 1.04, size); }
  else { ctx.fillText(s, x, y); const w = ctx.measureText(s).width; logBox(ctx, s, x - w / 2, y - size / 2, x + w / 2, y + size / 2, size); } ctx.restore(); }
// 朱の判子（物に押す）
function seal(ctx, s, x, y, size, t, t0, rot = -.1, col = CRED) { const u = t - t0; if (u < 0) return; const k = clamp(u / .14), sc0 = 1 + 1.3 * Math.pow(1 - k, 3);
  ctx.save(); ctx.globalAlpha *= Math.min(1, u / .05) * .93; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc0, sc0); ctx.font = `400 ${size}px ${DG}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const w = ctx.measureText(s).width + size * .7, h = size * 1.45; ctx.strokeStyle = col; ctx.lineWidth = size * .1; rrect(ctx, -w / 2, -h / 2, w, h, size * .14); ctx.stroke(); ctx.lineWidth = size * .03; rrect(ctx, -w / 2 + size * .15, -h / 2 + size * .15, w - size * .3, h - size * .3, size * .1); ctx.stroke();
  ctx.fillStyle = col; ctx.fillText(s, 0, size * .04); logBox(ctx, s, -w / 2, -h / 2, w / 2, h / 2, size); ctx.restore(); }
function pictoPerson(ctx, x, y, s, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y - 52 * s, 17 * s, 0, 7); ctx.fill(); rrect(ctx, x - 22 * s, y - 30 * s, 44 * s, 66 * s, 18 * s); ctx.fill(); }
function reliefPerson(ctx, x, y, s, key, pscale, a = 1) {   // 石に彫った人の形（凹み）：中は暗く、右下の縁に光
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; pictoPerson(ctx, x + 3 * s, y + 3 * s, s, "rgba(255,245,225,.38)"); pictoPerson(ctx, x, y, s, "rgba(22,18,14,.82)");
  ctx.save(); ctx.beginPath(); ctx.arc(x, y - 52 * s, 17 * s, 0, 7); rrect(ctx, x - 22 * s, y - 30 * s, 44 * s, 66 * s, 18 * s); ctx.clip(); pictoPerson(ctx, x - 4 * s, y - 4 * s, s * 1.02, "rgba(0,0,0,.5)"); ctx.restore(); ctx.restore(); }
function photoPrint(ctx, key, x, y, w, rot, credit, sepia = 0) {   // 白い縁の写真（小さめ）
  const im = IMG[key]; if (!im || !im.width) return; const h = w * im.height / im.width; ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(-w / 2 - 14, -h / 2 - 2, w + 40, h + 92); ctx.fillStyle = "#FBF7EC"; ctx.fillRect(-w / 2 - 20, -h / 2 - 20, w + 40, h + 90);

  ctx.font = `700 ${Math.max(18, w * .045)}px ${BIZ}`; ctx.fillStyle = "#4A4038"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(credit, 0, h / 2 + 36); ctx.restore(); }

// 文字の検査は画面に出る層だけ（場面の板はカメラで写すので位置が違う）
const _logBox = logBox; logBox = (ctx, ...a) => { if (ctx === sc || ctx === sc2 || ctx === tmp) return; _logBox(ctx, ...a); };

// ---------------------------------------------------------------- 物：大きな時計（木の箱・真鍮の縁・最後の 5 分の目盛り）
function clockObj(ctx, t, sec, { dark = 0, ghosts = [] } = {}) {
  texFill(ctx, "wood", 1.4, 0, 0); shade(ctx, "#1A0E06", .25);
  const cx = 540, cy = 900, R = 440;
  ctx.save(); ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.beginPath(); ctx.arc(cx + 14, cy + 22, R + 40, 0, 7); ctx.fill(); ctx.restore();
  const g = ctx.createRadialGradient(cx - 120, cy - 160, 60, cx, cy, R); g.addColorStop(0, "#FBF2DA"); g.addColorStop(1, "#D9C49A"); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  ctx.save(); ctx.globalAlpha = .55; ctx.fillStyle = "rgba(200,40,30,.35)"; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R - 10, -Math.PI, -Math.PI / 2); ctx.closePath(); ctx.fill(); ctx.restore();
  for (let s = 0; s <= 300; s += 10) { const a = angOf(s), big = s % 60 === 0, r0 = R - (big ? 70 : s % 30 === 0 ? 46 : 28); ctx.strokeStyle = big ? "#2A1A0E" : "rgba(42,26,14,.65)"; ctx.lineWidth = big ? 9 : 4; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * (R - 14), cy + Math.sin(a) * (R - 14)); ctx.stroke(); }
  for (let m = 1; m <= 5; m++) { const a = angOf(m * 60); ctx.font = `700 46px ${MIN}`; ctx.fillStyle = "#2A1A0E"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(`${m}分`, cx + Math.cos(a) * (R - 118), cy + Math.sin(a) * (R - 118)); }
  ctx.font = `700 50px ${MIN}`; ctx.fillStyle = CRED; ctx.textAlign = "left"; ctx.fillText("真夜中", cx + 34, cy - R + 110); ctx.textAlign = "center";
  for (let a = 0; a < 6.28; a += Math.PI / 30) { if (a > Math.PI && a < 1.5 * Math.PI) continue; ctx.fillStyle = "rgba(42,26,14,.35)"; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * (R - 26), cy + Math.sin(a) * (R - 26), 4, 0, 7); ctx.fill(); }

    if (lab) { ctx.font = `900 40px ${BIZ}`; ctx.textAlign = "center"; ctx.lineWidth = 8; ctx.strokeStyle = "rgba(20,10,4,.9)"; const lx = Math.max(210, cx + Math.cos(a) * (R - rr)), ly = cy + Math.sin(a) * (R - rr); ctx.strokeText(y, lx, ly); ctx.fillStyle = "#FFD27A"; ctx.fillText(y, lx, ly); } ctx.restore(); });

  hand(-Math.PI / 2, 230, 16, "rgba(0,0,0,.35)", 10); hand(a, R - 40, 13, "rgba(0,0,0,.35)", 12);

  const cg = ctx.createRadialGradient(-10, -10, 2, 0, 0, 40); cg.addColorStop(0, "#FFF0B8"); cg.addColorStop(1, "#8A5E1A"); ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, 38, 0, 7); ctx.fill(); ctx.restore();

// 小さな時計の札（右上）：針と「あと○秒」
function badge(t, i) {
  const l = LN[i], t0 = CUE[l.scene], hs = HAND.filter(h => h[0] >= t0 - .01 && h[0] < sEnd(i)); if (!hs.length || l.kind === "end" || l.kind === "open") return;
  const h = hs[0], u = t - h[0]; if (u < 0) return; const out = clamp((t - (sEnd(i) - .12)) / .12), k = spring(u / .45), pb = 1 + .06 * pulse(t);

  ui.fillStyle = "#F7EEDA"; ui.beginPath(); ui.arc(0, 0, 92, 0, 7); ui.fill(); ui.fillStyle = "rgba(200,40,30,.3)"; ui.beginPath(); ui.moveTo(0, 0); ui.arc(0, 0, 86, -Math.PI, -Math.PI / 2); ui.closePath(); ui.fill(); brassRing(ui, 0, 0, 96, 14);

// ---------------------------------------------------------------- 物（場面ごと）。b＝場面の頭からの拍数
function sOpen(c, t, b) { clockObj(c, t, 150 + 140 * Math.sin(t * 2.4) * Math.exp(-t * .15)); }
// 障子（後ろから柔らかい光）と畳。日本の部屋そのもので画面を埋める
const SHOJI = mk(W, 1180); (() => { const c = SHOJI.getContext("2d"), r = S.rng(31); const g = c.createRadialGradient(540, 500, 100, 540, 500, 900); g.addColorStop(0, "#FFF8E8"); g.addColorStop(1, "#E6D7B8"); c.fillStyle = g; c.fillRect(0, 0, W, 1180);
  for (let i = 0; i < 900; i++) { c.strokeStyle = `rgba(150,120,80,${.03 + r() * .05})`; c.lineWidth = .8; const x = r() * W, y = r() * 1180, a = r() * 6.28, l = 6 + r() * 26; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke(); }
