// ---------------------------------------------------------------- WebGL

const scene = new THREE.Scene();

const C = c => new THREE.Color(c).convertSRGBToLinear();
let FOGC = C(0x10161f);
scene.fog = new THREE.FogExp2(FOGC, .03);
const hemi = new THREE.HemisphereLight(C(0x8ea2bd), C(0x1a1612), .45); scene.add(hemi);
const key = new THREE.SpotLight(C(0xffd9a8), 2.5, 0, .7, .55, 1); key.castShadow = true; scene.add(key); scene.add(key.target);

function setCam(pos, look, fov = 40, near = .02, far = 200) {
  cam.position.copy(pos); cam.fov = fov; cam.near = near; cam.far = far; cam.lookAt(look); cam.updateProjectionMatrix(); cam.updateMatrixWorld();
}
function lights({ hemiI = .45, keyI = 30, keyPos, keyAt, keyCol = 0xffd9a8, angle = .7, rimI = .9, rimPos = [3, 4, -4], fillI = 0, fillPos = [0, 2, 2], fog = .03, fogC = 0x10161f, exp = 1.1 }) {
  hemi.intensity = hemiI; key.intensity = keyI * .085; key.color = C(keyCol); key.angle = angle;   // 値は旧来の光の単位（r149 の既定）。0.085 倍で実際の強さ
  key.position.set(...keyPos); key.target.position.set(...keyAt); key.target.updateMatrixWorld();
  rim.intensity = rimI * .6; rim.position.set(...rimPos); fill.intensity = fillI * .2; fill.position.set(...fillPos);

}
function draw3D(dof) {
  R.shadowMap.needsUpdate = true;
  const n0 = cam.near, f0 = cam.far;
  if (!dof) { R.setClearColor(FOGC, 1); R.render(scene, cam); bg.drawImage(glc, 0, 0); return; }
  const { focus, slab, far: bf, near: bn } = dof;
  const pass = (n, f, blur, clearAlpha) => {
    cam.near = Math.max(n0, n); cam.far = Math.min(f0, f); cam.updateProjectionMatrix();
    R.setClearColor(FOGC, clearAlpha); R.render(scene, cam); R.shadowMap.needsUpdate = false;
    bg.save(); bg.filter = blur > .3 ? `blur(${blur}px)` : "none"; bg.drawImage(glc, 0, 0); bg.restore();
  };
  pass(n0, f0, bf, 1);                                      // 下地：全体をぼかす（切り出すと、手前のぼけの縁から切り口の霧の色が透けて帯が出るため）
  pass(Math.max(n0, focus - slab), focus + slab, 0, 0);       // 焦点の前後（くっきり）
  if (focus - slab > n0 + .001) pass(n0, focus - slab + .002, bn, 0);

function proj(v) { const p = v.clone().project(cam); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z]; }
function guardBox(b) { if (b && b[2] > 0 && b[0] < W && b[3] > 0 && b[1] < H && (b[2] - b[0]) > 30) S.CHARLOG.push(b); }
// 被写体を字幕の帯より上に収める（字幕の上端 ≈ 1443）。下端が帯にかかるならカメラを少し下へ向け、収まらないほど大きければ少し引く。
// どちらも連続的に変わるので、コマごとにカメラが跳ばない
const FIT_TOP = 210, FIT_BOT = 1390;
function personPts(p, fromY = 0) { const s = p.S || 1, g = p.g.position; return { b: [V3(g.x, g.y + fromY, g.z)], t: [V3(g.x, g.y + 1.68 * s, g.z)] }; }
function objPts(o) { o.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(o); const c = (y) => [V3(bb.min.x, y, bb.min.z), V3(bb.max.x, y, bb.min.z), V3(bb.min.x, y, bb.max.z), V3(bb.max.x, y, bb.max.z)];
  return { b: c(bb.min.y), t: c(bb.max.y) }; }
function fit(list, yTop = FIT_TOP, yBot = FIT_BOT) {
  list = list.filter(Boolean); if (!list.length) return;
  const px = v => (1 - v.clone().project(cam).y) / 2 * H;
  const bots = list.flatMap(o => o.b), tops = list.flatMap(o => o.t), all = bots.concat(tops);
  cam.updateMatrixWorld();
  const span = Math.max(...bots.map(px)) - Math.min(...tops.map(px)), A = yBot - yTop;
  if (span > A) {                                   // 大きすぎる：被写体の中心から遠ざかる
    const c = all.reduce((m, v) => m.add(v), V3(0, 0, 0)).multiplyScalar(1 / all.length);
    cam.position.copy(c.clone().add(cam.position.clone().sub(c).multiplyScalar(span / A * 1.03))); cam.updateMatrixWorld();
  }
  const yb = Math.max(...bots.map(px));
  if (yb > yBot) { const ang = y => Math.atan((1 - 2 * y / H) * Math.tan(cam.fov * Math.PI / 360)); cam.rotateX(-(ang(yBot) - ang(yb))); cam.updateMatrixWorld(); }
}
// 人物用：画面上の実際の範囲（box）で収める。近いカメラでは足もとより手前の体のほうが下に写るため
function fitB(items, yTop = FIT_TOP, yBot = FIT_BOT) {
  items = items.filter(Boolean); if (!items.length) return;
  const ang = y => Math.atan((1 - 2 * y / H) * Math.tan(cam.fov * Math.PI / 360));
  for (let pass = 0; pass < 3; pass++) {
    cam.updateMatrixWorld();
    const bs = items.map(i => i.box()).filter(Boolean); if (!bs.length) return;
    const top = Math.min(...bs.map(b => b[1])), bot = Math.max(...bs.map(b => b[3])), A = yBot - yTop;
    if (bot - top > A) { const c = items.reduce((m, i) => m.add(i.c()), V3(0, 0, 0)).multiplyScalar(1 / items.length);
      cam.position.copy(c.clone().add(cam.position.clone().sub(c).multiplyScalar((bot - top) / A * 1.03))); continue; }
    if (bot > yBot) cam.rotateX(-(ang(yBot) - ang(bot)));
    else if (top < yTop) cam.rotateX(ang(top) - ang(yTop));
  }
  cam.updateMatrixWorld();
}
const P_ = p => ({ box: () => p.g.visible ? p.box(cam, W, H) : null, c: () => p.g.position.clone().add(V3(0, .85 * (p.S || 1), 0)) });
function guardP(p) { if (p.g.visible) guardBox(p.box(cam, W, H)); }
function boxOf(obj) {      // 物の画面上の範囲（文字の検査用）
  obj.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(obj); if (bb.isEmpty()) return null;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) for (const z of [bb.min.z, bb.max.z]) {
    const [px, py, pz] = proj(V3(x, y, z)); if (pz > 1) return null; x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); }
  return [x0, y0, x1, y1];
}

// ---------------------------------------------------------------- 画像（布目・木目・れんが・紙・設計図）
function canvasTex(w, h, draw, rep = [1, 1]) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 8; return t;
}
const rnd = S.rng(11);
const woodTex = (base, dark, rep) => canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = base; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 140; i++) { x.strokeStyle = `rgba(${dark},${.05 + rnd() * .12})`; x.lineWidth = 1 + rnd() * 3; const y = rnd() * h;
    x.beginPath(); x.moveTo(0, y); for (let k = 0; k <= 8; k++) x.lineTo(k * w / 8, y + Math.sin(k * 1.3 + i) * 4 * rnd()); x.stroke(); }
  for (let i = 0; i < 4; i++) { x.fillStyle = `rgba(${dark},.25)`; x.fillRect(0, (i + 1) * h / 4 - 2, w, 3); }
}, rep);
const floorWood = woodTex("#4a3524", "20,12,6", [6, 6]);
const tableWood = woodTex("#5a3d26", "25,14,6", [2, 1]);
const panelWood = woodTex("#3a281b", "15,8,4", [3, 2]);
const brickTex = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = "#3a2a22"; x.fillRect(0, 0, w, h);
  for (let r = 0; r < 16; r++) for (let c = 0; c < 8; c++) {
    const off = r % 2 ? 32 : 0, v = 70 + rnd() * 40;
    x.fillStyle = `rgb(${v + 40},${v * .55},${v * .4})`; x.fillRect(c * 64 + off + 2, r * 32 + 2, 60, 28);
  }
}, [8, 4]);
const kraftTex = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = "#b8895a"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) { x.fillStyle = `rgba(${rnd() < .5 ? "90,60,30" : "230,200,160"},${.05 + rnd() * .08})`; x.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 6, 1); }
});
const paperTex = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = "#d9cfb8"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 1500; i++) { x.fillStyle = `rgba(120,100,70,${.03 + rnd() * .05})`; x.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 4, 1); }
});
// 設計図（線が時間とともに増える：drawBlueprint(k) で描き直す）
const bpCanvas = document.createElement("canvas"); bpCanvas.width = 1024; bpCanvas.height = 700;

  add(140, 200, 880, 200); add(140, 200, 220, 120); add(880, 200, 800, 120); add(220, 120, 800, 120);
  for (let i = 0; i < 9; i++) add(240 + i * 64, 120, 240 + i * 64, 200);

// 特許の書類（英語の書面。番号と日付は fact_check の FACT-10）
const patentTex = canvasTex(768, 1000, (x, w, h) => {
  x.fillStyle = "#e6dcc4"; x.fillRect(0, 0, w, h);

// ---------------------------------------------------------------- 材質
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: C(c), roughness: .7, metalness: 0, ...o });

// ---------------------------------------------------------------- 紙袋（平らな底）と封筒型の袋
// 平底の袋：口が開いた箱。側面の中央に折り目（マチ）。単位はメートル
function flatBag(w = .26, d = .16, h = .34) {
  const g = new THREE.Group();
  const face = (pw, ph, mat) => new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), mat);
  const f = face(w, h, kraft); f.position.set(0, h / 2, d / 2); g.add(f);
  const b = face(w, h, kraft); b.position.set(0, h / 2, -d / 2); b.rotation.y = Math.PI; g.add(b);
  for (const s of [-1, 1]) {                                       // マチ：内側に少し折れた 2 枚
    for (const k of [-1, 1]) { const p = face(d / 2 * 1.04, h, kraftDark); p.position.set(s * (w / 2 - .012), h / 2, k * d / 4); p.rotation.y = s * Math.PI / 2 + k * s * .22; g.add(p); }
  }
  const bot = face(w, d, kraftDark); bot.rotation.x = -Math.PI / 2; bot.position.y = .002; g.add(bot);
  // 口のぎざぎざと折り目の線
  const pts = []; for (let i = 0; i <= 26; i++) pts.push(V3(-w / 2 + w * i / 26, h + (i % 2 ? .006 : 0), d / 2 + .001));
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));

  return g;

// 封筒型（底が V 字で平らでない）
function envelopeBag(w = .2, h = .3) {
  const sh = new THREE.Shape(); sh.moveTo(-w / 2, h); sh.lineTo(w / 2, h); sh.lineTo(w / 2, .06); sh.lineTo(0, 0); sh.lineTo(-w / 2, .06); sh.lineTo(-w / 2, h);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: .03, bevelEnabled: true, bevelThickness: .008, bevelSize: .006, bevelSegments: 2 });
  geo.translate(0, 0, -.015);

  const g = new THREE.Group(); g.add(m); return g;
}
// 平らな紙（折り目つき）
function sheet(w, h) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), kraft); m.rotation.x = -Math.PI / 2; m.castShadow = m.receiveShadow = true; return m; }

// ---------------------------------------------------------------- 人物（顔のない人形）
function person({ dress = null, hair = null, hat = false, coat = null, apron = false, scale = 1, skin = 0xd5dbe4 } = {}) {
  const p = S.mochi3D(THREE, { color: skin }); const P = p.parts;
  if (hair) {                                                      // 髪：頭を覆う帽子のような形＋後ろでまとめた髪

    const back = new THREE.Mesh(new THREE.SphereGeometry(.214, 32, 20, Math.PI, Math.PI, 0, 2.0), hm); P.head.add(back);  // 後ろ半分（顔の側は覆わない）

function grade(t, warm = 0) {
  const g = bg.createRadialGradient(W / 2, H * .42, H * .25, W / 2, H * .5, H * .8); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(2,5,10,.55)");

function machineRun(t, t0, speed) {

  outBags.forEach((b, i) => {      // 出口から出て、右へ流れ、積み重なる
    const life = (t - t0) * 1.2 * speed - i * .55;
    b.visible = life > 0;
    const run = clamp(life / 1.6), pile = Math.min(i, 6);
    b.position.set(lerp(.55, 1.45, easeOut(run)), lerp(.62, .45 + pile * .0, run), lerp(0, .0, run) + (run >= 1 ? -.18 + (i % 3) * .14 : 0));
    b.rotation.set(0, run >= 1 ? .3 * (i % 3) : 0, 0); b.scale.setScalar(1.7);   // 遠くからでも袋と分かる大きさに
